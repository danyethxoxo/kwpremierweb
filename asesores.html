<style>
  :root {
    --red: #8a0000;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    color: var(--text);
  }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
  body { display: flex; flex-direction: column; min-height: 100vh; }



  main { flex: 1; max-width: 1040px; margin: 0 auto; padding: 90px 24px 60px; width: 100%; }
  .page-title { font-size: 26px; font-weight: 700; text-align: center; color: var(--text); }
  .page-sub { font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; margin-bottom: 36px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
  }
  .persona-card {
    cursor: pointer;
    background: radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), radial-gradient(70% 50% at 90% 2%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%);
    border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
    border-radius: 16px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    transition: background 0.25s, transform 0.15s, box-shadow 0.15s, border-color 0.25s;
  }
  .persona-card:hover {
    background: linear-gradient(150deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0.98) 45%, rgba(255,255,255,0.96) 100%);
    border-color: rgba(255,255,255,0.85);
    transform: translateY(-3px);
    box-shadow: 0 16px 38px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .persona-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: #fff3f3;
    color: var(--red);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    overflow: hidden;
    transition: background 0.2s, color 0.2s;
  }
  .persona-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .persona-card:hover .persona-avatar { background: var(--red); color: #fff; }
  .persona-nombre { font-size: 14.5px; font-weight: 700; transition: color 0.2s; }
  .persona-rol { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.2s; }

  .persona-acerca {
    font-size: 12px; color: var(--muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
    transition: color 0.2s;
  }
  .persona-redes { display: flex; justify-content: center; gap: 7px; margin-top: 2px; flex-wrap: wrap; }

  .estado-msg { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }

  footer { display: flex; justify-content: center; gap: 10px; padding: 24px 20px; }
  .footer-social {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #fff;
    border: 1.5px solid var(--border);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .footer-social:hover { background: #ffe0e0; color: var(--red); transform: translateY(-2px); }
  .footer-social svg { width: 15px; height: 15px; fill: currentColor; }
  @media (max-width: 640px) {
    main { padding: 78px 16px 40px; }
    /* Dos por renglón: con minmax(200px) el teléfono solo daba para una
       columna y cada tarjeta ocupaba una pantalla entera. */
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  }
</style>

<script>
  var SUPABASE_URL = 'https://iloetojomzqtadkithtv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_ZvaIC0_lkd6OQ0VMihOvjA_BIgpbClq';
  var kwSupabasePublico = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var ROLES_FILTRO = ['asociado'];

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function iniciales(nombre, apellido) {
    var a = (nombre || '').trim().charAt(0);
    var b = (apellido || '').trim().charAt(0);
    return (a + b).toUpperCase() || '?';
  }

  var ROL_LABELS = { master: 'Liderazgo', admin: 'Liderazgo', staff: 'Liderazgo', asociado: 'Asesor' };


  // Normaliza lo que la gente pega en su perfil a un link seguro:
  // acepta con o sin https://, y para WhatsApp arma el link de wa.me.
  function linkSeguro(url) {
    var limpio = String(url || '').trim();
    if (!limpio) return null;
    if (!/^https?:\/\//i.test(limpio)) limpio = 'https://' + limpio;
    try {
      var u = new URL(limpio);
      if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
      return u.href;
    } catch (e) { return null; }
  }
  function linkWhatsapp(tel) {
    var digitos = String(tel || '').replace(/\D/g, '');
    if (!digitos) return null;
    if (digitos.length === 10) digitos = '52' + digitos; // números de México sin lada de país
    return 'https://wa.me/' + digitos;
  }

  var ICONOS_RED = {
    sitio_web: '<svg class="sin-relleno" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>',
    facebook: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.514c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.95a8.16 8.16 0 0 0 4.77 1.52V7.04a4.85 4.85 0 0 1-1-.35z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>',
  };

  function redesHtml(p) {
    var links = [
      ['sitio_web', linkSeguro(p.sitio_web), 'Sitio web'],
      ['whatsapp', linkWhatsapp(p.whatsapp), 'WhatsApp'],
      ['instagram', linkSeguro(p.instagram), 'Instagram'],
      ['facebook', linkSeguro(p.facebook), 'Facebook'],
      ['tiktok', linkSeguro(p.tiktok), 'TikTok'],
      ['linkedin', linkSeguro(p.linkedin), 'LinkedIn'],
    ].filter(function (r) { return r[1]; });
    if (!links.length) return '';
    var CLASES_RED = {
      sitio_web: 'red-sitio', whatsapp: 'red-whatsapp', instagram: 'red-instagram',
      facebook: 'red-facebook', tiktok: 'red-tiktok', linkedin: 'red-linkedin',
    };
    return '<div class="persona-redes">' + links.map(function (r) {
      return '<a class="persona-red ' + CLASES_RED[r[0]] + '" href="' + escapeHtml(r[1]) + '" target="_blank" rel="noopener" aria-label="' + r[2] + '" title="' + r[2] + '">' + ICONOS_RED[r[0]] + '</a>';
    }).join('') + '</div>';
  }

  async function cargarDirectorio() {
    var cont = document.getElementById('lista');
    try {
      var res = await kwSupabasePublico
        .from('perfiles_publicos')
        .select('id, nombre, apellido, role, foto_url, acerca_de, sitio_web, whatsapp, instagram, facebook, tiktok, linkedin')
        .in('role', ROLES_FILTRO)
        .order('nombre', { ascending: true });

      if (res.error) throw res.error;

      var personas = res.data || [];
      if (!personas.length) {
        cont.innerHTML = '<div class="estado-msg">Aún no hay nadie que mostrar aquí.</div>';
        return;
      }

      cont.innerHTML = personas.map(function (p) {
        var nombreCompleto = ((p.nombre || '') + ' ' + (p.apellido || '')).trim() || 'Sin nombre';
        var avatar = p.foto_url
          ? '<img src="' + escapeHtml(p.foto_url) + '" alt="' + escapeHtml(nombreCompleto) + '" />'
          : escapeHtml(iniciales(p.nombre, p.apellido));
        return '<div class="persona-card" data-id="' + escapeHtml(p.id) + '">' +
          '<div class="persona-avatar">' + avatar + '</div>' +
          '<div class="persona-nombre">' + escapeHtml(nombreCompleto) + '</div>' +
          '<div class="persona-rol">' + escapeHtml(ROL_LABELS[p.role] || p.role) + '</div>' +
          (p.acerca_de ? '<div class="persona-acerca">' + escapeHtml(p.acerca_de) + '</div>' : '') +
          redesHtml(p) +
        '</div>';
      }).join('');
    } catch (err) {
      cont.innerHTML = '<div class="estado-msg" style="color:#a30000;">' + escapeHtml(err.message || 'Ocurrió un error al cargar.') + '</div>';
    }
  }

  // Click en una tarjeta -> micrositio de esa persona. Los íconos de
  // redes dentro de la tarjeta abren su propio link sin disparar esto.
  document.getElementById('lista').addEventListener('click', function (e) {
    if (e.target.closest('.persona-red')) return;
    var card = e.target.closest('.persona-card');
    if (card && card.dataset.id) location.href = 'micrositio.html?id=' + encodeURIComponent(card.dataset.id);
  });

  cargarDirectorio();
</script>
