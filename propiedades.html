<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"></script>
<script src="/assets/js/auth-guard.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: 'Poppins', Arial, sans-serif;
    color: var(--text);
    overflow-x: clip;
  }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* La barra de arriba es la compartida (header.kw-header de
     kw-base.css): hamburguesa, título al centro y botón de regresar,
     igual que en el resto del sitio. */
  /* Sin tope de ancho: en pantalla grande entran más tarjetas por
     renglón en vez de dejar dos franjas vacías a los lados. */
  main { flex: 1; width: 100%; min-width: 0; margin: 0 auto; padding: 90px clamp(20px, 3vw, 48px) 60px; }

  .page-title { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; text-align: center; margin-bottom: 22px; color: var(--text); }

  /* ── Filtros ── */
  /* z-index alto y `position: relative` a propósito: la animación de
     entrada de kw-base.css deja un transform puesto (fill-mode both), y
     un transform crea contexto de apilamiento - eso encerraba el
     z-index del menú desplegable dentro de la barra, y las tarjetas, que
     van después en el HTML, le pasaban por encima. Subiendo la barra
     entera por encima de la lista, los menús vuelven a verse. */
  #lista { position: relative; z-index: 1; }
  .filtro { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  /* `display: flex` le gana al atributo `hidden`, y el filtro de estatus
     se le alcanzaba a ver a quien entra sin sesión. */
  .filtro[hidden] { display: none; }
  .filtro-rango { grid-column: span 2; }
  .rango { display: flex; gap: 8px; }
  .rango input { width: 100%; min-width: 0; }
  .filtro label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted);
  }
  /* Misma altura que los desplegables y los botones de la barra
     (--control-h, de kw-base.css): con alturas distintas, la etiqueta
     de un filtro quedaba más arriba que la de junto. */
  .filtro select, .filtro input {
    height: var(--control-h); padding: 0 11px;
    border: 1.5px solid var(--border); border-radius: var(--r-campo);
    font-size: 13.5px; font-family: 'Poppins', Arial, sans-serif;
    color: var(--text); background: #fff; outline: none;
  }
  .filtro select:focus, .filtro input:focus {
    border-color: var(--red); box-shadow: 0 0 0 3px rgba(138,0,0,0.08);
  }
  .btn-limpiar {
    align-self: end; height: var(--control-h); padding: 0 16px;
    border-radius: var(--r-campo);
    border: 1.5px solid var(--border); background: #f7f7f6;
    font-size: 12.5px; font-weight: 700; font-family: 'Poppins', Arial, sans-serif;
    color: #555; cursor: pointer; transition: background 0.15s;
  }
  .btn-limpiar:hover { background: #ececec; }

  .cuenta-filtros[hidden] { display: none; }
  .cuenta-filtros {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 20px;
    background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ── Panel lateral de filtros ── */
  .propiedades-layout { display: block; min-width: 0; }
  .propiedades-resultados { min-width: 0; }
  .propiedades-sidebar {
    position: sticky;
    top: 78px;
    width: 100%;
    min-width: 0;
    z-index: 20;
    height: auto;
    max-height: none;
    overflow: visible;
    padding: 18px;
    border: 1px solid rgba(255,255,255,0.84);
    border-radius: 16px;
    background: radial-gradient(70% 42% at 90% 0%, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0) 72%), linear-gradient(145deg, rgba(255,255,255,0.88), rgba(255,255,255,0.68));
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 8px 24px rgba(35,27,27,0.06);
    scrollbar-width: thin;
    scrollbar-color: rgba(138,0,0,0.22) transparent;
  }
  .propiedades-sidebar-cabecera {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    margin-bottom: 15px;
  }
  .propiedades-sidebar-kicker {
    display: block; margin-bottom: 3px;
    color: var(--red); font-size: 9.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .propiedades-sidebar h2 {
    color: var(--text); font-size: 17px; line-height: 1.2; letter-spacing: -0.25px;
  }
  /* En escritorio el filtro vive dentro del switch lateral universal de KW.
     Al sacarlo de su tarjeta original, conserva solo la lectura visual del
     contenido y deja que kw-lateral.css controle el panel. En celular vuelve
     a su punto original y recupera la tarjeta completa. */
  .kw-lateral-contenido > .propiedades-sidebar {
    position: static;
    flex: 0 0 auto;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    max-height: none;
    overflow-x: hidden;
    overflow-y: visible;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    box-shadow: none;
    scrollbar-width: auto;
  }
  .kw-lateral-contenido > .propiedades-sidebar .propiedades-buscador {
    min-height: 0;
    margin-bottom: 14px;
    padding: 7px 10px;
    background: #f7f7f7;
  }
  /* La barra lateral mantiene su ancho y altura. Solo su contenido puede
     desplazarse, sin cambiar el ancho de la pagina ni mostrar otra barra. */
  .kw-lateral-universal {
    width: 292px !important;
    max-width: 292px;
    overflow: hidden !important;
  }
  .kw-lateral-universal .kw-lateral-contenido {
    width: calc(100% + 4px);
    margin-right: -4px;
    padding-right: 12px;
    min-width: 0;
    min-height: 0;
    flex: 1 1 auto;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .kw-lateral-universal .kw-lateral-contenido { scrollbar-width: auto; scrollbar-color: auto; }
  .kw-lateral-universal .kw-lateral-contenido::-webkit-scrollbar { width: 8px; }
  .kw-lateral-universal .kw-lateral-contenido::-webkit-scrollbar-track {
    background: transparent; margin-block: 4px;
  }
  .kw-lateral-universal .kw-lateral-contenido::-webkit-scrollbar-thumb {
    background: #fff; border: 1px solid #d5d5d5; border-radius: 999px;
  }
  .kw-lateral-universal .kw-lateral-contenido::-webkit-scrollbar-button { display: none; }
  #filtros .kw-select { width: 100% !important; min-width: 0 !important; max-width: 100%; }
  #filtros .kw-select-menu {
    width: 100% !important; min-width: 0 !important; max-width: 100% !important;
    left: 0 !important; right: 0 !important; overflow-x: hidden;
    scrollbar-width: auto; scrollbar-color: auto;
  }
  #filtros .kw-select-btn { min-width: 0; max-width: 100%; }
  #filtros .kw-select-opcion-texto { white-space: normal; overflow-wrap: anywhere; }
  #filtros .kw-select-menu::-webkit-scrollbar { width: 8px; }
  #filtros .kw-select-menu::-webkit-scrollbar-track { background: #fff; }
  #filtros .kw-select-menu::-webkit-scrollbar-thumb {
    background: #fff; border: 1px solid #c8c8c8; border-radius: 999px;
  }
  .propiedades-encabezado {
    display: flex !important; align-items: center; justify-content: space-between;
    gap: 18px; margin-bottom: 20px !important;
  }
  .propiedades-encabezado .page-title { margin: 0; text-align: left; }
  .propiedades-encabezado .conteo { margin: 0; text-align: right; justify-content: flex-end; }
  @media (max-width: 640px) {
    .propiedades-encabezado { flex-wrap: wrap; gap: 8px; }
  }
  .propiedades-buscador {
    display: flex; align-items: center; gap: 8px;
    width: 100%; max-width: 100%;
    min-height: 0; padding: 8px 12px;
    border: 1.5px solid rgba(0,0,0,0.1); border-radius: 10px;
    background: rgba(255,255,255,0.75); color: var(--muted);
    transition: border-color 0.15s;
  }
  .propiedades-buscador:focus-within {
    border-color: var(--red);
  }
  .propiedades-buscador svg { flex: 0 0 auto; }
  .propiedades-buscador input {
    width: 100%; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; font-size: 13px;
  }
  .propiedades-buscador input::placeholder { color: #92908f; }
  .filtros-sidebar { display: flex; flex-direction: column; width: 100%; min-width: 0; max-width: 100%; }
  .filtro-seccion { min-width: 0; max-width: 100%; padding: 17px 0 15px; border-top: 1px solid rgba(0,0,0,0.08); }
  .filtro-seccion:first-child { border-top: 0; }
  .filtro-seccion h3 {
    margin-bottom: 11px; color: var(--text); font-size: 10.5px;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  #filtros .filtro { width: 100%; min-width: 0; max-width: 100%; margin-top: 10px; }
  #filtros .filtro:first-of-type { margin-top: 0; }
  #filtros .filtro label { font-size: 10px; }
  #filtros .filtro input,
  #filtros .filtro select {
    width: 100%; min-width: 0; max-width: 100%; height: 40px; padding: 0 10px;
    font-size: 12px; background: rgba(255,255,255,0.9);
  }
  #filtros .filtro select {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #filtros .rango { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  #filtros .filtro-rango { margin-top: 0; }
  .filtro-ayuda { margin-top: 9px; color: var(--muted); font-size: 10px; line-height: 1.4; }
  .filtros-dos-columnas {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; margin-top: 12px;
  }
  .filtros-dos-columnas .filtro { margin-top: 0 !important; }
  .filtro-seccion-final { padding-bottom: 0; }
  #filtros .btn-limpiar { width: 100%; margin-top: 12px; }
  .resultados-cabecera {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 32px; margin-bottom: 10px;
  }
  .resultados-cabecera .conteo { margin-bottom: 0; }
  .resultado-nota { color: var(--muted); font-size: 11px; white-space: nowrap; }

  .prop-pie {
    font-size: 11.5px; color: var(--muted); margin-top: 8px;
    padding-top: 8px; border-top: 1px solid var(--border);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .conteo {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 13px; color: var(--muted); margin-bottom: 14px;
  }

  /* Aviso de que se está navegando con la marca de un asesor: cualquier
     propiedad que se abra desde aquí le va a mostrar como contacto. */
  .banner-ref {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #fff3f3; border: 1px solid rgba(138,0,0,0.18); border-radius: 12px;
    padding: 11px 15px; margin-bottom: 18px; font-size: 13px;
  }
  .banner-ref-foto {
    width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
    background: #fff; color: var(--red); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .banner-ref b { color: var(--text); }
  .banner-ref-quitar {
    margin-left: auto; background: none; border: none; color: var(--muted);
    font-size: 12px; text-decoration: underline; cursor: pointer; font-family: inherit;
  }
  .banner-ref-quitar:hover { color: var(--text); }
  .chip-estatus {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 4px 10px; border-radius: 20px;
    background: #f0f0ef; color: #666;
  }
  .chip-estatus.publicada { background: #eaf7ee; color: #1a7f37; }
  .chip-estatus.vendida   { background: #fff0f0; color: #CC0000; }
  .chip-estatus.rentada   { background: #FFF0F0; color: var(--red); }
  .chip-estatus.no_publicada { background: #f6f2ff; color: var(--red); }

  /* ── Tarjetas ── */
  /* Columnas por ancho disponible, no un número fijo: con tres fijas, en
     una pantalla grande cada tarjeta se estiraba a más de 500px y se
     veía media docena de propiedades en toda la pantalla. Así entran
     las que quepan y se aprovecha el ancho. */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 14px; align-items: start; }

  .prop-card {
    background: radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), radial-gradient(70% 50% at 90% 2%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%);
    border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
    border-radius: 16px;
    overflow: hidden; text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    align-self: start;
    transition: transform 0.15s, box-shadow 0.18s, border-color 0.18s;
  }
  .prop-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
    border-color: rgba(138,0,0,0.25);
  }
  .prop-foto {
    position: relative; aspect-ratio: 4 / 3; background: #e4e4e4;
    flex: 0 0 auto; width: 100%; height: auto; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .prop-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prop-foto .sin-foto { color: #bbb; }
  .prop-foto .sin-foto svg { width: 34px; height: 34px; }
  .prop-badge {
    position: absolute; top: 10px; left: 10px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 4px 10px; border-radius: 20px;
    background: rgba(255,255,255,0.94); color: var(--red);
    box-shadow: 0 2px 8px rgba(0,0,0,0.14);
  }
  .prop-body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 0 0 auto; min-height: 190px; box-sizing: border-box; }
  .prop-precio {
    font-size: 19px; font-weight: 800; letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .prop-titulo {
    font-size: 14.5px; font-weight: 700; margin-top: 3px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .prop-ubic {
    font-size: 12.5px; color: var(--muted); margin-top: 4px;
    display: flex; align-items: center; gap: 5px;
  }
  .prop-ubic svg { width: 12px; height: 12px; flex-shrink: 0; }
  .prop-datos {
    display: flex; gap: 14px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--border); font-size: 12.5px; color: #555;
  }
  .prop-dato { display: flex; align-items: center; gap: 5px; }
  .prop-dato svg { width: 13px; height: 13px; color: var(--muted); }

  .estado-msg { text-align: center; color: var(--muted); font-size: 14px; padding: 50px 0; grid-column: 1 / -1; }
  .lista-cargando { opacity: 0.58; transition: opacity 0.15s ease; }
  .paginacion { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 10px 0 28px; }
  .paginacion button { min-width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: #555; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; padding: 0 10px; }
  .paginacion button:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  .paginacion button.activa { border-color: var(--red); background: var(--red); color: #fff; }
  .paginacion button:disabled { cursor: default; opacity: 0.45; }
  .paginacion .separador { color: var(--muted); padding: 0 2px; }
  .paginacion-info { color: var(--muted); font-size: 12px; margin: 0 7px; }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) {
    .propiedades-layout { display: block; }
    .propiedades-sidebar { position: relative; top: auto; max-height: none; overflow: visible; }
    .propiedades-sidebar-cabecera { margin-bottom: 13px; }
  }
  @media (max-width: 640px) {
    /* El título se va al header (kw-header-title), así que aquí solo
       hay que dejar el aire de la barra fija. */
    main { padding: 78px 16px 40px; }
    .page-title { font-size: 24px; }
    /* Dos por renglón también aquí: se alcanza a ver el doble de
       inventario por pantalla. Adentro todo se achica en proporción
       para que la tarjeta no salga altísima. */
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .prop-body { padding: 10px 11px 12px; }
    .prop-precio { font-size: 15px; }
    .prop-titulo { font-size: 12.5px; }
    .prop-ubic { font-size: 11px; }
    .prop-datos { gap: 8px; margin-top: 9px; padding-top: 9px; font-size: 11px; }
    .prop-pie { font-size: 10.5px; }
    .prop-badge { font-size: 9.5px; padding: 3px 8px; top: 8px; left: 8px; }
    /* Dos filtros por renglón fijos. Con `auto-fill` dependía del ancho
       exacto del teléfono: en uno de 480px salían dos y en uno de 412px
       uno solo, y la tarjeta se estiraba a lo largo. */
    .propiedades-sidebar { padding: 15px; }
    .resultados-cabecera { align-items: flex-start; }
    .resultado-nota { display: none; }
  }
</style>
</head>
<body>

  <header class="kw-header">
    <span class="kw-header-title">Propiedades</span>
    <a href="/" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      <span>Inicio</span>
    </a>
  </header>

  <main>
    <div class="kw-page-encabezado propiedades-encabezado">
      <h1 class="page-title">Propiedades</h1>
      <div class="conteo" id="conteo" aria-live="polite"></div>
    </div>

    <div class="banner-ref" id="banner-ref" style="display:none;"></div>

    <div class="propiedades-layout">
      <aside class="propiedades-sidebar" id="filtros" aria-label="Filtros de propiedades" autocomplete="off">
        <label class="propiedades-buscador" for="f-buscar" data-kw-buscador-propio>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.7" y2="16.7"></line>
          </svg>
          <input type="text" id="f-buscar" aria-label="Buscar" placeholder="Buscar" autocomplete="off" />
        </label>

        <div class="filtros-sidebar">
          <section class="filtro-seccion">
            <div class="filtro">
              <label for="f-orden">Ordenar por</label>
              <select id="f-orden">

<script>
  var SUPABASE_URL = 'https://iloetojomzqtadkithtv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_ZvaIC0_lkd6OQ0VMihOvjA_BIgpbClq';
  var sb = window.kwSupabase;

  var todas = [];
  var paginaActual = 1;
  var PROPIEDADES_POR_PAGINA = 20;
  var catalogoCargando = true;
  var totalCatalogo = 0;

  function escapeHtml(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtPrecio(p, moneda) {
    // 0 también es "no lo mandaron": varios CRMs lo usan como plantilla
    // para "precio a consultar" en vez de dejarlo vacío.
    if (p == null || Number(p) <= 0) return 'Precio a consultar';
    try {
      return new Intl.NumberFormat('es-MX', {
        style: 'currency', currency: moneda || 'MXN', maximumFractionDigits: 0
      }).format(p);
    } catch (e) { return '$' + Number(p).toLocaleString('es-MX'); }
  }

  var ICO = {
    cama: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>',
    bano: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 6.5 3.5a1.5 1.5 0 0 0-3 0V17a3 3 0 0 0 3 3h11a3 3 0 0 0 3-3v-1H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>',
    area: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M3 9h18"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    casa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>'
  };

  var ETIQUETA_ESTATUS = {
    publicada: 'Activa', no_publicada: 'Borrador', reservada: 'Reservada',
    vendida: 'Vendida', rentada: 'Rentada', suspendida: 'Suspendida',
  };

  function tarjeta(p, i) {
    var ubic = [p.colonia, p.municipio].filter(Boolean).join(', ');
    var foto = (p.imagenes && p.imagenes.length)
      ? '<img src="' + escapeHtml(p.imagenes[0]) + '" alt="' + escapeHtml(p.titulo) + '" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=&quot;sin-foto&quot;>' + ICO.casa.replace(/"/g, '&quot;') + '</div>\'" />'
      : '<div class="sin-foto">' + ICO.casa + '</div>';

    var datos = [];
    if (p.recamaras) datos.push('<span class="prop-dato">' + ICO.cama + p.recamaras + '</span>');
    if (p.banos) datos.push('<span class="prop-dato">' + ICO.bano + p.banos + '</span>');
    if (p.m2_construccion) datos.push('<span class="prop-dato">' + ICO.area + p.m2_construccion + ' m²</span>');

    // El sello de estatus solo se pinta cuando no es una publicada: hacia
    // afuera todas lo son y sería ruido; adentro sirve para ubicarlas.
    var sello = (p.estatus && p.estatus !== 'publicada')
      ? '<span class="chip-estatus ' + escapeHtml(p.estatus) + '">' +
        escapeHtml(ETIQUETA_ESTATUS[p.estatus] || p.estatus) + '</span>'
      : '';

    var pie = [p.asesor_nombre, p.market_center].filter(Boolean).join(' · ');

    var enlaceInterno = '/propiedad.html?id=' + encodeURIComponent(p.id);
    return '<a class="prop-card kw-aparece" style="animation-delay:' + (Math.min(i, 8) * 45) + 'ms" href="' + escapeHtml(enlaceInterno) + '">' +
      '<div class="prop-foto">' + foto +
        (p.operacion ? '<span class="prop-badge">' + (p.operacion === 'renta' ? 'Renta' : 'Venta') + '</span>' : '') +
      '</div>' +
      '<div class="prop-body">' +
        '<div class="prop-precio">' + fmtPrecio(p.precio, p.moneda) + sello + '</div>' +
        '<div class="prop-titulo">' + escapeHtml(p.titulo) + '</div>' +
        (ubic ? '<div class="prop-ubic">' + ICO.pin + escapeHtml(ubic) + '</div>' : '') +
        (datos.length ? '<div class="prop-datos">' + datos.join('') + '</div>' : '') +
        (pie ? '<div class="prop-pie">' + escapeHtml(pie) + '</div>' : '') +
      '</div>' +
    '</a>';
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }
  function num(id) {
    var n = Number(val(id));
    return isFinite(n) && n > 0 ? n : 0;
  }

  function normalizarTexto(valor) {
    return String(valor == null ? '' : valor)
      .toLocaleLowerCase('es-MX')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  // Los campos con datalist aceptan tanto una opción como texto escrito a
  // mano. Por eso los filtros de catálogo buscan coincidencias parciales.
  function coincide(valor, filtro) {
    return !filtro || normalizarTexto(valor).indexOf(normalizarTexto(filtro)) !== -1;
  }

  function ordenar(lista, modo) {
    var copia = lista.slice();
    if (modo === 'precio-asc') {
      copia.sort(function (a, b) { return (a.precio || Infinity) - (b.precio || Infinity); });
    } else if (modo === 'precio-desc') {
      copia.sort(function (a, b) { return (b.precio || 0) - (a.precio || 0); });
    } else if (modo === 'm2-desc') {
      copia.sort(function (a, b) { return (b.m2_construccion || 0) - (a.m2_construccion || 0); });
    }
    // "reciente" ya viene así de la consulta
    return copia;
  }

  function pintar() {
    var texto = val('f-buscar').toLowerCase();
    var op = val('f-operacion');
    var estatus = val('f-estatus');
    var tipo = val('f-tipo');
    var mc = val('f-mc');
    var asesor = val('f-asesor');
    var estado = val('f-estado');
    var municipio = val('f-municipio');
    var colonia = val('f-colonia');
    var minPrecio = num('f-min');
    var maxPrecio = num('f-max');
    var rec = num('f-recamaras');
    var banos = num('f-banos');
    var est = num('f-estacionamientos');
    var m2Min = num('f-m2-min');
    var m2Max = num('f-m2-max');

    var vis = todas.filter(function (p) {
      if (op && p.operacion !== op) return false;
      if (estatus && p.estatus !== estatus) return false;
      if (tipo && !coincide(p.tipo, tipo)) return false;
      if (mc && !coincide(p.market_center, mc)) return false;
      if (asesor && !coincide(p.asesor_nombre, asesor)) return false;
      if (estado && !coincide(p.estado, estado)) return false;
      if (municipio && !coincide(p.municipio, municipio)) return false;
      if (colonia && !coincide(p.colonia, colonia)) return false;
      if (minPrecio && Number(p.precio || 0) < minPrecio) return false;
      if (maxPrecio && Number(p.precio || 0) > maxPrecio) return false;
      if (rec && Number(p.recamaras || 0) < rec) return false;
      if (banos && Number(p.banos || 0) < banos) return false;
      if (est && Number(p.estacionamientos || 0) < est) return false;
      if (m2Min && Number(p.m2_construccion || 0) < m2Min) return false;
      if (m2Max && Number(p.m2_construccion || 0) > m2Max) return false;
      if (texto) {
        var donde = [p.titulo, p.asesor_nombre, p.calle, p.colonia, p.municipio,
          p.estado, p.cp, p.tipo, p.market_center]
          .filter(Boolean).join(' ');
        if (normalizarTexto(donde).indexOf(normalizarTexto(texto)) === -1) return false;
      }
      return true;
    });

    vis = ordenar(vis, val('f-orden'));
    marcarFiltrosEscondidos();

    var cont = document.getElementById('lista');
    var totalPaginas = catalogoCargando
      ? 1
      : Math.max(1, Math.ceil(vis.length / PROPIEDADES_POR_PAGINA));
    if (paginaActual > totalPaginas) paginaActual = totalPaginas;
    var inicio = (paginaActual - 1) * PROPIEDADES_POR_PAGINA;
    var pagina = vis.slice(inicio, inicio + PROPIEDADES_POR_PAGINA);
    var conteo = catalogoCargando && totalCatalogo
      ? totalCatalogo + ' propiedades · mostrando las primeras ' + pagina.length
      : vis.length + (vis.length === 1 ? ' propiedad' : ' propiedades') +
        (vis.length !== todas.length ? ' de ' + todas.length : '') +
        (vis.length ? ' · página ' + paginaActual + ' de ' + totalPaginas : '');
    document.getElementById('conteo').innerHTML =
      '<span>' + conteo + (catalogoCargando ? ' · cargando inventario…' : '') + '</span>';

    if (!vis.length) {
      cont.innerHTML = '<div class="estado-msg">No encontramos propiedades con esos filtros.</div>';
      return;
    }
    cont.innerHTML = pagina.map(tarjeta).join('') +
      (catalogoCargando ? '' : renderPaginacion(totalPaginas));
  }

  function renderPaginacion(totalPaginas) {
    if (totalPaginas <= 1) return '';
    var paginas = [];
    function agregar(numero) {
      if (paginas.indexOf(numero) === -1) paginas.push(numero);
    }
    if (totalPaginas <= 7) {
      for (var i = 1; i <= totalPaginas; i++) agregar(i);
    } else {
      agregar(1);
      if (paginaActual > 4) paginas.push('...');
      for (var n = Math.max(2, paginaActual - 2); n <= Math.min(totalPaginas - 1, paginaActual + 2); n++) agregar(n);
      if (paginaActual < totalPaginas - 3) paginas.push('...');
      agregar(totalPaginas);
    }

    var html = '<nav class="paginacion" aria-label="Paginación de propiedades">' +
      '<button type="button" onclick="irAPagina(' + (paginaActual - 1) + ')"' +
      (paginaActual === 1 ? ' disabled' : '') + '>Anterior</button>';
    paginas.forEach(function (numero) {
      if (numero === '...') {
        html += '<span class="separador" aria-hidden="true">…</span>';
        return;
      }
      html += '<button type="button" class="' + (numero === paginaActual ? 'activa' : '') + '"' +
        (numero === paginaActual ? ' aria-current="page"' : '') +
        ' onclick="irAPagina(' + numero + ')">' + numero + '</button>';
    });
    return html +
      '<button type="button" onclick="irAPagina(' + (paginaActual + 1) + ')"' +
      (paginaActual === totalPaginas ? ' disabled' : '') + '>Siguiente</button>' +
      '</nav>';
  }

  function irAPagina(numero) {
    paginaActual = Math.max(1, Number(numero) || 1);
    pintar();
    var lista = document.getElementById('lista');
    if (lista) lista.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  var repintadoPendiente = null;
  function repintarDesdeFiltro(evento) {
    paginaActual = 1;
    if (evento && (evento.target.id === 'f-estado' || evento.target.id === 'f-municipio')) {
      actualizarListasUbicacion(evento.target.id);
    }
    window.clearTimeout(repintadoPendiente);
    repintadoPendiente = window.setTimeout(pintar, 90);
  }

  // Si hay filtros aplicados dentro del plegable, se avisa con un número:
  // de otro modo alguien puede no entender por qué ve tan pocos resultados.
  // Solo los que viven dentro del plegable: Market Center y Asesor ya
  // están a la vista en la barra, así que contarlos aquí marcaría el
  // aviso por un filtro que la persona sí puede ver.
  var CAMPOS_FILTRO = ['f-buscar', 'f-operacion', 'f-tipo', 'f-mc', 'f-asesor',
                       'f-estado', 'f-municipio', 'f-colonia', 'f-min', 'f-max',
                       'f-recamaras', 'f-banos', 'f-estacionamientos', 'f-m2-min', 'f-m2-max'];

  function marcarFiltrosEscondidos() {
    var puestos = CAMPOS_FILTRO.filter(function (id) { return val(id) !== ''; }).length;
    if (val('f-orden') !== 'reciente') puestos++;
    if (val('f-estatus') && val('f-estatus') !== 'publicada') puestos++;
    var chip = document.getElementById('cuenta-filtros');
    if (!chip) return;
    chip.textContent = puestos;
    chip.hidden = puestos === 0;
  }

  function limpiarFiltros() {
    ['f-buscar', 'f-operacion', 'f-tipo', 'f-mc', 'f-asesor', 'f-estado', 'f-municipio',
     'f-colonia', 'f-min', 'f-max', 'f-recamaras', 'f-banos', 'f-estacionamientos', 'f-m2-min', 'f-m2-max'
    ].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('f-orden').value = 'reciente';
    // El estatus vuelve a "Activa", que es el arranque razonable: lo
    // normal es querer ver lo que sí está a la venta.
    var e = document.getElementById('f-estatus');
    if (e) e.value = 'publicada';
    actualizarListasUbicacion();
    repintarDesdeFiltro();
  }

  function llenarSelect(id, valores, textoVacio) {
    var lista = document.getElementById(id);
    if (!lista) return;
    var actual = lista.value;
    lista.innerHTML = '';
    var vacio = document.createElement('option');
    vacio.value = '';
    vacio.textContent = textoVacio || 'Todos';
    lista.appendChild(vacio);
    valores.sort(function (a, b) { return String(a).localeCompare(String(b), 'es'); })
      .forEach(function (v) {
        var o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        lista.appendChild(o);
      });
    if (actual && valores.some(function (v) { return String(v) === actual; })) {
      lista.value = actual;
    }
  }

  function distintos(campo, predicado) {
    var vistos = {};
    todas.forEach(function (p) {
      if (predicado && !predicado(p)) return;
      var v = p[campo];
      if (v !== null && v !== undefined && String(v).trim() !== '') vistos[v] = true;
    });
    return Object.keys(vistos);
  }

  function actualizarListasUbicacion(campoOrigen) {
    if (campoOrigen === 'f-estado') {
      var municipioEl = document.getElementById('f-municipio');
      var coloniaEl = document.getElementById('f-colonia');
      if (municipioEl) municipioEl.value = '';
      if (coloniaEl) coloniaEl.value = '';
    } else if (campoOrigen === 'f-municipio') {
      var coloniaDependiente = document.getElementById('f-colonia');
      if (coloniaDependiente) coloniaDependiente.value = '';
    }
    var estado = val('f-estado');
    var municipio = val('f-municipio');
    llenarSelect('f-estado', distintos('estado'), 'Todas');
    llenarSelect('f-municipio', distintos('municipio', function (p) {
      return coincide(p.estado, estado);
    }), 'Todas');
    llenarSelect('f-colonia', distintos('colonia', function (p) {
      return coincide(p.estado, estado) && coincide(p.municipio, municipio);
    }), 'Todas');
  }

  // Las listas se arman con lo que de verdad hay en el inventario. Las de
  // ubicación se recalculan para que municipio y colonia dependan del campo
  // anterior, igual que en un portal inmobiliario.
  function llenarListas() {
    llenarSelect('f-tipo', distintos('tipo'), 'Todos');
    llenarSelect('f-mc', distintos('market_center'), 'Todos');
    llenarSelect('f-asesor', distintos('asesor_nombre'), 'Todos');
    actualizarListasUbicacion();
  }

  var CAMPOS = 'id, fuente, fuente_id, titulo, operacion, estatus, tipo, precio, moneda, recamaras, banos, ' +
               'estacionamientos, m2_construccion, calle, colonia, municipio, estado, cp, ' +
               'imagenes, asesor_nombre, market_center, updated_at';

  function pintarBannerRef(asesor) {
    var banner = document.getElementById('banner-ref');
    if (!asesor) { banner.style.display = 'none'; return; }
    var nombre = [asesor.nombre, asesor.apellido].filter(Boolean).join(' ') || 'tu asesor';
    var iniciales = nombre.split(' ').filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase();
    banner.innerHTML =
      (asesor.foto_url
        ? '<img class="banner-ref-foto" src="' + escapeHtml(asesor.foto_url) + '" alt="' + escapeHtml(nombre) + '" />'
        : '<span class="banner-ref-foto">' + escapeHtml(iniciales || 'KW') + '</span>') +
      '<span>Estás viendo el catálogo con los datos de contacto de <b>' + escapeHtml(nombre) + '</b>.</span>' +
      '<button type="button" class="banner-ref-quitar" onclick="quitarRefAsesor()">Quitar</button>';
    banner.style.display = 'flex';
  }

  function quitarRefAsesor() {
    window.kwRefAsesor.limpiar();
    pintarBannerRef(null);
  }

  function cambiarEstadoFiltros(cargando) {
    document.querySelectorAll('#filtros input, #filtros select')
      .forEach(function (el) { el.disabled = cargando; });
  }

  function consultaPropiedades(desde, hasta, contar) {
    var consulta = contar
      ? sb.from('propiedades_inventario').select(CAMPOS, { count: 'exact' })
      : sb.from('propiedades_inventario').select(CAMPOS);
    return consulta
      .eq('fuente', 'kwmexico')
      .order('updated_at', { ascending: false })
      .range(desde, hasta);
  }

  async function cargarResto(desde, total) {
    var tamanoLote = 500;
    if (!total) {
      var acumuladas = [];
      var offsetSecuencial = desde;
      while (true) {
        var secuencial = await consultaPropiedades(offsetSecuencial, offsetSecuencial + tamanoLote - 1, false);
        if (secuencial.error) throw secuencial.error;
        var loteSecuencial = secuencial.data || [];
        acumuladas = acumuladas.concat(loteSecuencial);
        if (loteSecuencial.length < tamanoLote) return acumuladas;
        offsetSecuencial += tamanoLote;
      }
    }
    if (total <= desde) return [];

    var offsets = [];
    for (var offset = desde; offset < total; offset += tamanoLote) offsets.push(offset);
    var lotes = new Array(offsets.length);
    var siguiente = 0;

    async function trabajador() {
      while (true) {
        var indice = siguiente++;
        if (indice >= offsets.length) return;
        var inicio = offsets[indice];
        var fin = Math.min(inicio + tamanoLote - 1, total - 1);
        var r = await consultaPropiedades(inicio, fin, false);
        if (r.error) throw r.error;
        lotes[indice] = r.data || [];
      }
    }

    await Promise.all(Array.from({ length: Math.min(4, offsets.length) }, trabajador));
    return lotes.reduce(function (todo, lote) { return todo.concat(lote || []); }, []);
  }

  async function cargar() {
    var cont = document.getElementById('lista');
    cambiarEstadoFiltros(true);
    try {
      // La primera página y el conteo viajan en paralelo. Así la persona ve
      // tarjetas en cuanto llega el primer lote, sin esperar el count exacto.
      var primeraPaginaPromise = consultaPropiedades(0, PROPIEDADES_POR_PAGINA - 1, false);
      var totalPromise = consultaPropiedades(0, 0, true);
      var r = await primeraPaginaPromise;
      if (r.error) throw r.error;
      var loteInicial = r.data || [];
      totalCatalogo = 0;

      document.getElementById('filtro-estatus').hidden = false;
      todas = loteInicial;

      if (!todas.length) {
        catalogoCargando = false;
        cambiarEstadoFiltros(false);
        document.getElementById('conteo').textContent = '';
        cont.innerHTML = '<div class="estado-msg">Todavía no hay propiedades de KWMexico sincronizadas.</div>';
        return;
      }

      document.getElementById('f-estatus').value = 'publicada';
      paginaActual = 1;
      pintar();

      var totalR = await totalPromise;
      if (totalR.error) throw totalR.error;
      totalCatalogo = Number(totalR.count) || todas.length;
      var resto = await cargarResto(PROPIEDADES_POR_PAGINA, totalCatalogo);
      todas = todas.concat(resto);
      totalCatalogo = todas.length;
      catalogoCargando = false;
      llenarListas();
      cambiarEstadoFiltros(false);
      paginaActual = 1;
      pintar();
    } catch (err) {
      catalogoCargando = false;
      cambiarEstadoFiltros(false);
      cont.innerHTML = '<div class="estado-msg">No se pudieron cargar las propiedades.<br>' +
        escapeHtml(err.message || '') + '</div>';
    }
  }

  /*
   * La vista anterior descargaba todo el inventario para poder filtrar en el
   * navegador. Ese flujo bloqueaba los catalogos y mantenia una solicitud
   * grande despues de pintar la primera pagina. Estas funciones reemplazan
   * ese comportamiento por consultas paginadas y catalogos independientes.
   */
  var solicitudPaginaServidor = 0;
  var temporizadorPaginaServidor = null;
  var catalogoServidorVersion = 0;
  var catalogosServidor = {};
  var CAMPOS_CATALOGO_SERVIDOR = {
    'f-tipo': 'tipo',
    'f-mc': 'market_center',
    'f-asesor': 'asesor_nombre',
    'f-estado': 'estado',
    'f-municipio': 'municipio',
    'f-colonia': 'colonia'
  };
  var TAMANO_LOTE_CATALOGO = 1000;

  function escaparLikeServidor(valor) {
    return String(valor == null ? '' : valor)
      .trim()
      .replace(/\\/g, ' ')
      .replace(/[%,()_]/g, ' ')
      .replace(/\s+/g, ' ');
  }

  function filtrosServidorActuales() {
    return {
      texto: val('f-buscar'),
      operacion: val('f-operacion'),
      estatus: val('f-estatus'),
      tipo: val('f-tipo'),
      marketCenter: val('f-mc'),
      asesor: val('f-asesor'),
      estado: val('f-estado'),
      municipio: val('f-municipio'),
      colonia: val('f-colonia'),
      minimo: num('f-min'),
      maximo: num('f-max'),
      recamaras: num('f-recamaras'),
      banos: num('f-banos'),
      estacionamientos: num('f-estacionamientos'),
      m2Min: num('f-m2-min'),
      m2Max: num('f-m2-max'),
      orden: val('f-orden') || 'reciente'
    };
  }

  function consultaPaginaServidor(pagina, filtros) {
    var inicio = (pagina - 1) * PROPIEDADES_POR_PAGINA;
    var consulta = sb.from('propiedades_inventario')
      .select(CAMPOS, { count: 'exact' })
      .eq('fuente', 'kwmexico');

    if (filtros.operacion) consulta = consulta.eq('operacion', filtros.operacion);
    if (filtros.estatus) consulta = consulta.eq('estatus', filtros.estatus);
    if (filtros.tipo) consulta = consulta.eq('tipo', filtros.tipo);
    if (filtros.marketCenter) consulta = consulta.eq('market_center', filtros.marketCenter);
    if (filtros.asesor) consulta = consulta.eq('asesor_nombre', filtros.asesor);
    if (filtros.estado) consulta = consulta.eq('estado', filtros.estado);
    if (filtros.municipio) consulta = consulta.eq('municipio', filtros.municipio);
    if (filtros.colonia) consulta = consulta.eq('colonia', filtros.colonia);
    if (filtros.minimo) consulta = consulta.gte('precio', filtros.minimo);
    if (filtros.maximo) consulta = consulta.lte('precio', filtros.maximo);
    if (filtros.recamaras) consulta = consulta.gte('recamaras', filtros.recamaras);
    if (filtros.banos) consulta = consulta.gte('banos', filtros.banos);
    if (filtros.estacionamientos) consulta = consulta.gte('estacionamientos', filtros.estacionamientos);
    if (filtros.m2Min) consulta = consulta.gte('m2_construccion', filtros.m2Min);
    if (filtros.m2Max) consulta = consulta.lte('m2_construccion', filtros.m2Max);

    var texto = escaparLikeServidor(filtros.texto);
    if (texto) {
      consulta = consulta.or([
        'titulo.ilike.%' + texto + '%',
        'asesor_nombre.ilike.%' + texto + '%',
        'calle.ilike.%' + texto + '%',
        'colonia.ilike.%' + texto + '%',
        'municipio.ilike.%' + texto + '%',
        'estado.ilike.%' + texto + '%',
        'tipo.ilike.%' + texto + '%',
        'market_center.ilike.%' + texto + '%'
      ].join(','));
    }

    if (filtros.orden === 'precio-asc') {
      consulta = consulta.order('precio', { ascending: true });
    } else if (filtros.orden === 'precio-desc') {
      consulta = consulta.order('precio', { ascending: false });
    } else if (filtros.orden === 'm2-desc') {
      consulta = consulta.order('m2_construccion', { ascending: false });
    } else {
      consulta = consulta.order('updated_at', { ascending: false });
    }

    return consulta.order('id', { ascending: true })
      .range(inicio, inicio + PROPIEDADES_POR_PAGINA - 1);
  }

  function opcionesCatalogoActualizadas(campo, lote) {
    var actuales = catalogosServidor[campo] || [];
    var vistos = {};
    actuales.forEach(function (valor) { vistos[String(valor)] = true; });
    (lote || []).forEach(function (fila) {
      var valor = fila && fila[campo];
      if (valor !== null && valor !== undefined && String(valor).trim() !== '') {
        if (!vistos[String(valor)]) {
          vistos[String(valor)] = true;
          actuales.push(String(valor).trim());
        }
      }
    });
    actuales.sort(function (a, b) { return a.localeCompare(b, 'es'); });
    catalogosServidor[campo] = actuales;
    return actuales;
  }

  async function cargarCatalogoServidor(id, campo, version) {
    var desde = 0;
    var select = document.getElementById(id);
    var textoVacio = (id === 'f-estado' || id === 'f-municipio' || id === 'f-colonia') ? 'Todas' : 'Todos';

    while (version === catalogoServidorVersion) {
      var respuesta = await sb.from('propiedades_inventario')
        .select(campo)
        .eq('fuente', 'kwmexico')
        .not(campo, 'is', null)
        .order(campo, { ascending: true })
        .range(desde, desde + TAMANO_LOTE_CATALOGO - 1);
      if (respuesta.error) throw respuesta.error;

      var lote = respuesta.data || [];
      opcionesCatalogoActualizadas(campo, lote);
      if (select && version === catalogoServidorVersion) {
        llenarSelect(id, catalogosServidor[campo], textoVacio);
      }
      if (lote.length < TAMANO_LOTE_CATALOGO) break;
      desde += lote.length;
    }

    if (select && version === catalogoServidorVersion) {
      select.removeAttribute('aria-busy');
    }
  }

  function cargarCatalogosServidor() {
    var version = ++catalogoServidorVersion;
    Object.keys(CAMPOS_CATALOGO_SERVIDOR).forEach(function (id) {
      var select = document.getElementById(id);
      var campo = CAMPOS_CATALOGO_SERVIDOR[id];
      if (select) select.setAttribute('aria-busy', 'true');
      cargarCatalogoServidor(id, campo, version).catch(function (error) {
        if (select) select.removeAttribute('aria-busy');
        console.warn('No se pudo cargar el filtro ' + campo, error);
      });
    });
  }

  function actualizarConteoServidor(total, pagina, cantidad) {
    var conteo = document.getElementById('conteo');
    if (!conteo) return;
    if (!total) {
      conteo.textContent = '0 propiedades';
      return;
    }
    var inicio = ((pagina - 1) * PROPIEDADES_POR_PAGINA) + 1;
    var fin = Math.min(pagina * PROPIEDADES_POR_PAGINA, total);
    if (cantidad === 1 && total === 1) {
      conteo.textContent = '1 propiedad';
      return;
    }
    conteo.textContent = 'Mostrando ' + inicio + ' a ' + fin + ' de ' + total + ' propiedades';
  }

  function renderPaginacionServidor(totalPaginas) {
    if (totalPaginas <= 1) return '';
    var paginas = [];
    function agregar(numero) {
      if (paginas.indexOf(numero) === -1) paginas.push(numero);
    }
    if (totalPaginas <= 7) {
      for (var i = 1; i <= totalPaginas; i++) agregar(i);
    } else {
      agregar(1);
      if (paginaActual > 4) paginas.push('...');
      for (var n = Math.max(2, paginaActual - 2); n <= Math.min(totalPaginas - 1, paginaActual + 2); n++) agregar(n);
      if (paginaActual < totalPaginas - 3) paginas.push('...');
      agregar(totalPaginas);
    }

    var html = '<nav class="paginacion" aria-label="Paginación de propiedades">' +
      '<button type="button" onclick="irAPagina(' + (paginaActual - 1) + ')"' +
      (paginaActual === 1 ? ' disabled' : '') + '>Anterior</button>';
    paginas.forEach(function (numero) {
      if (numero === '...') {
        html += '<span class="separador" aria-hidden="true">…</span>';
        return;
      }
      html += '<button type="button" class="' + (numero === paginaActual ? 'activa' : '') + '"' +
        (numero === paginaActual ? ' aria-current="page"' : '') +
        ' onclick="irAPagina(' + numero + ')">' + numero + '</button>';
    });
    return html +
      '<button type="button" onclick="irAPagina(' + (paginaActual + 1) + ')"' +
      (paginaActual === totalPaginas ? ' disabled' : '') + '>Siguiente</button></nav>';
  }

  function renderizarPaginaServidor(filas, total) {
    var lista = document.getElementById('lista');
    var totalPaginas = total ? Math.ceil(total / PROPIEDADES_POR_PAGINA) : 0;
    actualizarConteoServidor(total, paginaActual, filas.length);
    lista.classList.remove('lista-cargando');
    lista.removeAttribute('aria-busy');
    if (!filas.length) {
      lista.innerHTML = '<div class="estado-msg">No encontramos propiedades con esos filtros.</div>';
      return;
    }
    lista.innerHTML = filas.map(tarjeta).join('') + renderPaginacionServidor(totalPaginas);
  }

  async function cargarPaginaServidor(numero) {
    var lista = document.getElementById('lista');
    var conteo = document.getElementById('conteo');
    var paginaSolicitada = Math.max(1, Number(numero) || 1);
    var solicitud = ++solicitudPaginaServidor;
    paginaActual = paginaSolicitada;
    lista.classList.add('lista-cargando');
    lista.setAttribute('aria-busy', 'true');
    if (conteo) conteo.textContent = 'Cargando propiedades…';

    try {
      var respuesta = await consultaPaginaServidor(paginaSolicitada, filtrosServidorActuales());
      if (solicitud !== solicitudPaginaServidor) return;
      if (respuesta.error) throw respuesta.error;
      var filas = respuesta.data || [];
      var total = Number(respuesta.count);
      if (!isFinite(total)) total = ((paginaSolicitada - 1) * PROPIEDADES_POR_PAGINA) + filas.length;
      if (total && paginaSolicitada > Math.ceil(total / PROPIEDADES_POR_PAGINA)) {
        cargarPaginaServidor(Math.ceil(total / PROPIEDADES_POR_PAGINA));
        return;
      }
      totalResultados = total;
      renderizarPaginaServidor(filas, total);
    } catch (error) {
      if (solicitud !== solicitudPaginaServidor) return;
      lista.classList.remove('lista-cargando');
      lista.removeAttribute('aria-busy');
      if (conteo) conteo.textContent = 'No se pudieron cargar las propiedades';
      lista.innerHTML = '<div class="estado-msg">Intenta nuevamente en unos segundos.<br>' +
        escapeHtml(error.message || '') + '</div>';
    }
  }

  function programarCargaServidor() {
    paginaActual = 1;
    window.clearTimeout(temporizadorPaginaServidor);
    temporizadorPaginaServidor = window.setTimeout(function () {
      cargarPaginaServidor(1);
    }, 180);
  }

  pintar = function () {
    programarCargaServidor();
  };

  irAPagina = function (numero) {
    cargarPaginaServidor(numero);
    var lista = document.getElementById('lista');
    if (lista) lista.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  repintarDesdeFiltro = function (evento) {
    if (evento && evento.target.id === 'f-estado') {
      document.getElementById('f-municipio').value = '';
      document.getElementById('f-colonia').value = '';
      document.getElementById('f-municipio').dispatchEvent(new Event('change', { bubbles: true }));
    } else if (evento && evento.target.id === 'f-municipio') {
      document.getElementById('f-colonia').value = '';
      document.getElementById('f-colonia').dispatchEvent(new Event('change', { bubbles: true }));
    }
    programarCargaServidor();
  };

  limpiarFiltros = function () {
    ['f-buscar', 'f-operacion', 'f-tipo', 'f-mc', 'f-asesor', 'f-estado', 'f-municipio',
     'f-colonia', 'f-min', 'f-max', 'f-recamaras', 'f-banos', 'f-estacionamientos', 'f-m2-min', 'f-m2-max'
    ].forEach(function (id) {
      var elemento = document.getElementById(id);
      if (elemento) {
        elemento.value = '';
        if (elemento.tagName === 'SELECT') elemento.dispatchEvent(new Event('change', { bubbles: true }));
      }
    });
    var estatus = document.getElementById('f-estatus');
    if (estatus) {
      estatus.value = 'publicada';
      estatus.dispatchEvent(new Event('change', { bubbles: true }));
    }
    var orden = document.getElementById('f-orden');
    if (orden) {
      orden.value = 'reciente';
      orden.dispatchEvent(new Event('change', { bubbles: true }));
    }
    programarCargaServidor();
  };

  cargar = function () {
    var filtroEstatus = document.getElementById('filtro-estatus');
    var estatus = document.getElementById('f-estatus');
    if (filtroEstatus) filtroEstatus.hidden = false;
    if (estatus && !estatus.value) estatus.value = 'publicada';
    cargarCatalogosServidor();
    cargarPaginaServidor(1);
  };

  var cajaFiltros = document.getElementById('filtros');
  if (cajaFiltros) {
    cajaFiltros.addEventListener('change', repintarDesdeFiltro);
    cajaFiltros.addEventListener('input', repintarDesdeFiltro);
  }

  if (document.documentElement.classList.contains('kw-auth-ok')) cargar();
  else window.addEventListener('kw-auth-ready', cargar, { once: true });
</script>
