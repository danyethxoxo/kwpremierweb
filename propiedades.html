  body { background: transparent; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* La barra de arriba es la compartida (header.kw-header de
     kw-base.css): hamburguesa, título al centro y botón de regresar,
     igual que en el resto del sitio. */
  /* Sin tope de ancho: en pantalla grande entran más tarjetas por
     renglón en vez de dejar dos franjas vacías a los lados. */
  main { flex: 1; width: 100%; min-width: 0; margin: 0 auto; padding: 90px clamp(20px, 3vw, 48px) 60px; }

  .page-title { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; text-align: center; margin-bottom: 22px; color: var(--text); }

  /* ── Filtros ── */
  /* z-index alto y `position: relative` a propósito: la animación de
     entrada de kw-base.css deja un transform puesto (fill-mode both), y
     un transform crea contexto de apilamiento - eso encerraba el
     z-index del menú desplegable dentro de la barra, y las tarjetas, que
     van después en el HTML, le pasaban por encima. Subiendo la barra
     entera por encima de la lista, los menús vuelven a verse. */
  #lista { position: relative; z-index: 1; }
  .filtro { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  /* `display: flex` le gana al atributo `hidden`, y el filtro de estatus
     se le alcanzaba a ver a quien entra sin sesión. */

  /* En escritorio el filtro vive dentro del switch lateral universal de KW.
     Al sacarlo de su tarjeta original, conserva solo la lectura visual del
     contenido y deja que kw-lateral.css controle el panel. En celular vuelve

  .kw-lateral-contenido > .propiedades-sidebar {

    max-height: none;

    padding: 7px 10px;
    background: #f7f7f7;
  }
  /* La barra lateral mantiene su ancho y altura. Solo su contenido puede
     desplazarse, sin cambiar el ancho de la pagina ni mostrar otra barra. */
  .kw-lateral-universal {
    width: 292px !important;
    max-width: 292px;

  }
  .kw-lateral-universal .kw-lateral-contenido { scrollbar-width: auto; scrollbar-color: auto; }
  .kw-lateral-universal .kw-lateral-contenido::-webkit-scrollbar { width: 8px; }

  }
  .kw-lateral-universal .kw-lateral-contenido::-webkit-scrollbar-thumb {

  }

  /* En escritorio el riel completo es fijo, así que la barra de acciones

  #filtros .kw-select { width: 100% !important; min-width: 0 !important; max-width: 100%; }

  #filtros .kw-select-btn,

  .filtros-sidebar { display: flex; flex-direction: column; width: 100%; min-width: 0; max-width: 100%; }

  #filtros .filtro input,

  }
  #filtros .filtro select {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #filtros .rango { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  #filtros .filtro-rango { margin-top: 0; }
  .filtro-ayuda { margin-top: 9px; color: var(--muted); font-size: 10px; line-height: 1.4; }
  .filtros-dos-columnas {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; margin-top: 12px;
  }
  .filtros-dos-columnas .filtro { margin-top: 0 !important; }
  /* Las acciones permanecen visibles mientras el contenido del riel se
     desplaza; la barra conserva el mismo pie sólido que Nuevo dictamen. */
  .filtro-seccion-final {
    position: sticky; bottom: 0; z-index: 4;

    padding: 0; border: 0; border-radius: 0;

  }
  #filtros .filtros-acciones button {
    width: 100%; min-width: 0; min-height: 34px; margin: 0; padding: 7px 14px;
    border-radius: 9px; font: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  #filtros .filtros-acciones .btn-limpiar {
    border: 1.5px solid var(--border); background: #f7f7f6; color: #555;
  }
  #filtros .filtros-acciones .btn-limpiar:hover { background: #ececec; }
  #filtros .btn-aplicar {
    border: 1.5px solid var(--red); background: var(--red); color: #fff;
  }
  #filtros .btn-aplicar:hover { background: var(--pastel-rojo-txt); border-color: var(--pastel-rojo-txt); }

  .prop-pie {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: start;

  }
  .prop-pie span { min-width: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

  /* El enlace cubre la tarjeta completa, incluida la foto. Va por encima

  /* ── Tarjetas ── */
  /* Columnas por ancho disponible, no un número fijo: con tres fijas, en
     una pantalla grande cada tarjeta se estiraba a más de 500px y se
     veía media docena de propiedades en toda la pantalla. Así entran
     las que quepan y se aprovecha el ancho. */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 14px; align-items: stretch; }
  /* Las listas largas deben entrar estables. El movimiento de entrada en
     cada tarjeta se siente como saltos cuando la persona ya esta rodando. */
  #lista > .prop-card { animation: none; }

  .prop-card {
    background: #fff;
    border: 1px solid rgba(33,29,29,0.14);
    box-shadow: 0 2px 8px rgba(35,27,27,0.06);
    border-radius: 16px;

  function copiarTextoPropiedadFallback(texto) {
    return new Promise(function (resolver, rechazar) {
      var campo = document.createElement('textarea');
      campo.value = texto;
      campo.setAttribute('readonly', '');
      campo.style.position = 'fixed';
      campo.style.opacity = '0';
      campo.style.pointerEvents = 'none';
      document.body.appendChild(campo);
      campo.select();
      campo.setSelectionRange(0, campo.value.length);
      var copiado = false;
      try { copiado = document.execCommand('copy'); } catch (error) { /* compatibilidad */ }
      campo.remove();
      if (copiado) resolver();
      else rechazar(new Error('No se pudo copiar el enlace.'));
    });
  }

  function copiarTextoPropiedad(texto) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(texto).catch(function () {

      });
    }
    return copiarTextoPropiedadFallback(texto);
  }

  function cargarAsesorFicha(propiedad) {
    var base = datosAsesorFichaBase(propiedad);
    var tienePerfil = sitioAsesorPerfil && (sitioAsesorPerfil.nombre || sitioAsesorPerfil.apellido ||
      sitioAsesorPerfil.email || sitioAsesorPerfil.whatsapp || sitioAsesorPerfil.foto_url);
    if (tienePerfil) return Promise.resolve(base);
    if (!propiedad.asesor_id) return Promise.resolve(base);
    var clave = String(propiedad.asesor_id);
    if (asesoresFichaCache[clave]) return asesoresFichaCache[clave];
    asesoresFichaCache[clave] = sb.from('perfiles_publicos')
      .select('id,nombre,apellido,role,foto_url,puesto,sitio_web,whatsapp,email')
      .eq('id', propiedad.asesor_id)
      .maybeSingle()
      .then(function (respuesta) {

  function cargarFotosFicha(propiedad) {
    var actuales = Array.isArray(propiedad && propiedad.imagenes) ? propiedad.imagenes : [];
    if (!propiedad || !sb || !sb.functions || typeof sb.functions.invoke !== 'function' ||
        propiedad.fuente !== 'kwmexico' || !propiedad.fuente_id || actuales.length >= 12) {
      return Promise.resolve(propiedad);
    }
    var clave = String(propiedad.fuente_id);
    if (fotosFichaCache[clave]) return fotosFichaCache[clave];
    fotosFichaCache[clave] = sb.functions.invoke('fotos-propiedad', {
      body: { fuente: 'kwmexico', fuente_id: clave }
    }).then(function (respuesta) {
      if (respuesta.error || !respuesta.data || !Array.isArray(respuesta.data.imagenes)) return propiedad;
      var combinadas = actuales.concat(respuesta.data.imagenes);
      var vistas = Object.create(null);
      propiedad.imagenes = combinadas.filter(function (url) {
        if (!url || vistas[url]) return false;
        vistas[url] = true;
        return true;
      });
      return propiedad;
    }).catch(function () { return propiedad; });
    return fotosFichaCache[clave];
  }

  function ordenar(lista, modo) {

    } else if (modo === 'precio-desc') {
      copia.sort(function (a, b) { return (b.precio || 0) - (a.precio || 0); });
    } else if (modo === 'm2-desc') {
      copia.sort(function (a, b) { return (b.m2_construccion || 0) - (a.m2_construccion || 0); });

    return copia;
  }

  function pintar() {
    var texto = val('f-buscar').toLowerCase();
    var op = val('f-operacion');
    var estatus = val('f-estatus');
    var tipo = val('f-tipo');
    var mc = val('f-mc');
    var asesor = val('f-asesor');
    var estado = val('f-estado');
    var municipio = val('f-municipio');
    var colonia = val('f-colonia');
    var minPrecio = num('f-min');
    var maxPrecio = num('f-max');
    var rec = num('f-recamaras');
    var banos = num('f-banos');
    var est = num('f-estacionamientos');
    var m2Min = num('f-m2-min');
    var m2Max = num('f-m2-max');

    var vis = todas.filter(function (p) {
      if (op && p.operacion !== op) return false;
      if (estatus && p.estatus !== estatus) return false;
      if (tipo && !coincide(p.tipo, tipo)) return false;
      if (mc && !coincide(p.market_center, mc)) return false;
      if (asesor && !coincide(p.asesor_nombre, asesor)) return false;
      if (estado && !coincide(p.estado, estado)) return false;
      if (municipio && !coincide(p.municipio, municipio)) return false;
      if (colonia && !coincide(p.colonia, colonia)) return false;
      if (minPrecio && Number(p.precio || 0) < minPrecio) return false;
      if (maxPrecio && Number(p.precio || 0) > maxPrecio) return false;
      if (rec && Number(p.recamaras || 0) < rec) return false;
      if (banos && Number(p.banos || 0) < banos) return false;
      if (est && Number(p.estacionamientos || 0) < est) return false;
      if (m2Min && Number(p.m2_construccion || 0) < m2Min) return false;
      if (m2Max && Number(p.m2_construccion || 0) > m2Max) return false;
      if (texto) {
        var donde = [p.titulo, p.asesor_nombre, p.calle, p.colonia, p.municipio,
          p.estado, p.cp, p.tipo, p.market_center]
          .filter(Boolean).join(' ');
        if (normalizarTexto(donde).indexOf(normalizarTexto(texto)) === -1) return false;
      }
      return true;
    });

    vis = ordenar(vis, val('f-orden'));
    marcarFiltrosEscondidos();

    var cont = document.getElementById('lista');
    propiedadesPaginaActual = Object.create(null);
    var totalPaginas = catalogoCargando
      ? 1
      : Math.max(1, Math.ceil(vis.length / PROPIEDADES_POR_PAGINA));
    if (paginaActual > totalPaginas) paginaActual = totalPaginas;
    var inicio = (paginaActual - 1) * PROPIEDADES_POR_PAGINA;
    var pagina = vis.slice(inicio, inicio + PROPIEDADES_POR_PAGINA);
    var conteo = catalogoCargando && totalCatalogo
      ? totalCatalogo + ' propiedades · mostrando las primeras ' + pagina.length
      : vis.length + (vis.length === 1 ? ' propiedad' : ' propiedades') +
        (vis.length !== todas.length ? ' de ' + todas.length : '') +
        (vis.length ? ' · página ' + paginaActual + ' de ' + totalPaginas : '');
    document.getElementById('conteo').innerHTML =
      '<span>' + conteo + (catalogoCargando ? ' · cargando inventario…' : '') + '</span>';

    if (!vis.length) {
      cont.innerHTML = '<div class="estado-msg">No encontramos propiedades con esos filtros.</div>';
      return;
    }
    cont.innerHTML = pagina.map(tarjeta).join('') +
      (catalogoCargando ? '' : renderPaginacion(totalPaginas));
  }

  function renderPaginacion(totalPaginas) {
    if (totalPaginas <= 1) return '';
    var paginas = [];
    function agregar(numero) {
      if (paginas.indexOf(numero) === -1) paginas.push(numero);
    }
    if (totalPaginas <= 7) {
      for (var i = 1; i <= totalPaginas; i++) agregar(i);
    } else {
      agregar(1);
      if (paginaActual > 4) paginas.push('...');
      for (var n = Math.max(2, paginaActual - 2); n <= Math.min(totalPaginas - 1, paginaActual + 2); n++) agregar(n);
      if (paginaActual < totalPaginas - 3) paginas.push('...');
      agregar(totalPaginas);
    }

    var html = '<nav class="paginacion" aria-label="Paginación de propiedades">' +
      '<button type="button" onclick="irAPagina(' + (paginaActual - 1) + ')"' +
      (paginaActual === 1 ? ' disabled' : '') + '>Anterior</button>';
    paginas.forEach(function (numero) {
      if (numero === '...') {
        html += '<span class="separador" aria-hidden="true">…</span>';
        return;
      }
      html += '<button type="button" class="' + (numero === paginaActual ? 'activa' : '') + '"' +
        (numero === paginaActual ? ' aria-current="page"' : '') +
        ' onclick="irAPagina(' + numero + ')">' + numero + '</button>';
    });
    return html +
      '<button type="button" onclick="irAPagina(' + (paginaActual + 1) + ')"' +
      (paginaActual === totalPaginas ? ' disabled' : '') + '>Siguiente</button>' +
      '</nav>';
  }

  function irAPagina(numero) {
    paginaActual = Math.max(1, Number(numero) || 1);
    pintar();
    var lista = document.getElementById('lista');
    if (lista) lista.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  var repintadoPendiente = null;
  function repintarDesdeFiltro(evento) {
    paginaActual = 1;
    if (evento && (evento.target.id === 'f-estado' || evento.target.id === 'f-municipio')) {
      actualizarListasUbicacion(evento.target.id);
    }
    window.clearTimeout(repintadoPendiente);
    repintadoPendiente = window.setTimeout(pintar, 90);
  }

  // Si hay filtros aplicados dentro del plegable, se avisa con un número:
  // de otro modo alguien puede no entender por qué ve tan pocos resultados.
  // Solo los que viven dentro del plegable: Market Center y Asesor ya
  // están a la vista en la barra, así que contarlos aquí marcaría el
  // aviso por un filtro que la persona sí puede ver.
  var CAMPOS_FILTRO = ['f-buscar', 'f-operacion', 'f-tipo', 'f-mc', 'f-asesor',
                       'f-estado', 'f-municipio', 'f-colonia', 'f-min', 'f-max',
                       'f-recamaras', 'f-banos', 'f-estacionamientos', 'f-m2-min', 'f-m2-max'];

  function marcarFiltrosEscondidos() {
    var puestos = CAMPOS_FILTRO.filter(function (id) { return val(id) !== ''; }).length;
    if (val('f-orden') !== 'reciente') puestos++;
    if (val('f-estatus') && val('f-estatus') !== 'publicada') puestos++;
    var chip = document.getElementById('cuenta-filtros');
    if (!chip) return;
    chip.textContent = puestos;
    chip.hidden = puestos === 0;
  }

  function limpiarFiltros() {
    ['f-buscar', 'f-operacion', 'f-tipo', 'f-mc', 'f-asesor', 'f-estado', 'f-municipio',
     'f-colonia', 'f-min', 'f-max', 'f-recamaras', 'f-banos', 'f-estacionamientos', 'f-m2-min', 'f-m2-max'
    ].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('f-orden').value = 'reciente';
    // El estatus vuelve a "Activa", que es el arranque razonable: lo
    // normal es querer ver lo que sí está a la venta.
    var e = document.getElementById('f-estatus');
    if (e) e.value = 'publicada';
    actualizarListasUbicacion();
    repintarDesdeFiltro();
  }

  function nombreMarketCenter(valor) {
    return String(valor || '').replace(/M\u00c3\u00a9xico/g, 'México');
  }

  function llenarSelect(id, valores, textoVacio) {
    var lista = document.getElementById(id);
    if (!lista) return;
    var actual = lista.value;
    var opcionesNuevas = document.createDocumentFragment();
    var vacio = document.createElement('option');
    vacio.value = '';
    vacio.textContent = textoVacio || 'Todos';
    opcionesNuevas.appendChild(vacio);
    valores.sort(function (a, b) {
      function prioridad(valor) {
        var texto = normalizarTexto(valor).trim();
        if (id === 'f-mc') return texto === 'kw premier' ? 0 : 1;
        if (id === 'f-tipo') {
          var orden = ['casa', 'departamento', 'terreno', 'oficina', 'local comercial', 'bodega'];
          var indice = orden.indexOf(texto);
          return indice === -1 ? orden.length : indice;
        }
        return 0;
      }
      return prioridad(a) - prioridad(b) || String(a).localeCompare(String(b), 'es');
    })
      .forEach(function (v) {
        var o = document.createElement('option');
        o.value = v;
        o.textContent = id === 'f-mc' ? nombreMarketCenter(v) : v;
        opcionesNuevas.appendChild(o);
      });
    lista.replaceChildren(opcionesNuevas);
    if (actual && valores.some(function (v) { return String(v) === actual; })) {
      lista.value = actual;
    }
  }

  function distintos(campo, predicado) {
    var vistos = {};
    todas.forEach(function (p) {
      if (predicado && !predicado(p)) return;
      var v = p[campo];
      if (v !== null && v !== undefined && String(v).trim() !== '') vistos[v] = true;
    });
    return Object.keys(vistos);
  }

  function actualizarListasUbicacion(campoOrigen) {
    if (campoOrigen === 'f-estado') {
      var municipioEl = document.getElementById('f-municipio');
      var coloniaEl = document.getElementById('f-colonia');
      if (municipioEl) municipioEl.value = '';
      if (coloniaEl) coloniaEl.value = '';
    } else if (campoOrigen === 'f-municipio') {
      var coloniaDependiente = document.getElementById('f-colonia');
      if (coloniaDependiente) coloniaDependiente.value = '';
    }
    var estado = val('f-estado');
    var municipio = val('f-municipio');
    llenarSelect('f-estado', distintos('estado'), 'Todas');
    llenarSelect('f-municipio', distintos('municipio', function (p) {
      return coincide(p.estado, estado);
    }), 'Todas');
    llenarSelect('f-colonia', distintos('colonia', function (p) {
      return coincide(p.estado, estado) && coincide(p.municipio, municipio);
    }), 'Todas');
  }

  // Las listas se arman con lo que de verdad hay en el inventario. Las de
  // ubicación se recalculan para que municipio y colonia dependan del campo
  // anterior, igual que en un portal inmobiliario.
  function llenarListas() {
    llenarSelect('f-tipo', distintos('tipo'), 'Todos');
    llenarSelect('f-mc', distintos('market_center'), 'Todos');
    llenarSelect('f-asesor', distintos('asesor_nombre'), 'Todos');
    actualizarListasUbicacion();
  }

  var CAMPOS = 'id, fuente, fuente_id, titulo, operacion, estatus, tipo, precio, moneda, recamaras, banos, ' +
               'estacionamientos, m2_construccion, m2_terreno, calle, colonia, municipio, estado, cp, pais, ' +
               'imagenes, caracteristicas, asesor_id, asesor_nombre, market_center, updated_at, enlace_kw, asesor_kw_id';

  function pintarBannerRef(asesor) {
    var banner = document.getElementById('banner-ref');
    if (!asesor) { banner.style.display = 'none'; return; }
    var nombre = [asesor.nombre, asesor.apellido].filter(Boolean).join(' ') || 'tu asesor';
    var iniciales = nombre.split(' ').filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase();
    banner.innerHTML =
      (asesor.foto_url
        ? '<img class="banner-ref-foto" src="' + escapeHtml(asesor.foto_url) + '" alt="' + escapeHtml(nombre) + '" />'
        : '<span class="banner-ref-foto">' + escapeHtml(iniciales || 'KW') + '</span>') +
      '<span>Estás viendo el catálogo con los datos de contacto de <b>' + escapeHtml(nombre) + '</b>.</span>' +
      '<button type="button" class="banner-ref-quitar" onclick="quitarRefAsesor()">Quitar</button>';
    banner.style.display = 'flex';
  }

  function quitarRefAsesor() {
    window.kwRefAsesor.limpiar();
    pintarBannerRef(null);
  }

  function cambiarEstadoFiltros(cargando) {
    document.querySelectorAll('#filtros input, #filtros select')
      .forEach(function (el) { el.disabled = cargando; });
  }

  function consultaPropiedades(desde, hasta, contar) {
    var consulta = contar
      ? sb.from('propiedades_inventario').select(CAMPOS, { count: 'exact' })
      : sb.from('propiedades_inventario').select(CAMPOS);
    return consulta
      .eq('fuente', 'kwmexico')
      .order('updated_at', { ascending: false })
      .range(desde, hasta);
  }

  async function cargarResto(desde, total) {
    var tamanoLote = 500;
    if (!total) {
      var acumuladas = [];
      var offsetSecuencial = desde;
      while (true) {
        var secuencial = await consultaPropiedades(offsetSecuencial, offsetSecuencial + tamanoLote - 1, false);
        if (secuencial.error) throw secuencial.error;
        var loteSecuencial = secuencial.data || [];
        acumuladas = acumuladas.concat(loteSecuencial);
        if (loteSecuencial.length < tamanoLote) return acumuladas;
        offsetSecuencial += tamanoLote;
      }
    }
    if (total <= desde) return [];

    var offsets = [];
    for (var offset = desde; offset < total; offset += tamanoLote) offsets.push(offset);
    var lotes = new Array(offsets.length);
    var siguiente = 0;

    async function trabajador() {
      while (true) {
        var indice = siguiente++;
        if (indice >= offsets.length) return;
        var inicio = offsets[indice];
        var fin = Math.min(inicio + tamanoLote - 1, total - 1);
        var r = await consultaPropiedades(inicio, fin, false);
        if (r.error) throw r.error;
        lotes[indice] = r.data || [];
      }
    }

    await Promise.all(Array.from({ length: Math.min(4, offsets.length) }, trabajador));
    return lotes.reduce(function (todo, lote) { return todo.concat(lote || []); }, []);
  }

  async function cargar() {
    var cont = document.getElementById('lista');
    cambiarEstadoFiltros(true);
    try {
      // La primera página y el conteo viajan en paralelo. Así la persona ve
      // tarjetas en cuanto llega el primer lote, sin esperar el count exacto.
      var primeraPaginaPromise = consultaPropiedades(0, PROPIEDADES_POR_PAGINA - 1, false);
      var totalPromise = consultaPropiedades(0, 0, true);
      var r = await primeraPaginaPromise;
      if (r.error) throw r.error;
      var loteInicial = r.data || [];
      totalCatalogo = 0;

      document.getElementById('filtro-estatus').hidden = false;
      todas = loteInicial;

      if (!todas.length) {
        catalogoCargando = false;
        cambiarEstadoFiltros(false);
        document.getElementById('conteo').textContent = '';
        cont.innerHTML = '<div class="estado-msg">Todavía no hay propiedades de KWMexico sincronizadas.</div>';
        return;
      }

      document.getElementById('f-estatus').value = 'publicada';
      paginaActual = 1;
      pintar();

      var totalR = await totalPromise;
      if (totalR.error) throw totalR.error;
      totalCatalogo = Number(totalR.count) || todas.length;
      var resto = await cargarResto(PROPIEDADES_POR_PAGINA, totalCatalogo);
      todas = todas.concat(resto);
      totalCatalogo = todas.length;
      catalogoCargando = false;
      llenarListas();
      cambiarEstadoFiltros(false);
      paginaActual = 1;
      pintar();
    } catch (err) {
      catalogoCargando = false;
      cambiarEstadoFiltros(false);
      cont.innerHTML = '<div class="estado-msg">No se pudieron cargar las propiedades.<br>' +
        escapeHtml(err.message || '') + '</div>';
    }
  }

  /*
   * La vista anterior descargaba todo el inventario para poder filtrar en el
   * navegador. Ese flujo bloqueaba los catalogos y mantenia una solicitud
   * grande despues de pintar la primera pagina. Estas funciones reemplazan
   * ese comportamiento por consultas paginadas y catalogos independientes.
   */
  var solicitudPaginaServidor = 0;
  var temporizadorPaginaServidor = null;
  var filtrosAplicados = null;
  var catalogoServidorVersion = 0;
  var catalogosServidor = {};
  var versionesCatalogoRelacionado = {};
  var actualizandoRelaciones = false;
  var versionUbicacion = 0;
  function ubicacionColonia(valor) {
    if (String(valor).indexOf('ubic:') !== 0) return null;
    try { return JSON.parse(valor.slice(5)); } catch (error) { return null; }
  }
  function ponerFiltroRelacionado(id, valor) {
    var select = document.getElementById(id);
    if (valor && !Array.from(select.options).some(function (o) { return o.value === valor; })) {
      select.add(new Option(valor, valor));
    }
    select.value = valor || '';
    actualizandoRelaciones = true;
    try { select.dispatchEvent(new Event('change', { bubbles: true })); }
    finally { actualizandoRelaciones = false; }
  }
  var CAMPOS_CATALOGO_SERVIDOR = {
    'f-tipo': 'tipos_filtro',
    'f-mc': 'market_center',
    'f-asesor': 'asesor_nombre',
    'f-estado': 'estado',
    'f-municipio': 'municipio',
    'f-colonia': 'colonia'
  };
  var TAMANO_LOTE_CATALOGO = 1000;

  function escaparLikeServidor(valor) {
    return String(valor == null ? '' : valor)
      .trim()
      .replace(/\\/g, ' ')
      .replace(/[%,()_]/g, ' ')
      .replace(/\s+/g, ' ');
  }

  function leerFiltrosServidor() {
    return {
      texto: val('f-buscar'),
      operacion: val('f-operacion'),
      estatus: val('f-estatus'),
      tipo: val('f-tipo'),
      marketCenter: val('f-mc'),
      asesor: val('f-asesor'),
      estado: val('f-estado'),
      municipio: val('f-municipio'),
      colonia: (ubicacionColonia(val('f-colonia')) || {}).colonia || val('f-colonia'),
      minimo: num('f-min'),
      maximo: num('f-max'),
      recamaras: num('f-recamaras'),
      recamarasMax: num('f-recamaras-max'),
      banos: num('f-banos'),
      estacionamientos: num('f-estacionamientos'),
      m2Min: num('f-m2-min'),
      m2Max: num('f-m2-max'),
      orden: val('f-orden') || 'reciente'
    };
  }

  function filtrosServidorActuales() {
    return filtrosAplicados || leerFiltrosServidor();
  }

  function consultaPaginaServidor(pagina, filtros) {
    var inicio = (pagina - 1) * PROPIEDADES_POR_PAGINA;
    var consulta = sb.from('propiedades_inventario')
      .select(CAMPOS, { count: 'exact' })
      .eq('fuente', 'kwmexico');

    if (filtros.operacion) consulta = consulta.eq('operacion', filtros.operacion);
    if (filtros.estatus === 'inactiva') consulta = consulta.neq('estatus', 'publicada');
    else if (filtros.estatus) consulta = consulta.eq('estatus', filtros.estatus);
    if (filtros.tipo) consulta = consulta.contains('tipos_filtro', [filtros.tipo]);
    if (filtros.marketCenter) consulta = consulta.eq('market_center', filtros.marketCenter);
    if (filtros.asesor) consulta = consulta.eq('asesor_nombre', filtros.asesor);
    if (filtros.estado) consulta = consulta.eq('estado', filtros.estado);
    if (filtros.municipio) consulta = consulta.eq('municipio', filtros.municipio);
    if (filtros.colonia) consulta = consulta.eq('colonia', filtros.colonia);
    if (filtros.minimo) consulta = consulta.gte('precio', filtros.minimo);
    if (filtros.maximo) consulta = consulta.lte('precio', filtros.maximo);
    if (filtros.recamaras) consulta = consulta.gte('recamaras', filtros.recamaras);
    if (filtros.recamarasMax) consulta = consulta.lte('recamaras', filtros.recamarasMax);
    if (filtros.banos) consulta = consulta.gte('banos', filtros.banos);
    if (filtros.estacionamientos) consulta = consulta.gte('estacionamientos', filtros.estacionamientos);
    if (filtros.m2Min) consulta = consulta.gte('m2_construccion', filtros.m2Min);
    if (filtros.m2Max) consulta = consulta.lte('m2_construccion', filtros.m2Max);

    var texto = escaparLikeServidor(filtros.texto);
    if (texto) {
      consulta = consulta.or([
        'titulo.ilike.%' + texto + '%',
        'asesor_nombre.ilike.%' + texto + '%',
        'calle.ilike.%' + texto + '%',
        'colonia.ilike.%' + texto + '%',
        'municipio.ilike.%' + texto + '%',
        'estado.ilike.%' + texto + '%',
        'tipo.ilike.%' + texto + '%',
        'market_center.ilike.%' + texto + '%'
      ].join(','));
    }

    if (filtros.orden === 'precio-asc') {
      consulta = consulta.order('precio', { ascending: true });
    } else if (filtros.orden === 'precio-desc') {
      consulta = consulta.order('precio', { ascending: false });
    } else if (filtros.orden === 'm2-desc') {
      consulta = consulta.order('m2_construccion', { ascending: false });
    } else {
      consulta = consulta.order('updated_at', { ascending: false });
    }

    return consulta.order('id', { ascending: true })
      .range(inicio, inicio + PROPIEDADES_POR_PAGINA - 1);
  }

  function opcionesCatalogoActualizadas(campo, lote) {
    var actuales = catalogosServidor[campo] || [];
    var vistos = {};
    actuales.forEach(function (valor) { vistos[String(valor)] = true; });
    (lote || []).forEach(function (fila) {
      var valor = fila && fila[campo];
      if (valor !== null && valor !== undefined && String(valor).trim() !== '') {
        if (!vistos[String(valor)]) {
          vistos[String(valor)] = true;
          actuales.push(String(valor).trim());
        }
      }
    });
    actuales.sort(function (a, b) { return a.localeCompare(b, 'es'); });
    catalogosServidor[campo] = actuales;
    return actuales;
  }

  async function cargarCatalogoServidor(id, campo, version) {
    var revision = (versionesCatalogoRelacionado[id] || 0) + 1;
    versionesCatalogoRelacionado[id] = revision;
    var desde = 0;
    var select = document.getElementById(id);
    var textoVacio = (id === 'f-estado' || id === 'f-municipio' || id === 'f-colonia') ? 'Todas' : 'Todos';
    var contexto = { mc: val('f-mc'), estado: val('f-estado'), municipio: val('f-municipio') };
    var valores = new Set();
    var colonias = new Map();
    if (select) select.setAttribute('aria-busy', 'true');

    while (version === catalogoServidorVersion && revision === versionesCatalogoRelacionado[id]) {
      var consulta = sb.from('propiedades_inventario')
        .select(id === 'f-colonia' ? 'colonia, municipio, estado' : campo)
        .eq('fuente', 'kwmexico')
        .not(campo, 'is', null)
        .order(campo, { ascending: true })
        .order('id', { ascending: true })
        .range(desde, desde + TAMANO_LOTE_CATALOGO - 1);
      if (id === 'f-asesor' && contexto.mc) consulta = consulta.eq('market_center', contexto.mc);
      if ((id === 'f-municipio' || id === 'f-colonia') && contexto.estado) consulta = consulta.eq('estado', contexto.estado);
      if (id === 'f-colonia' && contexto.municipio) consulta = consulta.eq('municipio', contexto.municipio);
      var respuesta = await consulta;
      if (respuesta.error) throw respuesta.error;
      if (revision !== versionesCatalogoRelacionado[id] || version !== catalogoServidorVersion) return;

      var lote = respuesta.data || [];
      lote.forEach(function (fila) {
        if (!fila[campo]) return;
        if ((id === 'f-estado' || id === 'f-colonia') && normalizarTexto(fila.estado).trim() === 'antioquia') return;
        if (id === 'f-colonia') {
          var lugar = { colonia: fila.colonia, municipio: fila.municipio || '', estado: fila.estado || '' };
          colonias.set('ubic:' + JSON.stringify(lugar), lugar);
        } else if (Array.isArray(fila[campo])) {
          fila[campo].forEach(function (tipo) { if (tipo) valores.add(String(tipo)); });
        } else valores.add(String(fila[campo]));
      });
      if (lote.length < TAMANO_LOTE_CATALOGO) break;
      desde += lote.length;
    }

    if (select && version === catalogoServidorVersion && revision === versionesCatalogoRelacionado[id]) {
      var anterior = select.value;
      if (id === 'f-colonia') {
        var opciones = Array.from(colonias.entries()).sort(function (a, b) { return a[1].colonia.localeCompare(b[1].colonia, 'es'); });
        var fragmento = document.createDocumentFragment();
        fragmento.appendChild(new Option(textoVacio, ''));
        opciones.forEach(function (entrada) {
          var lugar = entrada[1];
          fragmento.appendChild(new Option([lugar.colonia, lugar.municipio, lugar.estado].filter(Boolean).join(' · '), entrada[0]));
        });
        select.replaceChildren(fragmento);
      } else llenarSelect(id, Array.from(valores), textoVacio);
      // No perder una selección mientras todavía llegan bloques del catálogo.
      if (anterior && !Array.from(select.options).some(function (o) { return o.value === anterior; })) {
        var lugarAnterior = ubicacionColonia(anterior);
        select.add(new Option(lugarAnterior ? lugarAnterior.colonia : anterior, anterior));
      }
      select.value = anterior;
    }

    if (select && version === catalogoServidorVersion && revision === versionesCatalogoRelacionado[id]) {
      select.removeAttribute('aria-busy');
    }
  }

  function refrescarRelacionado(id) {
    var select = document.getElementById(id);
    var elegida = select.options[select.selectedIndex];
    var conservar = elegida && elegida.value ? new Option(elegida.textContent, elegida.value, false, true) : null;
    select.replaceChildren(new Option(id === 'f-asesor' ? 'Todos' : 'Todas', ''));
    if (conservar) select.add(conservar);
    return cargarCatalogoServidor(id, CAMPOS_CATALOGO_SERVIDOR[id], catalogoServidorVersion).catch(function (error) {
      document.getElementById(id).removeAttribute('aria-busy');
      console.warn('No se pudo actualizar ' + id, error);
    });
  }

  async function completarCiudadMunicipio(municipio, revision) {
    var estados = new Set();
    for (var desde = 0; ; desde += TAMANO_LOTE_CATALOGO) {
      var respuesta = await sb.from('propiedades_inventario').select('estado')
        .eq('fuente', 'kwmexico').eq('municipio', municipio).order('id')
        .range(desde, desde + TAMANO_LOTE_CATALOGO - 1);
      if (respuesta.error) throw respuesta.error;
      if (revision !== versionUbicacion) return;
      (respuesta.data || []).forEach(function (fila) {
        if (fila.estado && normalizarTexto(fila.estado).trim() !== 'antioquia') estados.add(fila.estado);
      });
      if ((respuesta.data || []).length < TAMANO_LOTE_CATALOGO) break;
    }
    if (estados.size === 1 && revision === versionUbicacion) {
      ponerFiltroRelacionado('f-estado', Array.from(estados)[0]);
      refrescarRelacionado('f-municipio');
      refrescarRelacionado('f-colonia');
      marcarFiltrosEscondidos();
    }
  }

  function cargarCatalogosServidor() {
    var version = ++catalogoServidorVersion;
    Object.keys(CAMPOS_CATALOGO_SERVIDOR).forEach(function (id) {
      var select = document.getElementById(id);
      var campo = CAMPOS_CATALOGO_SERVIDOR[id];
      if (select) select.setAttribute('aria-busy', 'true');
      cargarCatalogoServidor(id, campo, version).catch(function (error) {
        if (select) select.removeAttribute('aria-busy');
        console.warn('No se pudo cargar el filtro ' + campo, error);
      });
    });
  }

  function programarCargaCatalogosServidor() {
    var iniciar = function () { cargarCatalogosServidor(); };
    if ('requestIdleCallback' in window) {
      window.requestIdleCallback(iniciar, { timeout: 2000 });
    } else {
      window.setTimeout(iniciar, 650);
    }
  }

  var revisionPrecalentamientoImagenes = 0;

  function programarPrecalentamientoImagenes() {
    var revision = ++revisionPrecalentamientoImagenes;
    var pendientes = Array.from(document.querySelectorAll('#lista .prop-imagen')).slice(4);
    var activas = 0;

    // Cargar los elementos reales conserva su imagen decodificada. Dos
    // solicitudes a la vez evitan competir con todas las fotos de entrada.
    function iniciar() {
      if (revision !== revisionPrecalentamientoImagenes) return;
      while (activas < 2 && pendientes.length) {
        var imagen = pendientes.shift();
        if (!imagen.isConnected || imagen.complete) continue;
        activas++;
        (function (foto) {
          var terminada = false;
          function terminar() {
            if (terminada) return;
            terminada = true;
            foto.removeEventListener('load', terminar);
            foto.removeEventListener('error', terminar);
            activas--;
            agendar();
          }
          foto.addEventListener('load', terminar);
          foto.addEventListener('error', terminar);
          foto.loading = 'eager';
        })(imagen);
      }
    }
    function agendar() {
      if (revision !== revisionPrecalentamientoImagenes || !pendientes.length) return;
      if ('requestIdleCallback' in window) window.requestIdleCallback(iniciar, { timeout: 1200 });
      else window.setTimeout(iniciar, 80);
    }
    agendar();
  }

  function actualizarConteoServidor(total, pagina, cantidad) {
    var conteo = document.getElementById('conteo');
    if (!conteo) return;
    conteo.textContent = 'Mostrando ' + cantidad + ' de ' + total + ' listados';
  }

  function mostrarCargadorPropiedades() {
    if (document.getElementById('propiedades-cargando')) return;
    var cargador = document.createElement('div');
    cargador.id = 'propiedades-cargando';
    cargador.className = 'propiedades-cargando';
    cargador.setAttribute('role', 'status');
    cargador.setAttribute('aria-label', 'Cargando propiedades');
    cargador.innerHTML = '<div class="kw-loader" aria-hidden="true">' +
      '<div class="circle uno"></div><div class="circle dos"></div><div class="circle tres"></div>' +
      '</div>';
    document.body.appendChild(cargador);
  }

  function ocultarCargadorPropiedades() {
    var cargador = document.getElementById('propiedades-cargando');
    if (cargador) cargador.remove();
  }

  function renderPaginacionServidor(totalPaginas) {
    if (totalPaginas <= 1) return '';
    var paginas = [];
    function agregar(numero) {
      if (paginas.indexOf(numero) === -1) paginas.push(numero);
    }
    if (totalPaginas <= 7) {
      for (var i = 1; i <= totalPaginas; i++) agregar(i);
    } else {
      agregar(1);
      if (paginaActual > 4) paginas.push('...');
      for (var n = Math.max(2, paginaActual - 2); n <= Math.min(totalPaginas - 1, paginaActual + 2); n++) agregar(n);
      if (paginaActual < totalPaginas - 3) paginas.push('...');
      agregar(totalPaginas);
    }

    var html = '<nav class="paginacion" aria-label="Paginación de propiedades">' +
      '<button type="button" onclick="irAPagina(' + (paginaActual - 1) + ')"' +
      (paginaActual === 1 ? ' disabled' : '') + '>Anterior</button>';
    paginas.forEach(function (numero) {
      if (numero === '...') {
        html += '<span class="separador" aria-hidden="true">…</span>';
        return;
      }
      html += '<button type="button" class="' + (numero === paginaActual ? 'activa' : '') + '"' +
        (numero === paginaActual ? ' aria-current="page"' : '') +
        ' onclick="irAPagina(' + numero + ')">' + numero + '</button>';
    });
    return html +
      '<button type="button" onclick="irAPagina(' + (paginaActual + 1) + ')"' +
      (paginaActual === totalPaginas ? ' disabled' : '') + '>Siguiente</button></nav>';
  }

  function renderizarPaginaServidor(filas, total) {
    var lista = document.getElementById('lista');
    propiedadesPaginaActual = Object.create(null);
    var totalPaginas = total ? Math.ceil(total / PROPIEDADES_POR_PAGINA) : 0;
    ocultarCargadorPropiedades();
    actualizarConteoServidor(total, paginaActual, filas.length);
    lista.classList.remove('lista-cargando');
    lista.removeAttribute('aria-busy');
    if (!filas.length) {
      lista.innerHTML = '<div class="estado-msg">No encontramos propiedades con esos filtros.</div>';
      return;
    }
    lista.innerHTML = filas.map(tarjeta).join('') + renderPaginacionServidor(totalPaginas);
    actualizarControlesTitulo();
    programarPrecalentamientoImagenes();
  }

  async function cargarPaginaServidor(numero) {
    var lista = document.getElementById('lista');
    var conteo = document.getElementById('conteo');
    var paginaSolicitada = Math.max(1, Number(numero) || 1);
    var solicitud = ++solicitudPaginaServidor;
    ++revisionPrecalentamientoImagenes;
    paginaActual = paginaSolicitada;
    lista.classList.add('lista-cargando');
    lista.setAttribute('aria-busy', 'true');
    mostrarCargadorPropiedades();
    if (conteo) conteo.textContent = '';

    try {
      var cargas = await Promise.all([
        cargarSitioAsesor(),
        consultaPaginaServidor(paginaSolicitada, filtrosServidorActuales())
      ]);
      if (solicitud !== solicitudPaginaServidor) return;
      var respuesta = cargas[1];
      if (respuesta.error) throw respuesta.error;
      var filas = respuesta.data || [];
      var total = Number(respuesta.count);
      if (!isFinite(total)) total = ((paginaSolicitada - 1) * PROPIEDADES_POR_PAGINA) + filas.length;
      if (total && paginaSolicitada > Math.ceil(total / PROPIEDADES_POR_PAGINA)) {
        cargarPaginaServidor(Math.ceil(total / PROPIEDADES_POR_PAGINA));
        return;
      }
      totalResultados = total;
      renderizarPaginaServidor(filas, total);
    } catch (error) {
      if (solicitud !== solicitudPaginaServidor) return;
      ocultarCargadorPropiedades();
      lista.classList.remove('lista-cargando');
      lista.removeAttribute('aria-busy');
      if (conteo) conteo.textContent = 'No se pudieron cargar las propiedades';
      lista.innerHTML = '<div class="estado-msg">Intenta nuevamente en unos segundos.<br>' +
        escapeHtml(error.message || '') + '</div>';
    }
  }

  function programarCargaServidor() {
    paginaActual = 1;
    window.clearTimeout(temporizadorPaginaServidor);
    temporizadorPaginaServidor = window.setTimeout(function () {
      cargarPaginaServidor(1);
    }, 180);
  }

  aplicarFiltros = function () {
    filtrosAplicados = leerFiltrosServidor();
    marcarFiltrosEscondidos();
    programarCargaServidor();
  };

  pintar = function () {
    programarCargaServidor();
  };

  irAPagina = function (numero) {
    cargarPaginaServidor(numero);
    var lista = document.getElementById('lista');
    if (lista) lista.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  repintarDesdeFiltro = function (evento) {
    if (evento && evento.target.id === 'mi-sitio-web') return;
    if (actualizandoRelaciones) return;
    var id = evento && evento.target.id;
    // Los selects nativos disparan input y change; procesar cada elección una sola vez.
    if (evento && evento.type === 'input' && evento.target.tagName === 'SELECT') return;
    if (id === 'f-mc') {
      ponerFiltroRelacionado('f-asesor', '');
      refrescarRelacionado('f-asesor');
    } else if (id === 'f-estado') {
      ++versionUbicacion;
      ponerFiltroRelacionado('f-municipio', '');
      ponerFiltroRelacionado('f-colonia', '');
      refrescarRelacionado('f-municipio');
      refrescarRelacionado('f-colonia');
    } else if (id === 'f-municipio') {
      var revision = ++versionUbicacion;
      ponerFiltroRelacionado('f-colonia', '');
      refrescarRelacionado('f-colonia');
      if (val('f-municipio') && !val('f-estado')) completarCiudadMunicipio(val('f-municipio'), revision).catch(console.warn);
    } else if (id === 'f-colonia') {
      ++versionUbicacion;
      var lugar = ubicacionColonia(val('f-colonia'));
      if (lugar) {
        ponerFiltroRelacionado('f-estado', lugar.estado);
        ponerFiltroRelacionado('f-municipio', lugar.municipio);
        refrescarRelacionado('f-municipio');
        refrescarRelacionado('f-colonia');
      }
    }
    marcarFiltrosEscondidos();
  };

  limpiarFiltros = function () {
    document.getElementById('f-recamaras-max').value = '';
    ['f-buscar', 'f-operacion', 'f-tipo', 'f-mc', 'f-asesor', 'f-estado', 'f-municipio',
     'f-colonia', 'f-min', 'f-max', 'f-recamaras', 'f-banos', 'f-estacionamientos', 'f-m2-min', 'f-m2-max'
    ].forEach(function (id) {
      var elemento = document.getElementById(id);
      if (elemento) {
        elemento.value = '';
        if (elemento.tagName === 'SELECT') elemento.dispatchEvent(new Event('change', { bubbles: true }));
      }
    });
    var estatus = document.getElementById('f-estatus');
    if (estatus) {
      estatus.value = 'publicada';
      estatus.dispatchEvent(new Event('change', { bubbles: true }));
    }
    var orden = document.getElementById('f-orden');
    if (orden) {
      orden.value = 'reciente';
      orden.dispatchEvent(new Event('change', { bubbles: true }));
    }
    aplicarFiltros();
  };

  cargar = function () {
    var filtroEstatus = document.getElementById('filtro-estatus');
    var estatus = document.getElementById('f-estatus');
    if (filtroEstatus) filtroEstatus.hidden = false;
    if (estatus && !estatus.value) estatus.value = 'publicada';
    filtrosAplicados = leerFiltrosServidor();
    marcarFiltrosEscondidos();
    cargarPaginaServidor(1).then(programarCargaCatalogosServidor);
  };

  var cajaFiltros = document.getElementById('filtros');
  var campoBuscar = document.getElementById('f-buscar');
  if (campoBuscar) {
    campoBuscar.addEventListener('keydown', function (evento) {
      if (evento.key === 'Enter') {
        evento.preventDefault();
        aplicarFiltros();
      }
    });
  }
  var campoSitio = document.getElementById('mi-sitio-web');
  campoSitio.addEventListener('change', guardarSitioAsesor);
  document.getElementById('mi-sitio-quitar').addEventListener('click', quitarSitioAsesor);
  campoSitio.addEventListener('input', function () {
    this.removeAttribute('aria-invalid');
    mostrarEstadoSitio('');
  });
  campoSitio.addEventListener('keydown', function (evento) {
    if (evento.key === 'Enter') {
      evento.preventDefault();
      guardarSitioAsesor();
    }
  });
  function prepararBusquedasCatalogo() {
    ['f-mc', 'f-asesor', 'f-tipo', 'f-estado', 'f-municipio', 'f-colonia'].forEach(function (id) {
      var select = document.getElementById(id);
      var caja = select && select.closest('.kw-select');
      var menu = caja && caja.querySelector('.kw-select-menu');
      if (!menu) return;
      var btn = caja.querySelector('.kw-select-btn');
      var existente = caja.querySelector('.catalogo-buscar');
      if (existente) { existente.actualizarCatalogo(); return; }
      caja.classList.add('catalogo-select');
      var buscar = document.createElement('input');
      buscar.type = 'text';
      buscar.className = 'catalogo-buscar';
      buscar.autocomplete = 'off';
      buscar.setAttribute('role', 'combobox');
      buscar.setAttribute('aria-autocomplete', 'list');
      menu.id = id + '-opciones';
      buscar.setAttribute('aria-controls', menu.id);
      btn.tabIndex = -1;
      btn.setAttribute('aria-label', 'Abrir opciones');
      buscar.setAttribute('aria-label', 'Buscar en ' + document.querySelector('label[for="' + id + '"]').textContent);
      var limpiar = document.createElement('button');
      limpiar.type = 'button';
      limpiar.className = 'catalogo-limpiar';
      limpiar.setAttribute('aria-label', 'Borrar filtro ' + document.querySelector('label[for="' + id + '"]').textContent);
      limpiar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>';
      limpiar.addEventListener('click', function (evento) {
        evento.stopPropagation();
        buscar.value = '';
        select.value = '';
        if (caja.classList.contains('abierto')) btn.click();
        select.dispatchEvent(new Event('change', { bubbles: true }));
        buscar.actualizarCatalogo();
        buscar.focus();
      });
      function filtrar() {
        limpiar.hidden = !select.value && !buscar.value;
        limpiar.disabled = select.disabled;
        var texto = normalizarTexto(buscar.value);
        menu.querySelectorAll('.kw-select-opcion').forEach(function (opcion) {
          opcion.hidden = normalizarTexto(opcion.textContent).indexOf(texto) === -1;
        });
      }
      buscar.actualizarCatalogo = function () {
        var estilo = getComputedStyle(btn);
        ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing'].forEach(function (propiedad) {
          buscar.style[propiedad] = estilo[propiedad];
        });
        buscar.style.setProperty('--catalogo-inset', (parseFloat(estilo.paddingLeft) + parseFloat(estilo.borderLeftWidth)) + 'px');
        buscar.style.setProperty('--catalogo-color', getComputedStyle(caja.querySelector('.kw-select-valor')).color);
        var abierto = caja.classList.contains('abierto');
        buscar.setAttribute('aria-expanded', String(abierto));
        buscar.disabled = select.disabled;
        var seleccion = select.options[select.selectedIndex];
        buscar.placeholder = seleccion ? seleccion.textContent : 'Todos';
        if (!abierto) buscar.value = '';
        filtrar();
      };
      function abrirCatalogo() {
        if (!caja.classList.contains('abierto')) btn.click();
        filtrar();
      }
      buscar.addEventListener('click', function (evento) { evento.stopPropagation(); abrirCatalogo(); });
      buscar.addEventListener('input', function (evento) {
        evento.stopPropagation();
        abrirCatalogo();
      });
      buscar.addEventListener('keydown', function (evento) {
        evento.stopPropagation();
        if (evento.key === 'ArrowDown' || evento.key === 'Enter') {
          abrirCatalogo();
          var primera = menu.querySelector('.kw-select-opcion:not([hidden]):not([disabled])');
          if (primera) { evento.preventDefault(); primera.focus(); }
        } else if ((evento.key === 'Escape' || evento.key === 'Tab') && caja.classList.contains('abierto')) {
          btn.click();
        }
      });
      select.addEventListener('change', function () { buscar.value = ''; buscar.actualizarCatalogo(); });
      menu.addEventListener('click', function (evento) {
        if (evento.target.closest('.kw-select-opcion')) buscar.focus();
      });
      caja.appendChild(buscar);
      caja.appendChild(limpiar);
      buscar.actualizarCatalogo();
    });
  }
  var actualizarBusquedasPendiente = false;
  function programarActualizacionBusquedas() {
    if (actualizarBusquedasPendiente) return;
    actualizarBusquedasPendiente = true;
    window.requestAnimationFrame(function () {
      actualizarBusquedasPendiente = false;
      prepararBusquedasCatalogo();
    });
  }
  // Ignorar texto, iconos y botones del menú: antes cada mutación volvía
  // a leer estilos y recorrer los seis catálogos completos.
  new MutationObserver(function (cambios) {
    if (cambios.some(function (cambio) {
      return cambio.target.tagName === 'SELECT' ||
        (cambio.type === 'attributes' && cambio.target.classList.contains('catalogo-select')) ||
        Array.from(cambio.addedNodes).some(function (nodo) {
          return nodo.nodeType === 1 && nodo.classList.contains('kw-select');
        });
    })) programarActualizacionBusquedas();
  }).observe(cajaFiltros, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
  prepararBusquedasCatalogo();
  if (cajaFiltros) {
    cajaFiltros.addEventListener('change', repintarDesdeFiltro);
    cajaFiltros.addEventListener('input', repintarDesdeFiltro);
  }

  if (document.documentElement.classList.contains('kw-auth-ok')) cargar();
  else window.addEventListener('kw-auth-ready', cargar, { once: true });
</script>
