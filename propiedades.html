<!DOCTYPE html>
<html lang="es">
<head>

<title>Propiedades · KW Premier</title>
<link rel="icon" type="image/png" href="/kwpremierweb/assets/img/favicon.png" />
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-base.css?v=20260821a">
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-claro.css?v=20260820c">
<script src="/kwpremierweb/assets/js/kw-ui.js?v=20260821b"></script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet" />

<style>
  :root {
    --red: #8a0000;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --card: #ffffff;
    --border: rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
  }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* La barra de arriba es la compartida (header.kw-header de
     kw-base.css): hamburguesa, título al centro y botón de regresar,
     igual que en el resto del sitio. */
  /* Sin tope de ancho: en pantalla grande entran más tarjetas por
     renglón en vez de dejar dos franjas vacías a los lados. */
  main { flex: 1; width: 100%; margin: 0 auto; padding: 90px clamp(20px, 3vw, 48px) 60px; }

  .page-title { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; text-align: center; margin-bottom: 22px; color: var(--text); }

  /* ── Filtros ── */
  /* z-index alto y `position: relative` a propósito: la animación de
     entrada de kw-base.css deja un transform puesto (fill-mode both), y
     un transform crea contexto de apilamiento - eso encerraba el
     z-index del menú desplegable dentro de la barra, y las tarjetas, que
     van después en el HTML, le pasaban por encima. Subiendo la barra
     entera por encima de la lista, los menús vuelven a verse. */
  .filtros {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;
    background: radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), radial-gradient(70% 50% at 90% 2%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%);
    border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
    border-radius: 14px; padding: 16px; margin-bottom: 20px;
    align-items: end;
    position: relative; z-index: 30;
  }
  #lista { position: relative; z-index: 1; }
  .filtro { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  /* `display: flex` le gana al atributo `hidden`, y el filtro de estatus
     se le alcanzaba a ver a quien entra sin sesión. */
  .filtro[hidden] { display: none; }
  .filtro-rango { grid-column: span 2; }
  .rango { display: flex; gap: 8px; }
  .rango input { width: 100%; min-width: 0; }
  .filtro label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted);
  }
  /* Misma altura que los desplegables y los botones de la barra
     (--control-h, de kw-base.css): con alturas distintas, la etiqueta
     de un filtro quedaba más arriba que la de junto. */
  .filtro select, .filtro input {
    height: var(--control-h); padding: 0 11px;
    border: 1.5px solid var(--border); border-radius: var(--r-campo);
    font-size: 13.5px; font-family: 'DM Sans', sans-serif;
    color: var(--text); background: #fff; outline: none;
  }
  .filtro select:focus, .filtro input:focus {
    border-color: var(--red); box-shadow: 0 0 0 3px rgba(138,0,0,0.08);
  }
  .btn-limpiar {
    align-self: end; height: var(--control-h); padding: 0 16px;
    border-radius: var(--r-campo);
    border: 1.5px solid var(--border); background: #f7f7f6;
    font-size: 12.5px; font-weight: 700; font-family: 'DM Sans', sans-serif;
    color: #555; cursor: pointer; transition: background 0.15s;
  }
  .btn-limpiar:hover { background: #ececec; }

  .btn-mas-filtros {
    align-self: end; display: inline-flex; align-items: center; gap: 7px;
    height: var(--control-h); padding: 0 14px;
    border-radius: var(--r-campo);
    border: 1.5px solid var(--border); background: #fff;
    font-size: 12.5px; font-weight: 700; font-family: 'DM Sans', sans-serif;
    color: var(--text); cursor: pointer; transition: background 0.15s;
  }
  .btn-mas-filtros:hover { background: #fafafa; }
  .btn-mas-filtros .chevron { width: 15px; height: 15px; transition: transform 0.18s; }
  .btn-mas-filtros[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .cuenta-filtros[hidden] { display: none; }
  .cuenta-filtros {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 20px;
    background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* El bloque de abajo se pega visualmente al de arriba cuando se abre.
     La apertura se anima con grid-template-rows de 0fr a 1fr: es la
     forma de animar hacia una altura "automática" sin fijar un máximo a
     mano, que se rompería según cuántos filtros quepan por renglón.
     Antes solo se prendía y apagaba con [hidden], y por eso la lista de
     abajo pegaba el brinco. */
  .extra-wrap {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 0.34s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative; z-index: 29;
  }
  .extra-wrap > div { overflow: hidden; min-height: 0; }
  .extra-wrap.abierto { grid-template-rows: 1fr; }
  /* El contenido entra un pelín después que la altura, para que no se
     vea aplastado mientras el bloque todavía se está abriendo. */
  .extra-wrap .filtros-extra { opacity: 0; transition: opacity 0.22s ease 0.06s; }
  .extra-wrap.abierto .filtros-extra { opacity: 1; }
  .filtros-extra { margin-top: -12px; border-top-left-radius: 0; border-top-right-radius: 0; }
  #filtros:has(+ .extra-wrap.abierto) {
    margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0;
    border-bottom-color: transparent;
  }

  .prop-pie {
    font-size: 11.5px; color: var(--muted); margin-top: 8px;
    padding-top: 8px; border-top: 1px solid var(--border);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .conteo {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 13px; color: var(--muted); margin-bottom: 14px;
  }

  /* Aviso de que se está navegando con la marca de un asesor: cualquier
     propiedad que se abra desde aquí le va a mostrar como contacto. */
  .banner-ref {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #fff3f3; border: 1px solid rgba(138,0,0,0.18); border-radius: 12px;
    padding: 11px 15px; margin-bottom: 18px; font-size: 13px;
  }
  .banner-ref-foto {
    width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
    background: #fff; color: var(--red); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .banner-ref b { color: var(--text); }
  .banner-ref-quitar {
    margin-left: auto; background: none; border: none; color: var(--muted);
    font-size: 12px; text-decoration: underline; cursor: pointer; font-family: inherit;
  }
  .banner-ref-quitar:hover { color: var(--text); }
  .chip-estatus {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 4px 10px; border-radius: 20px;
    background: #f0f0ef; color: #666;
  }
  .chip-estatus.publicada { background: #eaf7ee; color: #1a7f37; }
  .chip-estatus.vendida   { background: #fff0f0; color: #CC0000; }
  .chip-estatus.rentada   { background: #FFF0F0; color: var(--red); }
  .chip-estatus.no_publicada { background: #f6f2ff; color: var(--red); }

  /* ── Tarjetas ── */
  /* Columnas por ancho disponible, no un número fijo: con tres fijas, en
     una pantalla grande cada tarjeta se estiraba a más de 500px y se
     veía media docena de propiedades en toda la pantalla. Así entran
     las que quepan y se aprovecha el ancho. */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 18px; }

  .prop-card {
    background: radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), radial-gradient(70% 50% at 90% 2%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%);
    border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
    border-radius: 16px;
    overflow: hidden; text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    transition: transform 0.15s, box-shadow 0.18s, border-color 0.18s;
  }
  .prop-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
    border-color: rgba(138,0,0,0.25);
  }
  .prop-foto {
    position: relative; aspect-ratio: 4 / 3; background: #e4e4e4;
    display: flex; align-items: center; justify-content: center;
  }
  .prop-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prop-foto .sin-foto { color: #bbb; }
  .prop-foto .sin-foto svg { width: 34px; height: 34px; }
  .prop-badge {
    position: absolute; top: 10px; left: 10px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 4px 10px; border-radius: 20px;
    background: rgba(255,255,255,0.94); color: var(--red);
    box-shadow: 0 2px 8px rgba(0,0,0,0.14);
  }
  .prop-body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
  .prop-precio {
    font-size: 19px; font-weight: 800; letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .prop-titulo {
    font-size: 14.5px; font-weight: 700; margin-top: 3px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .prop-ubic {
    font-size: 12.5px; color: var(--muted); margin-top: 4px;
    display: flex; align-items: center; gap: 5px;
  }
  .prop-ubic svg { width: 12px; height: 12px; flex-shrink: 0; }
  .prop-datos {
    display: flex; gap: 14px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--border); font-size: 12.5px; color: #555;
  }
  .prop-dato { display: flex; align-items: center; gap: 5px; }
  .prop-dato svg { width: 13px; height: 13px; color: var(--muted); }

  .estado-msg { text-align: center; color: var(--muted); font-size: 14px; padding: 50px 0; grid-column: 1 / -1; }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) {
    /* El título se va al header (kw-header-title), así que aquí solo
       hay que dejar el aire de la barra fija. */
    main { padding: 78px 16px 40px; }
    .page-title { font-size: 24px; }
    /* Dos por renglón también aquí: se alcanza a ver el doble de
       inventario por pantalla. Adentro todo se achica en proporción
       para que la tarjeta no salga altísima. */
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .prop-body { padding: 10px 11px 12px; }
    .prop-precio { font-size: 15px; }
    .prop-titulo { font-size: 12.5px; }
    .prop-ubic { font-size: 11px; }
    .prop-datos { gap: 8px; margin-top: 9px; padding-top: 9px; font-size: 11px; }
    .prop-pie { font-size: 10.5px; }
    .prop-badge { font-size: 9.5px; padding: 3px 8px; top: 8px; left: 8px; }
    /* Dos filtros por renglón fijos. Con `auto-fill` dependía del ancho
       exacto del teléfono: en uno de 480px salían dos y en uno de 412px
       uno solo, y la tarjeta se estiraba a lo largo. */
    .filtros { grid-template-columns: 1fr 1fr; gap: 10px; }
    .filtro { min-width: 0; }
  }
</style>
</head>
<body>

  <header class="kw-header">
    <span class="kw-header-title">Propiedades</span>
    <a href="/kwpremierweb/" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      <span>Inicio</span>
    </a>
  </header>

  <main>
    <div class="kw-page-encabezado">
      <h1 class="page-title">Propiedades</h1>
    </div>

    <div class="banner-ref" id="banner-ref" style="display:none;"></div>

    <div class="filtros" id="filtros" autocomplete="off">
      <div class="filtro">
        <label for="f-buscar">Buscar</label>
        <input type="search" id="f-buscar" placeholder="Título, colonia, calle…" />
      </div>
      <div class="filtro">
        <label for="f-operacion">Operación</label>
        <select id="f-operacion">
          <option value="">Todas</option>
          <option value="venta">Venta</option>
          <option value="renta">Renta</option>
        </select>
      </div>
      <div class="filtro">
        <label for="f-mc">Market Center</label>
        <select id="f-mc"><option value="">Todos</option></select>
      </div>
      <div class="filtro">
        <label for="f-asesor">Asesor</label>
        <select id="f-asesor"><option value="">Todos</option></select>
      </div>
      <div class="filtro">
        <label for="f-tipo">Tipo de propiedad</label>
        <select id="f-tipo"><option value="">Todos</option></select>
      </div>
      <!-- El estatus solo tiene sentido para quien trabaja aquí; hacia
           afuera solo existe lo publicado, así que se muestra únicamente
           con sesión iniciada (ver cargar). -->
      <div class="filtro" id="filtro-estatus" hidden>
        <label for="f-estatus">Estatus</label>
        <select id="f-estatus">
          <option value="publicada">Activa</option>
          <option value="vendida">Vendida</option>
          <option value="rentada">Rentada</option>
          <option value="no_publicada">Borrador</option>
          <option value="reservada">Reservada</option>
          <option value="suspendida">Suspendida</option>
          <option value="">Todos los estatus</option>
        </select>
      </div>
      <button type="button" class="btn-mas-filtros" id="btn-mas-filtros"
              aria-expanded="false" aria-controls="filtros-extra">
        <span id="txt-mas-filtros">Más opciones</span>
        <span class="cuenta-filtros" id="cuenta-filtros" hidden></span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <div class="extra-wrap" id="extra-wrap"><div>
    <div class="filtros filtros-extra" id="filtros-extra">
      <div class="filtro">
        <label for="f-estado">Ciudad / Estado</label>
        <select id="f-estado"><option value="">Todas</option></select>
      </div>
      <div class="filtro">
        <label for="f-municipio">Alcaldía / Municipio</label>
        <select id="f-municipio"><option value="">Todas</option></select>
      </div>
      <div class="filtro">
        <label for="f-colonia">Colonia</label>
        <select id="f-colonia"><option value="">Todas</option></select>
      </div>
      <div class="filtro filtro-rango">
        <label>Precio</label>
        <div class="rango">
          <input type="number" id="f-min" placeholder="Desde" min="0" step="100000" />
          <input type="number" id="f-max" placeholder="Hasta" min="0" step="100000" />
        </div>
      </div>
      <div class="filtro">
        <label for="f-recamaras">Recámaras (mín.)</label>
        <select id="f-recamaras"><option value="">Cualquiera</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      </div>
      <div class="filtro">
        <label for="f-banos">Baños (mín.)</label>
        <select id="f-banos"><option value="">Cualquiera</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
      </div>
      <div class="filtro">
        <label for="f-estacionamientos">Estacionamientos (mín.)</label>
        <select id="f-estacionamientos"><option value="">Cualquiera</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
      </div>
      <div class="filtro">
        <label for="f-m2">m² construcción (mín.)</label>
        <input type="number" id="f-m2" placeholder="Sin mínimo" min="0" step="10" />
      </div>
      <div class="filtro">
        <label for="f-orden">Ordenar por</label>
        <select id="f-orden">
          <option value="reciente">Más recientes</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="m2-desc">Más grandes</option>
        </select>
      </div>
      <button type="button" class="btn-limpiar" onclick="limpiarFiltros()">Limpiar filtros</button>
    </div>
    </div></div>

<div class="conteo" id="conteo"></div>

    <div class="grid" id="lista">
      <div class="kw-loader"><div class="circle uno"></div><div class="circle dos"></div><div class="circle tres"></div></div>
    </div>
  </main>

    </a>
    <a href="https://www.tiktok.com/@kwpremieroficial" target="_blank" rel="noopener" class="footer-social" aria-label="TikTok">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.95a8.16 8.16 0 0 0 4.77 1.52V7.04a4.85 4.85 0 0 1-1-.35z"/></svg>
    </a>
  </footer>

<script>
  var SUPABASE_URL = 'https://iloetojomzqtadkithtv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_ZvaIC0_lkd6OQ0VMihOvjA_BIgpbClq';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var todas = [];

  function escapeHtml(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtPrecio(p, moneda) {
    // 0 también es "no lo mandaron": varios CRMs lo usan como plantilla
    // para "precio a consultar" en vez de dejarlo vacío.
    if (p == null || Number(p) <= 0) return 'Precio a consultar';
    try {
      return new Intl.NumberFormat('es-MX', {
        style: 'currency', currency: moneda || 'MXN', maximumFractionDigits: 0
      }).format(p);
    } catch (e) { return '$' + Number(p).toLocaleString('es-MX'); }
  }

  var ICO = {
    cama: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>',
    bano: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 6.5 3.5a1.5 1.5 0 0 0-3 0V17a3 3 0 0 0 3 3h11a3 3 0 0 0 3-3v-1H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>',
    area: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M3 9h18"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    casa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>'
  };

  var ETIQUETA_ESTATUS = {
    publicada: 'Activa', no_publicada: 'Borrador', reservada: 'Reservada',
    vendida: 'Vendida', rentada: 'Rentada', suspendida: 'Suspendida',
  };

  function tarjeta(p, i) {
    var ubic = [p.colonia, p.municipio].filter(Boolean).join(', ');
    var foto = (p.imagenes && p.imagenes.length)
      ? '<img src="' + escapeHtml(p.imagenes[0]) + '" alt="' + escapeHtml(p.titulo) + '" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=&quot;sin-foto&quot;>' + ICO.casa.replace(/"/g, '&quot;') + '</div>\'" />'
      : '<div class="sin-foto">' + ICO.casa + '</div>';

    var datos = [];
    if (p.recamaras) datos.push('<span class="prop-dato">' + ICO.cama + p.recamaras + '</span>');
    if (p.banos) datos.push('<span class="prop-dato">' + ICO.bano + p.banos + '</span>');
    if (p.m2_construccion) datos.push('<span class="prop-dato">' + ICO.area + p.m2_construccion + ' m²</span>');

    // El sello de estatus solo se pinta cuando no es una publicada: hacia
    // afuera todas lo son y sería ruido; adentro sirve para ubicarlas.
    var sello = (p.estatus && p.estatus !== 'publicada')
      ? '<span class="chip-estatus ' + escapeHtml(p.estatus) + '">' +
        escapeHtml(ETIQUETA_ESTATUS[p.estatus] || p.estatus) + '</span>'
      : '';

    var pie = [p.asesor_nombre, p.market_center].filter(Boolean).join(' · ');

    return '<a class="prop-card kw-aparece" style="animation-delay:' + (Math.min(i, 8) * 45) + 'ms" href="/kwpremierweb/propiedad.html?id=' + encodeURIComponent(p.id) + '">' +
      '<div class="prop-foto">' + foto +
        (p.operacion ? '<span class="prop-badge">' + (p.operacion === 'renta' ? 'Renta' : 'Venta') + '</span>' : '') +
      '</div>' +
      '<div class="prop-body">' +
        '<div class="prop-precio">' + fmtPrecio(p.precio, p.moneda) + sello + '</div>' +
        '<div class="prop-titulo">' + escapeHtml(p.titulo) + '</div>' +
        (ubic ? '<div class="prop-ubic">' + ICO.pin + escapeHtml(ubic) + '</div>' : '') +
        (datos.length ? '<div class="prop-datos">' + datos.join('') + '</div>' : '') +
        (pie ? '<div class="prop-pie">' + escapeHtml(pie) + '</div>' : '') +
      '</div>' +
    '</a>';
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }
  function num(id) {
    var n = Number(val(id));
    return isFinite(n) && n > 0 ? n : 0;
  }

  function ordenar(lista, modo) {
    var copia = lista.slice();
    if (modo === 'precio-asc') {
      copia.sort(function (a, b) { return (a.precio || Infinity) - (b.precio || Infinity); });
    } else if (modo === 'precio-desc') {
      copia.sort(function (a, b) { return (b.precio || 0) - (a.precio || 0); });
    } else if (modo === 'm2-desc') {
      copia.sort(function (a, b) { return (b.m2_construccion || 0) - (a.m2_construccion || 0); });
    }
    // "reciente" ya viene así de la consulta
    return copia;
  }

  function pintar() {
    var texto = val('f-buscar').toLowerCase();
    var op = val('f-operacion');
    var estatus = val('f-estatus');
    var tipo = val('f-tipo');
    var mc = val('f-mc');
    var asesor = val('f-asesor');
    var estado = val('f-estado');
    var municipio = val('f-municipio');
    var colonia = val('f-colonia');
    var minPrecio = num('f-min');
    var maxPrecio = num('f-max');
    var rec = num('f-recamaras');
    var banos = num('f-banos');
    var est = num('f-estacionamientos');
    var m2 = num('f-m2');

    var vis = todas.filter(function (p) {
      if (op && p.operacion !== op) return false;
      if (estatus && p.estatus !== estatus) return false;
      if (tipo && p.tipo !== tipo) return false;
      if (mc && p.market_center !== mc) return false;
      if (asesor && p.asesor_nombre !== asesor) return false;
      if (estado && p.estado !== estado) return false;
      if (municipio && p.municipio !== municipio) return false;
      if (colonia && p.colonia !== colonia) return false;
      if (minPrecio && Number(p.precio || 0) < minPrecio) return false;
      if (maxPrecio && Number(p.precio || 0) > maxPrecio) return false;
      if (rec && Number(p.recamaras || 0) < rec) return false;
      if (banos && Number(p.banos || 0) < banos) return false;
      if (est && Number(p.estacionamientos || 0) < est) return false;
      if (m2 && Number(p.m2_construccion || 0) < m2) return false;
      if (texto) {
        var donde = [p.titulo, p.calle, p.colonia, p.municipio, p.estado, p.tipo, p.asesor_nombre]
          .filter(Boolean).join(' ').toLowerCase();
        if (donde.indexOf(texto) === -1) return false;
      }
      return true;
    });

    vis = ordenar(vis, val('f-orden'));
    marcarFiltrosEscondidos();

    var cont = document.getElementById('lista');
    document.getElementById('conteo').innerHTML =
      '<span>' + vis.length + (vis.length === 1 ? ' propiedad' : ' propiedades') +
      (vis.length !== todas.length ? ' de ' + todas.length : '') + '</span>';

    if (!vis.length) {
      cont.innerHTML = '<div class="estado-msg">No encontramos propiedades con esos filtros.</div>';
      return;
    }
    cont.innerHTML = vis.map(tarjeta).join('');
  }

  // Si hay filtros aplicados dentro del plegable, se avisa con un número:
  // de otro modo alguien puede no entender por qué ve tan pocos resultados.
  // Solo los que viven dentro del plegable: Market Center y Asesor ya
  // están a la vista en la barra, así que contarlos aquí marcaría el
  // aviso por un filtro que la persona sí puede ver.
  var CAMPOS_EXTRA = ['f-estado', 'f-municipio', 'f-colonia',
                      'f-min', 'f-max', 'f-recamaras', 'f-banos', 'f-estacionamientos', 'f-m2'];

  function marcarFiltrosEscondidos() {
    var puestos = CAMPOS_EXTRA.filter(function (id) { return val(id) !== ''; }).length;
    if (val('f-orden') !== 'reciente') puestos++;
    var chip = document.getElementById('cuenta-filtros');
    chip.textContent = puestos;
    chip.hidden = puestos === 0;
  }

  function limpiarFiltros() {
    ['f-buscar', 'f-operacion', 'f-tipo', 'f-mc', 'f-asesor', 'f-estado', 'f-municipio',
     'f-colonia', 'f-min', 'f-max', 'f-recamaras', 'f-banos', 'f-estacionamientos', 'f-m2'
    ].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('f-orden').value = 'reciente';
    // El estatus vuelve a "Activa", que es el arranque razonable: lo
    // normal es querer ver lo que sí está a la venta.
    var e = document.getElementById('f-estatus');
    if (e) e.value = 'publicada';
    pintar();
  }

  function llenarSelect(id, valores) {
    var sel = document.getElementById(id);
    if (!sel) return;
    valores.sort(function (a, b) { return String(a).localeCompare(String(b), 'es'); })
      .forEach(function (v) {
        var o = document.createElement('option');
        o.value = v; o.textContent = v;
        sel.appendChild(o);
      });
  }

  function distintos(campo) {
    var vistos = {};
    todas.forEach(function (p) {
      var v = p[campo];
      if (v !== null && v !== undefined && String(v).trim() !== '') vistos[v] = true;
    });
    return Object.keys(vistos);
  }

  // Las listas se arman con lo que de verdad hay en el inventario, no con
  // catálogos fijos: cuando llegue lo de Command, los valores salen solos.
  function llenarListas() {
    llenarSelect('f-tipo', distintos('tipo'));
    llenarSelect('f-mc', distintos('market_center'));
    llenarSelect('f-asesor', distintos('asesor_nombre'));
    llenarSelect('f-estado', distintos('estado'));
    llenarSelect('f-municipio', distintos('municipio'));
    llenarSelect('f-colonia', distintos('colonia'));
  }

  var CAMPOS = 'id, titulo, operacion, estatus, tipo, precio, moneda, recamaras, banos, ' +
               'estacionamientos, m2_construccion, calle, colonia, municipio, estado, ' +
               'imagenes, asesor_nombre, market_center';

  function pintarBannerRef(asesor) {
    var banner = document.getElementById('banner-ref');
    if (!asesor) { banner.style.display = 'none'; return; }
    var nombre = [asesor.nombre, asesor.apellido].filter(Boolean).join(' ') || 'tu asesor';
    var iniciales = nombre.split(' ').filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase();
    banner.innerHTML =
      (asesor.foto_url
        ? '<img class="banner-ref-foto" src="' + escapeHtml(asesor.foto_url) + '" alt="' + escapeHtml(nombre) + '" />'
        : '<span class="banner-ref-foto">' + escapeHtml(iniciales || 'KW') + '</span>') +
      '<span>Estás viendo el catálogo con los datos de contacto de <b>' + escapeHtml(nombre) + '</b>.</span>' +
      '<button type="button" class="banner-ref-quitar" onclick="quitarRefAsesor()">Quitar</button>';
    banner.style.display = 'flex';
  }

  function quitarRefAsesor() {
    window.kwRefAsesor.limpiar();
    pintarBannerRef(null);
  }

  async function cargar() {
    var cont = document.getElementById('lista');
    try {
      try {
        var asesorRef = await window.kwRefAsesor.capturar(sb);
        pintarBannerRef(asesorRef);
      } catch (e) { /* si falla, se navega igual sin la marca */ }

      // Con sesión se ve el inventario completo (para poder filtrar por
      // vendidas, rentadas o borradores); sin ella, solo lo publicado.
      var hayIngreso = false;
      try {
        var ses = await sb.auth.getSession();
        hayIngreso = !!(ses && ses.data && ses.data.session);
      } catch (e) { hayIngreso = false; }

      var origen = hayIngreso ? 'propiedades_inventario' : 'propiedades_publicas';
      var r = await sb.from(origen).select(CAMPOS)
        .order('updated_at', { ascending: false }).limit(500);

      // Si la vista interna todavía no existe en la base, no se rompe la
      // página: se cae a la pública y se esconde el filtro de estatus.
      if (r.error && hayIngreso) {
        hayIngreso = false;
        r = await sb.from('propiedades_publicas').select(CAMPOS)
          .order('updated_at', { ascending: false }).limit(500);
      }
      if (r.error) throw r.error;

      document.getElementById('filtro-estatus').hidden = !hayIngreso;
      todas = r.data || [];

      if (!todas.length) {
        document.getElementById('conteo').textContent = '';
        cont.innerHTML = '<div class="estado-msg">Todavía no hay propiedades publicadas.</div>';
        return;
      }

      llenarListas();
      if (hayIngreso) document.getElementById('f-estatus').value = 'publicada';
      pintar();
    } catch (err) {
      cont.innerHTML = '<div class="estado-msg">No se pudieron cargar las propiedades.<br>' +
        escapeHtml(err.message || '') + '</div>';
    }
  }

  ['filtros', 'filtros-extra'].forEach(function (id) {
    var caja = document.getElementById(id);
    caja.addEventListener('change', pintar);
    caja.addEventListener('input', pintar);
  });

  // Los filtros de siempre quedan a la vista y el resto se despliega, para
  // que la barra no llegue saturada de entrada.
  document.getElementById('btn-mas-filtros').addEventListener('click', function () {
    var wrap = document.getElementById('extra-wrap');
    var caja = wrap.firstElementChild;
    var abierto = wrap.classList.toggle('abierto');
    this.setAttribute('aria-expanded', String(abierto));
    document.getElementById('txt-mas-filtros').textContent = abierto ? 'Menos opciones' : 'Más opciones';

    // El overflow:hidden es lo que deja animar la altura, pero también
    // recorta los menús de los filtros de adentro. Se suelta en cuanto
    // termina de abrir y se vuelve a poner al cerrar. Se revisa que
    // siga abierto por si alguien alcanzó a cerrarlo antes de que
    // terminara la animación.
    if (abierto) {
      wrap.addEventListener('transitionend', function unaVez(e) {
        if (e.target !== wrap) return;
        wrap.removeEventListener('transitionend', unaVez);
        if (wrap.classList.contains('abierto')) caja.style.overflow = 'visible';
      });
    } else {
      caja.style.overflow = '';
    }
  });

  cargar();
</script>
