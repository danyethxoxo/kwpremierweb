<style>
  html, body { min-height: 100%; color: var(--text); }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  .cabecera {
    display: flex; justify-content: center; padding: 30px 20px 0;
  }
  .cabecera img { height: 52px; width: auto; display: block; }

  .page { flex: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 26px 20px 50px; }

  .tarjeta {
    background: radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), radial-gradient(70% 50% at 90% 2%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%); border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    border-radius: 18px; padding: 30px 26px; box-shadow: var(--sombra-1), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
  }
  .titulo { font-size: 23px; font-weight: 800; letter-spacing: -0.5px; text-align: center; }
  .sub {
    font-size: 13.5px; color: var(--muted); text-align: center;
    line-height: 1.6; margin: 8px 0 26px;
  }

  /* ── Calificación con estrellas ── */
  .estrellas-campo { text-align: center; margin-bottom: 24px; }
  .estrellas-btns { display: flex; justify-content: center; gap: 6px; }
  .estrella {
    background: none; border: none; padding: 2px; cursor: pointer;
    color: #ddd; line-height: 0;
    transition: color 0.12s, transform 0.12s;
  }
  .estrella svg { width: 38px; height: 38px; }
  .estrella:hover { transform: scale(1.12); }
  .estrella.activa { color: #f5b301; }
  .estrellas-texto {
    font-size: 12.5px; font-weight: 700; color: var(--muted);
    margin-top: 8px; min-height: 17px;
  }

  .btn-enviar {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; margin-top: 8px;
    background: radial-gradient(70% 90% at 18% 104%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.90) 0%, rgba(255,255,255,0.78) 100%);
    color: var(--red);
    border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%); border: none; border-radius: 40px;
    padding: 14px; font-size: 14.5px; font-weight: 700; font-family: inherit;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38), 0 6px 20px rgba(0,0,0,0.18);
    transition: filter 0.15s, transform 0.12s, background 0.15s, box-shadow 0.15s;
  }
  .btn-enviar:hover:not(:disabled) { box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 24px rgba(0,0,0,0.24); }
  .btn-enviar:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
  .btn-enviar:disabled {
    background: #e2e2e0; color: #999; box-shadow: none;
    cursor: default; transform: none; filter: none;
  }
  .btn-enviar.enviado:disabled {
    background: #1a7a1a; color: #fff;
    box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 4px 14px rgba(26,122,26,0.3);
  }


  /* Pantalla de gracias, en lugar del formulario */
  .gracias { display: none; text-align: center; padding: 14px 0 6px; }
  .gracias.visible { display: block; }
  .gracias-palomita {
    width: 62px; height: 62px; border-radius: 50%;
    background: #eaf7ee; color: #1a7f37;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .gracias-palomita svg { width: 30px; height: 30px; }
  .gracias h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .gracias p { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
  .gracias .btn-volver-inicio {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 22px;
    padding: 11px 24px; border-radius: 40px;
    border: 1.5px solid var(--border); background: #fff;
    color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 700;
  }
  .gracias .btn-volver-inicio:hover { border-color: var(--red); color: var(--red); }

  @media (max-width: 640px) {
    .cabecera { padding-top: 22px; }
    .cabecera img { height: 42px; }
    .tarjeta { padding: 24px 18px; border-radius: 15px; }
    .titulo { font-size: 20px; }
    .estrella svg { width: 34px; height: 34px; }
  }
</style>
</head>
<body>

  <div class="cabecera">
    <a href="/kwpremierweb/index.html" aria-label="KW Premier">
      <img src="/kwpremierweb/assets/img/logo-kw-premier.png" alt="KW Premier · Keller Williams · Bienes Raíces" />
    </a>
  </div>

  <main class="page">
    <div class="tarjeta">

      <div id="formulario">
        <h1 class="titulo">¿Cómo te fue con nosotros?</h1>
        <p class="sub">Tu opinión nos ayuda a mejorar y a que más personas nos conozcan. Te toma menos de un minuto.</p>

        <div class="field">

        <div class="msg" id="res-msg"></div>

        <button type="button" class="btn-enviar" id="res-btn" onclick="enviarResena()" disabled>
          <span class="kw-btn-cont" id="res-btn-cont">Enviar mi reseña</span>

      <div class="gracias" id="gracias">
        <div class="gracias-palomita">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>

        <h2>¡Gracias por tu reseña!</h2>
        <p>La leemos con cuidado antes de publicarla. Te agradecemos mucho el tiempo que te tomaste.</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://iloetojomzqtadkithtv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ZvaIC0_lkd6OQ0VMihOvjA_BIgpbClq';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const LEYENDAS = ['', 'Muy mal', 'Mal', 'Regular', 'Bien', '¡Excelente!'];
  let calificacion = 0;

  const ESTRELLA_SVG = '<svg viewBox="0 0 24 24" fill="currentColor">' +
    '<path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';

  function pintarEstrellas() {
    const cont = document.getElementById('estrellas');
    cont.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'estrella' + (i <= calificacion ? ' activa' : '');
      b.innerHTML = ESTRELLA_SVG;
      b.setAttribute('aria-label', i + ' de 5 estrellas');
      b.addEventListener('click', function () {
        calificacion = i;
        pintarEstrellas();
        actualizarBoton();
      });
      cont.appendChild(b);
    }
    document.getElementById('estrellas-texto').textContent = LEYENDAS[calificacion] || '';
  }

  function completo() {
    return calificacion > 0
      && document.getElementById('res-nombre').value.trim() !== ''
      && document.getElementById('res-texto').value.trim().length >= 3;
  }

  function actualizarBoton(estado) {
    const btn = document.getElementById('res-btn');
    const cont = document.getElementById('res-btn-cont');
    btn.classList.remove('enviado');
    if (estado === 'enviando') {
      btn.disabled = true;
      cont.innerHTML = '<span class="kw-btn-spinner"></span>Enviando...';
    } else if (estado === 'enviado') {
      btn.disabled = true;
      btn.classList.add('enviado');
      cont.textContent = '¡Enviada!';
    } else {
      btn.disabled = !completo();
      cont.textContent = 'Enviar mi reseña';
    }
  }

  async function enviarResena() {
    // Trampa para robots: si viene llena, se hace como que todo salió
    // bien y no se guarda nada.
    if (document.getElementById('res-apodo').value) {
      mostrarGracias();
      return;
    }
    if (!completo()) return;

    actualizarBoton('enviando');
    const msg = document.getElementById('res-msg');
    msg.style.display = 'none';
    try {
      const { error } = await sb.from('resenas').insert({
        nombre: document.getElementById('res-nombre').value.trim(),
        texto: document.getElementById('res-texto').value.trim(),
        estrellas: calificacion,
        rol: document.getElementById('res-rol').value.trim() || null,
      });
      if (error) throw error;
      actualizarBoton('enviado');
      setTimeout(mostrarGracias, 600);
    } catch (err) {
      msg.textContent = (err && err.message) || 'No se pudo enviar. Inténtalo de nuevo.';
      msg.className = 'msg error';
      actualizarBoton('inicial');
    }
  }

  function mostrarGracias() {
    document.getElementById('formulario').style.display = 'none';
    document.getElementById('gracias').classList.add('visible');
  }

  ['res-nombre', 'res-texto'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () { actualizarBoton(); });
  });

  pintarEstrellas();
  actualizarBoton();
</script>
</body>
