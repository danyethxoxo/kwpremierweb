  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --header-h: 68px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
      font-family: 'Poppins', Arial, sans-serif;
      color: var(--text);
    }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* ═══════════ HEADER ═══════════ */



    /* ═══════════ PÁGINA ═══════════ */
    .page { flex: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 100px 24px 60px;
    }

    .page-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .page-desc {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 48px;
    }

    /* ═══════════ GRID ═══════════
       Dos tarjetas nada más: Internos se fue al hub, con el resto de
       los accesos según el rol (Prospectos, Propiedades, etc.). */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 32px;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .page-eyebrow, .page-title, .page-desc { display: none; }
    }

    /* ═══════════ LA BIFURCACIÓN POR ROL ═══════════ */
    /* Un asociado entra directo a Acuerdos/Contratos: para él esta
       pantalla siempre fue solo un cruce de caminos. Master, Admin y
       Staff ven antes estas dos puertas, porque para ellos esta sección
       son dos cosas distintas: el control de lo que ya se firmó (la
       operatividad) y el formato en blanco de siempre.

       El atributo "hidden" del navegador vale menos que cualquier clase
       con display propio - sin esto .grid seguiría enseñándose por
       debajo. Con el !important, "hidden" gana siempre y esconder algo
       es una línea de JS en vez de acordarse de qué display tenía. */
    [hidden] { display: none !important; }

    /* El botón "Crear un Acuerdo" reusa el look de las tarjetas de
       enlace (.hover-card, en kw-base.css) pero es un <button>, no un
       <a>: no navega a otra página, descubre la parrilla de siempre en
       el mismo lugar. Se le quita el reset de <button> del navegador
       para que el vidrio de .hover-card se vea igual que en la de al
       lado. */
    button.hover-card {
      appearance: none; -webkit-appearance: none;
      font-family: inherit; text-align: left; width: 100%;
    }

    /* El aro de carga del sitio es blanco porque siempre gira sobre el
       fondo oscuro de la página. Aquí gira directo sobre el lienzo claro
       de kw-claro.css, donde no se vería. */
    #cargando .circle { border-top-color: var(--red); }

    /* ═══════════ TARJETA ═══════════
       El efecto de hover (relleno de color + flecha) vive en
       assets/css/kw-base.css como .hover-card - aquí solo quedan los
       colores de fondo de cada ícono en reposo, propios de esta página. */
    .icon-acuerdos svg { color: var(--red); }

    .icon-contratos svg { color: var(--red); }

    /* ═══════════ FOOTER ═══════════ */
    .footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center; display: flex; justify-content: center; gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }
  .footer-social {
    width: 34px; height: 34px; border-radius: 50%;
    background: #f5f5f5; color: #888;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .footer-social:hover { background: #ffe0e0; color: var(--red); transform: translateY(-2px); }
  .footer-social svg { width: 15px; height: 15px; fill: currentColor; }

  </style>
</head>
