<style>
  @view-transition { navigation: auto; }
  @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }

  ::view-transition-group(root) {
    animation-duration: 0.32s;
    animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }
  ::view-transition-old(root) { animation-name: kw-exit-forward; }
  ::view-transition-new(root) { animation-name: kw-enter-forward; }
  :active-view-transition-type(back)::view-transition-old(root) { animation-name: kw-exit-back; }
  :active-view-transition-type(back)::view-transition-new(root) { animation-name: kw-enter-back; }

  @keyframes kw-enter-forward { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes kw-exit-forward  { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  @keyframes kw-enter-back    { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  @keyframes kw-exit-back     { from { transform: translateX(0); } to { transform: translateX(100%); } }
</style>
<script>
  // Transición tipo app entre páginas: avanzar desliza de derecha a izquierda,
  // retroceder desliza de izquierda a derecha. Sin efecto en navegadores que no
  // soportan cross-document view transitions (Safari/Firefox) - navegación normal.
  //
  // La dirección se marca según QUÉ link se clickeó (el botón "Regresar", el logo
  // y el breadcrumb cuentan como "retroceso"; cualquier otro link cuenta como
  // "avance"), no según el historial del navegador - un link de "Regresar" es,
  // para el navegador, una navegación hacia adelante como cualquier otra.
  (function () {
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]');
      if (!a || a.target === '_blank') return;
      var url;
      try { url = new URL(a.href, location.href); } catch (err) { return; }
      if (url.origin !== location.origin) return;
      var isBack = !!a.closest('.back-btn, .breadcrumb, .logo');
      sessionStorage.setItem('kwPendingDirection', isBack ? 'back' : 'forward');
    }, true);

    function markDirection(event) {
      if (!event.viewTransition) return;
      var direction = sessionStorage.getItem('kwPendingDirection') || 'forward';
      sessionStorage.removeItem('kwPendingDirection');
      event.viewTransition.types.add(direction);
      // Al llegar por una transición, la entrada ya la hizo la propia
      // transición. Si además corre la aparición escalonada del CSS, el
      // contenido se ve aparecer, irse y volver: ese es el parpadeo.
      if (event.type === 'pagereveal') {
        document.documentElement.classList.add('kw-vino-de-transicion');
      }
    }

    window.addEventListener('pageswap', markDirection);
    window.addEventListener('pagereveal', markDirection);
  })();
</script>

    :root {
      --red: #8a0000;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --bg: /* Formas oscuras encima: tapan tramos de los filos, y ese tapado es
         lo que hace que una onda se vea pasando por delante de otra. */
      radial-gradient(68% 96% at 13% 26%, rgba(8,0,3,0.94) 0%, rgba(8,0,3,0.55) 44%, transparent 72%),
      radial-gradient(58% 85% at 94% 64%, rgba(8,0,3,0.90) 0%, rgba(8,0,3,0.45) 42%, transparent 70%),
      /* Filos luminosos: de cada elipse enorme solo se asoma un tramo del
         borde, y ese arco es el que dibuja el pliegue. El hilo claro va
         angosto y el resplandor ancho, para que se lea como luz pegandole
         al canto de la onda y no como una linea pintada.
         Los tamanos van en porcentaje del propio recuadro y no en vmax:
         asi la composicion se ve igual de proporcionada en la pantalla
         ancha del escritorio que en la alta del celular; con vmax los
         arcos se salian por abajo en vertical. */
      radial-gradient(170% 178% at 62% -72%,
        rgba(120,10,35,0.20) 0%, rgba(70,5,22,0.09) 46%,
        rgba(255,95,120,0) 57.4%, rgba(255,150,170,0.52) 59.5%,

        rgba(255,95,125,0.20) 59.2%, rgba(255,50,85,0.08) 62%, transparent 71%),

    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
    }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    /* ═══════════ HEADER ═══════════ */



    /* ═══════════ PÁGINA ═══════════ */
    .page { flex: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 100px 24px 60px;
    }

    .page-eyebrow {

      font-weight: 600;
      letter-spacing: 0.1em;

      color: rgba(255,255,255,0.72);
      margin-bottom: 10px;

    /* ═══════════ GRID ═══════════
       Dos tarjetas nada más: Internos se fue al hub, con el resto de
       los accesos según el rol (Prospectos, Propiedades, etc.). */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;

      .page-eyebrow, .page-title, .page-desc { display: none; }
    }
