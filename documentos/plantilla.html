<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Llenar formato</title>
<link rel="icon" type="image/png" href="/kwpremierweb/assets/img/favicon.png" />
<style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
<script>
  setTimeout(function () {
    if (!document.documentElement.classList.contains('kw-auth-ok')) {
      console.error('auth-guard.js no respondió a tiempo; redirigiendo al login por seguridad.');
      location.replace('/kwpremierweb/login.html');
    }
  }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kwpremierweb/assets/js/auth-guard.js"></script>
<script src="/kwpremierweb/assets/js/kw-hoja.js?v=20260729"></script>
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-base.css?v=20260822a">
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-claro.css?v=20260820c">
<script src="/kwpremierweb/assets/js/kw-ui.js?v=20260822a"></script>
<style>
  html, body { min-height: 100%; color: var(--text); }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .page { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 90px 22px 50px; }

  .barra { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .barra .crece { flex: 1; }
  .titulo-doc { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
  .folio { font-size: 12px; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border-radius: 10px; padding: 9px 16px; border: 1.5px solid var(--border);
    background: #fff; color: var(--text); cursor: pointer;
    font-size: 13px; font-weight: 700; font-family: inherit; text-decoration: none;
    transition: background 0.15s, transform 0.12s;
  }
  .btn:hover { background: #fafafa; }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-rojo {
    background: radial-gradient(70% 90% at 18% 104%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.90) 0%, rgba(255,255,255,0.78) 100%);
    color: var(--red);
    border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%); border: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38), 0 5px 16px rgba(0,0,0,0.16);
  }
  .btn-rojo:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 24px rgba(0,0,0,0.24); }
  .btn svg { width: 15px; height: 15px; }

  .dos-columnas { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
  .panel {
    background: radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), radial-gradient(70% 50% at 90% 2%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%); border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
    border-radius: 14px; padding: 18px;
  }
  .panel h2 { font-size: 14px; margin-bottom: 14px; }

  .campo-form { margin-bottom: 13px; }
  .campo-form label {
    display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); margin-bottom: 5px;
  }
  .campo-form input[type="text"], .campo-form input[type="number"],
  .campo-form input[type="date"], .campo-form textarea {
    width: 100%; box-sizing: border-box;
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-size: 13.5px; font-family: inherit;
    color: var(--text); background: #fff;
  }
  .campo-form input:focus, .campo-form textarea:focus {
    outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(138,0,0,0.08);
  }
  .campo-form textarea { min-height: 84px; resize: vertical; }
  .campo-casilla { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 13px; }
  .campo-casilla input { width: 17px; height: 17px; margin-top: 1px; accent-color: var(--red); flex-shrink: 0; }
  .campo-casilla label { font-size: 13.5px; line-height: 1.5; }

  .previa-marco {
    background: #e9e9e8; border-radius: 14px; padding: 18px;
    position: sticky; top: 76px; max-height: calc(100vh - 130px); overflow: auto;
  }
  .previa-escala { transform-origin: top center; }

  .aviso {
    text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6;
    border: 1.5px dashed var(--border); border-radius: 14px; padding: 46px 20px;
  }
  .aviso strong { display: block; color: #fff; font-size: 15px; margin-bottom: 6px; }
  .msg { font-size: 13px; margin-top: 10px; display: none; }
  .msg.ok { display: block; color: #1a7f37; }
  .msg.error { display: block; color: var(--red); }

  .sello-final {
    background: #eaf7ee; border: 1px solid #bfe3c9; color: #1a7f37;
    border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px; line-height: 1.55;
  }

  @media (max-width: 1000px) {
    .dos-columnas { grid-template-columns: 1fr; }
    .previa-marco { position: static; max-height: none; }
  }
  @media (max-width: 640px) { .page { padding: 82px 16px 40px; } }

  /* Al imprimir se va todo menos la hoja */
  @media print {
    @page { size: Letter; margin: 0; }
    body > *:not(#solo-impresion) { display: none !important; }
    #solo-impresion { display: block !important; }
    #solo-impresion .hoja {
      box-shadow: none; margin: 0; width: 100%; min-height: 0;
      page-break-after: always;
    }
    #solo-impresion .hoja:last-child { page-break-after: auto; }
  }
  #solo-impresion { display: none; }
</style>
</head>
<body>

  <header class="kw-header">
    <span class="kw-header-title">Formato</span>
    <a href="/kwpremierweb/documentos/documentos.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      <span>Atrás</span>
    </a>
  </header>

  <main class="page">
    <div id="contenido">
      <div class="kw-loader"><div class="circle uno"></div><div class="circle dos"></div><div class="circle tres"></div></div>
    </div>
  </main>

  <div id="solo-impresion"></div>

<script>
  var params = new URLSearchParams(location.search);
  var PLANTILLA_ID = params.get('id');
  var DOC_ID = params.get('doc');

  var plantilla = null;
  var doc = null;          // el documento guardado, si se abrió uno
  var valores = {};

  function $(id) { return document.getElementById(id); }
  function esc(t) {
    var d = document.createElement('div');
    d.textContent = t == null ? '' : t;
    return d.innerHTML;
  }
  function decir(texto, clase) {
    var el = $('msg');
    if (!el) return;
    if (!texto) { el.style.display = 'none'; return; }
    el.textContent = texto;
    el.className = 'msg ' + (clase || '');
  }

  function finalizado() { return doc && doc.estado === 'finalizado'; }

  function bloquesActivos() {
    // Un documento finalizado se dibuja con los bloques que tenía cuando
    // se firmó, no con los de la plantilla de hoy.
    if (finalizado() && doc.bloques_congelados) return doc.bloques_congelados;
    return (plantilla && plantilla.bloques) || [];
  }

  function campoHtml(c) {
    var v = valores[c.clave];
    var bloqueado = finalizado() ? ' disabled' : '';

    if (c.formato === 'casilla') {
      return '<div class="campo-casilla">' +
        '<input type="checkbox" id="v-' + esc(c.clave) + '" data-clave="' + esc(c.clave) + '"' +
        (v === true || v === 'si' ? ' checked' : '') + bloqueado + ' />' +
        '<label for="v-' + esc(c.clave) + '">' + esc(c.etiqueta) + '</label></div>';
    }

    var control;
    if (c.formato === 'parrafo') {
      control = '<textarea id="v-' + esc(c.clave) + '" data-clave="' + esc(c.clave) + '"' +
        bloqueado + '>' + esc(v || '') + '</textarea>';
    } else {
      var tipo = c.formato === 'fecha' ? 'date'
               : (c.formato === 'numero' || c.formato === 'moneda') ? 'number' : 'text';
      var paso = c.formato === 'moneda' ? ' step="0.01"' : '';
      control = '<input type="' + tipo + '" id="v-' + esc(c.clave) + '" data-clave="' +
        esc(c.clave) + '" value="' + esc(v || '') + '"' + paso + bloqueado + ' />';
    }
    return '<div class="campo-form"><label for="v-' + esc(c.clave) + '">' +
      esc(c.etiqueta) + '</label>' + control + '</div>';
  }

  function pintar() {
    var bloques = bloquesActivos();
    var campos = window.kwHoja.campos(bloques);

    $('contenido').innerHTML =
      '<div class="barra">' +
        '<div>' +
          '<div class="titulo-doc">' + esc(plantilla ? plantilla.nombre : 'Formato') + '</div>' +
          (finalizado() ? '<div class="folio">Folio ' + esc(doc.folio || '') + '</div>' : '') +
        '</div>' +
        '<div class="crece"></div>' +
        (finalizado() ? '' : '<button type="button" class="btn" id="btn-guardar">Guardar borrador</button>') +
        (finalizado() ? '' : '<button type="button" class="btn" id="btn-finalizar" data-kw-confirmar="Ya no podrás editarlo. ¿Seguro?">Finalizar</button>') +
        '<button type="button" class="btn btn-rojo" id="btn-imprimir">Imprimir o guardar PDF</button>' +
      '</div>' +

      (finalizado()
        ? '<div class="sello-final"><strong>Documento finalizado.</strong> ' +
          'Ya no se puede editar: quedó con folio ' + esc(doc.folio || '') + '. ' +
          'Si necesitas otra versión, genera un formato nuevo.</div>'
        : '') +

      '<div class="dos-columnas">' +
        '<div class="panel">' +
          '<h2>Datos del documento</h2>' +
          (campos.length
            ? campos.map(campoHtml).join('')
            : '<p style="font-size:13px;color:var(--muted);line-height:1.6;">' +
              'Este formato no pide datos: se imprime tal cual para llenarse a mano.</p>') +
          '<div class="msg" id="msg"></div>' +
        '</div>' +
        '<div class="previa-marco"><div class="previa-escala" id="previa"></div></div>' +
      '</div>';

    // Se escucha en el contenedor: los campos se vuelven a dibujar seguido.
    var panel = document.querySelector('.panel');
    panel.addEventListener('input', alCambiar);
    panel.addEventListener('change', alCambiar);

    if ($('btn-guardar')) $('btn-guardar').addEventListener('click', function () { guardar(false); });
    if ($('btn-finalizar')) $('btn-finalizar').addEventListener('kw-confirmado', finalizar);
    $('btn-imprimir').addEventListener('click', imprimir);
    // La barra se vuelve a dibujar al cargar y al finalizar, así que el
    // botón de confirmar hay que rearmarlo cada vez.
    window.kwUI.confirmaciones();

    pintarPrevia();
  }

  function alCambiar(e) {
    var el = e.target;
    var clave = el.getAttribute && el.getAttribute('data-clave');
    if (!clave) return;
    valores[clave] = el.type === 'checkbox' ? el.checked : el.value;
    pintarPrevia();
  }

  function pintarPrevia() {
    var html = window.kwHoja.html(bloquesActivos(), valores);
    $('previa').innerHTML = html;
    $('solo-impresion').innerHTML = html;
    ajustarEscala();
  }

  function ajustarEscala() {
    var marco = document.querySelector('.previa-marco');
    var caja = $('previa');
    if (!marco || !caja) return;
    caja.style.transform = '';
    caja.style.height = '';
    var disponible = marco.clientWidth - 36;
    var ancho = caja.firstElementChild ? caja.firstElementChild.offsetWidth : 0;
    if (!ancho || ancho <= disponible) return;
    var escala = disponible / ancho;
    caja.style.transform = 'scale(' + escala + ')';
    caja.style.height = (caja.scrollHeight * escala) + 'px';
  }
  window.addEventListener('resize', ajustarEscala);

  function imprimir() { window.print(); }

  async function guardar(silencioso) {
    var btn = $('btn-guardar');
    if (btn) btn.disabled = true;
    try {
      var u = await window.kwSupabase.auth.getUser();
      var fila = {
        plantilla_id: plantilla.id,
        user_id: u.data.user.id,
        titulo: plantilla.nombre,
        valores: valores,
        updated_at: new Date().toISOString(),
      };
      var res;
      if (doc && doc.id) {
        res = await window.kwSupabase.from('documentos_plantilla')
          .update(fila).eq('id', doc.id).select().single();
      } else {
        res = await window.kwSupabase.from('documentos_plantilla')
          .insert(fila).select().single();
      }
      if (res.error) throw res.error;
      doc = res.data;
      // Así, si recarga, vuelve al mismo borrador en vez de empezar de cero
      history.replaceState(null, '', location.pathname + '?id=' + plantilla.id + '&doc=' + doc.id);
      if (!silencioso) decir('Borrador guardado.', 'ok');
    } catch (e) {
      decir(e.message || 'No se pudo guardar.', 'error');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  // La advertencia y el "¿seguro?" los hace el propio botón al voltearse.
  async function finalizar() {
    var btn = $('btn-finalizar');
    btn.disabled = true;
    try {
      if (!doc || !doc.id) await guardar(true);
      var r = await window.kwSupabase.rpc('finalizar_documento_plantilla', { p_id: doc.id });
      if (r.error) throw r.error;
      await cargarDocumento(doc.id);
      pintar();
    } catch (e) {
      decir(e.message || 'No se pudo finalizar.', 'error');
      btn.disabled = false;
    }
  }

  async function cargarDocumento(id) {
    var r = await window.kwSupabase.from('documentos_plantilla')
      .select('id, plantilla_id, titulo, valores, bloques_congelados, estado, folio')
      .eq('id', id).single();
    if (r.error) throw r.error;
    doc = r.data;
    valores = doc.valores || {};
  }

  function error(mensaje) {
    $('contenido').innerHTML = '<div class="aviso"><strong>No se pudo abrir el formato</strong>' +
      esc(mensaje) + '</div>';
  }

  async function cargar() {
    try {
      if (DOC_ID) await cargarDocumento(DOC_ID);
      var id = PLANTILLA_ID || (doc && doc.plantilla_id);
      if (!id) return error('Falta indicar cuál formato.');

      var r = await window.kwSupabase.from('plantillas_documento')
        .select('id, nombre, descripcion, categoria, bloques, publicada')
        .eq('id', id).single();
      if (r.error) throw r.error;
      plantilla = r.data;
      plantilla.bloques = plantilla.bloques || [];
      document.title = plantilla.nombre;
      pintar();
    } catch (e) {
      error(e.message || 'Intenta de nuevo.');
    }
  }

  if (document.documentElement.classList.contains('kw-auth-ok')) cargar();
  else window.addEventListener('kw-auth-ready', cargar, { once: true });
</script>
<script>
  (function () {
    var s = document.createElement('style');
    s.textContent = window.kwHoja.estilos();
    document.head.appendChild(s);
  })();
</script>
<script src="/kwpremierweb/assets/js/drawer.js?v=20260822a" data-menu="hub"></script>
</body>
</html>
