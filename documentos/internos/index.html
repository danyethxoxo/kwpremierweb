      console.error('auth-guard.js no respondió a tiempo; redirigiendo al login por seguridad.');

  <style>
    :root {
      --header-h: 68px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      min-height: 100%;
      font-family: 'Poppins', Arial, sans-serif;
      color: var(--text);
    }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
    body { display: flex; flex-direction: column; min-height: 100vh; }




    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .breadcrumb a {
      color: var(--muted);
      text-decoration: none;
    }
    .breadcrumb a:hover { color: var(--text); }
    .breadcrumb span { color: var(--text); font-weight: 500; }

    .page { flex: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 100px 24px 60px;
    }

    .page-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 10px;
    }

    .page-title {
      font-size: 30px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .page-desc {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    @media (max-width: 780px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .page-title { font-size: 24px; }
    }

    /* El color del puesto ya no va en un rectángulo sólido: entra como
       un degradado que sale de la orilla izquierda y se apaga antes de
       la mitad de la tarjeta. Así se distingue de qué carpeta es sin que
       el color le gane al texto. El tono lo pone el JS en --rol-rgb (de
       roles_kw); si falta, se queda el guinda de siempre. */
    .card {
      --rol-rgb: 138, 0, 0;
      background:
        radial-gradient(115% 135% at 0% 50%,
          rgba(var(--rol-rgb), 0.40) 0%,
          rgba(var(--rol-rgb), 0.13) 34%,
          rgba(var(--rol-rgb), 0) 62%),
        radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), radial-gradient(70% 50% at 90% 2%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.82);
      backdrop-filter: blur(18px) saturate(165%);
      -webkit-backdrop-filter: blur(18px) saturate(165%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
      padding: 22px 20px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: background 0.25s, box-shadow 0.18s, transform 0.18s, border-color 0.25s;
    }
    .card:hover {
      background:
        radial-gradient(115% 135% at 0% 50%,
          rgba(var(--rol-rgb), 0.50) 0%,
          rgba(var(--rol-rgb), 0.17) 34%,
          rgba(var(--rol-rgb), 0) 62%),
        linear-gradient(150deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0.98) 45%, rgba(255,255,255,0.96) 100%);
      border-color: rgba(255,255,255,0.85);
      box-shadow: 0 16px 38px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.9);
      transform: translateY(-3px);
    }
    .card:active { transform: translateY(0) scale(0.97); }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #FFF0F0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .card-icon svg {
      width: 20px;
      height: 20px;
      color: var(--red);
      transition: color 0.2s;
    }
    .card:hover .card-icon { background: var(--red); }
    .card:hover .card-icon svg { color: #fff; }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.1px;
      line-height: 1.3;
      transition: color 0.2s;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
      transition: color 0.2s;
    }

    .card-cta {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: rgb(var(--rol-rgb));
      transition: color 0.2s;
    }
    .card-cta svg { width: 12px; height: 12px; }

    /* ── Carpetas por rol ──
       Cada puesto es una carpeta; adentro van sus documentos. Se prefirió
       esto a dejar todo desplegado en una sola pantalla porque con más
       documentos la lista se vuelve inmanejable, y porque quien entra
       casi siempre va por lo de UN rol, no por todo. */
    /* La sigla se queda clara y es la letra la que lleva el color del
       puesto, para que haga juego con el degradado de atrás en vez de
       competir con él. */
    .card-sigla {
      /* Sin esto la tarjeta (flex en columna) la estira de orilla a
         orilla y vuelve a verse como la barra de color de antes. */
      align-self: flex-start;
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 40px; height: 40px; padding: 0 9px;
      border-radius: 10px; margin-bottom: 14px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
      color: rgb(var(--rol-rgb));
      background: radial-gradient(70% 90% at 18% 104%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.90) 0%, rgba(255,255,255,0.78) 100%);
      border: 1px solid rgba(var(--rol-rgb), 0.22);
      box-shadow: 0 3px 12px rgba(var(--rol-rgb), 0.2), inset 0 1px 0 rgba(255,255,255,0.9);
      backdrop-filter: blur(18px) saturate(165%); -webkit-backdrop-filter: blur(18px) saturate(165%);
      transition: box-shadow 0.2s;
    }
    .card:hover .card-sigla { box-shadow: 0 5px 16px rgba(var(--rol-rgb), 0.28), inset 0 1px 0 rgba(255,255,255,0.95); }

    .cargando, .vacio-msg {
      grid-column: 1 / -1;
      text-align: center; padding: 40px 20px;
      color: var(--muted); font-size: 13.5px;
    }

      margin-top: 48px;

      border-top: 1px solid var(--border);
      text-align: center; display: flex; justify-content: center; gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }

  .footer-social svg { width: 15px; height: 15px; fill: currentColor; }

    @media (max-width: 640px) {
    .page { padding: 82px 16px 40px; }
    .page-title, .page-desc { display: none; }
  }
</style>

<script>
  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // El color del puesto llega de la base como hexadecimal (#4F46E5),
  // pero el degradado de la tarjeta lo necesita partido en canales para
  // poder darle transparencia. Lo que no se entienda se va al guinda de
  // siempre, para no dejar la tarjeta sin color.
  var ROL_RGB_RESPALDO = '138, 0, 0';
  function rgbDeHex(hex) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || '').trim());
    if (!m) return ROL_RGB_RESPALDO;
    var h = m[1];
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [
      parseInt(h.slice(0, 2), 16),
      parseInt(h.slice(2, 4), 16),
      parseInt(h.slice(4, 6), 16),
    ].join(', ');
  }

  // Una carpeta por puesto, con cuántos documentos tiene adentro. El
  // conteo se saca en el navegador (son pocos documentos) para no pedir
  // una consulta por carpeta.
  async function cargarCarpetas() {
    var caja = document.getElementById('carpetas');
    try {
      var r = await Promise.all([
        window.kwSupabase.from('roles_kw').select('id, nombre, descripcion, color').eq('activo', true).order('orden'),
        window.kwSupabase.from('documentos_internos').select('roles').eq('activo', true),
      ]);
      for (var i = 0; i < r.length; i++) if (r[i].error) throw r[i].error;

      var roles = r[0].data || [];
      var docs = r[1].data || [];
      if (!roles.length) {
        caja.innerHTML = '<div class="vacio-msg">Todavía no hay carpetas configuradas.</div>';
        return;
      }

      caja.innerHTML = roles.map(function (rol) {
        var n = docs.filter(function (d) { return (d.roles || []).indexOf(rol.id) >= 0; }).length;
        return '<a href="rol.html?rol=' + encodeURIComponent(rol.id) + '" class="card"' +
            ' style="--rol-rgb: ' + rgbDeHex(rol.color) + ';">' +
          '<span class="card-sigla">' + escapar(rol.id) + '</span>' +
          '<div class="card-title">' + escapar(rol.nombre) + '</div>' +
          '<div class="card-desc">' + escapar(rol.descripcion || '') + '</div>' +
          '<div class="card-cta">' + n + (n === 1 ? ' documento' : ' documentos') +
            ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>' +
          '</div></a>';
      }).join('');
    } catch (err) {
      caja.innerHTML = '<div class="vacio-msg">No se pudieron cargar las carpetas: ' + escapar(err.message || err) + '</div>';
    }
  }

  async function verificarAccesoInternos() {
    const { data: userData } = await window.kwSupabase.auth.getUser();
    if (!userData || !userData.user) return;
    const { data: perfil, error } = await window.kwSupabase
      .from('profiles')
      .select('role')
      .eq('id', userData.user.id)
      .single();
    if (error || !perfil) return;
    if (perfil.role === 'asociado') {
      document.getElementById('contenido-interno').style.display = 'none';
      document.getElementById('denegado').style.display = '';
      return;
    }
    cargarCarpetas();
  }
  if (document.documentElement.classList.contains('kw-auth-ok')) {
    verificarAccesoInternos();
  } else {
    window.addEventListener('kw-auth-ready', verificarAccesoInternos, { once: true });
  }
</script>
