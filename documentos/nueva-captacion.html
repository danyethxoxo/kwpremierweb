<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/assets/js/kw-security.js?v=20260922"></script>
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nueva captación</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png" />
<style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
<script>
  setTimeout(function () {
    if (!document.documentElement.classList.contains('kw-auth-ok')) location.replace('/login.html');
  }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"></script>
<script src="/assets/js/auth-guard.js"></script>
<script src="/assets/js/notif-bell.js?v=20260922"></script>
<link rel="stylesheet" href="/assets/css/kw-base.css?v=20260924a">
<link rel="stylesheet" href="/assets/css/kw-claro.css?v=20260924e">
<script src="/assets/js/kw-ui.js?v=20260922"></script>
<style>
  html, body { min-height: 100%; color: var(--text); }
  body { background: transparent; }
  .captacion-pagina { width: min(1060px, 100%); margin: 0 auto; padding: 94px 22px 56px; }
  .captacion-cabecera { margin-bottom: 18px; }
  .captacion-volver {
    display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px;
    border: 1px solid var(--border); border-radius: 999px; background: #fff; color: var(--text);
    font: inherit; font-size: 13px; font-weight: 700; text-decoration: none;
  }
  .captacion-volver:hover { color: var(--red); border-color: rgba(163,0,0,.3); }
  .captacion-volver svg { width: 15px; height: 15px; }
  .captacion-formulario {
    padding: clamp(18px, 3vw, 28px); border: 1px solid var(--border); border-radius: var(--r-card);
    background: #fff; box-shadow: var(--sombra-1);
  }
  .captacion-intro { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }
  .captacion-grupo {
    margin: 26px 0 13px; padding-top: 18px; border-top: 1px solid var(--border);
    color: var(--text); font-size: 14px; font-weight: 700;
  }
  .captacion-grupo:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
  .captacion-campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .captacion-campos .field.ancho { grid-column: 1 / -1; }
  .captacion-acciones {
    display: flex; justify-content: flex-end; gap: 10px; margin-top: 28px; padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .btn-cancelar-captacion, .btn-guardar-captacion {
    display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 18px;
    border-radius: 999px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-cancelar-captacion { border: 1px solid var(--border); background: #fff; color: var(--text); text-decoration: none; }
  .btn-cancelar-captacion:hover { color: var(--red); border-color: rgba(163,0,0,.3); }
  .btn-guardar-captacion { border: 0; background: var(--red); color: #fff; box-shadow: 0 4px 14px rgba(138,0,0,.22); }
  .btn-guardar-captacion:hover { background: #760000; }
  .btn-guardar-captacion:disabled { opacity: .65; cursor: default; }
  .captacion-mensaje { display: none; margin: 14px 0 0; font-size: 13px; }
  @media (min-width: 1024px) {
    html.kw-riel body { padding-left: 292px !important; }
    html.kw-riel .captacion-pagina { width: 100%; max-width: none; padding: 18px; }
    html.kw-riel #drawer { width: 292px !important; visibility: visible !important; opacity: 1 !important; transform: none !important; }
    html.kw-riel #drawer .drawer-hamburguesa { display: none; }
  }
  @media (max-width: 640px) {
    .captacion-pagina { padding: 84px 12px 36px; }
    .captacion-campos { grid-template-columns: 1fr; }
    .captacion-cabecera { display: none; }
    .captacion-acciones { justify-content: stretch; }
    .captacion-acciones > * { flex: 1; }
  }
</style>
</head>
<body>
  <header class="kw-header">
    <span class="kw-header-title">Nueva captación</span>
    <a href="/documentos/operatividad.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span>Atrás</span>
    </a>
  </header>

  <main class="captacion-pagina">
    <div class="kw-page-encabezado con-acciones captacion-cabecera">
      <h1 class="kw-page-titulo">Nueva captación</h1>
      <div class="kw-page-acciones">
        <a class="captacion-volver" href="/documentos/operatividad.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          <span>Cancelar</span>
        </a>
      </div>
    </div>

    <form class="captacion-formulario" id="form-captacion">
      <p class="captacion-intro">Registra una captación que no se haya creado automáticamente desde un documento.</p>
      <div id="campos-captacion"></div>
      <p class="captacion-mensaje" id="mensaje-captacion" role="alert"></p>
      <div class="captacion-acciones">
        <a class="btn-cancelar-captacion" href="/documentos/operatividad.html">Cancelar</a>
        <button class="btn-guardar-captacion" id="btn-guardar" type="submit">Guardar captación</button>
      </div>
    </form>
  </main>

<script>
var MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
var COLUMNAS = [
  { col: 'asociado_nombre', titulo: 'Nombre asociado', grupo: 'Quién', ancho: true },
  { col: 'folio', titulo: 'Folio', grupo: 'Quién' },
  { col: 'fecha_dictamen', titulo: 'Fecha dictamen', grupo: 'Dictamen', tipo: 'fecha' },
  { col: 'estatus_dictamen', titulo: 'Estatus dictamen', grupo: 'Dictamen', tipo: 'opciones', opciones: ['AUTORIZADO','CONDICIONADO','DEVUELTO'] },
  { col: 'mes_recibo', titulo: 'Mes de recibo', grupo: 'La operación', tipo: 'opciones', opciones: MESES },
  { col: 'fecha_contrato', titulo: 'Fecha contrato', grupo: 'La operación', tipo: 'fecha' },
  { col: 'tipo', titulo: 'Tipo', grupo: 'La operación', tipo: 'opciones', opciones: ['VENTA','RENTA'] },
  { col: 'exclusividad', titulo: 'Exclusiva/Opción', grupo: 'La operación', tipo: 'opciones', opciones: ['EXCLUSIVA','OPCIÓN'] },
  { col: 'division', titulo: 'División', grupo: 'La operación', tipo: 'opciones', opciones: ['RESIDENCIAL','COMERCIAL'] },
  { col: 'precio', titulo: 'Precio', grupo: 'La operación', tipo: 'dinero' },
  { col: 'porcentaje', titulo: '%', grupo: 'La operación', tipo: 'porcentaje' },
  { col: 'firma', titulo: 'Firma', grupo: 'La operación', tipo: 'opciones', opciones: ['DIGITAL','AUTÓGRAFA'] },
  { col: 'direccion', titulo: 'Dirección', grupo: 'El inmueble', ancho: true },
  { col: 'colonia', titulo: 'Colonia', grupo: 'El inmueble' },
  { col: 'alcaldia', titulo: 'Alcaldía/Municipio', grupo: 'El inmueble' },
  { col: 'entidad', titulo: 'Estado', grupo: 'El inmueble' },
  { col: 'codigo_postal', titulo: 'Código postal', grupo: 'El inmueble' },
  { col: 'cliente_nombre', titulo: 'Nombre del cliente', grupo: 'El propietario', ancho: true },
  { col: 'numero_propietario', titulo: 'Número propietario', grupo: 'El propietario' },
  { col: 'estatus_command', titulo: 'Estatus Command', grupo: 'Seguimiento', tipo: 'opciones', opciones: ['CARGADA','PENDIENTE','NO APLICA'] }
];

function esc(v) { var d = document.createElement('div'); d.textContent = v == null ? '' : v; return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function esNumero(c) { return c.tipo === 'dinero' || c.tipo === 'porcentaje'; }
function campo(c) {
  var id = 'campo-' + c.col;
  var html = '<div class="field' + (c.ancho ? ' ancho' : '') + '"><label for="' + id + '">' + esc(c.titulo) + '</label>';
  if (c.tipo === 'opciones') {
    html += '<select id="' + id + '"><option value="">Sin definir</option>' + c.opciones.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select>';
  } else if (c.tipo === 'fecha') html += '<input type="date" id="' + id + '">';
  else if (esNumero(c)) html += '<input type="number" step="0.01" id="' + id + '">';
  else html += '<input type="text" id="' + id + '">';
  return html + '</div>';
}
function pintarCampos() {
  var grupo = null;
  document.getElementById('campos-captacion').innerHTML = COLUMNAS.map(function (c) {
    var inicio = c.grupo !== grupo ? '<h2 class="captacion-grupo">' + esc(c.grupo) + '</h2><div class="captacion-campos">' : '';
    if (c.grupo !== grupo && grupo !== null) inicio = '</div>' + inicio;
    grupo = c.grupo;
    return inicio + campo(c);
  }).join('') + '</div>';
  if (window.kwUI) window.kwUI.iniciar(document.getElementById('form-captacion'));
}
function mensaje(texto, error) {
  var el = document.getElementById('mensaje-captacion');
  el.textContent = texto || ''; el.style.display = texto ? 'block' : 'none'; el.style.color = error ? '#a30000' : '#18763a';
}
async function validarRol() {
  var u = await window.kwSupabase.auth.getUser();
  if (!u.data || !u.data.user) return null;
  var p = await window.kwSupabase.from('profiles').select('role').eq('id', u.data.user.id).single();
  if (!p.data || ['master','admin','staff'].indexOf(p.data.role) === -1) { location.replace('/portal.html'); return null; }
  return u.data.user;
}
document.getElementById('form-captacion').addEventListener('submit', async function (e) {
  e.preventDefault(); mensaje('');
  var btn = document.getElementById('btn-guardar'); btn.disabled = true;
  try {
    var usuario = await validarRol(); if (!usuario) return;
    var datos = { creado_por: usuario.id };
    COLUMNAS.forEach(function (c) {
      var valor = document.getElementById('campo-' + c.col).value.trim();
      datos[c.col] = valor === '' ? null : (esNumero(c) ? Number(valor) : valor);
    });
    var res = await window.kwSupabase.from('operatividad').insert(datos);
    if (res.error) throw res.error;
    location.replace('/documentos/operatividad.html?guardada=1');
  } catch (err) {
    mensaje(err.message || 'No se pudo guardar la captación.', true);
  } finally { btn.disabled = false; }
});
async function iniciar() { if (await validarRol()) pintarCampos(); }
if (document.documentElement.classList.contains('kw-auth-ok')) iniciar();
else window.addEventListener('kw-auth-ready', iniciar, { once: true });
</script>
<script src="/assets/js/drawer.js?v=20260922c" data-menu="hub"></script>
</body>
</html>
