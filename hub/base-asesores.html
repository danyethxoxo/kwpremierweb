<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Base de asesores</title>
<link rel="icon" type="image/png" href="/kwpremierweb/assets/img/favicon.png" />
<style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
<script>
  setTimeout(function () {
    if (!document.documentElement.classList.contains('kw-auth-ok')) {
      console.error('auth-guard.js no respondió a tiempo; redirigiendo al login por seguridad.');
      location.replace('/kwpremierweb/login.html');
    }
  }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kwpremierweb/assets/js/auth-guard.js"></script>
<script src="/kwpremierweb/assets/js/notif-bell.js?v=20260829p"></script>
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-base.css?v=20260831c">
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-claro.css?v=20260829q">
<script src="/kwpremierweb/assets/js/kw-ui.js?v=20260831b"></script>
<style>
  /* ── Lo único que solo esta pantalla tiene ──────────────────────
     El resto sale de las piezas compartidas: .kw-page-encabezado,
     .kw-resumen/.kw-conteo, .kw-lista/.kw-fila, .kw-datos.en-columnas,
     .kw-fila-acciones y .field. */

  /* El color de cada grupo, en un solo lugar: lo usan la tarjeta de
     conteo de arriba y la etiqueta del renglón. Salen de la paleta. */
  .bd-activos   { --tono: var(--pastel-menta-txt); --pastel: var(--pastel-menta); }
  .bd-bajas     { --tono: #5b5b5b;                 --pastel: rgba(0,0,0,0.05); }
  .bd-back      { --tono: var(--pastel-cielo-txt); --pastel: var(--pastel-cielo); }
  .bd-back-baja { --tono: #5b5b5b;                 --pastel: rgba(0,0,0,0.05); }
  .bd-otro      { --tono: #6b6b6b;                 --pastel: #f1f1f0; }
  .bd-pill {
    display: inline-flex; align-items: center;
    padding: 2px 10px; border-radius: 999px;
    background: var(--pastel, #f1f1f0); color: var(--tono, var(--muted));
    font-size: 11.5px; white-space: nowrap;
  }

  /* De dónde salió el renglón: es una nota al pie del expediente, no un
     dato del asesor, así que va más callada que lo de arriba. */
  .bd-origen { color: var(--muted); font-size: 12px; margin-top: var(--sp-3); }

  /* La contraseña de Command no se queda a la vista al abrir la tarjeta.
     El texto real sigue en el DOM debajo del borrón, así que no es una
     forma de esconderla de quien abra las herramientas del navegador:
     es para que no se lea de reojo desde la silla de al lado. */
  .kw-clave { display: inline-flex; align-items: center; gap: 8px; }
  .clave-valor {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    letter-spacing: 0.02em;
  }
  .clave-valor.oculta { filter: blur(5px); user-select: none; }
  .clave-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    border: none; background: none; color: var(--muted); cursor: pointer;
    transition: background var(--t-rapido), color var(--t-rapido);
  }
  .clave-toggle:hover { background: #f0f0f0; color: var(--text); }
  .clave-toggle svg { width: 14px; height: 14px; }

  .kw-emergencia .kw-dato-txt { display: flex; flex-direction: column; gap: 1px; }
  .kw-emergencia-titulo { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

  /* ── La ficha, que es una página y no un cuadro encima ──────────
     Un expediente de veinticuatro campos dentro de un modal es un
     cuadrito con scroll propio; de página entera se llena como se
     llena un formulario de papel. */
  .ficha-hoja {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r-tarjeta); padding: var(--sp-5);
    max-width: 900px;
  }
  .ficha-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--sp-4); }
  .ficha-subtitulo {
    font-size: 13px; font-weight: 500; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.03em;
    margin: var(--sp-4) 0 var(--sp-3); padding-top: var(--sp-4);
    border-top: 1px solid var(--border);
  }
  /* El primero abre la hoja: no separa nada de lo de arriba porque no
     hay nada arriba. */
  .ficha-subtitulo.primera { margin-top: 0; padding-top: 0; border-top: none; }

  /* El cumpleaños, en tres pedazos. */
  .fecha-partes { display: flex; gap: var(--sp-2); }
  .fecha-partes select { min-width: 0; }
  .fecha-partes select:first-child { flex: 0 0 78px; }
  .fecha-partes select:last-child { flex: 0 0 92px; }
  .fecha-partes select:nth-child(2) { flex: 1; }

  /* Lo que el libro traía escrito a mano y no se pudo leer como fecha
     ("marzo 2024", "pendiente"). Se dice en vez de tirarlo: el campo
     queda vacío pero el dato sigue guardado hasta que se corrija. */
  .campo-nota { font-size: 11.5px; color: var(--muted); margin-top: 5px; }

  /* Cada contacto es su propia tarjetita: sin una línea que los separe,
     cuatro campos seguidos de otros cuatro se leen como ocho. */
  .contacto {
    border: 1px solid var(--border); border-radius: var(--r-tarjeta);
    padding: var(--sp-4); margin-bottom: var(--sp-3);
    background: rgba(255,255,255,0.5);
  }
  .contacto .field:last-of-type { margin-bottom: 0; }
  .contacto-pie {
    display: flex; align-items: center; gap: var(--sp-3);
    flex-wrap: wrap; margin-top: var(--sp-3);
  }
  .contacto-pie .crece { flex: 1; }
  .contacto-quitar {
    border: none; background: none; color: var(--muted);
    font-family: inherit; font-size: 12px; cursor: pointer; padding: 4px 6px;
  }
  .contacto-quitar:hover { color: #a30000; }
  .contacto-vacio { color: var(--muted); font-size: 13px; margin-bottom: var(--sp-3); }

  #f-mas-contacto { margin-bottom: var(--sp-4); }
  .ficha-notas { margin-top: var(--sp-4); }
  .ficha-acciones {
    display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
    margin-top: var(--sp-4); padding-top: var(--sp-4);
    border-top: 1px solid var(--border);
  }
  .ficha-acciones .crece { flex: 1; }
  @media (max-width: 620px) {
    .ficha-grid { grid-template-columns: 1fr; }
    .ficha-hoja { padding: var(--sp-4); }
  }

  /* El botón principal de la pantalla, en guinda y con texto, como en
     todas las demás. */
  .btn-guardar {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: 999px;
    border: none; background: var(--red); color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 14px rgba(40,12,12,0.2);
    transition: transform var(--t-medio), filter var(--t-rapido);
  }
  .btn-guardar:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
  .btn-guardar:disabled { opacity: 0.6; cursor: default; }

  .btn-quitar {
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(163,0,0,0.3); background: none; color: #a30000;
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    transition: background var(--t-rapido), border-color var(--t-rapido);
  }
  .btn-quitar:hover { background: #fdeaea; border-color: #a30000; }
</style>
</head>
<body>

  <!-- El mismo header que las demás pantallas: la lupa de un lado y la
       campanita del otro, que los pone drawer.js. -->
  <header class="kw-header">
    <span class="kw-header-title">Base de asesores</span>
    <a href="admin.html#asesores" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      <span>Atrás</span>
    </a>
  </header>

  <main class="kw-page">

    <div id="denegado" class="kw-vacio" style="display:none;">
      <strong>Esta pantalla no es para tu cuenta</strong>
      La base de asesores es de Máster, Admin y el equipo de altas.
    </div>

    <div id="contenido" style="display:none;">

      <!-- ── Vista 1: la lista ───────────────────────────────────── -->
      <div id="vista-lista">
        <div class="kw-page-encabezado">
          <h1 class="kw-page-titulo">Base de asesores</h1>
        </div>

        <!-- El campo se queda en la página pero no se ve: drawer.js lo
             encuentra por su id, lo esconde y le pasa lo que se escriba
             en la lupa de arriba. O sea que el buscador sigue siendo
             este, nada más que se teclea allá. -->
        <div class="kw-campo-filtro">
          <label for="bd-buscar">Buscar</label>
          <div class="kw-buscador">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.7" y2="16.7"/>
            </svg>
            <input type="text" id="bd-buscar" class="kw-input" placeholder="Nombre, correo o KWID" autocomplete="off">
          </div>
        </div>

        <!-- Cuántos hay de cada cual, y el filtro de un clic. -->
        <div class="kw-resumen" id="bd-resumen"></div>

        <div id="bd-lista"></div>
      </div>

      <!-- ── Vista 2: la ficha ───────────────────────────────────── -->
      <div id="vista-ficha" style="display:none;">
        <div class="kw-page-encabezado">
          <h1 class="kw-page-titulo" id="ficha-titulo">Nuevo asesor</h1>
        </div>

        <div class="ficha-hoja">
          <h2 class="ficha-subtitulo primera">Información del ingreso</h2>

          <div class="field requerido"><label for="f-nombre">Nombre completo</label>
            <input type="text" id="f-nombre" autocomplete="off" />
          </div>

          <div class="ficha-grid">
            <div class="field"><label for="f-correo-personal">Correo personal</label>
              <input type="email" id="f-correo-personal" autocomplete="off" /></div>
            <div class="field"><label for="f-telefono">Cel</label>
              <input type="tel" id="f-telefono" autocomplete="off" /></div>
            <div class="field"><label for="f-curp">CURP</label>
              <input type="text" id="f-curp" maxlength="18" style="text-transform:uppercase;" autocomplete="off" /></div>
            <!-- El cumpleaños no se pide con el calendario del navegador:
                 ese abre en el año que corre y para una fecha de
                 nacimiento hay que caminar treinta años hacia atrás. Tres
                 desplegables se llenan de un vistazo. -->
            <div class="field"><label>Cumpleaños</label>
              <div class="fecha-partes">
                <select id="f-cumple-dia" aria-label="Día"></select>
                <select id="f-cumple-mes" aria-label="Mes"></select>
                <select id="f-cumple-anio" aria-label="Año"></select>
              </div>
              <p class="campo-nota" id="f-cumple-nota" hidden></p>
            </div>
          </div>

          <h2 class="ficha-subtitulo">Datos para el MC</h2>
          <div class="ficha-grid">
            <div class="field"><label for="f-grupo">Estatus</label>
              <select id="f-grupo">
                <option value="asesor_activo">Asesor activo</option>
                <option value="asesor_baja">Asesor de baja</option>
                <option value="back_office_activo">Back office activo</option>
                <option value="back_office_baja">Back office de baja</option>
              </select>
            </div>
            <div class="field"><label for="f-tipo-asociado">Tipo de asociado</label>
              <select id="f-tipo-asociado">
                <option value="">Sin definir</option>
                <option value="R0">R0</option>
                <option value="R1">R1</option>
                <option value="R2">R2</option>
              </select>
            </div>
            <div class="field"><label for="f-sponsor">Sponsor</label>
              <input type="text" id="f-sponsor" autocomplete="off" /></div>
            <div class="field"><label for="f-correo">Correo KW</label>
              <input type="email" id="f-correo" autocomplete="off" /></div>
            <!-- El navegador quiere llenar estos dos con el correo y la
                 contraseña de quien está capturando: para él son un
                 usuario y una contraseña cualesquiera. new-password es lo
                 único que respeta, y por si acaso se vuelven a vaciar al
                 abrir la ficha (ver limpiarAutollenado). -->
            <div class="field"><label for="f-usuario-command">Usuario Command</label>
              <input type="text" id="f-usuario-command" name="kw-usuario-command"
                autocomplete="new-password" data-lpignore="true" spellcheck="false" /></div>
            <div class="field"><label for="f-contrasena">Contraseña</label>
              <div class="password-wrap">
                <input type="password" id="f-contrasena" name="kw-clave-command"
                  autocomplete="new-password" data-lpignore="true" />
                <button type="button" class="password-toggle" id="f-ver-clave" aria-label="Mostrar contraseña">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="field"><label for="f-kwid">KW ID</label>
              <input type="text" id="f-kwid" autocomplete="off" /></div>
            <div class="field"><label for="f-clasificacion">Clasificación</label>
              <select id="f-clasificacion">
                <option value="">Sin definir</option>
                <option value="Solo Agent">Solo Agent</option>
                <option value="Team">Team</option>
              </select>
            </div>
            <!-- Las PC todavía no son usuarios de la plataforma, así que
                 la lista trae sus nombres puestos a mano. En cuanto
                 existan con el rol de PC, la lista sale de ahí y estos
                 nombres dejan de hacer falta (ver cargarListas). -->
            <div class="field"><label for="f-coach">Coach asignado</label>
              <select id="f-coach"></select>
            </div>
            <!-- La célula es un miembro del staff que se le asigna a
                 quien no quiere coach, así que la lista sale de
                 Liderazgo, quitando a las PC. -->
            <div class="field"><label for="f-celula">Célula</label>
              <select id="f-celula"></select>
            </div>
            <div class="field"><label for="f-ingreso">Fecha de ingreso</label>
              <input type="date" id="f-ingreso" />
              <p class="campo-nota" id="f-ingreso-nota" hidden></p>
            </div>
            <div class="field"><label for="f-aniversario">Aniversario</label>
              <input type="date" id="f-aniversario" />
              <p class="campo-nota" id="f-aniversario-nota" hidden></p>
            </div>
            <div class="field"><label for="f-baja">Fecha de baja</label>
              <input type="date" id="f-baja" />
              <p class="campo-nota" id="f-baja-nota" hidden></p>
            </div>
          </div>

          <!-- El contacto de emergencia y el beneficiario no son la misma
               persona, y pueden ser varias: por eso es una lista donde
               cada quien se marca como lo que sea, o como las dos. -->
          <h2 class="ficha-subtitulo">Contactos de Emergencia y Beneficiarios</h2>
          <div id="f-contactos"></div>
          <button type="button" class="kw-fila-btn neutro" id="f-mas-contacto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Contacto
          </button>

          <div class="field ficha-notas"><label for="f-notas">Notas</label>
            <input type="text" id="f-notas" autocomplete="off" />
          </div>

          <div class="msg" id="ficha-msg"></div>

          <div class="ficha-acciones">
            <button type="button" class="kw-fila-btn neutro" id="ficha-volver">Volver a la lista</button>
            <span class="crece"></span>
            <button type="button" class="btn-quitar" id="ficha-borrar" style="display:none;"
              data-kw-confirmar="¿Quitarlo de la base?">Quitar de la base</button>
            <button type="button" class="btn-guardar" id="ficha-guardar">Guardar</button>
          </div>
        </div>
      </div>

    </div>
  </main>

<script>
  // ═══════════════════════════════════════════════════════════════
  // La base de asesores
  // ═══════════════════════════════════════════════════════════════
  //
  // Es la raíz: aquí vive quién es asesor del Market Center. El Panel
  // lee el libro de Excel y lo copia a esta tabla, y de esta tabla salen
  // sus pestañas; esta pantalla es la tabla misma, para verla completa,
  // corregir un expediente y repartir a la gente entre los grupos.
  //
  // Va en su propia página a propósito: entrar aquí y darle atrás en el
  // navegador regresa al Panel, sin que haya que acordarse de un botón.

  const $ = function (id) { return document.getElementById(id); };

  // Los cuatro estatus. La célula NO es uno: es un miembro del staff que
  // se le asigna a quien no quiere coach, y por eso es un campo de la
  // ficha y no un lugar donde estar.
  const GRUPOS = [
    { clave: 'asesor_activo', titulo: 'Asesores activos', corto: 'Activo', clase: 'activos' },
    { clave: 'asesor_baja', titulo: 'Asesores de baja', corto: 'Baja', clase: 'bajas' },
    { clave: 'back_office_activo', titulo: 'Back office activo', corto: 'Back office', clase: 'back' },
    { clave: 'back_office_baja', titulo: 'Back office de baja', corto: 'Back office baja', clase: 'back-baja' },
  ];
  const TITULO = {}, CORTO = {}, CLASE = {};
  GRUPOS.forEach(function (g) { TITULO[g.clave] = g.titulo; CORTO[g.clave] = g.corto; CLASE[g.clave] = g.clase; });

  // El estatus, dicho como se dice hoy. Los renglones que se guardaron
  // antes traen el nombre de la hoja del libro; la migración los
  // traduce, pero la pantalla no puede quedarse esperándola.
  function estatusDe(a) {
    const g = String(a.grupo || '').toLowerCase();
    if (g === 'activos' || g === 'celulas') return 'asesor_activo';
    if (g === 'bajas') return 'asesor_baja';
    if (g === 'back_office' || g === 'backoffice' || g === 'back') return 'back_office_activo';
    return g || 'asesor_activo';
  }

  // Quién entra: lo mismo que la pestaña de Asesores del Panel. El
  // candado de verdad es la RLS de la tabla; esto solo evita enseñar una
  // pantalla que de todos modos no traería nada.
  const ROLES = ['master', 'admin'];
  const CORREOS = ['dani.guerrero@kwmexico.mx'];

  // Las Productivity Coach del Market Center. Todavía no son usuarios de
  // la plataforma, así que van puestas a mano; en cuanto existan con el
  // rol de PC, cargarListas() las lee de profiles y estas se vuelven de
  // adorno (se juntan sin repetir, por correo).
  const PC = [
    { nombre: 'Sheila Carol Silva Dritrit', correo: 'carol.silva@kwmexico.mx' },
    { nombre: 'María Almendra Núñez Moreno', correo: 'almendra.nunez@kwmexico.mx' },
    { nombre: 'Maricarmen Cortés Escalante', correo: 'maricarmen.cortes@kwmexico.mx' },
    { nombre: 'Mónica Fernández Rodríguez', correo: 'moni.fernandez@kwmexico.mx' },
  ];
  const CORREOS_PC = PC.map(function (p) { return p.correo.toLowerCase(); });

  const ICONO_LLAVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg>';

  let asesores = [];
  let filtroGrupo = '';
  let editando = null;
  // Contraseñas que se pidieron ver. El texto siempre está en el DOM;
  // esto solo decide si se ve borroso.
  const clavesVisibles = new Set();

  function escapar(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ── Leer ──────────────────────────────────────────────────────
  async function leer() {
    const { data, error } = await window.kwSupabase
      .from('asesores').select('*').order('nombre', { ascending: true });
    if (error) {
      $('bd-lista').innerHTML = '<div class="kw-vacio"><strong>No se pudo leer la base</strong>' +
        escapar(error.message) +
        (/does not exist|relation|schema cache/i.test(error.message)
          ? '<br><br>Falta correr 073_asesores.sql en el SQL Editor de Supabase.'
          : '') + '</div>';
      return false;
    }
    asesores = data || [];
    return true;
  }

  // La base guarda con nombres de columna (correo_personal) y la
  // pantalla los pinta con los de siempre (correoPersonal). Se traduce
  // en un solo lugar.
  function persona(a) {
    return {
      id: a.id, grupo: estatusDe(a), origen: a.origen, hoja: a.hoja, fijado: a.fijado,
      correo: a.correo || '', nombre: a.nombre || '', telefono: a.telefono || '',
      kwid: a.kwid || '', fechaIngreso: a.fecha_ingreso || '', fechaBaja: a.fecha_baja || '',
      cumpleanos: a.cumpleanos || '', puesto: a.puesto || '', celula: a.celula || '',
      curp: a.curp || '', usuarioCommand: a.usuario_command || '', contrasena: a.contrasena || '',
      correoPersonal: a.correo_personal || '', tipoAsociado: a.tipo_asociado || '',
      clasificacion: a.clasificacion || '', sponsor: a.sponsor || '',
      aniversario: a.aniversario || '', coachAsignado: a.coach_asignado || '',
      asesorAsignado: a.asesor_asignado || '',
      contactos: contactosDe(a),
      notas: a.notas || '',
    };
  }

  // ── Pintar la lista ───────────────────────────────────────────
  function dato(icono, texto, href) {
    if (!texto) return '';
    const dentro = icono + '<span class="kw-dato-txt">' + escapar(texto) + '</span>';
    return href
      ? '<a class="kw-dato" href="' + escapar(href) + '">' + dentro + '</a>'
      : '<div class="kw-dato">' + dentro + '</div>';
  }

  function expedienteHtml(p) {

    const visible = clavesVisibles.has(p.id);

      ? '<div class="kw-dato">' + ICONO_LLAVE +

            '<span class="clave-valor' + (visible ? '' : ' oculta') + '">' + escapar(p.contrasena) + '</span>' +
            '<button type="button" class="clave-toggle" data-clave="' + p.id + '" aria-label="' +
              (visible ? 'Ocultar' : 'Mostrar') + ' contraseña">' + I.ojo + '</button>' +
          '</span>' +
        '</div>'
      : '';
    return dato(I.telefono, p.telefono, p.telefono ? 'tel:' + p.telefono : null) +
      dato(I.maletin, p.puesto, null) +
      dato(I.persona, p.celula ? 'Célula: ' + p.celula : '', null) +
      dato(I.calendario, p.fechaIngreso ? 'Ingreso: ' + p.fechaIngreso : '', null) +
      dato(I.calendario, p.fechaBaja ? 'Baja: ' + p.fechaBaja : '', null) +
      dato(I.persona, p.usuarioCommand, null) +
      clave +
      dato(I.correo, p.correoPersonal, p.correoPersonal ? 'mailto:' + p.correoPersonal : null) +
      dato(I.calendario, p.cumpleanos ? 'Cumpleaños: ' + p.cumpleanos : '', null) +
      dato(I.etiqueta, p.curp ? 'CURP: ' + p.curp : '', null) +
      dato(I.etiqueta, p.tipoAsociado ? 'Tipo de asociado: ' + p.tipoAsociado : '', null) +
      dato(I.etiqueta, p.clasificacion ? 'Clasificación: ' + p.clasificacion : '', null) +
      dato(I.calendario, p.aniversario ? 'Aniversario KW: ' + p.aniversario : '', null) +
      dato(I.persona, p.sponsor ? 'Sponsor: ' + p.sponsor : '', null) +
      dato(I.persona, p.coachAsignado ? 'Coach: ' + p.coachAsignado : '', null) +
      dato(I.persona, p.asesorAsignado ? 'Asesor: ' + p.asesorAsignado : '', null) +
      dato(I.etiqueta, p.notas, null) +
      p.contactos.map(function (c) {
        const quien = [c.nombre, c.parentesco ? '(' + c.parentesco + ')' : ''].filter(Boolean).join(' ');
        const que = [c.emergencia ? 'Contacto de emergencia' : '', c.beneficiario ? 'Beneficiario' : '']
          .filter(Boolean).join(' y ') || 'Contacto';
        return '<div class="kw-dato kw-emergencia">' + I.persona +
          '<span class="kw-dato-txt">' +
            '<span class="kw-emergencia-titulo">' + escapar(que) + '</span>' +
            (quien ? '<span>' + escapar(quien) + '</span>' : '') +
            (c.telefono ? '<a href="tel:' + escapar(c.telefono) + '">' + escapar(c.telefono) + '</a>' : '') +
            (c.correo ? '<a href="mailto:' + escapar(c.correo) + '">' + escapar(c.correo) + '</a>' : '') +
          '</span>' +
        '</div>';
      }).join('');
  }

  function pintar() {
    const q = ($('bd-buscar').value || '').trim().toLowerCase();

    // El resumen cuenta sobre todo lo que hay y no sobre lo filtrado: si
    // contara lo filtrado, picarle a un grupo dejaría a los demás en
    // cero y ya no habría cómo cambiar de uno a otro.
    $('bd-resumen').innerHTML = GRUPOS.map(function (g) {
      const cuantos = asesores.filter(function (a) { return estatusDe(a) === g.clave; }).length;
      return '<button type="button" class="kw-conteo bd-' + g.clase +
        (filtroGrupo === g.clave ? ' activa' : '') + '" data-grupo="' + g.clave + '">' +
        '<span class="kw-conteo-num">' + cuantos + '</span>' +
        '<span class="kw-conteo-txt">' + escapar(g.titulo) + '</span></button>';
    }).join('');

    const lista = asesores.filter(function (a) {
      if (filtroGrupo && estatusDe(a) !== filtroGrupo) return false;
      if (!q) return true;
      return [a.nombre, a.correo, a.kwid, a.celula, a.puesto]
        .some(function (x) { return String(x || '').toLowerCase().includes(q); });
    });

    const cont = $('bd-lista');
    if (!lista.length) {
      cont.innerHTML = '<div class="kw-vacio"><strong>' +
        (asesores.length ? 'Nadie cumple con lo que estás buscando' : 'La base está vacía') + '</strong>' +
        (asesores.length
          ? 'Prueba con otro nombre, correo o KWID.'
          : 'Se llena sola en cuanto el Panel lea el libro, o se captura desde ' +
            '"Nuevo asesor", en el Panel.') + '</div>';
      return;
    }

    cont.innerHTML = '<div class="kw-lista">' + lista.map(function (a, i) {
      const I = window.kwUI.iconos;
      const p = persona(a);
      const estatus = estatusDe(a);
      const esBaja = estatus === 'asesor_baja' || estatus === 'back_office_baja';
      return '<div class="kw-fila kw-aparece-fila' + (esBaja ? ' apagada' : '') + '"' +
        ' style="animation-delay:' + Math.min(i * 25, 300) + 'ms">' +
        '<button type="button" class="kw-fila-cabeza">' +
          '<span class="kw-fila-punto ' + (esBaja ? 'gris' : 'verde') + '"></span>' +
          '<span class="kw-fila-texto">' +
            '<span class="kw-fila-titulo">' + escapar(p.nombre || 'Sin nombre') + '</span>' +
            '<span class="kw-fila-sub">' + escapar(p.correo || 'Sin correo de KW') + '</span>' +
          '</span>' +
          '<span class="kw-fila-extra">' +
            '<span class="kw-extra"><span class="kw-extra-id">ID:</span><span>' +
              escapar(p.kwid || 'Sin KWID') + '</span></span>' +
            '<span class="kw-extra"><span class="bd-pill bd-' + (CLASE[estatus] || 'otro') + '">' +
              escapar(CORTO[estatus] || estatus) + '</span></span>' +
          '</span>' + I.flecha +
        '</button>' +
        '<div class="kw-fila-cuerpo"><div><div class="kw-fila-dentro">' +
          '<div class="kw-datos en-columnas">' + expedienteHtml(p) + '</div>' +
          '<div class="bd-origen">' +
            (p.origen === 'excel' ? 'Vino del libro' + (p.hoja ? ' (' + escapar(p.hoja) + ')' : '') : 'Capturado aquí') +
            (p.fijado ? ' · su grupo se puso a mano, el libro ya no se lo mueve' : '') +
          '</div>' +
          '<div class="kw-fila-acciones">' +
            '<button type="button" class="kw-fila-btn" data-editar="' + a.id + '">Editar ficha</button>' +
            GRUPOS.filter(function (g) { return g.clave !== a.grupo; }).map(function (g) {
              return '<button type="button" class="kw-fila-btn neutro" data-mover="' + a.id + '"' +
                ' data-a="' + g.clave + '">Pasar a ' + escapar(g.titulo) + '</button>';
            }).join('') +
          '</div>' +
        '</div></div></div>' +
      '</div>';
    }).join('') + '</div>';

    window.kwUI.acordeon(cont);
  }

  // Un solo escuchador para toda la lista: se repinta seguido y
  // colgarle uno a cada botón en cada repintado los va acumulando.
  document.addEventListener('click', function (e) {
    const conteo = e.target.closest('#bd-resumen [data-grupo]');
    if (conteo) {
      filtroGrupo = filtroGrupo === conteo.dataset.grupo ? '' : conteo.dataset.grupo;
      pintar();
      return;
    }
    const clave = e.target.closest('[data-clave]');
    if (clave) {
      const id = clave.dataset.clave;
      if (clavesVisibles.has(id)) clavesVisibles.delete(id); else clavesVisibles.add(id);
      pintar();
      return;
    }
    const editar = e.target.closest('[data-editar]');
    if (editar) { abrirFicha(editar.dataset.editar); return; }
    const mover = e.target.closest('[data-mover]');
    if (mover) moverDeGrupo(mover.dataset.mover, mover.dataset.a, mover);
  });

  // Repartir a alguien es cambiarle el grupo. Con eso queda repartido
  // también en las pestañas del Panel, que salen de esta misma tabla.
  async function moverDeGrupo(id, grupo, btn) {
    btn.disabled = true;
    const { error } = await window.kwSupabase.from('asesores').update({ grupo: grupo }).eq('id', id);
    btn.disabled = false;
    if (error) { await window.kwUI.alert('No se pudo mover: ' + error.message); return; }
    if (await leer()) pintar();
  }

  // ── Fechas ────────────────────────────────────────────────────
  // El libro las trae escritas a mano y de mil formas: "15/03/24",
  // "1 de enero", "marzo 2024", "pendiente". Se intenta leerlas para
  // poder ponerlas en un calendario; lo que no se entienda NO se tira:
  // el campo se queda vacío y debajo se dice qué decía, para que quien
  // esté viendo la ficha lo corrija sabiendo qué había.
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
    'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  function sinAcentos(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  // Devuelve {a, m, d} o null. El año puede faltar (un cumpleaños suele
  // venir sin él).
  function leerFecha(texto) {
    const t = String(texto || '').trim();
    if (!t) return null;

    let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return { a: +m[1], m: +m[2], d: +m[3] };

    m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) {
      let a = +m[3];
      // "24" es 2024 y no 1924: el libro no tiene a nadie de hace un
      // siglo. Se corta en 70 por si algún día hay una fecha de
      // nacimiento vieja capturada con dos dígitos.
      if (a < 100) a += a > 70 ? 1900 : 2000;
      return { a: a, m: +m[2], d: +m[1] };
    }

    m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
    if (m) return { a: null, m: +m[2], d: +m[1] };

    // "1 de enero", "14 marzo 1990", "enero 1"
    const limpio = sinAcentos(t);
    const mes = MESES.findIndex(function (nombre) { return limpio.includes(sinAcentos(nombre)); });
    if (mes !== -1) {
      const numeros = limpio.match(/\d+/g) || [];
      const dia = numeros.find(function (n) { return +n >= 1 && +n <= 31 && n.length <= 2; });
      const anio = numeros.find(function (n) { return n.length === 4; });
      if (dia) return { a: anio ? +anio : null, m: mes + 1, d: +dia };
    }
    return null;
  }

  function aISO(texto) {
    const f = leerFecha(texto);
    if (!f || !f.a) return '';
    return f.a + '-' + String(f.m).padStart(2, '0') + '-' + String(f.d).padStart(2, '0');
  }

  // Pone la fecha en un campo de calendario. Si no se pudo leer, deja el
  // campo vacío y enseña abajo lo que decía.
  function ponerFecha(idCampo, idNota, valor) {
    const campo = $(idCampo);
    const nota = $(idNota);
    const iso = aISO(valor);
    campo.value = iso;
    // El campo de fecha del sitio se enseña como texto mientras está
    // vacío; hay que avisarle que su valor cambió.
    campo.dispatchEvent(new Event('change', { bubbles: true }));
    const hayTexto = String(valor || '').trim();
    if (!iso && hayTexto) {
      nota.textContent = 'En el libro dice: ' + hayTexto;
      nota.hidden = false;
    } else {
      nota.textContent = '';
      nota.hidden = true;
    }
  }

  // Al guardar: lo que se eligió, o lo de antes si el campo sigue vacío
  // porque no se pudo leer (así no se borra solo por abrir la ficha).
  function sacarFecha(idCampo, idNota, original) {
    const v = $(idCampo).value;
    if (v) return v;
    return $(idNota).hidden ? null : (original || null);
  }

  // ── El cumpleaños, en tres pedazos ──
  function armarCumple() {
    const dia = $('f-cumple-dia'), mes = $('f-cumple-mes'), anio = $('f-cumple-anio');
    dia.innerHTML = '<option value="">Día</option>';
    for (let i = 1; i <= 31; i++) dia.innerHTML += '<option value="' + i + '">' + i + '</option>';
    mes.innerHTML = '<option value="">Mes</option>' + MESES.map(function (n, i) {
      return '<option value="' + (i + 1) + '">' + n.charAt(0).toUpperCase() + n.slice(1) + '</option>';
    }).join('');
    // Del año que corre hacia abajo: nadie nace mañana.
    const hoy = new Date().getFullYear();
    anio.innerHTML = '<option value="">Año</option>';
    for (let a = hoy; a >= hoy - 90; a--) anio.innerHTML += '<option value="' + a + '">' + a + '</option>';
  }

  function ponerCumple(valor) {
    const f = leerFecha(valor);
    $('f-cumple-dia').value = f ? String(f.d) : '';
    $('f-cumple-mes').value = f ? String(f.m) : '';
    $('f-cumple-anio').value = f && f.a ? String(f.a) : '';
    ['f-cumple-dia', 'f-cumple-mes', 'f-cumple-anio'].forEach(function (id) {
      $(id).dispatchEvent(new Event('change', { bubbles: true }));
    });
    const nota = $('f-cumple-nota');
    const hayTexto = String(valor || '').trim();
    if (!f && hayTexto) { nota.textContent = 'En el libro dice: ' + hayTexto; nota.hidden = false; }
    else { nota.textContent = ''; nota.hidden = true; }
  }

  function sacarCumple(original) {
    const d = $('f-cumple-dia').value, m = $('f-cumple-mes').value, a = $('f-cumple-anio').value;
    if (!d || !m) return $('f-cumple-nota').hidden ? null : (original || null);
    const dd = String(d).padStart(2, '0'), mm = String(m).padStart(2, '0');
    // Sin año se guarda día y mes, que es como viene la mitad del libro.
    return a ? (a + '-' + mm + '-' + dd) : (dd + '/' + mm);
  }

  // ── Las listas de gente ───────────────────────────────────────
  // El coach sale de las PC; la célula, de Liderazgo quitando a las PC.
  // Las dos se arman una vez al entrar.
  let listaCoaches = [], listaCelulas = [];

  async function cargarListas() {
    const { data } = await window.kwSupabase
      .from('profiles').select('nombre, apellido, email, role');
    const gente = data || [];
    const nombreDe = function (u) {
      return [u.nombre, u.apellido].filter(Boolean).join(' ') || u.email;
    };

    // Las PC de la plataforma, si ya existen, más las de la lista de
    // arriba; sin repetir a nadie, que la llave es el correo.
    const porCorreo = {};
    PC.forEach(function (p) { porCorreo[p.correo.toLowerCase()] = p.nombre; });
    gente.filter(function (u) { return u.role === 'pc'; })
      .forEach(function (u) { porCorreo[String(u.email || '').toLowerCase()] = nombreDe(u); });
    listaCoaches = Object.keys(porCorreo).map(function (c) { return porCorreo[c]; })
      .sort(function (a, b) { return a.localeCompare(b, 'es'); });

    listaCelulas = gente
      .filter(function (u) {
        return u.role === 'staff' && !CORREOS_PC.includes(String(u.email || '').toLowerCase());
      })
      .map(nombreDe)
      .sort(function (a, b) { return a.localeCompare(b, 'es'); });

    llenarLista('f-coach', listaCoaches, 'Sin coach');
    llenarLista('f-celula', listaCelulas, 'Sin célula');
  }

  // Lo mismo para los desplegables de opciones fijas: el libro trae
  // "Full Agent" y la lista de hoy es Solo Agent o Team. Se le agrega su
  // valor para que se vea lo que tiene y guardar no se lo borre por su
  // cuenta; se corrige eligiendo otro.
  function asegurarOpcion(id, valor) {
    const sel = $(id);
    // Lo que se le agregó a la ficha anterior se va: si no, la lista se
    // llena con los valores raros de todos los que se hayan abierto.
    sel.querySelectorAll('option[data-extra]').forEach(function (o) { o.remove(); });
    if (!valor) return;
    const hay = Array.prototype.some.call(sel.options, function (o) { return o.value === valor; });
    if (hay) return;
    const op = document.createElement('option');
    op.value = valor;
    op.textContent = valor;
    op.dataset.extra = '1';
    sel.insertBefore(op, sel.options[1] || null);
  }

  // El valor que ya trae la persona se agrega a la lista aunque no esté:
  // si el libro dice que su coach es alguien que ya no está, el
  // desplegable no puede borrárselo por su cuenta.
  function llenarLista(id, nombres, vacio, valorActual) {
    const sel = $(id);
    const todos = nombres.slice();
    if (valorActual && !todos.includes(valorActual)) todos.unshift(valorActual);
    sel.innerHTML = '<option value="">' + vacio + '</option>' + todos.map(function (n) {
      return '<option value="' + escapar(n) + '">' + escapar(n) + '</option>';
    }).join('');
  }

  // ── Los contactos ─────────────────────────────────────────────
  // Emergencia y beneficiario no son la misma persona y pueden ser
  // varias, así que es una lista: cada quien se marca como lo que sea, o
  // como las dos cosas.
  let contactos = [];

  function contactosDe(a) {
    if (Array.isArray(a.contactos) && a.contactos.length) {
      return a.contactos.map(function (c) {
        return {
          nombre: c.nombre || '', parentesco: c.parentesco || '',
          telefono: c.telefono || '', correo: c.correo || '',
          emergencia: c.emergencia !== false, beneficiario: !!c.beneficiario,
        };
      });
    }
    // Mientras el libro siga llenando las cuatro columnas de siempre,
    // con ellas se arma el primer contacto.
    if (a.emergencia_nombre || a.emergencia_telefono || a.emergencia_correo || a.emergencia_parentesco) {
      return [{
        nombre: a.emergencia_nombre || '', parentesco: a.emergencia_parentesco || '',
        telefono: a.emergencia_telefono || '', correo: a.emergencia_correo || '',
        emergencia: true, beneficiario: false,
      }];
    }
    return [];
  }

  function pintarContactos() {
    const cont = $('f-contactos');
    if (!contactos.length) {
      cont.innerHTML = '<p class="contacto-vacio">Sin contactos capturados.</p>';
      return;
    }
    cont.innerHTML = contactos.map(function (c, i) {
      return '<div class="contacto" data-c="' + i + '">' +
        '<div class="ficha-grid">' +
          '<div class="field"><label>Nombre</label>' +
            '<input type="text" data-campo="nombre" value="' + escapar(c.nombre) + '" autocomplete="off" /></div>' +
          '<div class="field"><label>Parentesco</label>' +
            '<input type="text" data-campo="parentesco" value="' + escapar(c.parentesco) + '" autocomplete="off" /></div>' +
          '<div class="field"><label>Cel</label>' +
            '<input type="tel" data-campo="telefono" value="' + escapar(c.telefono) + '" autocomplete="off" /></div>' +
          '<div class="field"><label>Correo</label>' +
            '<input type="email" data-campo="correo" value="' + escapar(c.correo) + '" autocomplete="off" /></div>' +
        '</div>' +
        '<div class="contacto-pie">' +
          '<div class="kw-chips">' +
            '<label class="kw-chip' + (c.emergencia ? ' elegido' : '') + '">' +
              '<input type="checkbox" data-marca="emergencia"' + (c.emergencia ? ' checked' : '') + '>' +
              'Marcar como contacto de emergencia</label>' +
            '<label class="kw-chip' + (c.beneficiario ? ' elegido' : '') + '">' +
              '<input type="checkbox" data-marca="beneficiario"' + (c.beneficiario ? ' checked' : '') + '>' +
              'Marcar como beneficiario</label>' +
          '</div>' +
          '<span class="crece"></span>' +
          '<button type="button" class="contacto-quitar" data-quitar="' + i + '">Quitar</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Lo que se escriba se guarda en el momento: repintar la lista al
  // agregar otro contacto no puede borrar lo que ya se llevaba escrito.
  $('f-contactos').addEventListener('input', function (e) {
    const caja = e.target.closest('.contacto');
    if (!caja || !e.target.dataset.campo) return;
    contactos[+caja.dataset.c][e.target.dataset.campo] = e.target.value;
  });
  $('f-contactos').addEventListener('change', function (e) {
    const caja = e.target.closest('.contacto');
    if (!caja || !e.target.dataset.marca) return;
    contactos[+caja.dataset.c][e.target.dataset.marca] = e.target.checked;
  });
  $('f-contactos').addEventListener('click', function (e) {
    const btn = e.target.closest('[data-quitar]');
    if (!btn) return;
    contactos.splice(+btn.dataset.quitar, 1);
    pintarContactos();
  });
  $('f-mas-contacto').addEventListener('click', function () {
    contactos.push({ nombre: '', parentesco: '', telefono: '', correo: '', emergencia: false, beneficiario: false });
    pintarContactos();
    const ultimo = $('f-contactos').querySelector('.contacto:last-child input');
    if (ultimo) ultimo.focus();
  });

  // ── La ficha ──────────────────────────────────────────────────
  // Los campos que son un texto y ya. Las fechas, el cumpleaños y los
  // contactos se leen y se guardan aparte, arriba.
  const CAMPOS = [
    ['f-nombre', 'nombre'],
    ['f-correo-personal', 'correo_personal'],
    ['f-telefono', 'telefono'],
    ['f-curp', 'curp'],
    ['f-grupo', 'grupo'],
    ['f-tipo-asociado', 'tipo_asociado'],
    ['f-sponsor', 'sponsor'],
    ['f-correo', 'correo'],
    ['f-usuario-command', 'usuario_command'],
    ['f-contrasena', 'contrasena'],
    ['f-kwid', 'kwid'],
    ['f-clasificacion', 'clasificacion'],
    ['f-coach', 'coach_asignado'],
    ['f-celula', 'celula'],
    ['f-notas', 'notas'],
  ];

  function abrirFicha(id) {
    editando = id ? asesores.find(function (a) { return a.id === id; }) : null;
    const a = editando || {};

    // Las dos listas de gente pueden traer un nombre que ya no está en
    // ellas (el coach de alguien que se fue): se le agrega el suyo.
    llenarLista('f-coach', listaCoaches, 'Sin coach', a.coach_asignado || '');
    llenarLista('f-celula', listaCelulas, 'Sin célula', a.celula || '');
    asegurarOpcion('f-tipo-asociado', a.tipo_asociado || '');
    asegurarOpcion('f-clasificacion', a.clasificacion || '');
    asegurarOpcion('f-grupo', editando ? estatusDe(a) : '');

    CAMPOS.forEach(function (par) {
      $(par[0]).value = par[1] === 'grupo' ? estatusDe(a) : (a[par[1]] || '');
    });
    ponerCumple(a.cumpleanos);
    ponerFecha('f-ingreso', 'f-ingreso-nota', a.fecha_ingreso);
    ponerFecha('f-aniversario', 'f-aniversario-nota', a.aniversario);
    ponerFecha('f-baja', 'f-baja-nota', a.fecha_baja);
    contactos = contactosDe(a);
    pintarContactos();

    // Los desplegables del sitio se dibujan aparte del <select>; hay que
    // avisarles que su valor cambió.
    ['f-grupo', 'f-tipo-asociado', 'f-clasificacion', 'f-coach', 'f-celula'].forEach(function (id2) {
      $(id2).dispatchEvent(new Event('change', { bubbles: true }));
    });
    if (window.kwUI) window.kwUI.selects($('vista-ficha'));
    $('f-contrasena').type = 'password';

    $('ficha-titulo').textContent = editando ? (a.nombre || 'Ficha del asesor') : 'Nuevo asesor';
    $('ficha-borrar').style.display = editando ? '' : 'none';
    aviso('', '');

    $('vista-lista').style.display = 'none';
    $('vista-ficha').style.display = '';
    window.scrollTo(0, 0);
    $('f-nombre').focus();
    limpiarAutollenado(a);
  }

  // El navegador ve un campo de texto seguido de uno de contraseña y le
  // mete el correo y la contraseña de quien está capturando. autocomplete
  // ayuda pero no siempre gana, así que al ratito se revisa que sigan
  // teniendo lo que se les puso y no lo que el navegador quiso.
  function limpiarAutollenado(a) {
    const quedar = { 'f-usuario-command': a.usuario_command || '', 'f-contrasena': a.contrasena || '' };
    const revisar = function () {
      Object.keys(quedar).forEach(function (id) {
        const campo = $(id);
        if (document.activeElement !== campo && campo.value !== quedar[id]) campo.value = quedar[id];
      });
    };
    setTimeout(revisar, 60);
    setTimeout(revisar, 400);
  }

  function cerrarFicha() {
    editando = null;
    contactos = [];
    $('vista-ficha').style.display = 'none';
    $('vista-lista').style.display = '';
    window.scrollTo(0, 0);
  }

  function aviso(texto, clase) {
    const el = $('ficha-msg');
    el.textContent = texto;
    el.className = 'msg' + (clase ? ' ' + clase : '');
  }

  async function guardarFicha() {
    const a = editando || {};
    const fila = {};
    CAMPOS.forEach(function (par) {
      const v = String($(par[0]).value || '').trim();
      fila[par[1]] = v || null;
    });

    // Lo único que de verdad hace falta es el nombre: el correo de KW se
    // asigna después, y hasta entonces la persona ya existe.
    if (!fila.nombre) {
      aviso('Falta el nombre.', 'error');
      $('f-nombre').focus();
      return;
    }
    if (fila.correo) fila.correo = fila.correo.toLowerCase();
    if (fila.curp) fila.curp = fila.curp.toUpperCase();
    fila.grupo = fila.grupo || 'asesor_activo';

    fila.cumpleanos = sacarCumple(a.cumpleanos);
    fila.fecha_ingreso = sacarFecha('f-ingreso', 'f-ingreso-nota', a.fecha_ingreso);
    fila.aniversario = sacarFecha('f-aniversario', 'f-aniversario-nota', a.aniversario);
    fila.fecha_baja = sacarFecha('f-baja', 'f-baja-nota', a.fecha_baja);

    // Un contacto sin nombre ni forma de localizarlo es un renglón que
    // alguien abrió y no llenó.
    fila.contactos = contactos.filter(function (c) {
      return c.nombre || c.telefono || c.correo;
    });

    const btn = $('ficha-guardar');
    btn.disabled = true;
    aviso('Guardando...', '');
    let error;
    if (editando) {
      ({ error } = await window.kwSupabase.from('asesores').update(fila).eq('id', editando.id));
    } else {
      fila.origen = 'sitio';
      ({ error } = await window.kwSupabase.from('asesores').insert(fila));
    }
    btn.disabled = false;
    if (error) {
      aviso(String(error.message).includes('asesores_correo_unico')
        ? 'Ese correo ya está en la base, es de alguien más.'
        : 'No se pudo guardar: ' + error.message, 'error');
      return;
    }
    if (await leer()) pintar();
    cerrarFicha();
  }

  async function borrarFicha() {
    if (!editando) return;
    const { error } = await window.kwSupabase.from('asesores').delete().eq('id', editando.id);
    if (error) { aviso('No se pudo quitar: ' + error.message, 'error'); return; }
    if (await leer()) pintar();
    cerrarFicha();
  }

  $('bd-buscar').addEventListener('input', pintar);
  $('ficha-volver').addEventListener('click', cerrarFicha);
  $('ficha-guardar').addEventListener('click', guardarFicha);
  $('ficha-borrar').addEventListener('click', borrarFicha);
  $('f-ver-clave').addEventListener('click', function () {
    const campo = $('f-contrasena');
    campo.type = campo.type === 'password' ? 'text' : 'password';
  });

  // ── Inicio ────────────────────────────────────────────────────
  async function init() {
    try {
      const { data: userData } = await window.kwSupabase.auth.getUser();
      if (!userData || !userData.user) throw new Error('sin sesión');

      const { data: perfil, error } = await window.kwSupabase
        .from('profiles').select('role').eq('id', userData.user.id).single();
      if (error || !perfil) throw new Error('sin perfil');

      const puede = ROLES.includes(perfil.role)
        || CORREOS.includes(String(userData.user.email || '').toLowerCase());
      if (!puede) { $('denegado').style.display = ''; return; }

      $('contenido').style.display = '';
      armarCumple();
      if (window.kwUI) window.kwUI.selects($('vista-ficha'));
      await cargarListas();
      if (await leer()) pintar();

      // Se puede llegar directo a capturar a alguien (el botón del
      // Panel) o a la ficha de una persona.
      const params = new URLSearchParams(location.search);
      if (params.get('nuevo')) abrirFicha(null);
      else if (params.get('id')) abrirFicha(params.get('id'));
    } catch (err) {
      $('denegado').style.display = '';
    }
  }

  if (document.documentElement.classList.contains('kw-auth-ok')) init();
  else window.addEventListener('kw-auth-ready', init, { once: true });
</script>
