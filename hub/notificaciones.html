<script>
  let notificaciones = [];

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function fmtRelativo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return 'ahora';
    if (min < 60) return `hace ${min} min`;
    const h = Math.floor(min / 60);
    if (h < 24) return `hace ${h} h`;
    const d = Math.floor(h / 24);
    if (d < 7) return `hace ${d} d`;
    try { return new Date(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }); }
    catch (e) { return ''; }
  }

  function render() {
    const cont = document.getElementById('notif-lista');
    const btnTodas = document.getElementById('btn-marcar-todas');
    btnTodas.style.display = notificaciones.some(n => !n.leido) ? '' : 'none';

    cont.innerHTML = notificaciones.length === 0
      ? '<div class="notif-vacio">No tienes notificaciones.</div>'
      : notificaciones.map(n => `
        <button type="button" class="notif-item${n.leido ? '' : ' notif-item-nuevo'}" data-id="${n.id}" data-url="${escapeHtml(n.url || '')}">
          <span class="notif-item-titulo">${escapeHtml(n.titulo)}</span>
          ${n.mensaje ? `<span class="notif-item-msg">${escapeHtml(n.mensaje)}</span>` : ''}
          <span class="notif-item-fecha">${fmtRelativo(n.created_at)}</span>
        </button>`).join('');

    Array.from(cont.querySelectorAll('.notif-item')).forEach(function (btn) {
      btn.addEventListener('click', function () {
        const url = btn.dataset.url;
        if (url) location.href = url;
      });
    });
  }

  function marcarTodasLeidas() {
    const idsNoLeidas = notificaciones.filter(n => !n.leido).map(n => n.id);
    if (!idsNoLeidas.length) return;
    notificaciones.forEach(n => { n.leido = true; });
    render();
    window.kwSupabase.from('notificaciones').update({ leido: true }).in('id', idsNoLeidas).then(function () {});
  }

  async function cargarNotificaciones() {
    const { data: userData } = await window.kwSupabase.auth.getUser();
    const uid = userData && userData.user && userData.user.id;
    if (!uid) return;

    const { data, error } = await window.kwSupabase
      .from('notificaciones')
      .select('id, tipo, titulo, mensaje, url, leido, created_at')
      .eq('user_id', uid)
      .order('created_at', { ascending: false })
      .limit(60);

    if (error) {
      document.getElementById('notif-lista').innerHTML =
        `<div class="notif-vacio">${escapeHtml(error.message || 'Ocurrió un error al cargar tus notificaciones.')}</div>`;
      return;
    }

    notificaciones = data || [];
    render();
    // Entrar aquí ya cuenta como haberlas visto - igual que abrir la
    // campanita en escritorio (ver notif-bell.js).
    marcarTodasLeidas();
  }

  document.getElementById('btn-marcar-todas').addEventListener('click', marcarTodasLeidas);

  if (document.documentElement.classList.contains('kw-auth-ok')) {
    cargarNotificaciones();
  } else {
    window.addEventListener('kw-auth-ready', cargarNotificaciones, { once: true });
  }
</script>
