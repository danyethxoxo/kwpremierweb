<!DOCTYPE html>
<html lang="es">
<head>

  <title>Perfil comprador · KW Premier</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png?v=20260926b" />
  <style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
  <script>setTimeout(function () { if (!document.documentElement.classList.contains('kw-auth-ok')) location.replace('/login.html'); }, 4000);</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; color: var(--text); }
    .page { width: 100%; max-width: none; margin: auto; padding: 94px 24px 100px; }
    body.comprador-pagina > main.page { width: 100% !important; max-width: none !important; padding-right: 18px !important; }
    .encabezado h1 { margin: 0; line-height: 1.2; letter-spacing: -.03em; }
    .encabezado .encabezado-acciones { display: flex; align-items: center; gap: 12px; }
    #abrir-cliente { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 9px 16px; border-radius: 999px; border: 0; font-size: 13px; font-weight: 700; }
    .comprador-pagina .panel { width: 100%; margin-top: 0; }
    [hidden] { display: none !important; }
    .encabezado { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 22px; }
    .pie-form { position: fixed; bottom: 0; left: 292px; right: 0; z-index: 180; padding: 7px 18px max(7px, env(safe-area-inset-bottom)); background: rgba(255,255,255,.96); border-top: 1px solid var(--border); box-shadow: 0 -10px 28px rgba(35,27,27,.10); backdrop-filter: blur(12px); display: flex; justify-content: flex-end; gap: 12px; }
    .pie-form button { min-height: 34px; padding: 7px 14px; border-radius: 9px; font-size: 12px; }
    .cantidad { display: flex; align-items: center; border: 1px solid #d9d5d5; border-radius: 10px; overflow: hidden; }
    .cantidad input { border: 0 !important; text-align: center; appearance: textfield; min-width: 0; }
    .cantidad input::-webkit-inner-spin-button { appearance: none; }
    .cantidad button { border: 0; border-radius: 0; width: 44px; padding: 0; flex-shrink: 0; font-size: 22px; }
    .etiquetas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 44px; padding: 5px 10px; border: 1px solid #d9d5d5; border-radius: 10px; }
    .etiquetas:focus-within { border-color: #800020; }
    #comprador-form .etiquetas input { flex: 1; width: 160px; min-width: 140px; min-height: 30px; padding: 0; border: 0 !important; background: transparent; }
    .etiqueta { display: inline-flex; align-items: center; gap: 6px; background: #f6eeee; color: #800020; border-radius: 7px; padding: 3px 8px; font-size: 12px; }
    .etiqueta button { min-height: 22px; padding: 0 3px; border: 0; background: transparent; color: inherit; }
    .campo .kw-select { width: 100%; }
    .campo .kw-select-btn { width: 100%; min-height: 44px; }
    #comprador-form .campo, #comprador-form input, #comprador-form select, #comprador-form textarea, #comprador-form .kw-select-btn, #comprador-form .kw-select-opcion, #comprador-form .opciones label { font-weight: 400 !important; }
    #comprador-form input:focus, #comprador-form textarea:focus, #comprador-form .kw-select-btn:focus-visible, #comprador-form .kw-select.abierto .kw-select-btn { outline: none !important; box-shadow: none !important; border-color: #800020 !important; }
    #comprador-form .cantidad:focus-within, #comprador-form .kw-numero:focus-within { border-color: #800020; box-shadow: none !important; outline: none !important; }
    #comprador-form .catalogo-select:focus-within .kw-select-btn { border-color: #800020; }
    #comprador-form .catalogo-select .kw-select-valor { visibility: hidden; }
    #comprador-form .catalogo-buscar { position: absolute; top: 0; left: 15px; width: calc(100% - 86px); height: 100%; min-height: 0; padding: 0; border: 0 !important; border-radius: 0; background: transparent; box-shadow: none !important; outline: none !important; }
    #comprador-form .catalogo-buscar::placeholder { color: var(--text); opacity: 1; }
    #comprador-form .catalogo-limpiar { position: absolute; right: 36px; top: 50%; transform: translateY(-50%); width: 30px; min-height: 30px; padding: 0; border: 0; background: transparent; color: #800020; }
    #comprador-acciones > #notif-bell-slot { width: 40px; flex-basis: 40px; }
    #comprador-acciones > #notif-bell-slot .notif-bell-btn { width: 40px; min-width: 40px; height: 40px; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
    #comprador-acciones > #notif-bell-slot .notif-bell-btn:hover { color: var(--red); }
    .campos.tres { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .campos.cuatro { grid-template-columns: repeat(4,minmax(0,1fr)); }
    .campos.operacion-renta { grid-template-columns: repeat(3,minmax(0,1fr)); }
    @media(max-width:900px) { .campos.tres,.campos.cuatro,.campos.operacion-renta { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media(max-width:640px) { .campos.tres,.campos.cuatro,.campos.operacion-renta { grid-template-columns: 1fr; } }
    @media(max-width:1023px) { .pie-form { left: 0; } }
    h1 { font-size: 26px; margin: 0 0 8px; }
    .intro, .nota { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .panel { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 24px; margin: 20px 0; }
    fieldset { border: 0; padding: 0; margin: 0 0 24px; min-width: 0; }
    legend { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
    .campos { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .campo { display: flex; flex-direction: column; gap: 7px; font-size: 13px; font-weight: 600; }
    .ancho { grid-column: 1 / -1; }
    input:not([type=checkbox]), select, textarea { width: 100%; min-height: 44px; border: 1px solid #d9d5d5; border-radius: 10px; background: #fff; padding: 10px 12px; font: inherit; color: var(--text); }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid #800020; outline-offset: 3px; }
    textarea { resize: vertical; }
    .opciones { display: flex; flex-wrap: wrap; gap: 10px; }
    .opciones label { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); padding: 10px 12px; border-radius: 12px; font-size: 13px; cursor: pointer; }
    input[type=checkbox] { accent-color: #800020; width: 17px; height: 17px; }
    .acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 10px; min-height: 42px; padding: 10px 16px; }
    .principal { background: #800020; color: #fff; border-color: #800020; font-weight: 600; }
    button:disabled { opacity: .6; cursor: wait; }
    #mensaje { margin: 12px 0 0; font-size: 13px; min-height: 20px; }
    #mensaje.error { color: #a00024; }
    .cliente { border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin: 12px 0; }
    .cliente h3 { margin: 0 0 6px; font-size: 16px; overflow-wrap: anywhere; }
    .cliente p { margin: 6px 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .cliente .acciones { margin-top: 12px; }
    .estado { font-size: 11px; background: #f6eeee; color: #800020; border-radius: 20px; padding: 4px 9px; display: inline-block; margin-bottom: 8px; }
    #vista-clientes { border: 0; padding: 0; border-radius: 0; background: transparent; }
    .clientes-tabla { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--border); border-radius: 14px; background: #fff; overflow: hidden; }
    .clientes-tabla td { padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .clientes-tabla tr:last-child td { border-bottom: 0; }
    .clientes-tabla .cliente { display: flex; align-items: center; gap: 16px; border: 0; border-radius: 0; padding: 0; margin: 0; }
    .cliente-info { flex: 1; min-width: 0; }
    .clientes-tabla .cliente-info { display: grid; grid-template-columns: minmax(130px,1fr) minmax(180px,1.2fr) minmax(240px,1.6fr) minmax(160px,1fr); align-items: center; gap: 14px; }
    .cliente-identidad { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .clientes-tabla .cliente-identidad .estado { margin: 0; }
    .clientes-tabla td { padding: 10px 14px; }
    @media(max-width:1200px) { .clientes-tabla .cliente-info { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px 14px; } }
    @media(max-width:640px) { .clientes-tabla .cliente-info { grid-template-columns: 1fr; } }
    .clientes-tabla .cliente h3 { font-size: 13px; margin: 0 0 4px; }
    .clientes-tabla .cliente p { font-size: 12px; margin: 3px 0; }
    .clientes-tabla .estado { font-size: 10px; margin: 0 0 5px; }
    .clientes-tabla .acciones { margin: 0; flex-wrap: nowrap; }
    .clientes-tabla button { min-height: 32px; font-size: 12px; padding: 6px 11px; }
    .btn-coincidencias { background: #f6eeee; border: 0; color: #800020; border-radius: 999px; white-space: nowrap; }
    .cliente-menu { position: relative; }
    .cliente-menu summary { cursor: pointer; list-style: none; padding: 6px 12px; font-size: 19px; }
    .cliente-menu summary::-webkit-details-marker { display: none; }
    .cliente-menu[open] > div { position: absolute; right: 0; top: 100%; min-width: 130px; background: #fff; box-shadow: 0 8px 24px #0002; border: 1px solid var(--border); border-radius: 10px; padding: 5px; z-index: 15; }
    .cliente-menu button { width: 100%; text-align: left; border: 0; }
    .matches-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap: 16px; }
    .match-prop { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: #fff; max-width: 340px; }
    .match-foto { position: relative; height: 220px; background: #f5f5f5; }
    .match-foto img { width: 100%; height: 100%; object-fit: cover; }
    .match-foto > a { display: block; height: 100%; }
    .match-badge { position: absolute; left: 12px; top: 12px; background: #fff; border-radius: 999px; padding: 5px 10px; color: #800020; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .match-body { padding: 16px; font-size: 12px; }
    .match-body a { color: inherit; text-decoration: none; }
    .match-precio { font-size: 19px; font-weight: 700; }
    .match-titulo { font-size: 14px; font-weight: 700; line-height: 1.4; margin: 6px 0 12px; }
    .match-ubic { color: var(--muted); margin-bottom: 18px; }
    .match-datos { padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); color: var(--muted); }
    .match-pie { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; padding-top: 10px; }
    .match-desglose { margin-top: 14px; font-size: 11px; }
    .match-desglose p { margin: 6px 0; }
    @media(max-width:640px) { .clientes-tabla .cliente { flex-wrap: wrap; gap: 8px; } .cliente-info { flex-basis: 100%; } }
    @media(max-width:640px) { .page { padding: 84px 14px 40px; } .panel { padding: 18px; } .campos { grid-template-columns: 1fr; } h1 { font-size: 23px; } }
  </style>
</head>
<body class="comprador-pagina">
  <header class="kw-header"><span class="kw-header-title">Perfil comprador</span><a href="/portal.html" class="back-btn">← Inicio</a></header>
  <main class="page">
    <div class="encabezado"><h1>Perfil comprador</h1><div class="encabezado-acciones" id="comprador-acciones"><button type="button" id="abrir-cliente" class="principal">+ Nuevo cliente</button></div></div>
    <section class="panel" id="vista-clientes" aria-label="Mis clientes"><div id="clientes" aria-live="polite">Cargando perfiles…</div><button id="mas" type="button" hidden>Cargar más</button></section>
    <section class="panel" id="vista-formulario" hidden aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario" hidden>Nuevo perfil</h2>
      <form id="comprador-form">
        <fieldset><legend>Datos del cliente</legend><div class="campos tres">
          <label class="campo">Nombre *<input name="nombre" required minlength="2" maxlength="120" autocomplete="off" /></label>
          <label class="campo">Teléfono<input name="telefono" type="tel" maxlength="40" autocomplete="off" /></label>
          <label class="campo">Correo<input name="correo" type="email" maxlength="160" autocomplete="off" /></label>
        </div></fieldset>
        <fieldset><legend>¿Qué está buscando?</legend><div class="campos cuatro" id="fila-presupuesto">
          <label class="campo">Operación *<select name="operacion" required><option value="venta">Comprar</option><option value="renta">Rentar</option></select></label>
          <label class="campo">Moneda *<select name="moneda"><option value="MXN">Pesos mexicanos (MXN)</option><option value="USD">Dólares (USD)</option></select></label>
          <label class="campo" id="campo-precio-min">Presupuesto mínimo<input name="precio_min" type="text" inputmode="decimal" maxlength="20" autocomplete="off" /></label>
          <label class="campo"><span id="precio-max-titulo">Presupuesto máximo *</span><input name="precio_max" type="text" inputmode="decimal" maxlength="20" autocomplete="off" required /></label>
          <div class="campo ancho"><span>Tipo de inmueble * · puedes elegir varios</span><div class="opciones" id="tipos"></div></div>
        </div></fieldset>
        <fieldset><legend>Ubicación deseada</legend><div class="campos tres">
          <label class="campo">Ciudad / estado *<select name="estado" required><option value="">Seleccionar ciudad</option></select></label>
          <label class="campo">Alcaldía / municipio<select name="municipio"><option value="">Todas</option></select></label>
          <label class="campo">Colonia<select name="colonias"><option value="">Todas</option></select></label>
        </div></fieldset>
        <fieldset><legend>Características</legend><div class="campos cuatro">
          <label class="campo">Recámaras<input name="recamaras_min" type="number" min="0" max="100" step="1" /></label>
          <label class="campo">Baños<input name="banos_min" type="number" min="0" max="100" step="0.5" /></label>
          <label class="campo">Estacionamientos<input name="estacionamientos_min" type="number" min="0" max="100" step="1" /></label>
          <label class="campo">Superficie mínima (m²)<input name="superficie_min" type="number" min="0" max="10000000" step="0.01" /></label>
          <div class="campo ancho"><label for="agregar-etiqueta">Características específicas</label><div class="etiquetas" id="etiquetas"><input id="agregar-etiqueta" type="text" maxlength="100" placeholder="Escribe una etiqueta y presiona Enter" autocomplete="off" /></div><input type="hidden" name="notas" /></div>
        </div></fieldset>
        <fieldset><legend>Preferencias para los futuros avisos</legend><div class="campos">
          <label class="campo">Compatibilidad mínima (%)<input name="umbral_match" type="number" min="1" max="100" step="1" value="70" required /></label>
        </div></fieldset>
        <div class="pie-form"><button type="button" id="cerrar-form">Cancelar</button><button type="button" id="nuevo">Limpiar</button><button type="submit" id="guardar" class="principal">Guardar perfil</button></div>
        <p id="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/assets/js/kw-ui.js?v=20260922"></script>
  <script src="/assets/js/kw-sitio-asesor.js"></script>
  <script src="/assets/js/comprador-matches.js?v=20260930b"></script>
  <script src="/assets/js/perfil-comprador.js?v=20260930j"></script>
  <script src="/assets/js/drawer.js?v=20260922c" data-menu="hub"></script>
</body>
</html>
