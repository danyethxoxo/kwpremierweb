<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Documentos de Drive</title>
<link rel="icon" type="image/png" href="/kwpremierweb/assets/img/favicon.png" />
<style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
<script>
  setTimeout(function () {
    if (!document.documentElement.classList.contains('kw-auth-ok')) {
      console.error('auth-guard.js no respondió a tiempo; redirigiendo al login por seguridad.');
      location.replace('/kwpremierweb/login.html');
    }
  }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kwpremierweb/assets/js/auth-guard.js"></script>
<script src="/kwpremierweb/assets/js/notif-bell.js?v=20260829p"></script>
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-base.css?v=20260829x">
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-claro.css?v=20260829q">
<style>
  html, body { min-height: 100%; color: var(--text); }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  /* Más angosta que el ancho de página general: es una lista de un solo
     renglón por cosa, y a 1180px los nombres quedaban perdidos en medio
     de un campo de blanco. */
  .kw-page { max-width: 1000px; }

  /* ── Buscador ──
     La clase .buscador y el id #busq son el trato con drawer.js: por
     ellos reconoce el buscador de esta pantalla, esconde esta franja y
     le pasa lo que se escriba en la lupa del header. */
  .buscador { position: relative; margin-bottom: var(--sp-3); }
  .buscador svg.lupa {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; color: var(--muted); pointer-events: none;
  }
  .buscador input {
    width: 100%; height: 46px; padding: 0 42px 0 40px;
    border: 1.5px solid var(--border); border-radius: var(--r-campo); background: #fff;
    font-family: inherit; font-size: 14.5px; color: var(--text); outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .buscador input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(138,0,0,0.08); }
  .limpiar-busq {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border: none; background: none; cursor: pointer;
    color: var(--muted); border-radius: 7px; display: none;
    align-items: center; justify-content: center;
  }
  .limpiar-busq:hover { background: #f0f0ef; color: var(--text); }
  .limpiar-busq svg { width: 14px; height: 14px; }
  .limpiar-busq.se-ve { display: flex; }

  /* ── Ruta de carpetas ──
     Un solo renglón: las migas de dónde estás parado a la izquierda y,
     hasta la orilla derecha (donde termina la tarjeta de un archivo),
     las dos flechas para regresar y volver a entrar. */
  .ruta {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; margin-bottom: var(--sp-3); min-height: 30px;
  }
  .ruta-migas {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 3px; flex-wrap: wrap;
  }
  .ruta button {
    border: none; background: none; cursor: pointer; font-family: inherit;
    font-size: 13px; color: var(--muted); padding: 4px 7px; border-radius: 7px;
    font-weight: 600;
  }
  .ruta button:hover { background: rgba(0,0,0,0.05); color: var(--text); }
  .ruta .actual { color: var(--text); font-weight: 700; padding: 4px 7px; }
  .ruta .sep { color: var(--muted); font-size: 12px; }

  /* Las dos flechas van juntas, del tamaño de un botón chico, para que
     se lean como un par y no como dos adornos sueltos. */
  .ruta-flechas { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .ruta-flechas button {
    width: 30px; height: 30px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 9px; background: #fff;
    color: var(--muted); box-shadow: 0 1px 2px rgba(40,12,12,0.05);
    transition: color 0.15s, border-color 0.15s, background 0.15s, opacity 0.15s;
  }
  .ruta-flechas button:hover:not([disabled]) {
    color: var(--red); border-color: color-mix(in srgb, var(--red) 32%, transparent);
    background: #fff;
  }
  /* Sin lugar a dónde ir se quedan a la vista pero apagadas: si
     desaparecieran, el renglón entero brincaría de ancho cada vez que
     se entra o se sale de una carpeta. */
  .ruta-flechas button[disabled] { opacity: 0.38; cursor: default; }
  .ruta-flechas svg { width: 15px; height: 15px; }
  /* Mientras carga el árbol todavía no hay ruta que pintar; sin esto se
     reservaban 42px en blanco arriba del loader. */
  .ruta:empty { min-height: 0; margin-bottom: 0; }

  /* Los renglones, el cuadro de ícono y el estado vacío salen del
     sistema (.kw-fila, .kw-fila-icono, .kw-vacio), y de ahí sale
     también el color que toman al pasarles el mouse. Aquí vivían
     copiados, con el vidrio de cuando el fondo era oscuro y con casi
     todos los tipos de archivo en rojo. */

  .aviso {
    font-size: 12.5px; color: var(--pastel-crema-txt); background: var(--pastel-crema);
    border-radius: var(--r-campo);
    padding: 10px 14px; margin-bottom: var(--sp-3); line-height: 1.5;
  }

  .pie {
    margin-top: var(--sp-4); font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .pie a { color: var(--muted); font-weight: 600; }
  .pie a:hover { color: var(--red); }
</style>
</head>
<body>

  <header class="kw-header">
    <span class="kw-header-title">Drive</span>
    <a href="../portal.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      <span>Atrás</span>
    </a>
  </header>

  <main class="kw-page">
    <div class="kw-page-encabezado">
      <div class="kw-page-titulo">Documentos de Drive</div>
    </div>

    <div class="buscador">
      <svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="busq" placeholder="Buscar un archivo o carpeta…" autocomplete="off" />
      <button type="button" class="limpiar-busq" id="btn-limpiar" title="Limpiar" aria-label="Limpiar búsqueda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="ruta" id="ruta"></div>
    <div id="aviso-tope"></div>
    <div id="contenido"></div>
    <div class="pie" id="pie"></div>
  </main>

<script src="/kwpremierweb/assets/js/kw-ui.js?v=20260829v"></script>
<script>
  // Misma función que el Proceso de Alta: ahí ya vive el token de Google
  // con permiso de Drive. Si algún día cambia el slug de la función, se
  // ajusta aquí y en hub/admin.html (la pestaña de Asesores).
  var DRIVE_URL = 'https://iloetojomzqtadkithtv.supabase.co/functions/v1/hyper-processor';

  var elementos = [];      // el árbol plano que devuelve la función
  var raiz = null;
  var carpetaActual = null;
  var porId = {};
  // En qué paso de la navegación de esta pantalla estamos y hasta dónde
  // llega la rama hacia adelante. Es lo que decide si las flechas de la
  // ruta están vivas: el navegador no dice cuántas páginas trae
  // guardadas, así que se lleva la cuenta aquí. La raíz es el paso 0, y
  // por eso "regresar" nunca alcanza a sacar de la página.
  var pasoActual = 0;
  var pasoTope = 0;

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fecha(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
    } catch (e) { return ''; }
  }

  // El tipo se saca del mime de Google. Los de Google Workspace traen su
  // propio mime ("...google-apps.document"), los subidos traen el normal
  // ("application/pdf"), por eso se revisan las dos formas.
  function tipoDe(mime) {
    var m = String(mime || '');
    if (m.indexOf('folder') >= 0) return { c: 'carpeta', n: 'Carpeta' };
    if (m.indexOf('spreadsheet') >= 0 || m.indexOf('excel') >= 0 || m.indexOf('csv') >= 0) return { c: 'hoja', n: 'Hoja de cálculo' };
    if (m.indexOf('presentation') >= 0 || m.indexOf('powerpoint') >= 0) return { c: 'pres', n: 'Presentación' };
    if (m.indexOf('pdf') >= 0) return { c: 'pdf', n: 'PDF' };
    if (m.indexOf('image') >= 0) return { c: 'img', n: 'Imagen' };
    if (m.indexOf('document') >= 0 || m.indexOf('word') >= 0 || m.indexOf('text') >= 0) return { c: 'doc', n: 'Documento' };
    return { c: 'otro', n: 'Archivo' };
  }

  function svgDe(clase) {
    if (clase === 'carpeta') {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
    }
    if (clase === 'img') {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
    }
    if (clase === 'hoja') {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  }

  // Ruta legible de un elemento ("Manuales › Ventas"), para que en los
  // resultados de búsqueda se sepa de dónde salió cada archivo.
  function rutaDe(id) {
    var partes = [], guarda = 0;
    var p = porId[id] ? porId[id].padre : null;
    while (p && p !== raiz && guarda++ < 20) {
      var c = porId[p];
      if (!c) break;
      partes.unshift(c.nombre);
      p = c.padre;
    }
    return partes.join(' › ');
  }

  function filaHTML(el, conRuta) {
    var t = tipoDe(el.mime);
    var meta = el.tipo === 'carpeta'
      ? (conRuta && rutaDe(el.id) ? rutaDe(el.id) : contarDentro(el.id))
      : [t.n, fecha(el.modificado), conRuta ? rutaDe(el.id) : ''].filter(Boolean).join(' · ');

    var flecha = el.tipo === 'carpeta'
      ? '<polyline points="9 18 15 12 9 6"/>'
      : '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>';

    var attrs = el.tipo === 'carpeta'
      ? 'href="#" data-carpeta="' + esc(el.id) + '"'
      : 'href="' + esc(el.link) + '" target="_blank" rel="noopener"';

    return '<div class="kw-fila kw-aparece">' +
      '<a class="kw-fila-cabeza" ' + attrs + '>' +
        '<div class="kw-fila-icono tipo-' + t.c + '">' + svgDe(t.c) + '</div>' +
        '<div class="kw-fila-texto">' +
          '<span class="kw-fila-titulo">' + esc(el.nombre) + '</span>' +
          (meta ? '<span class="kw-fila-sub">' + esc(meta) + '</span>' : '') +
        '</div>' +
        '<svg class="kw-fila-flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">' + flecha + '</svg>' +
      '</a>' +
    '</div>';
  }

  function contarDentro(id) {
    var n = elementos.filter(function (e) { return e.padre === id; }).length;
    if (!n) return 'Vacía';
    return n === 1 ? '1 elemento' : n + ' elementos';
  }

  function pintarRuta() {
    var cont = document.getElementById('ruta');
    if (!raiz) { cont.innerHTML = ''; return; }

    // Buscando no hay carpeta en la que se esté parado (los resultados
    // salen de todo el árbol), así que las migas se van y quedan solo
    // las flechas.
    var migas = '';
    if (!document.getElementById('busq').value.trim()) {
      var cadena = [], p = carpetaActual, guarda = 0;
      while (p && p !== raiz && guarda++ < 20) {
        var c = porId[p];
        if (!c) break;
        cadena.unshift(c);
        p = c.padre;
      }

      if (cadena.length) {
        migas = '<button type="button" data-ir="' + esc(raiz) + '">Documentos</button>';
        cadena.forEach(function (c, i) {
          migas += '<span class="sep">›</span>';
          migas += (i === cadena.length - 1)
            ? '<span class="actual">' + esc(c.nombre) + '</span>'
            : '<button type="button" data-ir="' + esc(c.id) + '">' + esc(c.nombre) + '</button>';
        });
      }
    }

    cont.innerHTML =
      '<div class="ruta-migas">' + migas + '</div>' +
      '<div class="ruta-flechas">' +
        '<button type="button" data-nav="atras" title="Regresar" aria-label="Regresar"' +
          (pasoActual > 0 ? '' : ' disabled') + '>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' +
        '</button>' +
        '<button type="button" data-nav="adelante" title="Ir adelante" aria-label="Ir adelante"' +
          (pasoActual < pasoTope ? '' : ' disabled') + '>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
        '</button>' +
      '</div>';

    cont.querySelectorAll('[data-ir]').forEach(function (b) {
      b.addEventListener('click', function () { abrirCarpeta(b.dataset.ir); });
    });
    // Las flechas mueven el historial del navegador, no la carpeta: así
    // hacen exactamente lo mismo que el "atrás" del navegador y las dos
    // formas de moverse no se pelean. Quien repinta es popstate.
    cont.querySelectorAll('[data-nav]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (b.disabled) return;
        if (b.dataset.nav === 'atras') history.back();
        else history.forward();
      });
    });
  }

  function pintar() {
    var cont = document.getElementById('contenido');
    var termino = document.getElementById('busq').value.trim().toLowerCase();
    document.getElementById('btn-limpiar').classList.toggle('se-ve', !!termino);
    pintarRuta();

    var lista, buscando = !!termino;
    if (buscando) {
      // Se busca en todo el árbol, no solo en la carpeta abierta: la
      // gracia es encontrar el archivo sin saber dónde quedó guardado.
      lista = elementos.filter(function (e) {
        return e.nombre.toLowerCase().indexOf(termino) >= 0;
      });
    } else {
      lista = elementos.filter(function (e) { return e.padre === carpetaActual; });
    }

    if (!lista.length) {
      cont.innerHTML = buscando
        ? '<div class="kw-vacio"><strong>Sin resultados</strong>No hay nada que se llame "' + esc(termino) + '".</div>'
        : '<div class="kw-vacio"><strong>Esta carpeta está vacía</strong>Todavía no hay archivos aquí.</div>';
      return;
    }

    // Las carpetas van primero y luego los archivos, pero sin los
    // rótulos de "Carpetas" y "Archivos" encima: el cuadro de color y
    // la flecha de cada renglón ya dicen cuál es cuál, y los dos
    // letreros nada más partían la lista en dos sin agregar nada.
    var carpetas = lista.filter(function (e) { return e.tipo === 'carpeta'; });
    var archivos = lista.filter(function (e) { return e.tipo === 'archivo'; });
    cont.innerHTML = '<div class="kw-lista">' +
      carpetas.concat(archivos).map(function (e) { return filaHTML(e, buscando); }).join('') +
      '</div>';

    cont.querySelectorAll('[data-carpeta]').forEach(function (a) {
      a.addEventListener('click', function (ev) {
        ev.preventDefault();
        document.getElementById('busq').value = '';
        abrirCarpeta(a.dataset.carpeta);
      });
    });
  }

  // Entrar a una carpeta se marca en el historial del navegador (con
  // pushState, sin cambiar la URL) para que "atrás" regrese un nivel en
  // vez de sacar de la página entera. Sin esto, como navegar entre
  // carpetas no cambiaba de URL, el navegador no tenía nada que "deshacer"
  // ahí adentro y el primer "atrás" te mandaba de una vez al portal.
  function abrirCarpeta(id, marcar) {
    carpetaActual = id;
    document.getElementById('busq').value = '';
    if (marcar !== false) {
      // Entrar a una carpeta nueva corta la rama de adelante: lo que se
      // había navegado y luego deshecho ya no se puede rehacer, igual
      // que en el navegador.
      pasoActual += 1;
      pasoTope = pasoActual;
      history.pushState({ kwCarpeta: id, kwPaso: pasoActual }, '', location.href);
    }
    pintar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.addEventListener('popstate', function (ev) {
    var id = (ev.state && ev.state.kwCarpeta) || raiz;
    if (!id) return; // todavía no ha cargado el árbol
    carpetaActual = id;
    pasoActual = (ev.state && typeof ev.state.kwPaso === 'number') ? ev.state.kwPaso : 0;
    document.getElementById('busq').value = '';
    pintar();
  });

  document.getElementById('busq').addEventListener('input', pintar);
  document.getElementById('btn-limpiar').addEventListener('click', function () {
    document.getElementById('busq').value = '';
    pintar();
    document.getElementById('busq').focus();
  });

  async function cargar() {
    var cont = document.getElementById('contenido');
    cont.innerHTML = '<div class="kw-loader"><div class="circle uno"></div><div class="circle dos"></div><div class="circle tres"></div></div>';
    try {
      var { data: ses } = await window.kwSupabase.auth.getSession();
      if (!ses || !ses.session) throw new Error('Sesión no válida.');

      var res = await fetch(DRIVE_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + ses.session.access_token,
        },
        body: JSON.stringify({ accion: 'drive_arbol' }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || ('No se pudo cargar (' + res.status + ').'));

      elementos = data.elementos || [];
      raiz = data.raiz;
      carpetaActual = raiz;
      porId = {};
      elementos.forEach(function (e) { porId[e.id] = e; });

      // Se reemplaza el estado inicial (no se "empuja") para que la
      // raíz no cuente como un paso navegado: el primer "atrás" desde
      // ahí sí debe salir al portal, como se espera.
      history.replaceState({ kwCarpeta: raiz, kwPaso: 0 }, '', location.href);
      pasoActual = 0;
      pasoTope = 0;

      if (data.truncado) {
        document.getElementById('aviso-tope').innerHTML =
          '<div class="aviso">La carpeta tiene muchas subcarpetas y no se alcanzaron a leer todas. ' +
          'Lo que falte se puede ver abriendo Drive directamente.</div>';
      }

      document.getElementById('pie').innerHTML =
        '<span>' + elementos.filter(function (e) { return e.tipo === 'archivo'; }).length + ' archivos en total</span>' +
        '<a href="https://drive.google.com/drive/folders/' + encodeURIComponent(raiz) + '" target="_blank" rel="noopener">Abrir en Drive ↗</a>';

      pintar();
    } catch (err) {
      cont.innerHTML = '<div class="kw-vacio"><strong>No se pudo cargar</strong>' + esc(err.message || '') + '</div>';
    }
  }

  if (document.documentElement.classList.contains('kw-auth-ok')) {
    cargar();
  } else {
    window.addEventListener('kw-auth-ready', cargar, { once: true });
  }
</script>
<script src="/kwpremierweb/assets/js/drawer.js?v=20260829p" data-menu="hub"></script>
</body>
