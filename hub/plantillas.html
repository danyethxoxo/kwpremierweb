<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creador de formatos</title>
<link rel="icon" type="image/png" href="/kwpremierweb/assets/img/favicon.png" />
<style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
<script>
  setTimeout(function () {
    if (!document.documentElement.classList.contains('kw-auth-ok')) {
      console.error('auth-guard.js no respondió a tiempo; redirigiendo al login por seguridad.');
      location.replace('/kwpremierweb/login.html');
    }
  }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kwpremierweb/assets/js/auth-guard.js"></script>
<script src="/kwpremierweb/assets/js/kw-hoja.js?v=20260729"></script>
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-base.css?v=20260817j">
<script src="/kwpremierweb/assets/js/kw-ui.js?v=20260817j"></script>
<style>
  html, body { min-height: 100%; color: var(--text); }
  /* El fondo real (la capa fija de kw-ui.css, o la propia si la pagina no carga kw-base.css) solo se asoma detras de <body>, nunca de <html>: <html> necesita quedarse con SU color de respaldo para la franja de "rebote" al llegar al tope o al fondo del scroll en celular. */
  body { background: transparent; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .page { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 90px 22px 50px; }
  .page-title { font-size: 24px; font-weight: 700; color: #fff; }
  .page-desc { font-size: 13.5px; color: rgba(255,255,255,0.72); margin: 4px 0 22px; }

  .barra { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .barra .crece { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border-radius: 10px; padding: 9px 16px; border: 1.5px solid var(--border);
    background: #fff; color: var(--text); cursor: pointer;
    font-size: 13px; font-weight: 700; font-family: inherit; text-decoration: none;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
  }
  .btn:hover { background: #fafafa; }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-rojo {
    background: radial-gradient(70% 90% at 18% 104%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.90) 0%, rgba(255,255,255,0.78) 100%);
    color: var(--red);
    border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%); border: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38), 0 5px 16px rgba(0,0,0,0.16);
  }
  .btn-rojo:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 24px rgba(0,0,0,0.24); background: radial-gradient(70% 90% at 18% 104%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.90) 0%, rgba(255,255,255,0.78) 100%); color: var(--red); }
  .btn svg { width: 15px; height: 15px; }

  /* ── Lista de formatos ── */
  .lista-plantillas { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .tarjeta-plantilla {
    background: radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), radial-gradient(70% 50% at 90% 2%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%); border: 1px solid rgba(255,255,255,0.82); border-radius: 14px;
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
    padding: 16px 17px; display: flex; flex-direction: column; gap: 6px;
  }
  .tp-nombre { font-size: 15.5px; font-weight: 700; letter-spacing: -0.2px; }
  .tp-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; flex: 1; }
  .tp-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .etiqueta {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 3px 9px; border-radius: 20px; background: #f0f0ef; color: #666;
  }
  .etiqueta.publicada { background: #eaf7ee; color: #1a7f37; }
  .etiqueta.borrador { background: #FFF0F0; color: var(--red); }
  .tp-acciones { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .tp-acciones .btn { padding: 7px 12px; font-size: 12px; }

  /* ── Armador ── */
  .armador { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }
  .panel {
    background: radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), radial-gradient(70% 50% at 90% 2%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 66%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%); border: 1px solid rgba(255,255,255,0.82);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30), inset 1px 0 0 rgba(255,255,255,0.38);
    border-radius: 14px; padding: 18px;
  }
  .panel h2 { font-size: 14px; margin-bottom: 14px; }

  .campo-form { margin-bottom: 12px; }
  .campo-form label {
    display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); margin-bottom: 5px;
  }
  .campo-form input, .campo-form select, .campo-form textarea {
    width: 100%; box-sizing: border-box;
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-size: 13.5px; font-family: inherit;
    color: var(--text); background: #fff;
  }
  .campo-form input:focus, .campo-form select:focus, .campo-form textarea:focus {
    outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(138,0,0,0.08);
  }
  .campo-form textarea { min-height: 76px; resize: vertical; }
  .ayuda { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

  .tipos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 16px; }
  .tipo-btn {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 11px 4px 9px; border: 1.5px solid var(--border); border-radius: 11px;
    background: #fff; cursor: pointer; font-family: inherit;
    font-size: 11px; font-weight: 700; color: #444;
    transition: border-color 0.15s, background 0.15s, transform 0.12s;
  }
  .tipo-btn:hover { background: #fafafa; }
  .tipo-btn:active { transform: scale(0.95); }
  .tipo-btn.activo { border-color: var(--red); background: #fff5f5; color: var(--red); }
  .tipo-btn svg { width: 17px; height: 17px; }

  .bloques { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
  .bloque-fila {
    display: flex; align-items: center; gap: 9px;
    border: 1.5px solid var(--border); border-radius: 11px; padding: 9px 11px;
    background: #fff; font-size: 13px;
  }
  .bloque-fila .bf-tipo {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--red); background: #fff3f3; padding: 3px 8px; border-radius: 20px; flex-shrink: 0;
  }
  .bloque-fila .bf-texto {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #444;
  }
  .bf-btn {
    width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; color: #777; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .bf-btn:hover { background: #f5f5f5; color: var(--text); }
  .bf-btn:disabled { opacity: 0.3; cursor: default; }
  .bf-btn svg { width: 13px; height: 13px; }
  .bf-btn.borrar:hover { background: #fff0f0; color: var(--red); border-color: #ffd0d0; }

  .previa { position: sticky; top: 76px; }
  .previa-marco {
    background: #e9e9e8; border-radius: 14px; padding: 18px;
    max-height: calc(100vh - 130px); overflow: auto;
  }
  .previa-escala { transform-origin: top center; }

  .vacio-lista {
    text-align: center; color: rgba(255,255,255,0.72); font-size: 14px; line-height: 1.6;
    border: 1.5px dashed var(--border); border-radius: 14px; padding: 46px 20px;
  }
  .vacio-lista strong { display: block; color: #fff; font-size: 15px; margin-bottom: 6px; }

  .msg { font-size: 13px; margin-top: 10px; display: none; }
  .msg.ok { display: block; color: #1a7f37; }
  .msg.error { display: block; color: var(--red); }

  @media (max-width: 1000px) {
    .armador { grid-template-columns: 1fr; }
    .previa { position: static; }
    .previa-marco { max-height: none; }
  }
  @media (max-width: 640px) {
    .page { padding: 82px 16px 40px; }
    .page-title, .page-desc { display: none; }
    .tipos { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

  <header class="kw-header">
    <span class="kw-header-title">Creador de formatos</span>
    <a href="/kwpremierweb/portal.html" class="back-btn" id="btn-atras">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      <span>Atrás</span>
    </a>
  </header>

  <main class="page">
    <h1 class="page-title">Creador de formatos</h1>
    <p class="page-desc">Arma aquí los documentos que va a llenar el equipo, sin tocar código.</p>

    <!-- ── Vista: lista ── -->
    <section id="vista-lista">
      <div class="barra">
        <div class="crece"></div>
        <button type="button" class="btn btn-rojo" id="btn-nuevo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Nuevo formato
        </button>
      </div>
      <div id="lista">
        <div class="kw-loader"><div class="circle uno"></div><div class="circle dos"></div><div class="circle tres"></div></div>
      </div>
    </section>

    <!-- ── Vista: armador ── -->
    <section id="vista-armador" hidden>
      <div class="barra">
        <button type="button" class="btn" id="btn-volver-lista">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Todos los formatos
        </button>
        <div class="crece"></div>
        <button type="button" class="btn" id="btn-guardar">Guardar</button>
        <button type="button" class="btn btn-rojo" id="btn-publicar">Publicar</button>
      </div>

      <div class="armador">
        <div>
          <div class="panel" style="margin-bottom:16px;">
            <h2>Datos del formato</h2>
            <div class="campo-form">
              <label for="p-nombre">Nombre</label>
              <input type="text" id="p-nombre" maxlength="120" placeholder="Ej. Contrato de arrendamiento" />
            </div>
            <div class="campo-form">
              <label for="p-descripcion">Para qué sirve</label>
              <input type="text" id="p-descripcion" maxlength="200" placeholder="Una línea que explique cuándo se usa" />
            </div>
            <div class="campo-form">
              <label for="p-categoria">Dónde aparece</label>
              <select id="p-categoria">
                <option value="acuerdos">Acuerdos</option>
                <option value="contratos">Contratos</option>
                <option value="internos">Internos</option>
              </select>
            </div>
            <div class="msg" id="msg-datos"></div>
          </div>

          <div class="panel" style="margin-bottom:16px;">
            <h2>Agregar a la hoja</h2>
            <div class="tipos" id="tipos"></div>
            <div id="form-bloque"></div>
          </div>

          <div class="panel">
            <h2>Lo que lleva la hoja</h2>
            <div class="bloques" id="bloques"></div>
          </div>
        </div>

        <div class="previa">
          <div class="previa-marco">
            <div class="previa-escala" id="previa"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

<script>
  var ICO = {
    titulo:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V5h16v2M9 5v14M15 19H9"/></svg>',
    texto:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 11h16M4 16h10"/></svg>',
    campo:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 17h16M4 8h9"/></svg>',
    tabla:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>',
    casilla: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>',
    firma:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18"/><path d="M5 15c3-6 5 2 7-2s3 3 6-3"/></svg>',
    salto:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"><path d="M3 12h18"/></svg>',
    arriba:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
    abajo:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    borrar:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  };

  var TIPOS = [
    { id: 'titulo',  nombre: 'Título' },
    { id: 'texto',   nombre: 'Texto' },
    { id: 'campo',   nombre: 'Campo' },
    { id: 'tabla',   nombre: 'Tabla' },
    { id: 'casilla', nombre: 'Casilla' },
    { id: 'firma',   nombre: 'Firma' },
    { id: 'salto',   nombre: 'Hoja nueva' },
  ];

  var plantillas = [];
  var actual = null;      // la plantilla que se está armando
  var tipoElegido = 'titulo';

  function esc(t) {
    var d = document.createElement('div');
    d.textContent = t == null ? '' : t;
    return d.innerHTML;
  }
  function $(id) { return document.getElementById(id); }
  function decir(id, texto, clase) {
    var el = $(id);
    if (!texto) { el.style.display = 'none'; return; }
    el.textContent = texto;
    el.className = 'msg ' + (clase || '');
  }

  // "Nombre del cliente" -> "nombre_del_cliente", que es lo que se escribe
  // entre llaves dentro de los textos.
  function comoClave(etiqueta) {
    return String(etiqueta).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'campo';
  }
  function claveLibre(base) {
    var usadas = {};
    (actual.bloques || []).forEach(function (b) { if (b.clave) usadas[b.clave] = true; });
    if (!usadas[base]) return base;
    var n = 2;
    while (usadas[base + '_' + n]) n++;
    return base + '_' + n;
  }

  // ── Vistas ──
  function verLista() {
    $('vista-lista').hidden = false;
    $('vista-armador').hidden = true;
    actual = null;
    pintarLista();
  }
  function verArmador() {
    $('vista-lista').hidden = true;
    $('vista-armador').hidden = false;
    $('p-nombre').value = actual.nombre || '';
    $('p-descripcion').value = actual.descripcion || '';
    $('p-categoria').value = actual.categoria || 'acuerdos';
    pintarTipos();
    pintarFormBloque();
    pintarBloques();
    pintarPrevia();
  }

  // ── Lista ──
  function pintarLista() {
    var cont = $('lista');
    if (!plantillas.length) {
      cont.innerHTML = '<div class="vacio-lista"><strong>Todavía no hay formatos</strong>' +
        'Crea el primero con el botón de arriba: agregas título, textos, campos y firmas, ' +
        'y queda listo para que el equipo lo llene.</div>';
      return;
    }
    cont.innerHTML = '<div class="lista-plantillas">' + plantillas.map(function (p) {
      return '<article class="tarjeta-plantilla">' +
        '<div class="tp-nombre">' + esc(p.nombre) + '</div>' +
        '<div class="tp-desc">' + esc(p.descripcion || 'Sin descripción.') + '</div>' +
        '<div class="tp-meta">' +
          '<span class="etiqueta">' + esc(p.categoria) + '</span>' +
          '<span class="etiqueta ' + (p.publicada ? 'publicada' : 'borrador') + '">' +
            (p.publicada ? 'Publicado' : 'Borrador') + '</span>' +
          '<span class="etiqueta">' + ((p.bloques || []).length) + ' bloques</span>' +
        '</div>' +
        '<div class="tp-acciones">' +
          '<button type="button" class="btn" data-editar="' + p.id + '">Editar</button>' +
          (p.publicada ? '<a class="btn" href="/kwpremierweb/documentos/plantilla.html?id=' + p.id + '">Llenar</a>' : '') +
          '<button type="button" class="btn" data-borrar="' + p.id + '" data-kw-confirmar="¿Borrarlo?">Borrar</button>' +
        '</div>' +
      '</article>';
    }).join('') + '</div>';

    cont.querySelectorAll('[data-editar]').forEach(function (b) {
      b.addEventListener('click', function () {
        actual = JSON.parse(JSON.stringify(
          plantillas.find(function (x) { return x.id === b.getAttribute('data-editar'); })));
        actual.bloques = actual.bloques || [];
        verArmador();
      });
    });
    // El botón se voltea y pregunta antes de borrar (data-kw-confirmar);
    // por eso se escucha el "sí" y no el click.
    cont.querySelectorAll('[data-borrar]').forEach(function (b) {
      b.addEventListener('kw-confirmado', function () { borrarPlantilla(b.getAttribute('data-borrar')); });
    });
    window.kwUI.confirmaciones(cont);
  }

  // ── Elegir qué agregar ──
  function pintarTipos() {
    $('tipos').innerHTML = TIPOS.map(function (t) {
      return '<button type="button" class="tipo-btn' + (t.id === tipoElegido ? ' activo' : '') +
        '" data-tipo="' + t.id + '">' + ICO[t.id] + '<span>' + t.nombre + '</span></button>';
    }).join('');
    $('tipos').querySelectorAll('[data-tipo]').forEach(function (b) {
      b.addEventListener('click', function () {
        tipoElegido = b.getAttribute('data-tipo');
        pintarTipos();
        pintarFormBloque();
      });
    });
  }

  function pintarFormBloque() {
    var c = $('form-bloque');
    var t = tipoElegido;

    if (t === 'salto') {
      c.innerHTML = '<p class="ayuda" style="margin-bottom:12px;">Corta aquí y lo que siga ' +
        'empieza en una hoja nueva, con su logo.</p>' +
        '<button type="button" class="btn btn-rojo" id="btn-agregar" style="width:100%;">Agregar hoja nueva</button>';
    } else if (t === 'titulo') {
      c.innerHTML =
        '<div class="campo-form"><label for="b-texto">Título</label>' +
          '<input type="text" id="b-texto" placeholder="CONTRATO DE ARRENDAMIENTO" /></div>' +
        '<div class="campo-form"><label for="b-alineacion">Posición</label>' +
          '<select id="b-alineacion"><option value="centro">Centrado</option>' +
          '<option value="izquierda">A la izquierda</option></select></div>' +
        '<button type="button" class="btn btn-rojo" id="btn-agregar" style="width:100%;">Agregar título</button>';
    } else if (t === 'texto') {
      c.innerHTML =
        '<div class="campo-form"><label for="b-texto">Texto</label>' +
          '<textarea id="b-texto" placeholder="Escribe el párrafo…"></textarea>' +
          '<div class="ayuda">Para meter un dato capturado, escribe su clave entre llaves: ' +
          '<strong>{{nombre_del_cliente}}</strong>. Las claves salen abajo, en cada campo que agregues.</div></div>' +
        '<button type="button" class="btn btn-rojo" id="btn-agregar" style="width:100%;">Agregar texto</button>';
    } else if (t === 'campo') {
      c.innerHTML =
        '<div class="campo-form"><label for="b-etiqueta">Qué se pide</label>' +
          '<input type="text" id="b-etiqueta" placeholder="Nombre del cliente" /></div>' +
        '<div class="campo-form"><label for="b-formato">Tipo de dato</label>' +
          '<select id="b-formato">' +
            '<option value="texto">Texto</option>' +
            '<option value="numero">Número</option>' +
            '<option value="moneda">Dinero</option>' +
            '<option value="fecha">Fecha</option>' +
            '<option value="parrafo">Texto largo</option>' +
          '</select></div>' +
        '<button type="button" class="btn btn-rojo" id="btn-agregar" style="width:100%;">Agregar campo</button>';
    } else if (t === 'tabla') {
      c.innerHTML =
        '<div class="campo-form"><label for="b-columnas">Columnas</label>' +
          '<input type="text" id="b-columnas" placeholder="Concepto, Monto" />' +
          '<div class="ayuda">Sepáralas con comas.</div></div>' +
        '<div class="campo-form"><label for="b-filas">Contenido</label>' +
          '<textarea id="b-filas" placeholder="Renta mensual, {{renta}}&#10;Depósito, "></textarea>' +
          '<div class="ayuda">Una fila por renglón, celdas separadas con comas. Déjalo vacío ' +
          'si la tabla se va a llenar a mano sobre el papel.</div></div>' +
        '<button type="button" class="btn btn-rojo" id="btn-agregar" style="width:100%;">Agregar tabla</button>';
    } else if (t === 'casilla') {
      c.innerHTML =
        '<div class="campo-form"><label for="b-etiqueta">Qué dice la casilla</label>' +
          '<input type="text" id="b-etiqueta" placeholder="Acepta el aviso de privacidad" /></div>' +
        '<button type="button" class="btn btn-rojo" id="btn-agregar" style="width:100%;">Agregar casilla</button>';
    } else if (t === 'firma') {
      c.innerHTML =
        '<div class="campo-form"><label for="b-etiqueta">Quién firma</label>' +
          '<input type="text" id="b-etiqueta" placeholder="Nombre y firma del arrendatario" />' +
          '<div class="ayuda">Si pones dos firmas seguidas, salen lado a lado.</div></div>' +
        '<button type="button" class="btn btn-rojo" id="btn-agregar" style="width:100%;">Agregar firma</button>';
    }

    var btn = $('btn-agregar');
    if (btn) btn.addEventListener('click', agregarBloque);
  }

  function agregarBloque() {
    var t = tipoElegido;
    var b = { tipo: t };

    if (t === 'titulo') {
      var texto = ($('b-texto').value || '').trim();
      if (!texto) return $('b-texto').focus();
      b.texto = texto;
      b.alineacion = $('b-alineacion').value;
    } else if (t === 'texto') {
      var p = ($('b-texto').value || '').trim();
      if (!p) return $('b-texto').focus();
      b.texto = p;
    } else if (t === 'campo' || t === 'casilla') {
      var et = ($('b-etiqueta').value || '').trim();
      if (!et) return $('b-etiqueta').focus();
      b.etiqueta = et;
      b.clave = claveLibre(comoClave(et));
      if (t === 'campo') b.formato = $('b-formato').value;
    } else if (t === 'tabla') {
      var cols = ($('b-columnas').value || '').split(',')
        .map(function (x) { return x.trim(); }).filter(Boolean);
      if (!cols.length) return $('b-columnas').focus();
      b.columnas = cols;
      b.filas = ($('b-filas').value || '').split('\n')
        .map(function (l) { return l.trim(); }).filter(Boolean)
        .map(function (l) { return l.split(',').map(function (x) { return x.trim(); }); });
    } else if (t === 'firma') {
      var f = ($('b-etiqueta').value || '').trim();
      if (!f) return $('b-etiqueta').focus();
      b.etiqueta = f;
    }

    actual.bloques.push(b);
    pintarFormBloque();
    pintarBloques();
    pintarPrevia();
  }

  // ── Lo que ya lleva la hoja ──
  function resumen(b) {
    if (b.tipo === 'titulo' || b.tipo === 'texto') return b.texto || '';
    if (b.tipo === 'campo') return b.etiqueta + '  ·  {{' + b.clave + '}}';
    if (b.tipo === 'casilla') return b.etiqueta + '  ·  {{' + b.clave + '}}';
    if (b.tipo === 'firma') return b.etiqueta || '';
    if (b.tipo === 'tabla') return (b.columnas || []).join(' · ');
    if (b.tipo === 'salto') return 'Empieza hoja nueva';
    return '';
  }

  function pintarBloques() {
    var c = $('bloques');
    if (!actual.bloques.length) {
      c.innerHTML = '<p class="ayuda">Todavía no agregas nada. Empieza por el título.</p>';
      return;
    }
    c.innerHTML = actual.bloques.map(function (b, i) {
      var nombre = (TIPOS.find(function (t) { return t.id === b.tipo; }) || {}).nombre || b.tipo;
      return '<div class="bloque-fila">' +
        '<span class="bf-tipo">' + esc(nombre) + '</span>' +
        '<span class="bf-texto" title="' + esc(resumen(b)) + '">' + esc(resumen(b)) + '</span>' +
        '<button type="button" class="bf-btn" data-sube="' + i + '"' + (i === 0 ? ' disabled' : '') +
          ' aria-label="Subir">' + ICO.arriba + '</button>' +
        '<button type="button" class="bf-btn" data-baja="' + i + '"' +
          (i === actual.bloques.length - 1 ? ' disabled' : '') + ' aria-label="Bajar">' + ICO.abajo + '</button>' +
        '<button type="button" class="bf-btn borrar" data-quita="' + i + '" aria-label="Quitar">' + ICO.borrar + '</button>' +
      '</div>';
    }).join('');

    c.querySelectorAll('[data-sube]').forEach(function (b) {
      b.addEventListener('click', function () { mover(+b.getAttribute('data-sube'), -1); });
    });
    c.querySelectorAll('[data-baja]').forEach(function (b) {
      b.addEventListener('click', function () { mover(+b.getAttribute('data-baja'), 1); });
    });
    c.querySelectorAll('[data-quita]').forEach(function (b) {
      b.addEventListener('click', function () {
        actual.bloques.splice(+b.getAttribute('data-quita'), 1);
        pintarBloques(); pintarPrevia();
      });
    });
  }

  function mover(i, paso) {
    var j = i + paso;
    if (j < 0 || j >= actual.bloques.length) return;
    var tmp = actual.bloques[i];
    actual.bloques[i] = actual.bloques[j];
    actual.bloques[j] = tmp;
    pintarBloques(); pintarPrevia();
  }

  // ── Vista previa ──
  function pintarPrevia() {
    // Con datos de muestra se entiende mucho mejor cómo va a quedar que
    // con los espacios en blanco.
    var muestra = {};
    window.kwHoja.campos(actual.bloques).forEach(function (c) {
      muestra[c.clave] =
        c.formato === 'moneda' ? '15000' :
        c.formato === 'fecha'  ? new Date().toISOString().slice(0, 10) :
        c.formato === 'numero' ? '3' :
        c.formato === 'casilla' ? true :
        'Ejemplo';
    });
    $('previa').innerHTML = window.kwHoja.html(actual.bloques, muestra);
    ajustarEscala();
  }

  // La hoja mide 21.6 cm de ancho fijo; se encoge para que quepa en el panel.
  function ajustarEscala() {
    var marco = document.querySelector('.previa-marco');
    var caja = $('previa');
    if (!marco || !caja) return;
    caja.style.transform = '';
    var disponible = marco.clientWidth - 36;
    var ancho = caja.firstElementChild ? caja.firstElementChild.offsetWidth : 0;
    if (!ancho || ancho <= disponible) return;
    var escala = disponible / ancho;
    caja.style.transform = 'scale(' + escala + ')';
    caja.style.height = (caja.scrollHeight * escala) + 'px';
  }
  window.addEventListener('resize', ajustarEscala);

  // ── Guardar ──
  function datosDelFormulario() {
    return {
      nombre: $('p-nombre').value.trim(),
      descripcion: $('p-descripcion').value.trim() || null,
      categoria: $('p-categoria').value,
      bloques: actual.bloques,
    };
  }

  async function guardar(publicar) {
    var d = datosDelFormulario();
    if (d.nombre.length < 3) {
      decir('msg-datos', 'Ponle un nombre al formato (al menos 3 letras).', 'error');
      $('p-nombre').focus();
      return;
    }
    if (publicar && !d.bloques.length) {
      decir('msg-datos', 'Agrega al menos un bloque antes de publicarlo.', 'error');
      return;
    }
    if (publicar) d.publicada = true;

    $('btn-guardar').disabled = true;
    $('btn-publicar').disabled = true;
    try {
      var res;
      if (actual.id) {
        d.updated_at = new Date().toISOString();
        res = await window.kwSupabase.from('plantillas_documento')
          .update(d).eq('id', actual.id).select().single();
      } else {
        var u = await window.kwSupabase.auth.getUser();
        d.creada_por = u.data.user.id;
        res = await window.kwSupabase.from('plantillas_documento').insert(d).select().single();
      }
      if (res.error) throw res.error;
      actual = res.data;
      actual.bloques = actual.bloques || [];
      decir('msg-datos', publicar ? 'Publicado. Ya lo puede llenar el equipo.' : 'Guardado.', 'ok');
      await cargar(true);
    } catch (e) {
      decir('msg-datos', e.message || 'No se pudo guardar.', 'error');
    } finally {
      $('btn-guardar').disabled = false;
      $('btn-publicar').disabled = false;
    }
  }

  async function borrarPlantilla(id) {
    var p = plantillas.find(function (x) { return x.id === id; });
    if (!p) return;
    var r = await window.kwSupabase.from('plantillas_documento').delete().eq('id', id);
    if (r.error) { alert('No se pudo borrar: ' + r.error.message); return; }
    await cargar(true);
  }

  async function cargar(silencioso) {
    try {
      var r = await window.kwSupabase.from('plantillas_documento')
        .select('id, nombre, descripcion, categoria, bloques, publicada, created_at')
        .order('created_at', { ascending: false });
      if (r.error) throw r.error;
      plantillas = r.data || [];
      if (!silencioso || !actual) pintarLista();
    } catch (e) {
      $('lista').innerHTML = '<div class="vacio-lista"><strong>No se pudieron cargar los formatos</strong>' +
        esc(e.message || '') + '</div>';
    }
  }

  $('btn-nuevo').addEventListener('click', function () {
    actual = { nombre: '', descripcion: '', categoria: 'acuerdos', bloques: [] };
    verArmador();
  });
  $('btn-volver-lista').addEventListener('click', verLista);
  $('btn-guardar').addEventListener('click', function () { guardar(false); });
  $('btn-publicar').addEventListener('click', function () { guardar(true); });

  if (document.documentElement.classList.contains('kw-auth-ok')) cargar();
  else window.addEventListener('kw-auth-ready', cargar, { once: true });
</script>
<script>
  // El CSS de la hoja lo pone el mismo módulo que la dibuja, para que la
  // vista previa y el documento impreso no se puedan separar.
  (function () {
    var s = document.createElement('style');
    s.textContent = window.kwHoja.estilos();
    document.head.appendChild(s);
  })();
</script>
