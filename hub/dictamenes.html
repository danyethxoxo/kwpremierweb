      if (listado !== 'todos' && (d.estatus_listado || 'pendiente') !== listado) return false;
      if (contrato !== 'todos' && d.tipo_contrato !== contrato) return false;
      if (tipo !== 'todos' && d.tipo_inmueble_id !== tipo) return false;

      // Sin asesores elegidos no se filtra por asesor: la lista vacía
      // quiere decir "todos", no "ninguno".
      if (asesoresFiltro.length && asesoresFiltro.indexOf(d.asesor_id) === -1) return false;

      // Las fechas viajan como aaaa-mm-dd, y en ese formato compararlas
      // como texto da el mismo resultado que compararlas como fechas.
      var f = d.fecha_dictamen || '';
      if (desde && (!f || f < desde)) return false;
      if (hasta && (!f || f > hasta)) return false;

      if (fueraDeRango(d.precio_listado, precioMin, precioMax)) return false;
      // La comisión se pide exacta: se escribe 5 y salen los del 5. Como
      // rango no aportaba, porque los porcentajes que se manejan son un
      // puñado de valores cerrados y no una escala continua.
      if (comision && Number(soloCifra(d.comision_porcentaje)) !== Number(comision)) return false;

      if (busca) {
        var heno = [d.inmueble, d.folio, d.clientes_nombres, d.asesor_nombre,
          d.escritura_numero, d.precio_listado, d.comision_porcentaje]
          .join(' ').toLowerCase();
        if (heno.indexOf(busca) === -1) return false;
      }
      return true;
    });
  }

  // ── El filtro de asesor, que admite varios ──────────────────

  var asesoresFiltro = [];

  function pintarAsesoresFiltro() {
    var caja = $('f-asesor-elegidos');
    caja.innerHTML = asesoresFiltro.map(function (id) {
      var a = asesores.find(function (x) { return x.id === id; });
      return '<span class="dic-multi-chip"><span>' +
        escapar(a ? a.nombre : 'Asesor') + '</span>' +
        '<button type="button" data-quitar-asesor="' + id + '" aria-label="Quitar">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">' +
            '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button></span>';
    }).join('');

    $('f-asesor-busca').placeholder = asesoresFiltro.length
      ? 'Agregar otro' : 'Buscar asesor';

    caja.querySelectorAll('[data-quitar-asesor]').forEach(function (b) {
      b.addEventListener('click', function () {
        asesoresFiltro = asesoresFiltro.filter(function (x) {
          return x !== b.dataset.quitarAsesor;
        });
        pintarAsesoresFiltro();
        pintar();
      });
    });

    // El campo de asesor crece hacia abajo con cada elegido, así que
    // agregar uno puede empujar filtros fuera del renglón que se ve. La
    // cuenta se rehace aquí y no en cada lugar que toca los asesores,
    // porque todos pasan por esta función.
    acomodarFiltros();
  }

  function pintarSugerenciasAsesor() {
    var q = $('f-asesor-busca').value.trim().toLowerCase();
    var caja = $('f-asesor-lista');
    if (!q) { caja.classList.remove('abierta'); return; }

    var hallados = asesores.filter(function (a) {
      if (!a.activo) return false;
      if (asesoresFiltro.indexOf(a.id) !== -1) return false;
      return (a.nombre + ' ' + (a.correo || '')).toLowerCase().indexOf(q) !== -1;
    }).slice(0, 30);

    caja.innerHTML = hallados.length
      ? hallados.map(function (a) {
        return '<button type="button" class="dic-asesor-op" data-mas-asesor="' + a.id + '">' +
          escapar(a.nombre) + '</button>';
      }).join('')
      : '<div class="dic-asesor-vacio">Ningún asesor con ese nombre.</div>';
    caja.classList.add('abierta');

    caja.querySelectorAll('[data-mas-asesor]').forEach(function (b) {
      b.addEventListener('click', function () {
        asesoresFiltro.push(b.dataset.masAsesor);
        $('f-asesor-busca').value = '';
        caja.classList.remove('abierta');
        pintarAsesoresFiltro();
        pintar();
      });
    });
  }

  // ── El resumen ──────────────────────────────────────────────

  function pintarResumen() {
    if (verArchivo) { $('resumen').innerHTML = ''; return; }
    var vivos = dictamenes.filter(function (d) { return !d.archivado_at; });
    var cuenta = function (e) {
      return vivos.filter(function (d) { return d.estado === e; }).length;
    };
    var tarjetas = [
      ['devuelta', cuenta('devuelta'), 'Devueltos'],
      ['condicionada', cuenta('condicionada'), 'Condicionados'],
      ['autorizada', cuenta('autorizada'), 'Autorizados'],
    ];
    var activo = estadoFiltro;

    // Cada tarjeta lleva la clase de su estado, que es la que le pone el
    // color del borde: el mismo que su etiqueta en la lista.
    $('resumen').innerHTML = tarjetas.map(function (t) {
      return '<button type="button" class="kw-conteo ' + t[0] +
        (activo === t[0] ? ' activa' : '') + '" data-estado="' + t[0] + '">' +
        '<span class="kw-conteo-num">' + t[1] + '</span>' +
        '<span class="kw-conteo-txt">' + t[2] + '</span>' +
      '</button>';
    }).join('');

    $('resumen').querySelectorAll('[data-estado]').forEach(function (b) {
      b.addEventListener('click', function () {
        // Volver a picarle al que ya está puesto lo quita. Es la única
        // forma de sacarlo, ahora que no hay desplegable de estado.
        var quiere = b.dataset.estado;
        estadoFiltro = (estadoFiltro === quiere) ? 'todos' : quiere;
        pintar();
      });
    });
  }

  // ── Preguntar en qué estatus quedó ──────────────────────────
  //
  // kwUI.alert y kwUI.confirm solo saben de aceptar y cancelar, y aquí
  // hacen falta tres respuestas. Se arma con las mismas piezas del aviso
  // del sitio (.modal-overlay/.modal-box) para que se vea igual que todo
  // lo demás. Devuelve el estado elegido, o null si se cerró sin elegir.
  function preguntarEstado() {
    return new Promise(function (resolver) {
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      var caja = document.createElement('div');
      caja.className = 'modal-box dic-modal-estado';
      caja.setAttribute('role', 'alertdialog');
      caja.setAttribute('aria-modal', 'true');
      caja.innerHTML =
        '<h3>¿En qué estatus quedó este expediente?</h3>' +
        '<div class="dic-preguntar">' +
          ORDEN_ESTADOS.map(function (e) {
            return '<button type="button" class="dic-preguntar-op" data-elige="' + e + '">' +
              '<i class="' + e + '"></i>' + ESTADOS[e] + '</button>';
          }).join('') +
        '</div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn-modal-cancelar" data-elige="">Ahora no</button>' +
        '</div>';

      var listo = false;
      function cerrar(valor) {
        if (listo) return;
        listo = true;
        document.removeEventListener('keydown', porTecla);
        if (window.kwUI) window.kwUI.cerrarModal(overlay, function () { overlay.remove(); });
        else overlay.remove();
        resolver(valor);
      }
      function porTecla(e) { if (e.key === 'Escape') cerrar(null); }

      caja.querySelectorAll('[data-elige]').forEach(function (b) {
        b.addEventListener('click', function () { cerrar(b.dataset.elige || null); });
      });
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) cerrar(null);
      });

      overlay.appendChild(caja);
      document.body.appendChild(overlay);
      document.addEventListener('keydown', porTecla);
      caja.querySelector('[data-elige]').focus();
    });
  }

  // ── La lista ────────────────────────────────────────────────

  function pintar() {
    pintarResumen();
    // El título es ahora el del renglón de arriba, que es el único que
    // queda. La descripción se fue con el encabezado que se quitó: decía
    // lo que la propia pantalla enseña, y costaba un renglón.
    $('page-titulo').textContent = verArchivo
      ? 'Archivo de expedientes'
      : 'Dictaminación de Expedientes';
    $('op-archivo-txt').textContent = verArchivo ? 'Volver a la lista' : 'Ver archivo';

    var filas = visibles();

    // Los rótulos solo tienen sentido si hay renglones debajo.
    $('dic-cabecera').style.display = filas.length ? '' : 'none';

    if (!filas.length) {
      var hayFiltro = asesoresFiltro.length || estadoFiltro !== 'todos' ||
        ESCRITOS.some(function (x) { return $(x).value.trim(); }) ||
        DESPLEGABLES.some(function (x) { return $(x).value !== 'todos'; });
      $('lista').innerHTML = '<div class="kw-vacio">' + (
        verArchivo ? 'No hay dictámenes archivados.'
          : hayFiltro ? 'No hay dictámenes que cumplan con lo que estás filtrando.'
            : 'Todavía no se ha levantado ningún dictamen.'
      ) + '</div>';
      return;
    }

    $('lista').innerHTML = filas.map(filaHTML).join('');

    // Se vuelve a abrir el que estaba abierto: sin esto, marcar una
    // observación cierra la tarjeta y hay que volver a buscarla.
    if (abierto) {
      var f = $('lista').querySelector('[data-fila="' + abierto + '"]');
      if (f) {
        f.classList.add('abierta');
        var c = f.querySelector('.kw-fila-cabeza');
        if (c) c.setAttribute('aria-expanded', 'true');
      }
    }

    if (window.kwUI) {
      window.kwUI.acordeon($('lista'));
      window.kwUI.tabs($('lista'));
    }
    $('lista').querySelectorAll('.kw-fila-cabeza').forEach(function (c) {
      c.addEventListener('click', function () {
        var fila = c.closest('.kw-fila');
        abierto = fila && fila.classList.contains('abierta') ? fila.dataset.fila : null;
      });
    });
    cablear();
  }

  function filaHTML(d) {
    var mios = puntos.filter(function (p) { return p.dictamen_id === d.id; });
    var total = d.puntos_total || 0;
    var listas = d.puntos_corregidas || 0;
    var pct = total ? Math.round((listas / total) * 100) : 0;

    return '<div class="kw-fila" data-fila="' + d.id + '">' +
      '<button type="button" class="kw-fila-cabeza">' +
        '<span class="kw-fila-texto">' +
          '<span class="kw-fila-titulo">' + escapar(d.inmueble || 'Borrador sin dirección') + '</span>' +
          '<span class="kw-fila-sub">' +
            (d.folio ? escapar(d.folio) +
              (Number(d.revision) > 0 ? ' · Rev ' + Number(d.revision) : '') + ' · ' : '') +
            escapar(d.asesor_nombre || 'Sin asesor') + ' · ' + fecha(d.fecha_dictamen) +
          '</span>' +
        '</span>' +
        '<span class="kw-fila-extra">' +
          (total
            ? '<span class="kw-extra"><span class="dic-avance"><span style="width:' + pct + '%"></span></span></span>' +
              '<span class="kw-extra"><span>' + listas + ' de ' + total + '</span></span>'
            : '') +
          '<span class="kw-extra dic-col">' + etiquetaEstado(d) + '</span>' +
          '<span class="kw-extra dic-col dic-col-separada">' + etiquetaMarketing(d) + '</span>' +
          '<span class="kw-extra dic-col dic-col-separada">' + etiquetaListado(d) + '</span>' +
        '</span>' +
        '<svg class="kw-fila-flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>' +
      '</button>' +
      '<div class="kw-fila-cuerpo"><div><div class="kw-fila-dentro">' +
        cuerpoHTML(d, mios) +
      '</div></div></div>' +
    '</div>';
  }

  function correccionDe(d, campo) {
    return (separarCorrecciones(d.observaciones).correcciones || {})[campo] || '';
  }

  function correccionesClientesTexto(d) {
    var correcciones = separarCorrecciones(d.observaciones).correcciones || {};
    var suyos = clientes
      .filter(function (c) { return c.dictamen_id === d.id; })
      .sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
    var n = Math.max(suyos.length, d.clientes_total || 1);
    var partes = [];
    for (var i = 0; i < n; i++) {
      var nombre = correcciones['cliente_' + i + '_nombre'];
      var civil = correcciones['cliente_' + i + '_estado_civil'];
      if (nombre || civil) {
        partes.push((n > 1 ? 'Cliente ' + (i + 1) + ': ' : '') +
          [nombre, civil].filter(Boolean).join(' · '));
      }
    }
    return partes.join(' | ');
  }

  function dato(rotulo, valor, correccion) {
    if (!valor && !correccion) return '';
    return '<div class="dic-dato"><b>' + rotulo + '</b>' +
      (valor
        ? '<span class="dic-dato-valor">' + escapar(valor) + '</span>'
        : '<span class="dic-dato-valor vacio">Sin dato capturado</span>') +
      (correccion ? '<span class="dic-dato-correccion">' + escapar(correccion) + '</span>' : '') +
      '</div>';
  }

  function grupoDatos(titulo, contenido, clase) {
    if (!contenido) return '';
    return '<section class="dic-grupo-datos ' + (clase || '') + '">' +
      '<h4 class="dic-grupo-datos-titulo">' + escapar(titulo) + '</h4>' +
      '<div class="dic-grupo-datos-rejilla">' + contenido + '</div>' +
    '</section>';
  }

  // Un expediente trae la escritura desglosada o, si es de antes de que
  // se partiera en cuatro, el párrafo que se escribió a mano. Se enseña
  // lo que tenga: los expedientes viejos no se van a recapturar y su
  // escritura tiene que seguir viéndose.
  function tieneEscrituraDesglosada(d) {
    return !!(d.escritura_numero || d.escritura_fecha ||
      d.notario_nombre || d.notaria_numero);
  }

  function datosEscritura(d) {
    if (!tieneEscrituraDesglosada(d)) {
      return dato('Escrituras y fecha', d.escritura_propiedad);
    }
    return dato('Número de escritura', d.escritura_numero, correccionDe(d, 'escritura_numero')) +
      dato('Fecha de escrituración', fecha(d.escritura_fecha), correccionDe(d, 'escritura_fecha')) +
      dato('Notario', d.notario_nombre, correccionDe(d, 'notario_nombre')) +
      dato('Número de notaría', d.notaria_numero, correccionDe(d, 'notaria_numero'));
  }

  // ── La etiqueta del estado, que además lo cambia ─────────────

  // Los que se pueden poner desde el menú. Borrador no está: es de donde
  // se sale, no a donde se llega, y el folio se gasta al salir de ahí.
  var ORDEN_ESTADOS = ['devuelta', 'condicionada', 'autorizada'];

  var MARKETING = {
    pendiente: 'Pendiente',
    corregir: 'Corregir',
    aprobado: 'Aprobado',
  };
  var ORDEN_MARKETING = ['pendiente', 'corregir', 'aprobado'];

  var MARKETING_PUNTOS = [
    { clave: 'titulo', nombre: 'Título' },
    { clave: 'precio_moneda', nombre: 'Precio y moneda' },
    { clave: 'metrajes', nombre: 'Metrajes' },
    { clave: 'comisiones', nombre: 'Comisiones' },
    { clave: 'descripcion_nom247', nombre: 'Descripción con leyenda de la NOM-247' },
    { clave: 'fotos', nombre: 'Fotos' },
  ];

  var LISTADOS = {
    pendiente: 'Pendiente',
    sin_listado: 'No tiene cargado el listado',
    aprobado: 'Aprobado',
  };
  var ORDEN_LISTADOS = ['pendiente', 'sin_listado', 'aprobado'];

  var FLECHITA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
    '<polyline points="6 9 12 15 18 9"/></svg>';

  // La misma etiqueta sirve de adorno y de botón. Quien no puede
  // dictaminar la ve nada más como etiqueta, sin flechita: un botón que no
  // hace nada al picarle es peor que no tenerlo.
  //
  // En el encabezado va como <span> a propósito, no como <button>: ese
  // renglón entero YA es el botón que abre la tarjeta, y un botón dentro
  // de otro no es HTML válido. En el cuerpo, que no está dentro de nada,
  // sí va como botón de verdad.
  function etiquetaEstado(d, enCuerpo) {
    var mueve = puedoDictaminar && !d.archivado_at;
    var clases = 'dic-estado ' + d.estado +
      (mueve ? ' dic-estado-btn' : '') +
      (enCuerpo ? ' dic-estado-movil' : '');
    var dentro = (ESTADOS[d.estado] || '') + (mueve ? FLECHITA : '');
    var attr = mueve ? ' data-estado-de="' + d.id + '"' : '';

    return enCuerpo
      ? '<button type="button" class="' + clases + '"' + attr + '>' + dentro + '</button>'
      : '<span class="' + clases + '"' + attr + '>' + dentro + '</span>';
  }

  function etiquetaMarketing(d, enCuerpo) {
    var v = d.estatus_marketing || 'pendiente';
    var mueve = puedoDictaminar && !d.archivado_at;
    var clases = 'dic-marketing ' + v +
      (mueve ? ' dic-estado-btn' : '') +
      (enCuerpo ? ' dic-estado-movil' : '');
    var dentro = (MARKETING[v] || '') + (mueve ? FLECHITA : '');
    var attr = mueve ? ' data-marketing-de="' + d.id + '"' : '';
    return enCuerpo
      ? '<button type="button" class="' + clases + '"' + attr + '>' + dentro + '</button>'
      : '<span class="' + clases + '"' + attr + '>' + dentro + '</span>';
  }

  // El estatus del listado, que es otra cosa que el dictamen: un
  // expediente puede quedar autorizado y el listado seguir sin cargarse.
  // Por eso lleva su propia etiqueta al lado y no un estado más adentro
  // de la otra.
  function etiquetaListado(d, enCuerpo) {
    var v = d.estatus_listado || 'pendiente';
    var mueve = puedoDictaminar && !d.archivado_at;
    var clases = 'dic-listado ' + v +
      (mueve ? ' dic-estado-btn' : '') +
      (enCuerpo ? ' dic-estado-movil' : '');
    var dentro = (LISTADOS[v] || '') + (mueve ? FLECHITA : '');
    var attr = mueve ? ' data-listado-de="' + d.id + '"' : '';

    return enCuerpo
      ? '<button type="button" class="' + clases + '"' + attr + '>' + dentro + '</button>'
      : '<span class="' + clases + '"' + attr + '>' + dentro + '</span>';
  }

  var menuEstado = null;
  var menuAbiertoEn = 0;

  function cerrarMenuEstado() {
    if (!menuEstado) return;
    menuEstado.remove();
    menuEstado = null;
  }

  // Cerrarlo porque la página se movió, pero no por el movimiento que
  // provoca abrirlo: al picarle a un botón el navegador rueda la página
  // para traerlo a la vista, y ese scroll llega justo después de abrir el
  // menú. Sin esta guarda, en el celular el menú se cerraba solo en el
  // mismo instante en que aparecía.
  function cerrarMenuSiSeMovio() {
    if (Date.now() - menuAbiertoEn < 350) return;
    cerrarMenuEstado();
  }

  // El mismo menú sirve para las dos etiquetas. Lo único que cambia es de
  // dónde salen las opciones, cuál está puesta y qué se hace al elegir,
  // así que eso viaja en un descriptor y el resto (dónde se dibuja, cómo
  // se cierra) es igual para ambas.
  var MENUS = {
    estado: {
      opciones: ORDEN_ESTADOS,
      nombres: ESTADOS,
      puesta: function (d) { return d.estado; },
      // Pasa por dictaminar() y no por un update directo porque es ahí
      // donde se reparte el folio, que tiene que ser único.
      poner: function (id, valor) {
        return window.kwSupabase.rpc('dictaminar', { p_id: id, p_estado: valor });
      },
      error: 'No se pudo dictaminar: ',
    },
    marketing: {
      opciones: ORDEN_MARKETING,
      nombres: MARKETING,
      puesta: function (d) { return d.estatus_marketing || 'pendiente'; },
      poner: function (id, valor) {
        return window.kwSupabase.rpc('dictamen_cambiar_marketing', {
          p_id: id, p_estado: valor
        });
      },
      error: 'No se pudo cambiar el estatus de Marketing: ',
    },
    listado: {
      opciones: ORDEN_LISTADOS,
      nombres: LISTADOS,
      puesta: function (d) { return d.estatus_listado || 'pendiente'; },
      poner: function (id, valor) {
        return window.kwSupabase.from('dictamenes')
          .update({ estatus_listado: valor }).eq('id', id);
      },
      error: 'No se pudo cambiar el estatus del listado: ',
    },
  };

  function abrirMenu(desde, id, cual) {
    var m = MENUS[cual];
    var d = dictamenes.find(function (x) { return x.id === id; });
    if (!m || !d) return;
    cerrarMenuEstado();

    var puesta = m.puesta(d);
    var caja = document.createElement('div');
    caja.className = 'dic-menu-estado';
    caja.innerHTML = m.opciones.map(function (e) {
      return '<button type="button" class="dic-menu-op' + (puesta === e ? ' puesto' : '') +
        '" data-poner="' + e + '"><i class="' + e + '"></i>' + m.nombres[e] + '</button>';
    }).join('');
    document.body.appendChild(caja);

    // Se cuelga de la etiqueta, y si abajo ya no cabe se voltea hacia
    // arriba en vez de salirse de la pantalla.
    var r = desde.getBoundingClientRect();
    var arriba = r.bottom + 6;
    if (arriba + caja.offsetHeight > window.innerHeight - 8) {
      arriba = Math.max(8, r.top - caja.offsetHeight - 6);
    }
    var izq = Math.min(r.left, window.innerWidth - caja.offsetWidth - 8);
    caja.style.top = arriba + 'px';
    caja.style.left = Math.max(8, izq) + 'px';

    caja.querySelectorAll('[data-poner]').forEach(function (b) {
      b.addEventListener('click', async function () {
        cerrarMenuEstado();
        var r2 = await m.poner(id, b.dataset.poner);
        if (r2 && r2.error) {
          await window.kwUI.alert(m.error + r2.error.message);
          return;
        }
        await cargar();
      });
    });

    menuEstado = caja;
    menuAbiertoEn = Date.now();
  }

  document.addEventListener('click', function (e) {
    if (!menuEstado) return;
    if (e.target.closest('.dic-menu-estado, [data-estado-de], [data-marketing-de], [data-listado-de], [data-menu-punto]')) return;
    cerrarMenuEstado();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') cerrarMenuEstado();
  });
  // Colgado con position:fixed, el menú no sigue a la tarjeta al rodar la
  // página: se cierra, que es lo que uno espera.
  window.addEventListener('scroll', cerrarMenuSiSeMovio, true);
  window.addEventListener('resize', cerrarMenuSiSeMovio);

  function rutaDocumento(tipo) {
    var rutas = {
      aceptacion_oferta: 'acuerdos/aceptacionoferta.html',
      aviso_privacidad: 'acuerdos/avisodeprivacidad.html',
      carta_terminacion: 'acuerdos/cartaterminacion.html',
      cedula_registro: 'acuerdos/cedularegistro.html',
      checklist: 'acuerdos/checklist.html',
      colaboracion: 'acuerdos/colaboracion.html',
      contrapropuesta: 'acuerdos/contrapropuesta.html',
      referido: 'acuerdos/referido.html',
      acuerdo_renta: 'contratos/renta.html',
      contrato_profeco: 'contratos/profeco.html'
    };
    return rutas[tipo] ? '/kwpremierweb/documentos/' + rutas[tipo] : '';
  }

  function etiquetaDatoDocumento(clave) {
    var conocidas = {
      inmueble: 'Inmueble', direccion: 'Dirección', cliente: 'Cliente',
      precio: 'Precio', comision: 'Comisión', operacion: 'Operación',
      fecha: 'Fecha', propietario: 'Propietario'
    };
    var limpia = String(clave || '')
      .replace(/^(pv|ct|co|ref|ao|cr|cp|ren|pro)[-_]/i, '')
      .replace(/[-_]+/g, ' ').trim();
    var conocida = conocidas[limpia.toLowerCase()];
    if (conocida) return conocida;
    return limpia ? limpia.charAt(0).toUpperCase() + limpia.slice(1) : 'Dato';
  }

  function valorDatoDocumento(valor) {
    if (valor == null || valor === '') return '';
    if (Array.isArray(valor)) {
      return valor.map(function (v) {
        if (v && typeof v === 'object') {
          return Object.keys(v).map(function (k) {
            var x = valorDatoDocumento(v[k]);
            return x ? etiquetaDatoDocumento(k) + ': ' + x : '';
          }).filter(Boolean).join(' · ');
        }
        return valorDatoDocumento(v);
      }).filter(Boolean).join(' | ');
    }
    if (typeof valor === 'object') {
      return Object.keys(valor).map(function (k) {
        var x = valorDatoDocumento(valor[k]);
        return x ? etiquetaDatoDocumento(k) + ': ' + x : '';
      }).filter(Boolean).join(' · ');
    }
    if (valor === true) return 'Sí';
    if (valor === false) return 'No';
    return String(valor);
  }

  function documentosHTML(d) {
    var docs = documentosEnlazados.filter(function (x) { return x.dictamen_id === d.id; });
    if (!docs.length) {
      return '<div class="kw-vacio" style="padding:var(--sp-4);">No hay documentos enlazados a este expediente.</div>';
    }
    return '<div class="dic-documentos">' + docs.map(function (doc) {
      var campos = Object.keys(doc.datos || {}).map(function (clave) {
        var valor = valorDatoDocumento(doc.datos[clave]);
        if (!valor) return '';
        return dato(escapar(etiquetaDatoDocumento(clave)), valor);
      }).filter(Boolean).join('');
      var ruta = rutaDocumento(doc.tipo_documento);
      return '<article class="dic-documento">' +
        '<div class="dic-documento-cabecera"><div><strong>' +
          escapar(doc.nombre_archivo || 'Documento enlazado') + '</strong><span>' +
          escapar((doc.folio || 'Sin folio') + ' · ' +
            ((Number(doc.revision) || 0) ? 'Revisión ' + Number(doc.revision) : 'Original')) +
          '</span></div>' +
          (ruta ? '<a href="' + ruta + '?doc=' + encodeURIComponent(doc.id) +
            '" target="_blank" rel="noopener noreferrer">Abrir documento</a>' : '') +
        '</div><div class="dic-documento-datos">' + campos + '</div>' +
      '</article>';
    }).join('') + '</div>';
  }

  function confirmarIcono(boton, evento) {
    if (evento) {
      evento.preventDefault();
      evento.stopPropagation();
    }
    if (!boton.classList.contains('preparado')) {
      document.querySelectorAll('.dic-icono-btn.preparado').forEach(function (otro) {
        if (otro !== boton) otro.classList.remove('preparado');
      });
      boton.classList.add('preparado');
      return false;
    }
    boton.classList.remove('preparado');
    return true;
  }

  function navegarEditor(id) {
    if (!id) document.body.classList.add('cargando-nuevo');
    var destino = new URL(location.href);
    destino.search = id ? '?editar=' + encodeURIComponent(id) : '?nuevo=1';
    location.href = destino.href;
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('.dic-icono-btn')) return;
    document.querySelectorAll('.dic-icono-btn.preparado').forEach(function (b) {
      b.classList.remove('preparado');
    });
  });

  function datosMarketing(d) {
    var valor = d.marketing_checklist || {};
    if (typeof valor === 'string') {
      try { valor = JSON.parse(valor); } catch (e) { valor = {}; }
    }
    return valor && typeof valor === 'object' ? valor : {};
  }

  function marketingHTML(d) {
    var datos = datosMarketing(d);
    var editable = puedoDictaminar && !d.archivado_at;
    var correctos = 0;

    var filas = MARKETING_PUNTOS.map(function (p, i) {
      var guardado = datos[p.clave] || {};
      var estado = ['correcto', 'incorrecto'].indexOf(guardado.estado) !== -1
        ? guardado.estado : 'pendiente';
      if (estado === 'correcto') correctos++;

      function opcion(valor, simbolo, titulo) {
        return '<button type="button" class="dic-mkt-opcion ' + valor +
          (estado === valor ? ' activo' : '') + '" data-marketing-marcar="' + valor +
          '" aria-label="' + titulo + '" title="' + titulo + '" aria-pressed="' +
          (estado === valor ? 'true' : 'false') + '"' + (editable ? '' : ' disabled') + '>' +
          simbolo + '</button>';
      }

      return '<div class="dic-mkt-fila ' + estado + '" data-marketing-punto="' + p.clave +
        '" data-estado="' + estado + '">' +
          '<span class="dic-mkt-nombre">' + (i + 1) + '. ' + escapar(p.nombre) + '</span>' +
          '<div class="dic-mkt-opciones">' +
            opcion('correcto', '✓', 'Marcar como correcto') +
            opcion('incorrecto', '×', 'Marcar para corregir') +
          '</div>' +
          '<textarea class="dic-mkt-comentario" rows="1" placeholder="Observaciones"' +
            (editable ? '' : ' readonly') + '>' + escapar(guardado.comentario || '') + '</textarea>' +
        '</div>';
    }).join('');

    return '<div class="dic-mkt-checklist" data-marketing-checklist="' + d.id + '">' +
      '<div class="dic-mkt-encabezado">' +
        '<h4>Checklist de calidad del listado</h4>' +
        '<span class="dic-mkt-progreso" data-marketing-progreso>' +
          correctos + ' de ' + MARKETING_PUNTOS.length + ' correctos</span>' +
      '</div>' +
      '<div class="dic-mkt-lista">' + filas + '</div>' +
      '<div class="dic-mkt-general">' +
        '<label>Comentario general</label>' +
        '<textarea rows="2" data-marketing-general placeholder="Comentario general del listado"' +
          (editable ? '' : ' readonly') + '>' + escapar(d.marketing_comentario_general || '') + '</textarea>' +
      '</div>' +
      (editable
        ? '<div class="dic-mkt-pie"><button type="button" class="btn-nuevo dic-mkt-guardar" ' +
            'data-marketing-guardar="' + d.id + '">Guardar checklist</button></div>'
        : '') +
    '</div>';
  }

  function actualizarProgresoMarketing(panel) {
    if (!panel) return;
    var filas = panel.querySelectorAll('[data-marketing-punto]');
    var correctos = panel.querySelectorAll('[data-marketing-punto][data-estado="correcto"]').length;
    var progreso = panel.querySelector('[data-marketing-progreso]');
    if (progreso) progreso.textContent = correctos + ' de ' + filas.length + ' correctos';
  }

  function cuerpoHTML(d, mios) {
    var personas =
      dato('Asesor responsable', d.asesor_nombre || '') +
      dato(d.clientes_total > 1 ? 'Clientes' : 'Cliente',
        clientesTexto(d), correccionesClientesTexto(d));

    var operacion =
      dato('Dirección del inmueble', d.inmueble, correccionDe(d, 'inmueble')) +
      dato('Tipo de inmueble', d.tipo_inmueble, correccionDe(d, 'tipo_inmueble')) +
      dato('Tipo de contrato', CONTRATOS[d.tipo_contrato] || '',
        correccionDe(d, 'tipo_contrato')) +
      dato('Operación', (OPERACIONES[d.operacion] || '') + ' · ' + (USOS[d.uso] || ''),
        [correccionDe(d, 'operacion'), correccionDe(d, 'uso')].filter(Boolean).join(' · ')) +
      dato('Precio del listado', conPesos(d.precio_listado),
        correccionDe(d, 'precio_listado')) +
      dato('Comisión', conPorciento(d.comision_porcentaje),
        correccionDe(d, 'comision_porcentaje'));

    var escritura =
      datosEscritura(d) +
      dato('Condominio', siNo(d.condominio), correccionDe(d, 'condominio')) +
      dato('Escritura del condominio', d.escritura_condominio,
        correccionDe(d, 'escritura_condominio')) +
      dato('CFDI', d.cfdi, correccionDe(d, 'cfdi')) +
      dato('Folio real', d.folio_real, correccionDe(d, 'folio_real'));

    var medidas =
      dato('Superficie escritura', conUnidad(d.superficie_escritura),
        correccionDe(d, 'superficie_escritura')) +
      dato('Cuenta predial', d.cuenta_predial, correccionDe(d, 'cuenta_predial')) +
      dato('Superficie terreno', conUnidad(d.superficie_terreno),
        correccionDe(d, 'superficie_terreno')) +
      dato('Superficie construcción', conUnidad(d.superficie_construccion),
        correccionDe(d, 'superficie_construccion'));

    var datos = '<div class="dic-datos">' +
      grupoDatos('Personas', personas, 'dic-grupo-personas') +
      grupoDatos('Inmueble y operación', operacion, 'dic-grupo-operacion') +
      grupoDatos('Escritura y registro', escritura, 'dic-grupo-escritura') +
      grupoDatos('Superficies y predial', medidas, 'dic-grupo-medidas') +
    '</div>';

    var obsTexto = separarCorrecciones(d.observaciones).texto;
    var obs = obsTexto
      ? '<div class="kw-nota">' + escapar(obsTexto) + '</div>' : '';

    var lista = mios.length
      ? mios.map(function (p, i) { return puntoHTML(p, i); }).join('')
      : '<div class="dic-sin-observaciones">Sin observaciones por atender.</div>';

    var agregar = (puedoDictaminar && !d.archivado_at)
      ? '<div class="dic-nuevo-punto" data-agregar-en="' + d.id + '">' +
          '<textarea data-nuevo-texto placeholder="Otra observación para este expediente" rows="1"></textarea>' +
          '<button type="button" class="kw-btn-mini" data-nuevo-agregar>Agregar</button>' +
        '</div>'
      : '';

    // Los tres estados se repiten dentro del expediente en el celular.
    // renglón no las enseña, así que aquí adentro van las mismas.
    var enCuerpo = (puedoDictaminar && !d.archivado_at)
      ? '<div class="dic-etiquetas-movil">' +
          etiquetaEstado(d, true) + etiquetaMarketing(d, true) + etiquetaListado(d, true) +
        '</div>'
      : '';

    // Los botones del expediente, puros iconos. Van en el mismo renglón
    // que las pestañas, hasta la derecha: son tres dibujos conocidos y el
    // texto era ancho gastado en decir lo que el dibujo ya dice.
    function iconoBtn(marca, id, titulo, dibujo, saca) {
      var claseAccion = ' accion-' + marca.replace(/^data-/, '');
      return '<button type="button" class="dic-icono-btn' + claseAccion +
        (saca ? ' saca' : '') + '" ' +
        marca + '="' + id + '" title="' + titulo + '" aria-label="' + titulo + '">' +
        dibujo + '<span class="dic-icono-texto">' + escapar(titulo) + '</span></button>';
    }

    var acciones = '<div class="dic-acciones-iconos">' +
      iconoBtn('data-imprimir', d.id, 'PDF solo datos', ICONO_BAJAR) +
      iconoBtn('data-imprimir-correcciones', d.id, 'PDF con correcciones', ICONO_BAJAR) +
      (puedoDictaminar && !d.archivado_at
        ? iconoBtn('data-editar', d.id, 'Editar', ICONO_LAPIZ) +
          iconoBtn('data-archivar', d.id, 'Archivar', ICONO_CAJA, true)
        : '') +
      (puedoDictaminar && d.archivado_at
        ? iconoBtn('data-restaurar', d.id, 'Restaurar', ICONO_REGRESAR) +
          iconoBtn('data-borrar', d.id, 'Borrar', BOTE, true)
        : '') +
    '</div>';

    // Dos pestañas: lo que dice el expediente hoy, y cómo llegó a decir
    // eso. El historial va aparte y no debajo porque es de otra
    // naturaleza: lo de arriba se edita, esto solo se lee.
    // Las pestañas apuntan a sus paneles por id. kw-ui.js los busca como
    // hermanos cuando no se le dice cuáles son, y aquí las pestañas viven
    // dentro de la barra que comparten con los botones: sin el id, no
    // daba con los paneles y picarle a Historial no hacía nada.
    return '<div class="dic-barra-tarjeta">' +
        '<div class="kw-tabs dic-tabs" data-kw-tabs="paneles-' + d.id + '">' +
          '<button type="button" class="kw-tab activo" data-tab="exp-' + d.id + '">Expediente</button>' +
          '<button type="button" class="kw-tab" data-tab="mkt-' + d.id + '">Marketing</button>' +
          '<button type="button" class="kw-tab" data-tab="docs-' + d.id + '">Contrato</button>' +
          '<button type="button" class="kw-tab" data-tab="hist-' + d.id + '">Historial</button>' +
        '</div>' +
        acciones +
      '</div>' +
      '<div class="kw-tabpanels dic-tabpanels" id="paneles-' + d.id + '">' +
        '<section class="kw-tabpanel activo" data-panel="exp-' + d.id + '">' +
          datos +
          '<section class="dic-observaciones-seccion">' +
            '<h4 class="dic-observaciones-titulo">Observaciones</h4>' +
            obs + '<div>' + lista + agregar + '</div>' +
          '</section>' +
          enCuerpo +
        '</section>' +
        '<section class="kw-tabpanel" data-panel="mkt-' + d.id + '">' +
          marketingHTML(d) +
        '</section>' +
        '<section class="kw-tabpanel" data-panel="docs-' + d.id + '">' +
          documentosHTML(d) +
        '</section>' +
        '<section class="kw-tabpanel" data-panel="hist-' + d.id + '">' +
          historialHTML(d) +
        '</section>' +
      '</div>';
  }

  // ── El historial ────────────────────────────────────────────

  var COMO = {
    creado: 'Se levantó el expediente',
    estado: 'Dictamen',
    marketing: 'Marketing',
    marketing_checklist: 'Checklist de Marketing',
    listado: 'Listado',
    revision: 'Revisión',
    contrato_enlazado: 'Contrato enlazado',
    archivado: 'Archivado',
    restaurado: 'Restaurado',
    punto_nuevo: 'Observación nueva',
    punto_corregida: 'Corregida',
    punto_pendiente: 'De vuelta a pendiente',
    punto_quitado: 'Observación quitada',
    punto_nota: 'Nota',
  };

  function historialHTML(d) {
    var suyo = historial
      .filter(function (h) { return h.dictamen_id === d.id; })
      .sort(function (a, b) { return (b.created_at || '').localeCompare(a.created_at || ''); });

    if (!suyo.length) {
      return '<div class="kw-vacio" style="padding:var(--sp-4);">' +
        'Todavía no hay movimientos registrados en este expediente.</div>';
    }

    return '<div class="dic-historia">' + suyo.map(function (h) {
      var titulo = COMO[h.que] || h.que;
      // Hay movimientos cuyo detalle es la misma frase del título (el de
      // "se levantó el expediente", por ejemplo). Repetirla dos renglones
      // seguidos se lee como un error.
      var detalle = (h.detalle && h.detalle !== titulo) ? h.detalle : '';

      return '<div class="dic-historia-fila">' +
        '<span class="dic-historia-punto ' + escapar(h.que) + '"></span>' +
        '<div class="dic-historia-txt">' +
          '<b>' + escapar(titulo) + '</b>' +
          (detalle ? '<span>' + escapar(detalle) + '</span>' : '') +
        '</div>' +
        '<div class="dic-historia-cuando">' +
          fechaHora(h.created_at) +
          (h.quien_nombre ? '<span>' + escapar(h.quien_nombre) + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function fechaHora(iso) {
    if (!iso) return '';
    var f = new Date(iso);
    if (isNaN(f)) return '';
    return f.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }) +
      ' · ' + f.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  }

  // Los dibujos de los botones de cada expediente. Todos con el mismo
  // trazo y el mismo lienzo, para que en hilera se vean de una familia.
  function dibujo(dentro) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + dentro + '</svg>';
  }

  var BOTE = dibujo('<polyline points="3 6 5 6 21 6"/>' +
    '<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' +
    '<line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>');

  var ICONO_BAJAR = dibujo('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
    '<polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>');

  var ICONO_LAPIZ = dibujo('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>' +
    '<path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>');

  var ICONO_CAJA = dibujo('<polyline points="21 8 21 21 3 21 3 8"/>' +
    '<rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>');

  var ICONO_REGRESAR = dibujo('<polyline points="1 4 1 10 7 10"/>' +
    '<path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>');

  var ICONO_MAS = dibujo('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>');

  function puntoHTML(p, i) {
    var corregida = p.estado === 'corregida';

    // Las acciones viven junto al texto: la tarjeta se lee de izquierda a
    // derecha y ya no necesita una segunda fila para operar la observación.
    var btns = puedoDictaminar
      ? '<div class="dic-punto-acciones">' +
          '<button type="button" class="kw-btn-mini" data-mover="' + p.id + '">' +
            (corregida ? '✓ Corregido' : '✓ Corregido') + '</button>' +
          '<button type="button" class="kw-btn-mini oculto-notando" data-nota="' + p.id + '">+ Nota</button>' +
          '<button type="button" class="kw-btn-mini verde solo-notando" data-guardar-nota="' + p.id + '">Enviar nota</button>' +
          '<button type="button" class="kw-btn-mini rojo solo-notando" data-cerrar-form="' + p.id + '">Cancelar</button>' +
        '</div>'
      : '';

    var menu = puedoDictaminar
      ? '<button type="button" class="dic-punto-menu-trigger" data-menu-punto="' + p.id + '" ' +
          'title="Más acciones" aria-label="Más acciones">' + ICONO_MAS + '</button>'
      : '';

    return '<div class="dic-punto' + (corregida ? ' corregida' : '') + '" data-punto="' + p.id + '">' +
      '<div class="dic-punto-cabeza">' +
        '<span class="dic-punto-texto">' + (i + 1) + '. ' + escapar(p.texto) + '</span>' +
        btns +
        '<span class="dic-estado ' + (corregida ? 'autorizada' : 'condicionada') + '">' +
          (corregida ? 'Corregida' : 'Pendiente') + '</span>' +
        menu +
      '</div>' +
      (p.nota ? '<div class="dic-punto-nota">' + escapar(p.nota) + '</div>' : '') +
      '<div class="dic-punto-form" data-form-de="' + p.id + '">' +
        '<textarea placeholder="Una nota sobre esta observación">' + escapar(p.nota || '') + '</textarea>' +
      '</div>' +
    '</div>';
  }

  // ── Los botones de la lista ─────────────────────────────────

  function cablear() {
    var raiz = $('lista');

    function mostrarActualizando(b) {
      b.disabled = true;
      b.classList.add('actualizando');
      var punto = b.closest('.dic-punto');
      if (punto) punto.classList.add('guardando');
      return function () {
        b.disabled = false;
        b.classList.remove('actualizando');
        if (punto) punto.classList.remove('guardando');
      };
    }

    raiz.querySelectorAll('[data-mover]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var p = puntos.find(function (x) { return x.id === b.dataset.mover; });
        if (!p) return;
        var terminar = mostrarActualizando(b);
        try {
          await guardarPunto(p.id, { estado: p.estado === 'corregida' ? 'pendiente' : 'corregida' });
        } finally { terminar(); }
      });
    });

    // Abrir y cerrar la nota marca la observación entera, no nada más el
    // recuadro: de esa marca cuelga qué botones se enseñan.
    function notando(id, si) {
      var caja = raiz.querySelector('[data-form-de="' + id + '"]');
      var punto = raiz.querySelector('[data-punto="' + id + '"]');
      if (caja) caja.classList.toggle('abierto', si);
      if (punto) punto.classList.toggle('notando', si);
      if (si && caja) caja.querySelector('textarea').focus();
    }

    raiz.querySelectorAll('[data-nota]').forEach(function (b) {
      b.addEventListener('click', function () { notando(b.dataset.nota, true); });
    });
    raiz.querySelectorAll('[data-cerrar-form]').forEach(function (b) {
      b.addEventListener('click', function () { notando(b.dataset.cerrarForm, false); });
    });
    raiz.querySelectorAll('[data-guardar-nota]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var caja = raiz.querySelector('[data-form-de="' + b.dataset.guardarNota + '"]');
        if (!caja) return;
        var terminar = mostrarActualizando(b);
        try {
          await guardarPunto(b.dataset.guardarNota,
            { nota: caja.querySelector('textarea').value.trim() || null });
        } finally { terminar(); }
      });
    });

    raiz.querySelectorAll('[data-menu-punto]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        if (menuEstado) { cerrarMenuEstado(); return; }
        var p = puntos.find(function (x) { return x.id === b.dataset.menuPunto; });
        if (!p) return;
        var menu = document.createElement('div');
        menu.className = 'dic-menu-estado dic-menu-punto';
        menu.innerHTML = '<button type="button" data-editar-punto="' + p.id + '">' + ICONO_LAPIZ + 'Editar observación</button>' +
          '<button type="button" class="peligro" data-quitar-punto="' + p.id + '">' + BOTE + 'Eliminar observación</button>';
        document.body.appendChild(menu);
        var r = b.getBoundingClientRect();
        menu.style.top = Math.min(window.innerHeight - menu.offsetHeight - 8, r.bottom + 6) + 'px';
        menu.style.left = Math.max(8, Math.min(r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 8)) + 'px';
        menuEstado = menu;
        menuAbiertoEn = Date.now();
        menu.querySelector('[data-editar-punto]').addEventListener('click', async function () {
          cerrarMenuEstado();
          var texto = window.prompt('Editar observación:', p.texto);
          if (texto === null || texto.trim() === p.texto) return;
          if (!texto.trim()) { await window.kwUI.alert('La observación no puede quedar vacía.'); return; }
          await guardarPunto(p.id, { texto: texto.trim() });
        });
        menu.querySelector('[data-quitar-punto]').addEventListener('click', async function () {
          cerrarMenuEstado();
          if (!(await window.kwUI.confirm('¿Deseas eliminar esta observación?',
            { textoConfirmar: 'Sí', textoCancelar: 'No' }))) return;
          var r2 = await window.kwSupabase.from('dictamen_puntos').delete().eq('id', p.id);
          if (r2.error) { await window.kwUI.alert('No se pudo eliminar: ' + r2.error.message); return; }
          await cargar();
        });
      });
    });

    raiz.querySelectorAll('[data-agregar-en]').forEach(function (caja) {
      var btn = caja.querySelector('[data-nuevo-agregar]');
      var txt = caja.querySelector('[data-nuevo-texto]');
      var agregar = async function () {
        var texto = txt.value.trim();
        if (!texto) return;
        var d = caja.dataset.agregarEn;
        var cuantos = puntos.filter(function (p) { return p.dictamen_id === d; }).length;
        btn.disabled = true;
        var r = await window.kwSupabase.from('dictamen_puntos')
          .insert({ dictamen_id: d, texto: texto, orden: cuantos + 1 });
        btn.disabled = false;
        if (r.error) { await window.kwUI.alert('No se pudo agregar: ' + r.error.message); return; }
        await cargar();
      };
      btn.addEventListener('click', agregar);
      txt.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); agregar(); }
      });
    });

    raiz.querySelectorAll('[data-marketing-marcar]').forEach(function (b) {
      b.addEventListener('click', function () {
        var fila = b.closest('[data-marketing-punto]');
        var panel = b.closest('[data-marketing-checklist]');
        if (!fila || !panel) return;
        var siguiente = b.dataset.marketingMarcar;
        var actual = fila.dataset.estado || 'pendiente';
        fila.dataset.estado = actual === siguiente ? 'pendiente' : siguiente;
        fila.classList.remove('pendiente', 'correcto', 'incorrecto');
        fila.classList.add(fila.dataset.estado);
        fila.querySelectorAll('[data-marketing-marcar]').forEach(function (op) {
          var activo = op.dataset.marketingMarcar === fila.dataset.estado;
          op.classList.toggle('activo', activo);
          op.setAttribute('aria-pressed', activo ? 'true' : 'false');
        });
        actualizarProgresoMarketing(panel);
      });
    });

    raiz.querySelectorAll('[data-marketing-guardar]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var id = b.dataset.marketingGuardar;
        var panel = b.closest('[data-marketing-checklist]');
        if (!panel) return;

        var checklist = {};
        panel.querySelectorAll('[data-marketing-punto]').forEach(function (fila) {
          checklist[fila.dataset.marketingPunto] = {
            estado: fila.dataset.estado || 'pendiente',
            comentario: fila.querySelector('.dic-mkt-comentario').value.trim(),
          };
        });

        b.disabled = true;
        b.textContent = 'Guardando...';
        var r = await window.kwSupabase.rpc('dictamen_guardar_checklist_marketing', {
          p_id: id,
          p_checklist: checklist,
          p_comentario_general: panel.querySelector('[data-marketing-general]').value.trim(),
        });
        if (r.error) {
          b.disabled = false;
          b.textContent = 'Guardar checklist';
          await window.kwUI.alert('No se pudo guardar el checklist: ' + r.error.message);
          return;
        }

        await cargar();
        var tab = $('lista').querySelector('[data-tab="mkt-' + id + '"]');
        if (tab) tab.click();
      });
    });

    [['data-estado-de', 'estadoDe', 'estado'],
     ['data-marketing-de', 'marketingDe', 'marketing'],
     ['data-listado-de', 'listadoDe', 'listado']].forEach(function (t) {
      raiz.querySelectorAll('[' + t[0] + ']').forEach(function (b) {
        b.addEventListener('click', function (e) {
          // Las etiquetas del encabezado viven dentro del renglón que abre
          // y cierra la tarjeta. Sin esto, cambiar el estatus la cerraría
          // de pasada y el menú quedaría flotando sobre una tarjeta ya
          // cerrada.
          e.stopPropagation();
          if (menuEstado) { cerrarMenuEstado(); return; }
          abrirMenu(b, b.dataset[t[1]], t[2]);
        });
      });
    });

    raiz.querySelectorAll('[data-imprimir]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        if (!confirmarIcono(b, e)) return;
        imprimir(b.dataset.imprimir, false);
      });
    });
    raiz.querySelectorAll('[data-imprimir-correcciones]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        if (!confirmarIcono(b, e)) return;
        imprimir(b.dataset.imprimirCorrecciones, true);
      });
    });
    raiz.querySelectorAll('[data-editar]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        if (!confirmarIcono(b, e)) return;
        navegarEditor(b.dataset.editar);
      });
    });

    raiz.querySelectorAll('[data-archivar]').forEach(function (b) {
      b.addEventListener('click', async function (e) {
        if (!confirmarIcono(b, e)) return;
        await window.kwSupabase.from('dictamenes')
          .update({ archivado_at: new Date().toISOString() }).eq('id', b.dataset.archivar);
        abierto = null;
        await cargar();
      });
    });
    raiz.querySelectorAll('[data-restaurar]').forEach(function (b) {
      b.addEventListener('click', async function (e) {
        if (!confirmarIcono(b, e)) return;
        await window.kwSupabase.from('dictamenes')
          .update({ archivado_at: null }).eq('id', b.dataset.restaurar);
        abierto = null;
        await cargar();
      });
    });
    raiz.querySelectorAll('[data-borrar]').forEach(function (b) {
      b.addEventListener('click', async function (e) {
        if (!confirmarIcono(b, e)) return;
        if (!(await window.kwUI.confirm('Se va a borrar este dictamen para siempre, con sus observaciones. No se puede deshacer.\n\n¿Seguimos?'))) return;
        var r = await window.kwSupabase.from('dictamenes').delete().eq('id', b.dataset.borrar);
        if (r.error) { await window.kwUI.alert('No se pudo borrar: ' + r.error.message); return; }
        abierto = null;
        await cargar();
      });
    });
  }

  async function guardarPunto(id, datos) {
    var r = await window.kwSupabase.from('dictamen_puntos').update(datos).eq('id', id);
    if (r.error) { await window.kwUI.alert('No se pudo guardar: ' + r.error.message); return; }
    await cargar();
  }

  // ── El buscador de asesor ───────────────────────────────────

  function elegirAsesor(a) {
    var siguiente = a ? a.id : '';
    if (borrador.asesor_id !== siguiente && !borrador.id) {
      contratoSeleccionado = null;
      borrador.documento_origen_id = null;
      $('e-contrato-buscar').value = '';
      $('e-contrato-operacion').value = 'todos';
      $('e-contrato-uso').value = 'todos';
      $('e-contrato-seleccion').hidden = true;
      $('e-contrato-seleccion').textContent = '';
    }
    borrador.asesor_id = siguiente;
    if (a) {
      $('e-asesor-nombre').innerHTML = escapar(a.nombre) +
        (a.correo ? '<small>' + escapar(a.correo) + '</small>' : '');
      $('e-asesor-puesto').style.display = '';
      $('e-asesor-busca').parentElement.style.display = 'none';
    } else {
      $('e-asesor-puesto').style.display = 'none';
      $('e-asesor-busca').parentElement.style.display = '';
      $('e-asesor-busca').value = '';
      $('e-asesor-lista').classList.remove('abierta');
    }
    pintarContratosOrigen();
  }

  function pintarAsesores() {
    var q = $('e-asesor-busca').value.trim().toLowerCase();
    var caja = $('e-asesor-lista');
    if (!q) { caja.classList.remove('abierta'); return; }

    var hallados = asesores.filter(function (a) {
      if (!a.activo) return false;
      return (a.nombre + ' ' + (a.correo || '')).toLowerCase().indexOf(q) !== -1;
    }).slice(0, 40);

    caja.innerHTML = hallados.length
      ? hallados.map(function (a) {
        return '<button type="button" class="dic-asesor-op" data-asesor="' + a.id + '">' +
          escapar(a.nombre) +
          (a.correo ? '<small>' + escapar(a.correo) + '</small>' : '') +
        '</button>';
      }).join('')
      : '<div class="dic-asesor-vacio">Ningún asesor con ese nombre.</div>';

    caja.classList.add('abierta');
    caja.querySelectorAll('[data-asesor]').forEach(function (b) {
      b.addEventListener('click', function () {
        elegirAsesor(asesores.find(function (a) { return a.id === b.dataset.asesor; }));
      });
    });
  }

  // ── Armar un dictamen ───────────────────────────────────────

  // Los campos del machote, con el id del campo en pantalla al lado del
  // nombre de la columna. La lista vive en un solo lugar para que agregar
  // un renglón sea agregar un renglón aquí, y no acordarse de tocar el
  // leer, el guardar y el reabrir por separado.
  var CAMPOS = [
    ['e-inmueble', 'inmueble'],
    ['e-precio', 'precio_listado'],
    ['e-comision', 'comision_porcentaje'],
    ['e-esc-numero', 'escritura_numero'],
    ['e-esc-fecha', 'escritura_fecha'],
    ['e-notario', 'notario_nombre'],
    ['e-notaria', 'notaria_numero'],
    ['e-esc-condominio', 'escritura_condominio'],
    ['e-cfdi', 'cfdi'],
    ['e-folio-real', 'folio_real'],
    ['e-sup-escritura', 'superficie_escritura'],
    ['e-cuenta-predial', 'cuenta_predial'],
    ['e-sup-terreno', 'superficie_terreno'],
    ['e-sup-construccion', 'superficie_construccion'],
  ];

  var CAMPOS_CORRECCION = CAMPOS.concat([
    ['e-tipo-contrato', 'tipo_contrato'],
    ['e-tipo', 'tipo_inmueble'],
    ['e-operacion', 'operacion'],
    ['e-uso', 'uso'],
    ['e-condominio', 'condominio'],
  ]);

  function opcionesParaCorreccion(campo) {
    return Array.prototype.map.call(campo.options || [], function (o) {
      if (o.value === '__nuevo__') return '';
      return '<button type="button" class="dic-correccion-opcion" ' +
        'data-correccion-opcion data-valor="' + escapar(o.value) + '">' +
        escapar(o.textContent) + '</button>';
    }).join('');
  }

  function crearBloqueCorreccion(campo, llave) {
    var caja = campo && campo.closest('.dic-campo');
    if (!caja) return null;
    var bloque = caja.querySelector('[data-correccion="' + llave + '"]');
    var esSelect = campo.tagName === 'SELECT';

    if (!bloque) {
      bloque = document.createElement('div');
      bloque.className = 'dic-correccion';
      bloque.dataset.correccion = llave;
      bloque.innerHTML =
        '<button type="button" class="dic-correccion-btn">+ Corrección</button>' +
        '<div class="dic-correccion-campo">' +
          (esSelect
            ? '<div class="dic-correccion-combo">' +
                '<button type="button" class="dic-correccion-combo-btn" data-correccion-abrir ' +
                  'aria-haspopup="listbox" aria-expanded="false">' +
                  '<span data-correccion-valor>Elige una opción</span>' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>' +
                '</button>' +
                '<div class="dic-correccion-menu" data-correccion-menu role="listbox"></div>' +
              '</div>'
            : '<textarea data-correccion-texto placeholder="Escribe aquí el dato correcto"></textarea>') +
        '</div>';
      caja.appendChild(bloque);
    }

    if (esSelect) {
      bloque.dataset.origenSelect = campo.id || '';
      var menu = bloque.querySelector('[data-correccion-menu]');
      menu.innerHTML = opcionesParaCorreccion(campo) +
        '<div class="dic-correccion-escribir">' +
          '<input type="text" data-correccion-libre ' +
            'placeholder="Escribe aquí otra opción" autocomplete="off">' +
        '</div>';
    }
    return bloque;
  }

  function prepararCorrecciones() {
    CAMPOS_CORRECCION.forEach(function (c) {
      crearBloqueCorreccion($(c[0]), c[1]);
    });
    if (borrador) pintarCorrecciones(document);
  }

  function cerrarCombosCorreccion(salvo) {
    document.querySelectorAll('.dic-correccion-combo.abierto').forEach(function (combo) {
      if (combo === salvo) return;
      combo.classList.remove('abierto');
      var boton = combo.querySelector('[data-correccion-abrir]');
      if (boton) boton.setAttribute('aria-expanded', 'false');
    });
  }

  function ponerValorCorreccion(bloque, valor, libre) {
    if (!borrador || !bloque) return;
    var llave = bloque.dataset.correccion;
    var texto = String(valor || '');
    if (CAMPOS_CON_COMAS.indexOf(llave) !== -1 && /^[\d,]*$/.test(texto)) {
      texto = conComasMientrasEscribe(texto);
    }
    borrador.correcciones[llave] = texto;

    var etiqueta = bloque.querySelector('[data-correccion-valor]');
    if (etiqueta) etiqueta.textContent = texto || 'Elige una opción';
    bloque.dataset.valorCorreccion = texto;
    var campoLibre = bloque.querySelector('[data-correccion-libre]');
    if (campoLibre && libre && campoLibre.value !== texto) campoLibre.value = texto;
  }

  function pintarCorrecciones(raiz) {
    (raiz || document).querySelectorAll('[data-correccion]').forEach(function (bloque) {
      var valor = (borrador && borrador.correcciones || {})[bloque.dataset.correccion] || '';
      var opciones = bloque.querySelectorAll('[data-correccion-opcion]');
      var libre = bloque.querySelector('[data-correccion-libre]');
      var texto = bloque.querySelector('[data-correccion-texto]');
      var etiqueta = bloque.querySelector('[data-correccion-valor]');

      if (opciones.length) {
        var encontrada = Array.prototype.find.call(opciones, function (o) {
          return o.dataset.valor === valor ||
            o.textContent.trim().toLowerCase() === String(valor).toLowerCase();
        });
        bloque.dataset.valorCorreccion = valor;
        if (etiqueta) etiqueta.textContent = valor || 'Elige una opción';
        if (libre) libre.value = encontrada ? '' : valor;
      } else if (texto) {
        texto.value = valor;
      }
      bloque.classList.toggle('abierta', !!valor);
    });
  }

  document.addEventListener('click', function (e) {
    var botonCorreccion = e.target.closest('.dic-correccion-btn');
    if (botonCorreccion) {
      var bloque = botonCorreccion.closest('[data-correccion]');
      bloque.classList.toggle('abierta');
      if (bloque.classList.contains('abierta')) {
        var control = bloque.querySelector('[data-correccion-abrir], [data-correccion-texto]');
        if (control) control.focus();
      }
      return;
    }

    var abrir = e.target.closest('[data-correccion-abrir]');
    if (abrir) {
      var combo = abrir.closest('.dic-correccion-combo');
      var seAbre = !combo.classList.contains('abierto');
      cerrarCombosCorreccion(seAbre ? combo : null);
      combo.classList.toggle('abierto', seAbre);
      abrir.setAttribute('aria-expanded', seAbre ? 'true' : 'false');
      return;
    }

    var opcion = e.target.closest('[data-correccion-opcion]');
    if (opcion) {
      var bloqueOpcion = opcion.closest('[data-correccion]');
      ponerValorCorreccion(bloqueOpcion, opcion.textContent.trim(), false);
      cerrarCombosCorreccion();
      return;
    }

    if (!e.target.closest('.dic-correccion-combo')) cerrarCombosCorreccion();
  });

  document.addEventListener('input', function (e) {
    if (e.target.matches('[data-correccion-texto]')) {
      ponerValorCorreccion(e.target.closest('[data-correccion]'), e.target.value, false);
    } else if (e.target.matches('[data-correccion-libre]')) {
      ponerValorCorreccion(e.target.closest('[data-correccion]'), e.target.value, true);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && e.target.closest('.dic-correccion-combo')) {
      cerrarCombosCorreccion();
    }
    if (e.key === 'Enter' && e.target.matches('[data-correccion-libre]')) {
      e.preventDefault();
      cerrarCombosCorreccion();
    }
  });

  // Las superficies se guardan como número pelón y la unidad se pone al
  // enseñarlas. Antes eran texto libre, así que en la base ya hay
  // "92.40", "92.40 m2" y "92.40 m²" queriendo decir lo mismo: al leer se
  // le quita la unidad venga como venga, y al pintar se le pone una sola.
  var SUPERFICIES = ['superficie_escritura', 'superficie_terreno', 'superficie_construccion'];

  // El precio y la comisión sí son número en la base, así que lo que se
  // teclee tiene que llegar pelón: quien captura escribe "4,500,000" o
  // "$4.500,000.00" y las dos cosas quieren decir lo mismo.
  var NUMERICOS = ['precio_listado', 'comision_porcentaje'];

  function soloCifra(v) {
    var s = String(v == null ? '' : v).replace(/[^\d.]/g, '');
    // De varios puntos se queda el último, que es el de los decimales:
    // "4.500.000" es cuatro millones y medio escrito a la europea.
    var partes = s.split('.');
    if (partes.length > 2) s = partes.slice(0, -1).join('') + '.' + partes[partes.length - 1];
    return s;
  }

  function conPesos(v) {
    var n = Number(soloCifra(v));
    if (!soloCifra(v) || isNaN(n)) return '';
    return '$' + n.toLocaleString('es-MX', {
      minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2,
    });
  }

  function conPorciento(v) {
    var n = soloCifra(v);
    return n ? n + ' %' : '';
  }

  function conComasMientrasEscribe(v) {
    var limpio = String(v == null ? '' : v).replace(/[^\\d]/g, '');
    return limpio ? limpio.replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',') : '';
  }
  var CAMPOS_CON_COMAS = ['precio_listado'];

  // Lo que se teclea en un campo se guarda ya limpio, según de qué campo
  // se trate. Está en un solo lugar porque el leer y el reabrir tienen
  // que estar de acuerdo: si uno limpia y el otro no, el campo se ve
  // distinto cada vez que se abre el expediente.
  function limpiar(col, v) {
    if (SUPERFICIES.indexOf(col) !== -1) return soloNumero(v);
    if (NUMERICOS.indexOf(col) !== -1) return soloCifra(v);
    return v;
  }

  // Un precio de siete dígitos sin separadores se cuenta con el dedo.
  // Las comas se ponen para verlo y se quitan al guardar, así que en la
  // base sigue entrando el número pelón.
  function conComas(v) {
    var n = soloCifra(v);
    if (!n) return '';
    var p = n.split('.');
    return Number(p[0]).toLocaleString('es-MX') + (p.length > 1 ? '.' + p[1] : '');
  }

  function paraCampo(col, v) {
    return col === 'precio_listado' ? conComas(v) : limpiar(col, v);
  }

  var ESTADOS_CIVILES = [
    'Soltero(a)',
    'Casado(a) por sociedad conyugal',
    'Casado(a) por separación de bienes',
    'Divorciado(a)',
  ];

  function soloNumero(v) {
    return String(v == null ? '' : v).replace(/\s*m\s*(2|²)\s*$/i, '').trim();
  }

  function conUnidad(v) {
    var n = soloNumero(v);
    return n ? n + ' m²' : '';
  }

  // ── Los clientes del expediente ─────────────────────────────

  // Las opciones del estado civil de un cliente. Si el expediente venía
  // con algo escrito a mano (de cuando era campo libre y estaba en el
  // dictamen, no en cada persona) se le agrega su propia opción: dejarlo
  // caer en "Sin especificar" le borraría un dato sin avisarle a nadie.
  function opcionesEstadoCivil(valor) {
    var lista = ESTADOS_CIVILES.slice();
    if (valor && lista.indexOf(valor) === -1) lista.push(valor);
    return '<option value="">Sin especificar</option>' +
      lista.map(function (e) {
        return '<option value="' + escapar(e) + '"' +
          (e === valor ? ' selected' : '') + '>' + escapar(e) + '</option>';
      }).join('');
  }

  // Cuántas casillas hay que enseñar. El desplegable llega hasta 5 y de
  // ahí en adelante manda el número que se escriba, topado para que un
  // teclazo no pinte trescientas tarjetas.
  function cuantosClientes() {
    var sel = $('e-clientes-cuantos').value;
    if (sel !== '__mas__') return Number(sel) || 1;
    var n = Number($('e-clientes-otros').value) || 6;
    return Math.max(6, Math.min(30, n));
  }

  // Lo escrito se guarda en el borrador antes de volver a pintar, para
  // que cambiar el número de clientes no borre lo que ya se había
  // capturado en las casillas de arriba.
  function leerClientes() {
    $('e-clientes').querySelectorAll('[data-cliente]').forEach(function (caja) {
      var i = Number(caja.dataset.cliente);
      borrador.clientes[i] = {
        nombre: caja.querySelector('[data-cliente-nombre]').value.trim(),
        estado_civil: caja.querySelector('[data-cliente-estado]').value || null,
      };
    });
  }

  function pintarClientes() {
    var n = cuantosClientes();
    var html = '';
    for (var i = 0; i < n; i++) {
      var c = borrador.clientes[i] || { nombre: '', estado_civil: '' };
      html += '<div class="dic-cliente" data-cliente="' + i + '">' +
        '<div class="dic-cliente-num">Cliente ' + (i + 1) + '</div>' +
        '<div class="dic-dos">' +
          '<div class="dic-campo">' +
            '<label>Nombre</label>' +
            '<input type="text" class="kw-input" data-cliente-nombre ' +
              'autocomplete="off" ' +
              'value="' + escapar(c.nombre || '') + '">' +
          '</div>' +
          '<div class="dic-campo">' +
            '<label>Estado civil</label>' +
            '<select data-cliente-estado>' + opcionesEstadoCivil(c.estado_civil) + '</select>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    $('e-clientes').innerHTML = html;
    $('e-clientes').querySelectorAll('[data-cliente]').forEach(function (caja) {
      var i = Number(caja.dataset.cliente);
      crearBloqueCorreccion(
        caja.querySelector('[data-cliente-nombre]'),
        'cliente_' + i + '_nombre'
      );
      crearBloqueCorreccion(
        caja.querySelector('[data-cliente-estado]'),
        'cliente_' + i + '_estado_civil'
      );
    });
    pintarCorrecciones($('e-clientes'));
    // Los desplegables recién pintados todavía son los grises del
    // navegador hasta que kw-ui los arma.
    if (window.kwUI) window.kwUI.selects($('e-clientes'));

    // Lo que se teclee se va guardando solo: así cambiar el número de
    // clientes, o guardar, no depende de que el campo haya perdido el foco.
    $('e-clientes').querySelectorAll('[data-cliente-nombre]').forEach(function (inp) {
      inp.addEventListener('input', leerClientes);
    });
    $('e-clientes').querySelectorAll('[data-cliente-estado]').forEach(function (sel) {
      sel.addEventListener('change', leerClientes);
    });
  }

  // El campo del número exacto solo estorba mientras no se elija "Más
  // de 5", así que vive escondido hasta entonces.
  function acomodarCuantos() {
    var mas = $('e-clientes-cuantos').value === '__mas__';
    $('e-clientes-otros-caja').style.display = mas ? '' : 'none';
    if (mas && !$('e-clientes-otros').value) $('e-clientes-otros').value = '6';
  }

  // De dónde salen los clientes de un expediente que se abre. Los de la
  // tabla nueva mandan; si no tiene (porque se capturó antes de que los
  // clientes fueran varios), se arma uno solo con lo que traía el
  // dictamen en sus casillas viejas, para no llegar con el formulario en
  // blanco a un expediente que sí tenía cliente.
  function clientesDe(d) {
    if (!d) return [{ nombre: '', estado_civil: '' }];

    var suyos = clientes
      .filter(function (c) { return c.dictamen_id === d.id; })
      .sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); })
      .map(function (c) { return { nombre: c.nombre, estado_civil: c.estado_civil || '' }; });
    if (suyos.length) return suyos;

    if (d.cliente || d.estado_civil) {
      return [{ nombre: d.cliente || '', estado_civil: d.estado_civil || '' }];
    }
    return [{ nombre: '', estado_civil: '' }];
  }

  // La escritura del condominio solo se pide si se dijo que sí.
  function acomodarCondominio() {
    $('e-esc-condominio-caja').style.display =
      $('e-condominio').value === 'si' ? '' : 'none';
  }

  function abrirEditor(id) {
    var d = id ? dictamenes.find(function (x) { return x.id === id; }) : null;

    contratoSeleccionado = null;
    borrador = {
      id: d ? d.id : null,
      documento_origen_id: null,
      asesor_id: d ? d.asesor_id : '',
      operacion: d ? d.operacion : 'venta',
      uso: d ? d.uso : 'residencial',
      tipo_inmueble_id: (d && d.tipo_inmueble_id) || '',
      fecha_dictamen: (d && d.fecha_dictamen) || hoy(),
      tipo_contrato: (d && d.tipo_contrato) || '',
      // En la base es booleano y aquí desplegable, así que viaja como
      // texto: "" es que todavía no se contesta, que no es lo mismo que no.
      condominio: d && d.condominio !== null && d.condominio !== undefined
        ? (d.condominio ? 'si' : 'no') : '',
      clientes: clientesDe(d),
      observaciones_base: d ? separarCorrecciones(d.observaciones).texto : '',
      correcciones: d ? separarCorrecciones(d.observaciones).correcciones : {},
      // El id viaja con cada observación: es lo que deja saber después
      // cuáles ya existían y cuáles se acaban de escribir, para no
      // borrarlas todas y volverlas a crear en cada guardada.
      puntos: d
        ? puntos.filter(function (p) { return p.dictamen_id === d.id; })
          .map(function (p) {
            return { id: p.id, texto: p.texto, estado: p.estado, nota: p.nota };
          })
        : [],
    };
    CAMPOS.forEach(function (c) { borrador[c[1]] = (d && d[c[1]]) || ''; });

    $('editor-titulo').textContent = d
      ? 'Editar dictamen' + (Number(d.revision) > 0 ? ' · Rev ' + Number(d.revision) : '')
      : 'Nuevo dictamen';
    $('e-operacion').value = borrador.operacion;
    $('e-uso').value = borrador.uso;
    $('e-tipo').value = borrador.tipo_inmueble_id;
    $('e-tipo-contrato').value = borrador.tipo_contrato;
    $('e-condominio').value = borrador.condominio;
    $('e-tipo-nuevo').style.display = 'none';
    $('e-tipo-nuevo').value = '';
    // El desplegable del sitio pinta su rótulo escuchando "change", y
    // poner el valor desde el código no lo dispara.
    ['e-operacion', 'e-uso', 'e-tipo', 'e-tipo-contrato', 'e-condominio'].forEach(function (x) {
      $(x).dispatchEvent(new Event('change', { bubbles: true }));
    });
    CAMPOS.forEach(function (c) { $(c[0]).value = paraCampo(c[1], borrador[c[1]]); });
    ponerFechaEscritura(borrador.escritura_fecha);
    pintarCorrecciones();
    // kw-ui.js mantiene el campo como texto visible y guarda el ISO en su
    // descriptor interno. No se cambia de nuevo a type=date: hacerlo
    // mezclaba el calendario nativo con el personalizado y borraba la fecha.
    elegirAsesor(asesores.find(function (a) { return a.id === borrador.asesor_id; }));

    // Cuántos clientes son lo dice lo que ya trae capturado; uno nuevo
    // arranca en uno, que es el caso de todos los días.
    var cuantos = Math.max(1, borrador.clientes.length);
    $('e-clientes-cuantos').value = cuantos > 5 ? '__mas__' : String(cuantos);
    $('e-clientes-otros').value = cuantos > 5 ? String(cuantos) : '';
    $('e-clientes-cuantos').dispatchEvent(new Event('change', { bubbles: true }));
    acomodarCuantos();
    pintarClientes();
    acomodarCondominio();

    aviso('editor-msg', '', '');
    $('e-listo').classList.remove('visible');
    $('e-origen').style.display = d ? 'none' : '';
    $('e-contrato-buscar').value = '';
    $('e-contrato-operacion').value = 'todos';
    $('e-contrato-uso').value = 'todos';
    $('e-contrato-seleccion').hidden = true;
    $('e-contrato-seleccion').textContent = '';
    pintarContratosOrigen();
    pintarPuntosEditor();

    $('vista-lista').style.display = 'none';
    $('vista-editor').style.display = '';
    document.body.classList.remove('en-lista');
    document.body.classList.remove('cargando-nuevo');
    window.scrollTo(0, 0);
  }

  function cerrarEditor() {
    borrador = null;
    if (location.search) {
      location.replace(location.pathname);
      return;
    }
    $('vista-editor').style.display = 'none';
    $('vista-lista').style.display = '';
    document.body.classList.add('en-lista');
  }

  function pintarPuntosEditor() {
    // Sin observaciones no se pinta nada: el renglón para agregarlas va
    // aquí abajo y ya dice solo lo que hay que hacer.
    if (!borrador.puntos.length) {
      $('e-puntos').innerHTML = '';
      return;
    }
    $('e-puntos').innerHTML = borrador.puntos.map(function (p, i) {
      return '<div class="dic-punto-edit">' +
        '<span class="dic-punto-edit-num">' + (i + 1) + '</span>' +
        '<textarea class="dic-punto-edit-texto" data-editar="' + i + '" ' +
          'aria-label="Editar observación">' + escapar(p.texto) + '</textarea>' +
        '<button type="button" class="dic-quitar" data-quitar="' + i + '" aria-label="Quitar">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
      '</div>';
    }).join('');

    $('e-puntos').querySelectorAll('[data-editar]').forEach(function (campo) {
      campo.addEventListener('input', function () {
        borrador.puntos[Number(campo.dataset.editar)].texto = campo.value;
      });
    });
    $('e-puntos').querySelectorAll('[data-quitar]').forEach(function (b) {
      b.addEventListener('click', function () {
        borrador.puntos.splice(Number(b.dataset.quitar), 1);
        pintarPuntosEditor();
      });
    });
  }

  function leerEditor() {
    sincronizarFechaEscritura();
    // En uno nuevo la fecha pertenece al día en que se guarda; al editar
    // se conserva la fecha con la que el dictamen fue creado.
    if (!borrador.id) borrador.fecha_dictamen = hoy();
    borrador.operacion = $('e-operacion').value;
    borrador.uso = $('e-uso').value;
    borrador.tipo_contrato = $('e-tipo-contrato').value;
    borrador.condominio = $('e-condominio').value;
    leerClientes();
    CAMPOS.forEach(function (c) { borrador[c[1]] = limpiar(c[1], $(c[0]).value.trim()); });
  }

  // Si se escribió un tipo nuevo, se guarda en el catálogo antes que nada
  // y se usa el que quedó. Así la próxima vez ya sale en la lista, igual
  // que las etiquetas de Firmas.
  async function resolverTipo() {
    var elegido = $('e-tipo').value;
    if (elegido !== '__nuevo__') return elegido || null;

    var nombre = $('e-tipo-nuevo').value.trim();
    if (!nombre) return null;

    var ya = tipos.find(function (t) {
      return t.nombre.toLowerCase() === nombre.toLowerCase();
    });
    if (ya) return ya.id;

    var r = await window.kwSupabase.from('dictamen_tipos_inmueble')
      .insert({ nombre: nombre }).select('id, nombre').single();
    if (r.error) { await fallo('No se pudo guardar el tipo de inmueble: ' + r.error.message); return null; }
    tipos.push(r.data);
    await cargarCatalogos();
    return r.data.id;
  }

  // Guarda el dictamen y sus observaciones. Las observaciones se borran y
  // se vuelven a escribir en vez de andar comparando cuál cambió: el
  // editor es de quien dictamina y nadie más las está tocando mientras.
  // Por qué no se guardó tiene que llegarle a quien le picó a Guardar. El
  // mensaje de la tarjeta vive hasta arriba del formulario y el botón está
  // hasta abajo: con la página abajo, ese renglón queda fuera de la
  // pantalla y guardar se siente como que no hizo nada. Por eso el error
  // va también en el aviso de en medio, y el campo que falta se trae a la
  // vista para poder corregirlo de una vez.
  async function fallo(texto, campo) {
    aviso('editor-msg', texto, 'error');
    await window.kwUI.alert(texto);
    var el = campo && $(campo);
    if (el) {
      el.scrollIntoView({ block: 'center' });
      try { el.focus(); } catch (e) { /* un desplegable armado no siempre lo acepta */ }
    }
    return null;
  }

  async function guardar() {
    leerEditor();
    // Se puede guardar aunque el expediente esté incompleto. Mientras
    // falten asesor, inmueble o cliente permanece como borrador y no se
    // ofrece dictaminarlo todavía.
    if ($('e-esc-anio').value || $('e-esc-mes').value || $('e-esc-dia').value) {
      if (!$('e-esc-fecha').value) return await fallo('Completa día, mes y año de la escrituración.', 'e-esc-dia');
      var fesc = new Date(Number($('e-esc-anio').value), Number($('e-esc-mes').value) - 1, Number($('e-esc-dia').value));
      if (fesc.getFullYear() !== Number($('e-esc-anio').value) ||
          fesc.getMonth() + 1 !== Number($('e-esc-mes').value) ||
          fesc.getDate() !== Number($('e-esc-dia').value)) {
        return await fallo('La fecha de escrituración no es válida.', 'e-esc-dia');
      }
    }

    // De los clientes se guardan nada más los que traen nombre: las
    // casillas de más que hayan quedado abiertas por haber subido el
    // número y luego bajarlo no son clientes, son casillas vacías.
    var losClientes = borrador.clientes
      .slice(0, cuantosClientes())
      .filter(function (c) { return c && c.nombre; });
    borrador.completo_para_dictaminar = !!(borrador.asesor_id &&
      borrador.inmueble && borrador.inmueble.length >= 3 && losClientes.length);

    var fila = {
      asesor_id: borrador.asesor_id || null,
      fecha_dictamen: borrador.fecha_dictamen,
      operacion: borrador.operacion,
      uso: borrador.uso,
      tipo_contrato: borrador.tipo_contrato || null,
      condominio: borrador.condominio === '' ? null : borrador.condominio === 'si',
      tipo_inmueble_id: await resolverTipo(),
    };
    // Los vacíos van como nulo y no como cadena vacía: en la base son la
    // misma ausencia, pero una cadena vacía se cuela en las búsquedas y en
    // los reportes como si fuera un dato.
    CAMPOS.forEach(function (c) { fila[c[1]] = borrador[c[1]] || null; });
    fila.inmueble = borrador.inmueble || null;
    // La casilla vieja se mantiene al día con los nombres de la tabla
    // nueva. No es la fuente (esa es dictamen_clientes), pero sí lo que
    // leen los reportes de antes, y dejarla congelada haría que un
    // expediente editado hoy siguiera diciendo el cliente de ayer.
    fila.cliente = losClientes.map(function (c) { return c.nombre; }).join(', ');
    fila.observaciones = juntarCorrecciones(borrador.observaciones_base, borrador.correcciones);
    // Si el condominio quedó en no, la escritura que se hubiera escrito
    // antes deja de tener a qué referirse.
    if (borrador.condominio !== 'si') fila.escritura_condominio = null;

    var id = borrador.id;
    var eraEdicion = !!id;
    if (id) {
      var u = await window.kwSupabase.from('dictamenes').update(fila).eq('id', id);
      if (u.error) return await fallo('No se pudo guardar: ' + u.error.message);
      // Los clientes sí se rehacen enteros: no llevan historial ni fechas
      // propias, así que volver a escribirlos no pierde nada.
      await window.kwSupabase.from('dictamen_clientes').delete().eq('dictamen_id', id);
    } else {
      fila.dictaminado_por = yo.id;
      var c = await window.kwSupabase.from('dictamenes').insert(fila).select('id').single();
      if (c.error) return await fallo('No se pudo guardar: ' + c.error.message);
      id = c.data.id;
      borrador.id = id;
    }

    if (losClientes.length) {
      var rc = await window.kwSupabase.from('dictamen_clientes').insert(
