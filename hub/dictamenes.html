<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dictaminación de Expedientes</title>
<link rel="icon" type="image/png" href="/kwpremierweb/assets/img/favicon.png" />
<style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
<script>
  setTimeout(function () {
    if (!document.documentElement.classList.contains('kw-auth-ok')) {
      console.error('auth-guard.js no respondió a tiempo; redirigiendo al login por seguridad.');
      location.replace('/kwpremierweb/login.html');
    }
  }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kwpremierweb/assets/js/auth-guard.js"></script>
<script src="/kwpremierweb/assets/js/notif-bell.js"></script>
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-base.css?v=20260829">
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-claro.css?v=20260829">
<script src="/kwpremierweb/assets/js/kw-ui.js?v=20260822a"></script>
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  /* ── La barra de arriba ─────────────────────────────────────── */
  .dic-barra {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4);
  }
  .btn-nuevo {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 999px;
    border: none; background: var(--red); color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 14px rgba(40,12,12,0.2);
    transition: transform var(--t-medio);
  }
  .btn-nuevo:hover { transform: translateY(-1px); }
  .btn-nuevo:disabled { opacity: 0.5; cursor: default; transform: none; }

  /* ── La cinta de arriba ──
     El header dejaba de flotar sobre la página pero seguía costando su
     banda: .kw-page le apartaba 90px que eran casi todo aire, y debajo
     venía otro renglón nada más para el título y dos botones. Aquí los
     dos son uno solo: el header se queda quieto en el flujo, se lleva el
     título adentro y los botones van a su derecha. */
  .dic-cinta {
    display: flex; align-items: center; gap: 10px;
    /* El ancho va explícito, igual que en .kw-page: el body es una
       columna flexible y sin esto la cinta se encoge a lo que mide su
       contenido y se queda flotando a media pantalla. */
    width: 100%; box-sizing: border-box;
    max-width: var(--ancho-pagina); margin: 12px auto 0;
    padding: 0 var(--sp-4);
  }
  .dic-cinta > header.kw-header {
    position: static; flex: 1; min-width: 0;
    top: auto; left: auto; right: auto; margin: 0;
  }
  /* En el celular drawer.js esconde el header al rodar la página con un
     transform. Quieto en el flujo, eso dejaría un hueco donde estaba. */
  .dic-cinta > header.kw-header.kw-header-oculto { transform: none; }
  /* Ya sin la banda del header, la página empieza arriba. */
  main.kw-page { padding-top: var(--sp-4); }

  /* El título vivía escondido en el header y repetido como encabezado de
     la página. Ahora hay uno solo y es este, así que se ve en los dos
     tamaños. */
  /* Va pegado a la lupa y no centrado: aquí no es el rótulo de una barra
     de aplicación, es el título de la pantalla, y un título se lee desde
     la izquierda como cualquier otro encabezado. */
  .dic-cinta .kw-header-title {
    display: block; text-align: left; font-size: 15px;
    padding-left: 2px;
  }
  .dic-cinta-acciones { display: flex; gap: 8px; flex-shrink: 0; }

  @media (max-width: 700px) {
    .dic-cinta { flex-wrap: wrap; padding: 0 var(--sp-3); }
    .dic-cinta > header.kw-header { flex-basis: 100%; }
    .dic-cinta-acciones { width: 100%; }
    .dic-cinta-acciones .btn-nuevo { flex: 1; justify-content: center; }
  }

  /* ── Lo de arriba ──
     El buscador y los tres números en un mismo renglón: cada uno por su
     lado dejaba media hilera vacía. El buscador manda un poco más porque
     es lo que más se usa, pero no tanto como para dejar a los números
     apretados. En el celular se apilan. */
  .dic-arriba {
    display: flex; gap: var(--sp-2); align-items: stretch;
    margin-bottom: var(--sp-3);
  }
  /* El buscador se queda de la mitad de lo que medía: con lo que se
     escribe ahí (un folio, media calle) sobraba ancho, y ese ancho le
     sirve más a los tres números de al lado. */
  .dic-arriba > .dic-campo-buscar { flex: 0 1 230px; min-width: 0; }
  .dic-arriba > .dic-resumen { flex: 1 1 460px; min-width: 0; margin: 0; }
  .dic-arriba .kw-buscador, .dic-arriba .kw-buscador input { height: 100%; }
  @media (max-width: 820px) {
    .dic-arriba { flex-wrap: wrap; }
    .dic-arriba > .dic-campo-buscar { flex-basis: 100%; }
    .dic-arriba .kw-buscador, .dic-arriba .kw-buscador input { height: var(--control-h); }
  }

  /* ── El resumen ──
     Tres números y ya. Es lo que uno viene a saber al entrar. Cada uno
     filtra la lista, para no tener que ir a buscar el filtro.

     Cada tarjeta va con el borde del color de su etiqueta. Las tres
     blancas y en hilera no se distinguían entre sí, y el color ya lo
     tienen asignado más abajo: devuelto rojo, condicionado amarillo,
     autorizado verde. Verlo aquí y en la lista es la misma clave. */
  .dic-resumen { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
  .dic-tarjeta {
    flex: 1 1 130px; min-width: 0;
    display: flex; flex-direction: column; gap: 2px; justify-content: center;
    padding: 11px 15px; border-radius: 14px;
    border: 1.5px solid var(--border); background: #fff;
    box-shadow: var(--sombra-1);
    color: var(--text); font-family: inherit; text-align: left; cursor: pointer;
    transition: background var(--t-medio), border-color var(--t-medio);
  }
  .dic-tarjeta.devuelta     { border-color: rgba(176,42,42,0.42); }
  .dic-tarjeta.condicionada { border-color: rgba(122,86,16,0.38); }
  .dic-tarjeta.autorizada   { border-color: rgba(23,96,58,0.38); }
  .dic-tarjeta.devuelta:hover,     .dic-tarjeta.devuelta.activa     { background: #fdeaea; }
  .dic-tarjeta.condicionada:hover, .dic-tarjeta.condicionada.activa { background: var(--pastel-crema); }
  .dic-tarjeta.autorizada:hover,   .dic-tarjeta.autorizada.activa   { background: var(--pastel-menta); }
  /* La elegida se pinta de su color y además engorda el borde, para que
     se sepa cuál está puesta sin depender nada más del relleno. */
  .dic-tarjeta.activa { box-shadow: var(--sombra-1), inset 0 0 0 1.5px currentColor; }
  .dic-tarjeta.devuelta.activa     { color: #b02a2a; }
  .dic-tarjeta.condicionada.activa { color: var(--pastel-crema-txt); }
  .dic-tarjeta.autorizada.activa   { color: var(--pastel-menta-txt); }
  .dic-tarjeta-num { font-size: 21px; font-weight: 700; line-height: 1.1; }
  .dic-tarjeta-txt { font-size: 11.5px; color: var(--muted); }
  .dic-tarjeta.activa .dic-tarjeta-txt { color: inherit; opacity: 0.85; }

  /* ── El estado del dictamen ──
     Cada uno con su color, porque es lo que se viene a mirar de un
     vistazo: devuelto naranja, condicionado amarillo, autorizado verde. */
  .dic-estado {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; white-space: nowrap;
  }
  .dic-estado::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .dic-estado.borrador     { background: rgba(0,0,0,0.05);   color: #5b5b5b; }
  .dic-estado.devuelta     { background: #fdeaea;            color: #b02a2a; }
  .dic-estado.condicionada { background: var(--pastel-crema); color: var(--pastel-crema-txt); }
  .dic-estado.autorizada   { background: var(--pastel-menta); color: var(--pastel-menta-txt); }

  /* El estatus del listado. Comparte forma con la del dictamen pero no
     colores: son dos preguntas distintas y verlas iguales las confunde. */
  .dic-listado {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; white-space: nowrap;
    max-width: 190px; overflow: hidden; text-overflow: ellipsis;
  }
  .dic-listado::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .dic-listado.pendiente   { background: rgba(0,0,0,0.05); color: #5b5b5b; }
  .dic-listado.sin_listado { background: #fdeaea;          color: #b02a2a; }
  .dic-listado.aprobado    { background: var(--pastel-menta); color: var(--pastel-menta-txt); }

  .dic-menu-op i.pendiente   { background: #5b5b5b; }
  .dic-menu-op i.sin_listado { background: #b02a2a; }
  .dic-menu-op i.aprobado    { background: var(--pastel-menta-txt); }

  /* Las dos etiquetas juntas, para el celular. */
  .dic-etiquetas-movil { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (min-width: 901px) { .dic-etiquetas-movil { display: none; } }

  /* ── Las dos autorizaciones como dos columnas ──
     Cada una con el mismo ancho en todos los renglones: sin eso, un
     estatus largo empuja al de junto y las etiquetas quedan escalonadas
     de tarjeta en tarjeta, que es lo que hacía difícil compararlas. La
     línea de en medio es la que las separa de verdad.

     Los rótulos de arriba viven fuera de las tarjetas, así que su
     alineación se sostiene repitiendo aquí las medidas del renglón: el
     relleno de la tarjeta (16px), el hueco antes de la flecha (12px) y
     la flecha misma (17px). */
  .dic-cabecera { display: none; }
  @media (min-width: 901px) {
    .dic-col { width: 200px; flex-shrink: 0; }
    .dic-col-listado {
      border-left: 1px solid var(--border);
      padding-left: 20px; margin-left: -4px;
    }
    .dic-col .dic-estado, .dic-col .dic-listado { max-width: 100%; }

    .dic-cabecera {
      display: flex; justify-content: flex-end; gap: 20px;
      /* El 1px de más es el borde de la tarjeta, que los rótulos no
         tienen y que si no los deja corridos por esa misma cantidad. */
      padding: 0 calc(16px + 12px + 17px + 1px) 7px 16px;
      margin-bottom: 2px;
    }
    .dic-cabecera-col {
      width: 200px; flex-shrink: 0;
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted);
    }
    .dic-cabecera-col:last-child { padding-left: 20px; margin-left: -4px; }
  }

  /* La misma etiqueta, pero se le puede picar para cambiar el estado. Se
     queda del color que tiene puesto: es lo que se viene a mirar de un
     vistazo, y volverla neutra por ser botón la haría perder eso. La
     flechita es la que avisa que además se abre. */
  .dic-estado-btn {
    border: none; font-family: inherit; cursor: pointer;
    transition: filter 0.15s, box-shadow 0.15s;
  }
  .dic-estado-btn:hover { filter: brightness(0.96); box-shadow: var(--sombra-1); }
  .dic-estado-btn svg { width: 11px; height: 11px; margin-left: -1px; opacity: 0.75; }
  /* En el celular la etiqueta del encabezado no se enseña (no cabe), así
     que el botón para cambiar el estado sale adentro de la tarjeta ya
     desplegada. En escritorio estorba: ahí se pica la etiqueta de arriba. */
  .dic-estado-movil { margin-bottom: var(--sp-3); }
  @media (min-width: 901px) { .dic-estado-movil { display: none; } }

  /* El menú del estado. Va pegado al body y con position:fixed porque la
     tarjeta lleva overflow:hidden: colgado de ella quedaría recortado. */
  .dic-menu-estado {
    position: fixed; z-index: 120; min-width: 210px; padding: 5px;
    background: linear-gradient(150deg, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.92) 45%, rgba(255,255,255,0.88) 100%);
    border: 1px solid rgba(255,255,255,0.82); border-radius: 12px;
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: 0 12px 32px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30);
  }
  .dic-menu-op {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: none; background: none; font-family: inherit;
    font-size: 13px; color: var(--text); text-align: left;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .dic-menu-op:hover { background: #f5f5f5; }
  .dic-menu-op i { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dic-menu-op.puesto { font-weight: 700; background: #fff3f3; }
  /* El expediente abierto se enmarca en rojo, como la tarjeta de los
     filtros. Con varios abiertos a la vez, la sombra sola no alcanzaba
     para saber dónde empieza y dónde termina cada uno. */
  #lista .kw-fila.abierta { border-color: rgba(206,1,31,0.34); }

  /* ── Las pestañas de cada tarjeta ──
     Los paneles de kw-ui traen un alto mínimo pensado para una pantalla
     completa; aquí van dentro de una tarjeta y ese piso la estiraría con
     aire vacío. */
  .dic-tabpanels { --panel-min: 0; }

  /* Las pestañas y los botones del expediente comparten renglón: son dos
     cosas chicas y cada una ocupaba el suyo. Las pestañas a la izquierda,
     los botones hasta la derecha. */
  .dic-barra-tarjeta {
    display: flex; align-items: center; gap: var(--sp-2);
    margin-bottom: var(--sp-3);
  }
  /* Aquí las pestañas van sin cápsula: nada más las dos palabras, con
     los mismos colores. Dentro de la tarjeta, una pastilla gris con otra
     pastilla blanca encima eran dos cajas más sobre una tarjeta que ya
     es una caja, y no pegaban con el resto. La abierta se distingue por
     el color y por la raya de abajo. */
  .dic-barra-tarjeta .dic-tabs {
    margin: 0; flex-shrink: 0; padding: 0; gap: var(--sp-3);
    background: none; border-radius: 0; overflow: visible;
  }
  .dic-barra-tarjeta .kw-tabs-indicador { display: none; }
  .dic-barra-tarjeta .kw-tab {
    height: 26px; padding: 0 1px; font-size: 12.5px;
    border-bottom: 2px solid transparent; border-radius: 0;
  }
  .dic-barra-tarjeta .kw-tab.activo { border-bottom-color: var(--red); }

  /* Los botones del expediente, ya sin letras. Lo que hace cada uno lo
     dice el title; con tres iconos conocidos (bajar, lápiz, caja) el
     texto era ancho gastado en decir lo que el dibujo ya dice. */
  .dic-acciones-iconos { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .dic-icono-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0;
    border: 1px solid var(--border); border-radius: 9px;
    background: #fff; color: var(--muted); cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .dic-icono-btn svg { width: 15px; height: 15px; }
  .dic-icono-btn:hover { color: var(--red); border-color: rgba(138,0,0,0.34); background: #fffafa; }
  /* Archivar y borrar sacan el expediente de la lista: se pintan al
     pasar encima para que no se confundan con los de todos los días. */
  .dic-icono-btn.saca:hover { color: #b02a2a; border-color: rgba(176,42,42,0.42); }

  @media (max-width: 560px) {
    .dic-barra-tarjeta { flex-wrap: wrap; }
    .dic-acciones-iconos { margin-left: 0; }
  }

  /* ── El historial ──
     Un renglón por movimiento, con su punto de color a la izquierda y la
     hora a la derecha. Se lee de arriba abajo como una conversación: lo
     más reciente primero, que es lo que uno viene a ver. */
  .dic-historia { display: flex; flex-direction: column; }
  .dic-historia-fila {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .dic-historia-fila:last-child { border-bottom: none; }
  .dic-historia-punto {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    margin-top: 5px; background: #b3b3b3;
  }
  .dic-historia-punto.creado          { background: var(--red); }
  .dic-historia-punto.estado          { background: #e0a218; }
  .dic-historia-punto.listado         { background: #6b7fd7; }
  .dic-historia-punto.punto_corregida { background: #1f9d55; }
  .dic-historia-punto.punto_nuevo     { background: #e0a218; }
  .dic-historia-punto.punto_quitado   { background: #d13b3b; }
  .dic-historia-txt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; }
  .dic-historia-txt b { display: block; color: var(--text); }
  .dic-historia-txt span { color: var(--muted); }
  .dic-historia-cuando {
    flex-shrink: 0; text-align: right;
    font-size: 11.5px; color: var(--muted); line-height: 1.5;
  }
  .dic-historia-cuando span { display: block; font-size: 11px; opacity: 0.85; }
  @media (max-width: 700px) {
    .dic-historia-fila { flex-wrap: wrap; }
    .dic-historia-cuando { width: 100%; text-align: left; padding-left: 18px; }
    .dic-historia-cuando span { display: inline; }
  }

  /* Las tres respuestas del aviso de "en qué estatus quedó". Van una
     debajo de otra y no en hilera: leídas en columna se comparan, que es
     lo que uno está haciendo justo en ese momento. */
  .dic-preguntar { display: flex; flex-direction: column; gap: 7px; }
  .dic-preguntar-op {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: 1px solid var(--border); border-radius: 10px; background: #fff;
    font-family: inherit; font-size: 13.5px; font-weight: 700; color: var(--text);
    padding: 11px 13px; cursor: pointer; text-align: left;
    transition: border-color 0.15s, background 0.15s, transform 0.12s;
  }
  .dic-preguntar-op:hover { background: #fafafa; border-color: #c9c9c9; }
  .dic-preguntar-op:active { transform: translateY(1px) scale(0.99); }
  .dic-preguntar-op i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dic-preguntar-op i.devuelta     { background: #b02a2a; }
  .dic-preguntar-op i.condicionada { background: var(--pastel-crema-txt); }
  .dic-preguntar-op i.autorizada   { background: var(--pastel-menta-txt); }

  .dic-menu-op i.borrador     { background: #5b5b5b; }
  .dic-menu-op i.devuelta     { background: #b02a2a; }
  .dic-menu-op i.condicionada { background: var(--pastel-crema-txt); }
  .dic-menu-op i.autorizada   { background: var(--pastel-menta-txt); }

  .dic-avance {
    width: 84px; height: 5px; border-radius: 999px;
    background: rgba(0,0,0,0.09); overflow: hidden; flex-shrink: 0;
  }
  .dic-avance span { display: block; height: 100%; background: #1f9d55; border-radius: 999px; }

  /* ── Una observación por atender ── */
  .dic-punto {
    border: 1px solid var(--border);
    border-left: 3px solid #e0a218;
    border-radius: 11px; background: #fff;
    padding: 11px 13px; margin-bottom: 9px;
  }
  .dic-punto.corregida { border-left-color: #1f9d55; }
  .dic-punto-cabeza { display: flex; align-items: flex-start; gap: 10px; }
  .dic-punto-texto { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.5; color: var(--text); }
  .dic-punto-nota {
    margin-top: 8px; padding: 8px 10px; border-radius: 9px;
    background: rgba(0,0,0,0.035); font-size: 12.5px; color: #444;
    line-height: 1.5; white-space: pre-line;
  }
  /* Todo lo que se le puede hacer a una observación va en un solo
     renglón. Antes la nota traía su propia hilera de botones encima de
     la de siempre: quedaban dos filas amontonadas y ninguna decía cuál
     era la acción principal. */
  .dic-punto-acciones {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 10px;
  }
  /* Quitar y archivar no son acciones del mismo peso que las de al lado:
     se van hasta la derecha, separadas, para no picarles de pasada. */
  .dic-punto-acciones .a-la-derecha,
  .kw-fila-acciones .a-la-derecha { margin-left: auto; }

  /* Enviar y cancelar solo existen mientras se está escribiendo la nota,
     y el botón de abrirla desaparece mientras tanto: ya está abierta. */
  .dic-punto .solo-notando { display: none; }
  .dic-punto.notando .solo-notando { display: inline-flex; }
  .dic-punto.notando .oculto-notando { display: none; }

  .kw-btn-mini.verde { border-color: #1f9d55; color: #157a41; }
  .kw-btn-mini.verde:hover { background: #f0faf3; border-color: #157a41; }
  .kw-btn-mini.rojo { border-color: #d13b3b; color: #b02a2a; }
  .kw-btn-mini.rojo:hover { background: #fdf0f0; border-color: #b02a2a; }

  /* Un bote de basura solo, sin texto: se entiende sin leerlo y deja de
     competir por atención con las acciones que sí se usan a diario. */
  .dic-punto-tirar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 9px;
    background: #fff; color: var(--muted); cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .dic-punto-tirar:hover { background: #fdf0f0; color: #b02a2a; border-color: #d13b3b; }
  .dic-punto-tirar svg { width: 14px; height: 14px; }

  .dic-punto-form { margin-top: 10px; display: none; }
  .dic-punto-form.abierto { display: block; }
  .dic-punto-form textarea {
    width: 100%; min-height: 58px; resize: vertical;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-family: inherit; font-size: 13px;
    color: var(--text); background: #fff;
  }
  .dic-punto-form textarea:focus { outline: none; border-color: var(--red); }

  /* ── Los datos del expediente dentro de la tarjeta ── */
  .dic-datos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 9px var(--sp-4); margin: var(--sp-3) 0;
  }
  .dic-dato { font-size: 13px; line-height: 1.45; }
  .dic-dato b {
    display: block; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
  }

  /* ── El editor ── */
  .dic-editor {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--r-tarjeta); box-shadow: var(--sombra-1);
    padding: var(--sp-4);
  }
  .dic-campo { margin-bottom: var(--sp-3); }
  .dic-campo > label {
    display: block; margin-bottom: 5px;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--muted);
  }
  /* El campo de fecha se apunta también por su id: kw-ui.js lo cambia a
     type="text" mientras está vacío (para poder enseñar un placeholder),
     y con el selector amarrado a type="date" se quedaba sin estilo justo
     en ese rato, viéndose como una caja suelta del navegador.

     Los que ya traen .kw-input quedan fuera: esos se visten con esa clase
     en los dos tipos, y agregarles este otro juego de medidas los hacía
     cambiar de alto y de borde al picarlos. */
  .dic-campo textarea,
  .dic-campo input[type="date"]:not(.kw-input),
  .dic-campo input#e-fecha {
    width: 100%; resize: vertical;
    border: 1px solid var(--border); border-radius: var(--r-campo);
    padding: 10px 12px; font-family: inherit; font-size: 13.5px;
    color: var(--text); background: #fff;
  }
  .dic-campo textarea { min-height: 62px; }
  .dic-campo textarea:focus, .dic-campo input:focus { outline: none; border-color: var(--red); }

  /* Superficies: en el campo se teclea nada más el número y la unidad va
     pegada a la derecha, puesta por el sitio. Se dibuja encima del campo
     en vez de escribirse dentro para que no haya forma de borrarla ni de
     capturarla de tres maneras distintas. El relleno de la derecha le
     abre el lugar para que el número no se le encime al llegar. */
  .dic-conunidad { position: relative; }
  .dic-conunidad input { width: 100%; padding-right: 40px; }
  .dic-conunidad span {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; font-weight: 700; color: var(--muted); pointer-events: none;
  }
  /* El peso va del otro lado, que es donde se escribe en una cifra. */
  .dic-conunidad span.dic-unidad-izq { right: auto; left: 12px; }
  .dic-conunidad:has(.dic-unidad-izq) input { padding-right: 12px; padding-left: 26px; }
  .dic-dos { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .dic-tres { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp-3); }
  @media (max-width: 700px) {
    .dic-dos, .dic-tres { grid-template-columns: 1fr; }
  }
  /* Las tres partes del formulario (cliente, inmueble, observaciones)
     se separan con este rótulo. La línea de abajo es la que hace que se
     lean como bloques y no como un solo chorro de campos. */
  .dic-subtitulo {
    font-size: 15px; color: var(--text);
    margin: var(--sp-5) 0 var(--sp-3);
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }

  /* ── Los clientes del expediente ──
     Cada uno en su tarjeta: con tres o cuatro capturados seguidos, sin
     algo que los encierre no se distingue dónde acaba uno y empieza el
     que sigue, y se acaba escribiendo el estado civil en el renglón del
     otro. */
  .dic-cliente {
    border: 1px solid var(--border); border-radius: var(--r-campo);
    padding: var(--sp-3); margin-bottom: var(--sp-3);
    background: var(--card-degradado, #fff);
  }
  .dic-cliente-num {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--red); margin-bottom: var(--sp-2);
  }
  .dic-cliente .dic-campo:last-child { margin-bottom: 0; }

  /* Los rótulos de arriba de cada filtro se quitan de la vista: lo que
     dice cada uno (Estado, Listado, Contrato...) ya sale dentro de la
     cápsula, como su propio valor por defecto ("Estado" en vez de "Todos
     los estados"). Un rótulo repitiendo lo mismo arriba era doble aviso
     del mismo dato. Sigue en el HTML, nada más oculto, para quien use
     lector de pantalla. */
  #vista-lista .kw-campo-filtro > label {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* Ocho filtros en una hilera se reparten el ancho a partes iguales y
     ninguno alcanza a enseñar lo que dice. Con un tope, el que sobra en
     el último renglón se queda de su tamaño en vez de estirarse de lado a
     lado. */
  .kw-filtros > .kw-campo-filtro { max-width: 250px; }

  /* Cada filtro pesa según lo que le cabe adentro, en vez de repartirse
     el ancho a partes iguales. El de asesor es el que más se usa y el que
     crece con los elegidos, así que va más ancho; los tres desplegables
     llevan nombres largos; la comisión son dos dígitos y una fecha es una
     fecha. Sin esto, "Comisión %" tenía el mismo lugar que "Tipo de
     inmueble" y ninguno de los dos alcanzaba a decirse completo. */
  .kw-filtros > .dic-f-asesor { flex: 1.3 1 190px; max-width: 260px; }
  .kw-filtros > .dic-f-lista  { flex: 1 1 156px; max-width: 200px; }
  .kw-filtros > .dic-f-fecha  { flex: 0 1 138px; max-width: 150px; }
  .kw-filtros > .dic-f-chico  { flex: 0 1 118px; max-width: 130px; }

  /* ── La tarjeta de los filtros ──
     Diez casillas siempre abiertas eran media pantalla antes de llegar
     al primer expediente. Encerrados en su tarjeta se lee que son un
     bloque aparte, y de entrada solo se ve el primer renglón. */
  .dic-filtros-caja {
    /* Azul, para que no compita con el rojo de la marca: la tarjeta de
       filtros no es lo que se viene a mirar, es con lo que se busca. */
    border: 1.5px solid rgba(27,79,138,0.34); border-radius: 16px;
    background: rgba(255,255,255,0.55);
    /* El mismo aire arriba que abajo. Antes el de abajo era cero, porque
       ahí colgaba el renglón del botón de "más filtros", y al pasar ese
       botón a la orilla la tarjeta quedó chueca. */
    padding: var(--sp-3);
    margin-bottom: var(--sp-4);
  }
  /* La hilera trae su propio margen de abajo, que sumado al relleno de la
     tarjeta daba doble aire de ese lado. */
  .dic-filtros-caja .kw-filtros { margin-bottom: 0; }

  /* Plegado, los filtros que no caben en el primer renglón se esconden
     uno por uno desde el código. Antes se recortaba la caja entera con
     overflow, que era más corto, pero el menú de un desplegable cuelga
     por debajo de su campo: al abrir "Tipo de inmueble" el menú quedaba
     cortado a media lista. */
  .dic-filtro-oculto { display: none !important; }

  /* La flechita va al final del primer renglón, colgada del borde y no
     en la hilera: metida entre los filtros se movía de lugar según
     cuántos cupieran ese día. */
  .dic-filtros-caja { position: relative; padding-right: 46px; }
  .dic-filtros-mas {
    position: absolute; right: 8px; top: calc(var(--sp-3) + var(--control-h) / 2);
    transform: translateY(-50%);
    display: flex; align-items: center; gap: 4px;
    padding: 5px 6px; border: none; background: none;
    color: rgba(27,79,138,0.9); cursor: pointer;
  }
  .dic-filtros-mas svg {
    width: 17px; height: 17px;
    transition: transform var(--t-medio);
  }
  .dic-filtros-caja.abierta .dic-filtros-mas svg { transform: rotate(180deg); }
  /* Cuántos filtros hay puestos entre los que quedaron escondidos. Sin
     esto, plegar la tarjeta escondía filtros prendidos y la lista salía
     recortada sin decir por qué. */
  .dic-filtros-cuantos {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
    background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700;
  }
  .dic-filtros-cuantos[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .dic-filtros-mas svg { transition: none; }
  }

  /* Las dos fechas del rango. El estilo va por la clase y no por
     input[type="date"] porque kw-ui.js le cambia el tipo a "text"
     mientras está vacío, para poder enseñar el texto de adentro. */
  .dic-fecha {
    width: 100%; height: var(--control-h);
    border: 1px solid var(--border); border-radius: var(--r-campo);
    padding: 0 11px; background: #fff;
    font-family: inherit; font-size: 13.5px; color: var(--text);
  }
  .dic-fecha:focus { outline: none; border-color: var(--red); }

  /* Precio y comisión se piden por rango y no por un valor exacto:
     nadie busca "los de 4,500,000", se busca "de tres a cinco millones".
     Los dos campos caben en el lugar de un filtro para no estirar la
     hilera a doce casillas. */
  /* Los dos del par van más pegados entre sí que de los filtros vecinos:
     con la misma separación de todos, "precio máx" y "comisión mín" se
     leían tan juntos como los de un mismo rango, y no se veía qué va con
     qué. Los dos campos caben en el lugar de un filtro para no estirar la
     hilera a doce casillas. */
  .dic-rango { display: flex; gap: 4px; }
  .dic-rango .dic-fecha { min-width: 0; flex: 1; padding: 0 8px; }

  /* Un rango son dos casillas donde los demás filtros tienen una, así
     que pide como el doble de lugar. Sin este piso se encogía con los
     demás hasta dejar "Precio mí" y "Comisión" cortados; con él, cuando
     ya no cabe se pasa al siguiente renglón entero. */
  .kw-filtros > .dic-campo-rango { flex-basis: 236px; min-width: 216px; max-width: 270px; }

  /* En el celular caben dos filtros por renglón, y a medio renglón el
     par de la comisión se quedaba sin lugar para decir "Comisión máx".
     Con el renglón entero para él, cada mitad alcanza de sobra. */
  @media (max-width: 700px) {
    .kw-filtros > .dic-campo-rango { flex-basis: 100%; max-width: none; }
  }

  /* El engrane es solo el dibujo: cuadrado, del mismo alto que el de
     al lado, sin el hueco que dejaría el texto ausente. */
  .dic-btn-icono {
    padding: 9px; width: 36px; justify-content: center;
  }
  .dic-btn-icono svg { width: 16px; height: 16px; }
  /* Mientras sincroniza, el dibujo da vueltas: sin texto que cambiar, es
     lo que dice que está haciendo algo. */
  .dic-btn-icono[disabled] svg { animation: dic-gira 1.1s linear infinite; }
  @keyframes dic-gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .dic-btn-icono[disabled] svg { animation: none; }
  }

  /* El menú del engrane. Cuelga del botón y no del cuerpo de la página
     como el de los estados: ese sale de una tarjeta que rueda con la
     lista y necesita posición fija, este vive en el encabezado y se
     queda donde está. Misma tarjeta blanca de siempre. */
  .dic-engrane-caja { position: relative; }
  .dic-engrane-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 120;
    min-width: 208px; padding: 5px;
    background: linear-gradient(150deg, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.92) 45%, rgba(255,255,255,0.88) 100%);
    border: 1px solid rgba(255,255,255,0.82); border-radius: 12px;
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: 0 12px 32px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30);
  }
  .dic-engrane-menu[hidden] { display: none; }
  /* En el celular el engrane queda pegado a la orilla izquierda, y un
     menú colgado de su derecha se sale de la pantalla. Ahí se cuelga del
     otro lado. */
  @media (max-width: 700px) {
    .dic-engrane-menu { left: 0; right: auto; max-width: calc(100vw - 32px); }
  }
  .dic-engrane-menu .dic-menu-op svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--muted); }
  .dic-engrane-menu .dic-menu-op:disabled { opacity: 0.55; cursor: default; }
  .dic-menu-raya { height: 1px; background: var(--border); margin: 4px 8px; }
  .dic-menu-raya[hidden] { display: none; }
  /* El de sincronizar mientras trabaja: el dibujo da vueltas ahí mismo. */
  .dic-menu-op.trabajando svg { animation: dic-gira 1.1s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .dic-menu-op.trabajando svg { animation: none; }
  }

  /* Limpiar cierra la hilera: no es un filtro más, es el botón para
     deshacer lo elegido, así que va al final de todos y no compitiendo
     por lugar entre ellos. */
  .dic-campo-limpiar { justify-content: flex-end; }
  .kw-filtros > .dic-campo-limpiar { flex: 0 0 auto; }
  /* Chico y con el bote: no es un filtro más, es deshacer lo elegido, y
     del tamaño de los demás pesaba como si lo fuera. */
  .dic-limpiar {
    display: inline-flex; align-items: center; gap: 6px;
    height: var(--control-h); padding: 0 12px;
    border: 1px solid var(--border); border-radius: var(--r-campo);
    background: #fff; color: var(--muted);
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .dic-limpiar svg { width: 14px; height: 14px; flex-shrink: 0; }
  .dic-limpiar:hover { background: #fafafa; color: var(--red); border-color: var(--red); }

  /* ── El filtro de asesor, que admite varios ──
     El campo crece hacia abajo conforme se van agregando: con tres o
     cuatro elegidos, una sola línea los recortaría y ya no se sabría a
     quiénes se está filtrando. */
  .dic-multi { position: relative; }
  .dic-multi-elegidos { display: flex; flex-wrap: wrap; gap: 5px; }
  .dic-multi-elegidos:not(:empty) { margin-bottom: 6px; }
  .dic-multi-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--pastel-rojo); color: var(--red);
    border-radius: 999px; padding: 3px 5px 3px 10px;
    font-size: 11.5px; font-weight: 700; max-width: 100%;
  }
  .dic-multi-chip span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dic-multi-chip button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; flex-shrink: 0;
    border: none; border-radius: 50%; background: rgba(0,0,0,0.08);
    color: inherit; cursor: pointer; padding: 0;
  }
  .dic-multi-chip button:hover { background: rgba(0,0,0,0.16); }
  .dic-multi-chip svg { width: 9px; height: 9px; }

  /* ── El buscador de asesor ──
     Son 94 y crecen. Un desplegable de 94 renglones se recorre a ciegas;
     escribiendo tres letras se llega en un segundo. */
  .dic-busca-asesor { position: relative; }
  .dic-asesor-lista {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
    max-height: 260px; overflow-y: auto;
    background: #fff; border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--sombra-3);
    padding: 5px; display: none;
  }
  .dic-asesor-lista.abierta { display: block; }
  .dic-asesor-op {
    display: block; width: 100%; text-align: left;
    padding: 8px 10px; border: none; border-radius: 9px;
    background: none; font-family: inherit; font-size: 13.5px;
    color: var(--text); cursor: pointer;
  }
  .dic-asesor-op:hover, .dic-asesor-op.resaltada { background: var(--pastel-rojo); }
  .dic-asesor-op small { display: block; color: var(--muted); font-size: 11.5px; }
  .dic-asesor-vacio { padding: 14px 10px; color: var(--muted); font-size: 13px; text-align: center; }
  /* Ya elegido: se enseña como pastilla para que se note que es un dato
     tomado del catálogo y no algo que se escribió a mano. */
  .dic-asesor-puesto {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--r-campo);
    border: 1px solid var(--border); background: var(--pastel-rojo);
  }
  .dic-asesor-puesto span { flex: 1; min-width: 0; font-size: 13.5px; }
  .dic-asesor-puesto small { display: block; color: var(--muted); font-size: 11.5px; }

  .dic-lista-puntos { margin-top: var(--sp-3); }
  .dic-punto-edit {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 11px; background: #fff;
  }
  .dic-punto-edit-num {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--pastel-rojo); color: var(--pastel-rojo-txt);
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .dic-quitar {
    border: none; background: transparent; color: var(--muted);
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: color var(--t-medio), background var(--t-medio);
  }
  .dic-quitar:hover { color: var(--red); background: rgba(198,32,39,0.08); }

  .dic-nuevo-punto {
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
    padding: 12px; border-radius: 12px;
    border: 1px dashed rgba(0,0,0,0.18); background: rgba(0,0,0,0.015);
    margin-top: var(--sp-2);
  }
  .dic-nuevo-punto textarea {
    width: 100%; min-height: 44px; resize: vertical;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-family: inherit; font-size: 13.5px; background: #fff;
  }
  .dic-nuevo-punto textarea:focus { outline: none; border-color: var(--red); }

  .dic-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--sp-4); }
  .dic-msg { border-radius: 12px; padding: 11px 13px; font-size: 13px; margin-bottom: var(--sp-3); display: none; }
  .dic-msg.error { display: block; background: rgba(198,32,39,0.08); color: #8a1212; }
  .dic-msg.ok { display: block; background: var(--pastel-menta); color: var(--pastel-menta-txt); }

  /* Al guardar aparece la descarga. Antes de guardar no tiene sentido:
     el PDF lleva el folio, y el folio se pone al dictaminar. */
  .dic-listo {
    display: none; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
    margin-top: var(--sp-4); padding: 13px 15px;
    border-radius: var(--r-tarjeta);
    background: var(--pastel-menta); color: var(--pastel-menta-txt);
  }
  .dic-listo.visible { display: flex; }
  .dic-listo span { flex: 1; min-width: 200px; font-size: 13.5px; }

</style>

<body>

  <!-- El header deja de flotar sobre la página en su propia banda y pasa
       a ser el primer renglón de ella, con el título adentro y los
       botones al lado. Antes eran dos renglones (uno casi todo aire) para
       decir el nombre de la pantalla y dejar cuatro iconos. -->
  <div class="dic-cinta">
  <header class="kw-header">
    <span class="kw-header-title" id="page-titulo">Dictaminación de Expedientes</span>
    <div class="header-right">
      <div id="notif-bell-slot"></div>
      <a href="../portal.html" class="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        <span>Atrás</span>
      </a>
    </div>
  </header>
        <div class="dic-cinta-acciones">
          <!-- Exportar, ver el archivo, recargar y sincronizar se juntan

<script>
(function () {

    borrador:     'Borrador',

  var OPERACIONES = { venta: 'Venta', renta: 'Renta' };
  var USOS = { residencial: 'Residencial', comercial: 'Comercial', mixto: 'Mixto' };
  var CONTRATOS = { exclusiva: 'Exclusiva', abierto: 'Abierto' };

  // Un booleano de la base tiene tres respuestas posibles en pantalla: sí,
  // no, y todavía no se contesta. La tercera se enseña vacía, no como "No".
  function siNo(v) {
    if (v === true) return 'Sí';
    if (v === false) return 'No';
    return '';
  }

  // Los clientes de un expediente, con su estado civil entre paréntesis
  // para no gastar un renglón por cada uno en la tarjeta.
  function clientesTexto(d) {
    var suyos = clientes
      .filter(function (c) { return c.dictamen_id === d.id; })
      .sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
    if (!suyos.length) return d.clientes_nombres || '';
    return suyos.map(function (c) {
      return c.nombre + (c.estado_civil ? ' (' + c.estado_civil + ')' : '');
    }).join(' · ');
  }

  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fecha(iso) {
    if (!iso) return '';
    // Las fechas de solo día vienen como "2026-08-18". Pasarlas por Date
    // las lee como medianoche UTC y en México se corren un día hacia
    // atrás, así que se parten a mano.
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
    var d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(iso);
    return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function hoy() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function aviso(caja, texto, tipo) {
    var el = $(caja);
    el.className = 'dic-msg' + (texto ? ' ' + tipo : '');
    el.textContent = texto || '';
  }

  // ── Traer los datos ─────────────────────────────────────────

  async function cargar() {
    var r = await window.kwSupabase
      .from('dictamenes_con_asesor').select('*')
      .order('created_at', { ascending: false }).limit(500);

    if (r.error) {
      $('lista').innerHTML = '<div class="kw-vacio">No se pudieron cargar los dictámenes: '
        + escapar(r.error.message) + '</div>';
      return;
    }
    dictamenes = r.data || [];

    // Las observaciones de todos, de una sola vez. La regla de acceso de
    // la base ya devuelve nada más las que a uno le tocan.
    var p = await window.kwSupabase
      .from('dictamen_puntos').select('*').order('orden').limit(5000);
    puntos = p.data || [];

    // Y los clientes, por lo mismo: se ocupan al abrir cualquier
    // expediente y traerlos uno por uno sería una vuelta a la base por
    // cada tarjeta que se abre.
    var cl = await window.kwSupabase
      .from('dictamen_clientes').select('*').order('orden').limit(5000);
    clientes = cl.data || [];

    var hi = await window.kwSupabase
      .from('dictamen_historial_con_quien').select('*')
      .order('created_at', { ascending: false }).limit(5000);
    historial = hi.data || [];

    pintar();
  }

  async function cargarCatalogos() {
    var a = await window.kwSupabase
      .from('dictamen_asesores').select('id, nombre, correo, activo').order('nombre');
    asesores = a.data || [];

    var t = await window.kwSupabase
      .from('dictamen_tipos_inmueble').select('id, nombre').order('nombre');
    tipos = t.data || [];

    $('e-tipo').innerHTML = '<option value="">Sin especificar</option>' +
      tipos.map(function (x) {
        return '<option value="' + x.id + '">' + escapar(x.nombre) + '</option>';
      }).join('') +
      '<option value="__nuevo__">Otro (escribirlo)</option>';

    $('f-tipo').innerHTML = '<option value="todos">Tipo de inmueble</option>' +
      tipos.map(function (x) {
        return '<option value="' + x.id + '">' + escapar(x.nombre) + '</option>';
      }).join('');
    if (window.kwUI) window.kwUI.selects(document);
  }

  // ── Filtrar ─────────────────────────────────────────────────

  var DESPLEGABLES = ['f-listado', 'f-contrato', 'f-tipo'];

  // Los filtros que se escriben: el buscador, el rango de fechas, el de
  // precio y el de comisión. Se enumeran una sola vez porque los tres
  // lugares que los tocan (repintar al cambiarlos, saber si hay algo
  // filtrado y limpiarlos) tienen que estar de acuerdo. Cuando la lista
  // vivía suelta en cada uno, agregar un filtro era acordarse de los tres.
  var ESCRITOS = ['f-buscar', 'f-desde', 'f-hasta',
    'f-precio-min', 'f-precio-max', 'f-comision'];

  // El estado ya no tiene desplegable: se pone y se quita picándole a las
  // tarjetas de arriba, que hacían exactamente lo mismo. Vive aquí en vez
  // de leerse de un campo.
  var estadoFiltro = 'todos';

  // Un rango de números. Si se pidió un mínimo o un máximo, el expediente
  // que no trae ese dato queda fuera: dejarlo pasar como si valiera cero
  // lo haría salir en "hasta 500,000" sin que nadie sepa en cuánto está.
  function fueraDeRango(valor, min, max) {
    if (!min && !max) return false;
    var n = Number(soloCifra(valor));
    if (!soloCifra(valor) || isNaN(n)) return true;
    if (min && n < Number(min)) return true;
    if (max && n > Number(max)) return true;
    return false;
  }

  function visibles() {
    var busca = $('f-buscar').value.trim().toLowerCase();
    var listado = $('f-listado').value;
    var contrato = $('f-contrato').value;
    var tipo = $('f-tipo').value;
    var desde = $('f-desde').value;
    var hasta = $('f-hasta').value;
    var precioMin = soloCifra($('f-precio-min').value);
    var precioMax = soloCifra($('f-precio-max').value);
    var comision = soloCifra($('f-comision').value);

    return dictamenes.filter(function (d) {
      // El archivo es una lista aparte, no un filtro más: o se ve lo
      // vivo, o se ve lo archivado.
      if (verArchivo !== !!d.archivado_at) return false;
      if (estadoFiltro !== 'todos' && d.estado !== estadoFiltro) return false;
      if (listado !== 'todos' && (d.estatus_listado || 'pendiente') !== listado) return false;
      if (contrato !== 'todos' && d.tipo_contrato !== contrato) return false;
      if (tipo !== 'todos' && d.tipo_inmueble_id !== tipo) return false;

      // Sin asesores elegidos no se filtra por asesor: la lista vacía
      // quiere decir "todos", no "ninguno".
      if (asesoresFiltro.length && asesoresFiltro.indexOf(d.asesor_id) === -1) return false;

      // Las fechas viajan como aaaa-mm-dd, y en ese formato compararlas
      // como texto da el mismo resultado que compararlas como fechas.
      var f = d.fecha_dictamen || '';
      if (desde && (!f || f < desde)) return false;
      if (hasta && (!f || f > hasta)) return false;

      if (fueraDeRango(d.precio_listado, precioMin, precioMax)) return false;
      // La comisión se pide exacta: se escribe 5 y salen los del 5. Como
      // rango no aportaba, porque los porcentajes que se manejan son un
      // puñado de valores cerrados y no una escala continua.
      if (comision && Number(soloCifra(d.comision_porcentaje)) !== Number(comision)) return false;

      if (busca) {
        var heno = [d.inmueble, d.folio, d.clientes_nombres, d.asesor_nombre,
          d.escritura_numero, d.precio_listado, d.comision_porcentaje]
          .join(' ').toLowerCase();
        if (heno.indexOf(busca) === -1) return false;
      }
      return true;
    });
  }

  // ── El filtro de asesor, que admite varios ──────────────────

  var asesoresFiltro = [];

  function pintarAsesoresFiltro() {
    var caja = $('f-asesor-elegidos');
    caja.innerHTML = asesoresFiltro.map(function (id) {
      var a = asesores.find(function (x) { return x.id === id; });
      return '<span class="dic-multi-chip"><span>' +
        escapar(a ? a.nombre : 'Asesor') + '</span>' +
        '<button type="button" data-quitar-asesor="' + id + '" aria-label="Quitar">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">' +
            '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button></span>';
    }).join('');

    $('f-asesor-busca').placeholder = asesoresFiltro.length
      ? 'Agregar otro' : 'Buscar asesor';

    caja.querySelectorAll('[data-quitar-asesor]').forEach(function (b) {
      b.addEventListener('click', function () {
        asesoresFiltro = asesoresFiltro.filter(function (x) {
          return x !== b.dataset.quitarAsesor;
        });
        pintarAsesoresFiltro();
        pintar();
      });
    });

    // El campo de asesor crece hacia abajo con cada elegido, así que
    // agregar uno puede empujar filtros fuera del renglón que se ve. La
    // cuenta se rehace aquí y no en cada lugar que toca los asesores,
    // porque todos pasan por esta función.
    acomodarFiltros();
  }

  function pintarSugerenciasAsesor() {
    var q = $('f-asesor-busca').value.trim().toLowerCase();
    var caja = $('f-asesor-lista');
    if (!q) { caja.classList.remove('abierta'); return; }

    var hallados = asesores.filter(function (a) {
      if (!a.activo) return false;
      if (asesoresFiltro.indexOf(a.id) !== -1) return false;
      return (a.nombre + ' ' + (a.correo || '')).toLowerCase().indexOf(q) !== -1;
    }).slice(0, 30);

    caja.innerHTML = hallados.length
      ? hallados.map(function (a) {
        return '<button type="button" class="dic-asesor-op" data-mas-asesor="' + a.id + '">' +
          escapar(a.nombre) + '</button>';
      }).join('')
      : '<div class="dic-asesor-vacio">Ningún asesor con ese nombre.</div>';
    caja.classList.add('abierta');

    caja.querySelectorAll('[data-mas-asesor]').forEach(function (b) {
      b.addEventListener('click', function () {
        asesoresFiltro.push(b.dataset.masAsesor);
        $('f-asesor-busca').value = '';
        caja.classList.remove('abierta');
        pintarAsesoresFiltro();
        pintar();
      });
    });
  }

  // ── El resumen ──────────────────────────────────────────────

  function pintarResumen() {
    if (verArchivo) { $('resumen').innerHTML = ''; return; }
    var vivos = dictamenes.filter(function (d) { return !d.archivado_at; });
    var cuenta = function (e) {
      return vivos.filter(function (d) { return d.estado === e; }).length;
    };
    var tarjetas = [
      ['devuelta', cuenta('devuelta'), 'Devueltos'],
      ['condicionada', cuenta('condicionada'), 'Condicionados'],
      ['autorizada', cuenta('autorizada'), 'Autorizados'],
    ];
    var activo = estadoFiltro;

    // Cada tarjeta lleva la clase de su estado, que es la que le pone el
    // color del borde: el mismo que su etiqueta en la lista.
    $('resumen').innerHTML = tarjetas.map(function (t) {
      return '<button type="button" class="dic-tarjeta ' + t[0] +
        (activo === t[0] ? ' activa' : '') + '" data-estado="' + t[0] + '">' +
        '<span class="dic-tarjeta-num">' + t[1] + '</span>' +
        '<span class="dic-tarjeta-txt">' + t[2] + '</span>' +
      '</button>';
    }).join('');

    $('resumen').querySelectorAll('[data-estado]').forEach(function (b) {
      b.addEventListener('click', function () {
        // Volver a picarle al que ya está puesto lo quita. Es la única
        // forma de sacarlo, ahora que no hay desplegable de estado.
        var quiere = b.dataset.estado;
        estadoFiltro = (estadoFiltro === quiere) ? 'todos' : quiere;
        pintar();
      });
    });
  }

  // ── Preguntar en qué estatus quedó ──────────────────────────
  //
  // kwUI.alert y kwUI.confirm solo saben de aceptar y cancelar, y aquí
  // hacen falta tres respuestas. Se arma con las mismas piezas del aviso
  // del sitio (.modal-overlay/.modal-box) para que se vea igual que todo
  // lo demás. Devuelve el estado elegido, o null si se cerró sin elegir.
  function preguntarEstado() {
    return new Promise(function (resolver) {
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      var caja = document.createElement('div');
      caja.className = 'modal-box';
      caja.setAttribute('role', 'alertdialog');
      caja.setAttribute('aria-modal', 'true');
      caja.innerHTML =
        '<h3>¿En qué estatus quedó este expediente?</h3>' +
        '<p class="modal-sub">Al elegirlo se le asigna su folio y ya se puede descargar.</p>' +
        '<div class="dic-preguntar">' +
          ORDEN_ESTADOS.map(function (e) {
            return '<button type="button" class="dic-preguntar-op" data-elige="' + e + '">' +
              '<i class="' + e + '"></i>' + ESTADOS[e] + '</button>';
          }).join('') +
        '</div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn-modal-cancelar" data-elige="">Ahora no</button>' +
        '</div>';

      var listo = false;
      function cerrar(valor) {
        if (listo) return;
        listo = true;
        document.removeEventListener('keydown', porTecla);
        if (window.kwUI) window.kwUI.cerrarModal(overlay, function () { overlay.remove(); });
        else overlay.remove();
        resolver(valor);
      }
      function porTecla(e) { if (e.key === 'Escape') cerrar(null); }

      caja.querySelectorAll('[data-elige]').forEach(function (b) {
        b.addEventListener('click', function () { cerrar(b.dataset.elige || null); });
      });
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) cerrar(null);
      });

      overlay.appendChild(caja);
      document.body.appendChild(overlay);
      document.addEventListener('keydown', porTecla);
      caja.querySelector('[data-elige]').focus();
    });
  }

  // ── La lista ────────────────────────────────────────────────

  function pintar() {
    pintarResumen();
    // El título es ahora el del renglón de arriba, que es el único que
    // queda. La descripción se fue con el encabezado que se quitó: decía
    // lo que la propia pantalla enseña, y costaba un renglón.
    $('page-titulo').textContent = verArchivo
      ? 'Archivo de expedientes'
      : 'Dictaminación de Expedientes';
    $('op-archivo-txt').textContent = verArchivo ? 'Volver a la lista' : 'Ver archivo';

    var filas = visibles();

    // Los rótulos solo tienen sentido si hay renglones debajo.
    $('dic-cabecera').style.display = filas.length ? '' : 'none';

    if (!filas.length) {
      var hayFiltro = asesoresFiltro.length || estadoFiltro !== 'todos' ||
        ESCRITOS.some(function (x) { return $(x).value.trim(); }) ||
        DESPLEGABLES.some(function (x) { return $(x).value !== 'todos'; });
      $('lista').innerHTML = '<div class="kw-vacio">' + (
        verArchivo ? 'No hay dictámenes archivados.'
          : hayFiltro ? 'No hay dictámenes que cumplan con lo que estás filtrando.'
            : 'Todavía no se ha levantado ningún dictamen.'
      ) + '</div>';
      return;
    }

    $('lista').innerHTML = filas.map(filaHTML).join('');

    // Se vuelve a abrir el que estaba abierto: sin esto, marcar una
    // observación cierra la tarjeta y hay que volver a buscarla.
    if (abierto) {
      var f = $('lista').querySelector('[data-fila="' + abierto + '"]');
      if (f) {
        f.classList.add('abierta');
        var c = f.querySelector('.kw-fila-cabeza');
        if (c) c.setAttribute('aria-expanded', 'true');
      }
    }

    if (window.kwUI) {
      window.kwUI.acordeon($('lista'));
      window.kwUI.tabs($('lista'));
    }
    $('lista').querySelectorAll('.kw-fila-cabeza').forEach(function (c) {
      c.addEventListener('click', function () {
        var fila = c.closest('.kw-fila');
        abierto = fila && fila.classList.contains('abierta') ? fila.dataset.fila : null;
      });
    });
    cablear();
  }

  function filaHTML(d) {
    var mios = puntos.filter(function (p) { return p.dictamen_id === d.id; });
    var total = d.puntos_total || 0;
    var listas = d.puntos_corregidas || 0;
    var pct = total ? Math.round((listas / total) * 100) : 0;

    return '<div class="kw-fila" data-fila="' + d.id + '">' +
      '<button type="button" class="kw-fila-cabeza">' +
        '<span class="kw-fila-texto">' +
          '<span class="kw-fila-titulo">' + escapar(d.inmueble) + '</span>' +
          '<span class="kw-fila-sub">' +
            (d.folio ? escapar(d.folio) + ' · ' : '') +
            escapar(d.asesor_nombre || '') + ' · ' + fecha(d.fecha_dictamen) +
          '</span>' +
        '</span>' +
        '<span class="kw-fila-extra">' +
          (total
            ? '<span class="kw-extra"><span class="dic-avance"><span style="width:' + pct + '%"></span></span></span>' +
              '<span class="kw-extra"><span>' + listas + ' de ' + total + '</span></span>'
            : '') +
          '<span class="kw-extra dic-col">' + etiquetaEstado(d) + '</span>' +
          '<span class="kw-extra dic-col dic-col-listado">' + etiquetaListado(d) + '</span>' +
        '</span>' +
        '<svg class="kw-fila-flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>' +
      '</button>' +
      '<div class="kw-fila-cuerpo"><div><div class="kw-fila-dentro">' +
        cuerpoHTML(d, mios) +
      '</div></div></div>' +
    '</div>';
  }

  function dato(rotulo, valor) {
    if (!valor) return '';
    return '<div class="dic-dato"><b>' + rotulo + '</b>' + escapar(valor) + '</div>';
  }

  // Un expediente trae la escritura desglosada o, si es de antes de que
  // se partiera en cuatro, el párrafo que se escribió a mano. Se enseña
  // lo que tenga: los expedientes viejos no se van a recapturar y su
  // escritura tiene que seguir viéndose.
  function tieneEscrituraDesglosada(d) {
    return !!(d.escritura_numero || d.escritura_fecha ||
      d.notario_nombre || d.notaria_numero);
  }

  function datosEscritura(d) {
    if (!tieneEscrituraDesglosada(d)) {
      return dato('Escrituras y fecha', d.escritura_propiedad);
    }
    return dato('Número de escritura', d.escritura_numero) +
      dato('Fecha de escrituración', fecha(d.escritura_fecha)) +
      dato('Notario', d.notario_nombre) +
      dato('Número de notaría', d.notaria_numero);
  }

  // ── La etiqueta del estado, que además lo cambia ─────────────

  // Los que se pueden poner desde el menú. Borrador no está: es de donde
  // se sale, no a donde se llega, y el folio se gasta al salir de ahí.
  var ORDEN_ESTADOS = ['devuelta', 'condicionada', 'autorizada'];

  var LISTADOS = {
    pendiente: 'Pendiente',
    sin_listado: 'No tiene cargado el listado',
    aprobado: 'Aprobado',
  };
  var ORDEN_LISTADOS = ['pendiente', 'sin_listado', 'aprobado'];

  var FLECHITA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
    '<polyline points="6 9 12 15 18 9"/></svg>';

  // La misma etiqueta sirve de adorno y de botón. Quien no puede
  // dictaminar la ve nada más como etiqueta, sin flechita: un botón que no
  // hace nada al picarle es peor que no tenerlo.
  //
  // En el encabezado va como <span> a propósito, no como <button>: ese
  // renglón entero YA es el botón que abre la tarjeta, y un botón dentro
  // de otro no es HTML válido. En el cuerpo, que no está dentro de nada,
  // sí va como botón de verdad.
  function etiquetaEstado(d, enCuerpo) {
    var mueve = puedoDictaminar && !d.archivado_at;
    var clases = 'dic-estado ' + d.estado +
      (mueve ? ' dic-estado-btn' : '') +
      (enCuerpo ? ' dic-estado-movil' : '');
    var dentro = (ESTADOS[d.estado] || '') + (mueve ? FLECHITA : '');
    var attr = mueve ? ' data-estado-de="' + d.id + '"' : '';

    return enCuerpo
      ? '<button type="button" class="' + clases + '"' + attr + '>' + dentro + '</button>'
      : '<span class="' + clases + '"' + attr + '>' + dentro + '</span>';
  }

  // El estatus del listado, que es otra cosa que el dictamen: un
  // expediente puede quedar autorizado y el listado seguir sin cargarse.
  // Por eso lleva su propia etiqueta al lado y no un estado más adentro
  // de la otra.
  function etiquetaListado(d, enCuerpo) {
    var v = d.estatus_listado || 'pendiente';
    var mueve = puedoDictaminar && !d.archivado_at;
    var clases = 'dic-listado ' + v +
      (mueve ? ' dic-estado-btn' : '') +
      (enCuerpo ? ' dic-estado-movil' : '');
    var dentro = (LISTADOS[v] || '') + (mueve ? FLECHITA : '');
    var attr = mueve ? ' data-listado-de="' + d.id + '"' : '';

    return enCuerpo
      ? '<button type="button" class="' + clases + '"' + attr + '>' + dentro + '</button>'
      : '<span class="' + clases + '"' + attr + '>' + dentro + '</span>';
  }

  var menuEstado = null;
  var menuAbiertoEn = 0;

  function cerrarMenuEstado() {
    if (!menuEstado) return;
    menuEstado.remove();
    menuEstado = null;
  }

  // Cerrarlo porque la página se movió, pero no por el movimiento que
  // provoca abrirlo: al picarle a un botón el navegador rueda la página
  // para traerlo a la vista, y ese scroll llega justo después de abrir el
  // menú. Sin esta guarda, en el celular el menú se cerraba solo en el
  // mismo instante en que aparecía.
  function cerrarMenuSiSeMovio() {
    if (Date.now() - menuAbiertoEn < 350) return;
    cerrarMenuEstado();
  }

  // El mismo menú sirve para las dos etiquetas. Lo único que cambia es de
  // dónde salen las opciones, cuál está puesta y qué se hace al elegir,
  // así que eso viaja en un descriptor y el resto (dónde se dibuja, cómo
  // se cierra) es igual para ambas.
  var MENUS = {
    estado: {
      opciones: ORDEN_ESTADOS,
      nombres: ESTADOS,
      puesta: function (d) { return d.estado; },
      // Pasa por dictaminar() y no por un update directo porque es ahí
      // donde se reparte el folio, que tiene que ser único.
      poner: function (id, valor) {
        return window.kwSupabase.rpc('dictaminar', { p_id: id, p_estado: valor });
      },
      error: 'No se pudo dictaminar: ',
    },
    listado: {
      opciones: ORDEN_LISTADOS,
      nombres: LISTADOS,
      puesta: function (d) { return d.estatus_listado || 'pendiente'; },
      poner: function (id, valor) {
        return window.kwSupabase.from('dictamenes')
          .update({ estatus_listado: valor }).eq('id', id);
      },
      error: 'No se pudo cambiar el estatus del listado: ',
    },

  function abrirMenu(desde, id, cual) {
    var m = MENUS[cual];
    var d = dictamenes.find(function (x) { return x.id === id; });
    if (!m || !d) return;
    cerrarMenuEstado();

    var puesta = m.puesta(d);
    var caja = document.createElement('div');
    caja.className = 'dic-menu-estado';
    caja.innerHTML = m.opciones.map(function (e) {
      return '<button type="button" class="dic-menu-op' + (puesta === e ? ' puesto' : '') +
        '" data-poner="' + e + '"><i class="' + e + '"></i>' + m.nombres[e] + '</button>';
    }).join('');
    document.body.appendChild(caja);

    // Se cuelga de la etiqueta, y si abajo ya no cabe se voltea hacia
    // arriba en vez de salirse de la pantalla.
    var r = desde.getBoundingClientRect();
    var arriba = r.bottom + 6;
    if (arriba + caja.offsetHeight > window.innerHeight - 8) {
      arriba = Math.max(8, r.top - caja.offsetHeight - 6);
    }
    var izq = Math.min(r.left, window.innerWidth - caja.offsetWidth - 8);
    caja.style.top = arriba + 'px';
    caja.style.left = Math.max(8, izq) + 'px';

    caja.querySelectorAll('[data-poner]').forEach(function (b) {
      b.addEventListener('click', async function () {
        cerrarMenuEstado();
        var r2 = await m.poner(id, b.dataset.poner);
        if (r2 && r2.error) {
          await window.kwUI.alert(m.error + r2.error.message);
          return;
        }
        await cargar();
      });
    });

    menuEstado = caja;
    menuAbiertoEn = Date.now();
  }

  document.addEventListener('click', function (e) {

  // Colgado con position:fixed, el menú no sigue a la tarjeta al rodar la

      dato('Tipo de inmueble', d.tipo_inmueble) +

      datosEscritura(d) +

      dato('CFDI', d.cfdi) +

  var COMO = {
    creado: 'Se levantó el expediente',

    listado: 'Listado',
    archivado: 'Archivado',
    restaurado: 'Restaurado',

  function historialHTML(d) {
    var suyo = historial
      .filter(function (h) { return h.dictamen_id === d.id; })
      .sort(function (a, b) { return (b.created_at || '').localeCompare(a.created_at || ''); });

    if (!suyo.length) {
      return '<div class="kw-vacio" style="padding:var(--sp-4);">' +
        'Todavía no hay movimientos registrados en este expediente.</div>';
    }

    return '<div class="dic-historia">' + suyo.map(function (h) {
      var titulo = COMO[h.que] || h.que;
      // Hay movimientos cuyo detalle es la misma frase del título (el de
      // "se levantó el expediente", por ejemplo). Repetirla dos renglones
      // seguidos se lee como un error.
      var detalle = (h.detalle && h.detalle !== titulo) ? h.detalle : '';

      return '<div class="dic-historia-fila">' +
        '<span class="dic-historia-punto ' + escapar(h.que) + '"></span>' +
        '<div class="dic-historia-txt">' +

  function fechaHora(iso) {

      ' · ' + f.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  }

  // Los dibujos de los botones de cada expediente. Todos con el mismo

      'stroke-linecap="round" stroke-linejoin="round">' + dentro + '</svg>';

  var BOTE = dibujo('<polyline points="3 6 5 6 21 6"/>' +

    '<path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>');

  function puntoHTML(p, i) {
    var corregida = p.estado === 'corregida';

    // Un solo renglón de acciones. Los de la nota viven aquí también,
