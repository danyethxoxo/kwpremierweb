<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dictaminación de Expedientes</title>
<link rel="icon" type="image/png" href="/kwpremierweb/assets/img/favicon.png" />
<style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
<script>
  setTimeout(function () {
    if (!document.documentElement.classList.contains('kw-auth-ok')) {
      console.error('auth-guard.js no respondió a tiempo; redirigiendo al login por seguridad.');
      location.replace('/kwpremierweb/login.html');
    }
  }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kwpremierweb/assets/js/auth-guard.js"></script>
<script src="/kwpremierweb/assets/js/notif-bell.js?v=20260829p"></script>
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-base.css?v=20260908e">
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-claro.css?v=20260829q">
<script src="/kwpremierweb/assets/js/kw-ui.js?v=20260831b"></script>
<script src="/kwpremierweb/assets/js/kw-xlsx.js?v=20260829t"></script>
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* ── Preparando un dictamen nuevo ──────────────────────────────
     Abrir el formulario trae catálogos y contratos antes de pintar los
     campos. Esta capa nombra esa espera para que no parezca que volvió a
     cargar toda la pantalla de expedientes. */
  .dic-carga-nuevo {
    position: fixed;
    inset: 0;
    z-index: 400;
    display: none;
    overflow-y: auto;
    background: #f7f6f4;
    color: var(--text);
  }
  body.cargando-nuevo .dic-carga-nuevo { display: flex; }
  .dic-carga-nuevo-aviso {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(255,255,255,0.72);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  .dic-carga-nuevo-aviso .kw-loader {
    width: 56px;
    height: 56px;
    min-height: 0;
    padding: 0;
  }
  .dic-carga-nuevo-aviso .kw-loader .circle { border-top-color: var(--red); }
  .dic-carga-nuevo-contenido {
    width: 100%;
    max-width: var(--ancho-pagina);
    margin: 0 auto;
    padding: 90px var(--sp-4) var(--sp-6);
  }
  .dic-carga-nuevo-titulo {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-3);
    margin-bottom: var(--sp-4);
  }
  .dic-carga-nuevo-texto { font-size: 14px; font-weight: 600; color: var(--text); }
  .dic-carga-nuevo-editor {
    padding: var(--sp-4);
    border: 1px solid var(--border);
    border-radius: var(--r-tarjeta);
    background: #fff;
    box-shadow: var(--sombra-1);
  }
  .dic-carga-nuevo-origen {
    padding: 13px;
    border: 1px solid #e7e2e2;
    border-radius: 13px;
    background: #fffaf1;
  }
  .dic-carga-nuevo-campos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--sp-3);
    margin-top: var(--sp-3);
  }
  .dic-carga-nuevo-campo .kw-skel-line:first-child { margin-bottom: 8px; }
  .dic-carga-nuevo-control { height: var(--control-h); border-radius: var(--r-campo); }
  .dic-carga-nuevo-seccion { margin-top: var(--sp-5); }
  .dic-carga-nuevo-seccion > .kw-skel-line { margin-bottom: var(--sp-3); }
  @media (max-width: 640px) {
    .dic-carga-nuevo-contenido { padding: 82px var(--sp-3) var(--sp-5); }
    .dic-carga-nuevo-campos { grid-template-columns: 1fr; }
  }

  /* ── La lista aprovecha la pantalla ────────────────────────────
     Igual que el historial de Firmas digitales, en escritorio la página
     mide la pantalla: el encabezado, los conteos y filtros ocupan solo lo
     necesario y la lista recibe el alto restante. Así los expedientes
     ruedan dentro de su propia zona sin mover los controles de arriba.
     En celular se conserva el desplazamiento normal de la página. */
  @media (min-width: 901px) {
    html.kw-riel body.en-lista > main.kw-page {
      padding-top: 18px !important;
      padding-bottom: 18px;
    }
    body.en-lista .kw-page-encabezado { margin-bottom: 12px; }
    /* Los conteos usan el mismo bloque compacto de tres tarjetas que el
       historial de Firmas: primero se entiende la carga de trabajo y
       después se filtra. */
    body.en-lista .dic-arriba { margin-bottom: 8px; }
    body.en-lista .kw-resumen {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 0;
    }
    body.en-lista .kw-conteo {
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-height: 42px;
      padding: 8px 14px;
    }
    body.en-lista .kw-conteo-num { font-size: 18px; }
    body.en-lista .kw-conteo-txt { font-size: 12px; white-space: nowrap; }
    body.en-lista { height: 100vh; overflow: hidden; }
    body.en-lista > main.kw-page,
    body.en-lista #vista-lista {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }
    body.en-lista #lista {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 2px;
    }
    /* Firmas usa superficies blancas y bordes discretos para que cada
       documento se lea como un renglón de trabajo. Los expedientes
       conservan su acordeón, pero con la misma escala y limpieza visual. */
    body.en-lista .kw-fila {
      border-radius: var(--r-tarjeta);
      background: #fff;
      border-color: var(--border);
      box-shadow: var(--sombra-1);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    body.en-lista .kw-fila-cabeza { padding: 12px 16px; }
  }

  /* ── La barra de arriba ─────────────────────────────────────── */
  .dic-barra {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4);
  }
  .btn-nuevo {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 999px;
    border: none; background: var(--red); color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 14px rgba(40,12,12,0.2);
    transition: transform var(--t-medio);
  }
  .btn-nuevo:hover { transform: translateY(-1px); }
  .btn-nuevo:disabled { opacity: 0.5; cursor: default; transform: none; }

  /* El título de la pantalla y sus botones van en el mismo renglón, que
     es el bloque de encabezado que traen todas las páginas
     (.kw-page-encabezado.con-acciones, en kw-ui.css). Antes esta
     pantalla se armaba su propia cinta con el header metido adentro, y
     el título terminaba más arriba que el de las demás. */

  /* ── Lo de arriba ──
     El buscador y los tres números en un mismo renglón: cada uno por su
     lado dejaba media hilera vacía. El buscador manda un poco más porque
     es lo que más se usa, pero no tanto como para dejar a los números
     apretados. En el celular se apilan. */
  .dic-arriba {
    display: flex; gap: var(--sp-2); align-items: stretch;
    margin-bottom: var(--sp-3);
  }
  /* El buscador se queda de la mitad de lo que medía: con lo que se
     escribe ahí (un folio, media calle) sobraba ancho, y ese ancho le
     sirve más a los tres números de al lado. */
  .dic-arriba > .dic-campo-buscar { flex: 0 1 230px; min-width: 0; }
  .dic-arriba > .kw-resumen { flex: 1 1 460px; min-width: 0; margin: 0; }
  .dic-arriba .kw-buscador, .dic-arriba .kw-buscador input { height: 100%; }
  @media (max-width: 820px) {
    .dic-arriba { flex-wrap: wrap; }
    .dic-arriba > .dic-campo-buscar { flex-basis: 100%; }
    .dic-arriba .kw-buscador, .dic-arriba .kw-buscador input { height: var(--control-h); }
  }

  /* ── El resumen ──
     Tres números y ya. Es lo que uno viene a saber al entrar. Cada uno
     filtra la lista, para no tener que ir a buscar el filtro.

     Cada tarjeta va con el borde del color de su etiqueta. Las tres
     blancas y en hilera no se distinguían entre sí, y el color ya lo
     tienen asignado más abajo: devuelto rojo, condicionado amarillo,
     autorizado verde. Verlo aquí y en la lista es la misma clave. */
  /* Las tarjetas de conteo son la pieza compartida (.kw-resumen y
     .kw-conteo, en kw-ui.css). Aquí solo el color de cada una, que es el
     mismo que el de su etiqueta en la lista. */
  .kw-conteo.devuelta     { --tono: #b02a2a;                 --pastel: #fdeaea; }
  .kw-conteo.condicionada { --tono: var(--pastel-crema-txt); --pastel: var(--pastel-crema); }
  .kw-conteo.autorizada   { --tono: var(--pastel-menta-txt); --pastel: var(--pastel-menta); }
  /* La hilera va dentro del renglón de arriba, junto al buscador, y ahí
     no lleva el margen de abajo que trae de fábrica. */
  .dic-arriba > .kw-resumen { margin-bottom: 0; }

  /* ── El estado del dictamen ──
     Cada uno con su color, porque es lo que se viene a mirar de un
     vistazo: devuelto naranja, condicionado amarillo, autorizado verde. */
  /* El texto va sin negritas: son cuatro etiquetas de colores fuertes
     una debajo de otra, y en negritas la lista entera gritaba. El color
     ya las hace saltar, la letra no tiene que hacerlo también. */
  .dic-estado {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500; white-space: nowrap;
  }
  .dic-estado::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .dic-estado.borrador     { background: rgba(0,0,0,0.05);   color: #5b5b5b; }
  .dic-estado.devuelta     { background: #fdeaea;            color: #b02a2a; }
  .dic-estado.condicionada { background: var(--pastel-crema); color: var(--pastel-crema-txt); }
  .dic-estado.autorizada   { background: var(--pastel-menta); color: var(--pastel-menta-txt); }

  /* El estatus del listado. Comparte forma con la del dictamen pero no
     colores: son dos preguntas distintas y verlas iguales las confunde. */
  .dic-listado {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500; white-space: nowrap;
    max-width: 190px; overflow: hidden; text-overflow: ellipsis;
  }
  .dic-listado::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .dic-listado.pendiente   { background: rgba(0,0,0,0.05); color: #5b5b5b; }
  .dic-listado.sin_listado { background: #fdeaea;          color: #b02a2a; }
  .dic-listado.aprobado    { background: var(--pastel-menta); color: var(--pastel-menta-txt); }

  .dic-marketing {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500; white-space: nowrap;
    max-width: 190px; overflow: hidden; text-overflow: ellipsis;
  }
  .dic-marketing::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .dic-marketing.pendiente { background: rgba(0,0,0,.05); color: #5b5b5b; }
  .dic-marketing.corregir  { background: var(--pastel-crema); color: var(--pastel-crema-txt); }
  .dic-marketing.aprobado  { background: var(--pastel-menta); color: var(--pastel-menta-txt); }

  .dic-menu-op i.pendiente   { background: #5b5b5b; }
  .dic-menu-op i.sin_listado { background: #b02a2a; }
  .dic-menu-op i.aprobado    { background: var(--pastel-menta-txt); }
  .dic-menu-op i.corregir     { background: var(--pastel-crema-txt); }

  /* Las dos etiquetas juntas, para el celular. */
  .dic-etiquetas-movil { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (min-width: 901px) { .dic-etiquetas-movil { display: none; } }

  /* ── Las dos autorizaciones como dos columnas ──
     Cada una con el mismo ancho en todos los renglones: sin eso, un
     estatus largo empuja al de junto y las etiquetas quedan escalonadas
     de tarjeta en tarjeta, que es lo que hacía difícil compararlas. La
     línea de en medio es la que las separa de verdad.

     Los rótulos de arriba viven fuera de las tarjetas, así que su
     alineación se sostiene repitiendo aquí las medidas del renglón: el
     relleno de la tarjeta (16px), el hueco antes de la flecha (12px) y
     la flecha misma (17px). */
  .dic-cabecera { display: none; }
  @media (min-width: 901px) {
    .dic-col { width: 175px; flex-shrink: 0; }
    .dic-col-separada {
      border-left: 1px solid var(--border);
      padding-left: 16px; margin-left: -4px;
    }
    .dic-col .dic-estado, .dic-col .dic-marketing, .dic-col .dic-listado { max-width: 100%; }

    .dic-cabecera {
      display: flex; justify-content: flex-end; gap: 20px;
      /* El 1px de más es el borde de la tarjeta, que los rótulos no
         tienen y que si no los deja corridos por esa misma cantidad. */
      padding: 0 calc(16px + 12px + 17px + 1px) 7px 16px;
      margin-bottom: 2px;
    }
    .dic-cabecera-col {
      width: 175px; flex-shrink: 0;
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted);
    }
    .dic-cabecera-col:not(:first-child) { padding-left: 16px; margin-left: -4px; }
  }

  /* La misma etiqueta, pero se le puede picar para cambiar el estado. Se
     queda del color que tiene puesto: es lo que se viene a mirar de un
     vistazo, y volverla neutra por ser botón la haría perder eso. La
     flechita es la que avisa que además se abre. */
  .dic-estado-btn {
    border: none; font-family: inherit; cursor: pointer;
    transition: filter 0.15s, box-shadow 0.15s;
  }
  .dic-estado-btn:hover { filter: brightness(0.96); box-shadow: var(--sombra-1); }
  .dic-estado-btn svg { width: 11px; height: 11px; margin-left: -1px; opacity: 0.75; }
  /* En el celular la etiqueta del encabezado no se enseña (no cabe), así
     que el botón para cambiar el estado sale adentro de la tarjeta ya
     desplegada. En escritorio estorba: ahí se pica la etiqueta de arriba. */
  .dic-estado-movil { margin-bottom: var(--sp-3); }
  @media (min-width: 901px) { .dic-estado-movil { display: none; } }

  /* El menú del estado. Va pegado al body y con position:fixed porque la
     tarjeta lleva overflow:hidden: colgado de ella quedaría recortado. */
  .dic-menu-estado {
    position: fixed; z-index: 120; min-width: 210px; padding: 5px;
    background: linear-gradient(150deg, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.92) 45%, rgba(255,255,255,0.88) 100%);
    border: 1px solid rgba(255,255,255,0.82); border-radius: 12px;
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: 0 12px 32px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.30);
  }
  .dic-menu-op {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: none; background: none; font-family: inherit;
    font-size: 13px; color: var(--text); text-align: left;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .dic-menu-op:hover { background: #f5f5f5; }
  .dic-menu-op i { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dic-menu-op.puesto { font-weight: 700; background: #fff3f3; }
  /* El expediente abierto se enmarca en rojo, como la tarjeta de los
     filtros. Con varios abiertos a la vez, la sombra sola no alcanzaba
     para saber dónde empieza y dónde termina cada uno. */
  #lista .kw-fila.abierta { border-color: rgba(206,1,31,0.34); }

  /* ── Las pestañas de cada tarjeta ──
     Los paneles de kw-ui traen un alto mínimo pensado para una pantalla
     completa; aquí van dentro de una tarjeta y ese piso la estiraría con
     aire vacío. */
  .dic-tabpanels { --panel-min: 0; }

  /* Las pestañas y los botones del expediente comparten renglón: son dos
     cosas chicas y cada una ocupaba el suyo. Las pestañas a la izquierda,
     los botones hasta la derecha. */
  .dic-barra-tarjeta {
    display: flex; align-items: center; gap: var(--sp-2);
    margin-bottom: var(--sp-3);
  }
  /* Aquí las pestañas van sin cápsula: nada más las dos palabras, con
     los mismos colores. Dentro de la tarjeta, una pastilla gris con otra
     pastilla blanca encima eran dos cajas más sobre una tarjeta que ya
     es una caja, y no pegaban con el resto. La abierta se distingue por
     el color y por la raya de abajo. */
  .dic-barra-tarjeta .dic-tabs {
    margin: 0; flex-shrink: 0; padding: 0; gap: var(--sp-3);
    background: none; border-radius: 0; overflow: visible;
  }
  .dic-barra-tarjeta .kw-tabs-indicador { display: none; }
  .dic-barra-tarjeta .kw-tab {
    height: 26px; padding: 0 1px; font-size: 12.5px;
    border-bottom: 2px solid transparent; border-radius: 0;
  }
  .dic-barra-tarjeta .kw-tab.activo { border-bottom-color: var(--red); }

  /* Los botones del expediente, ya sin letras. Lo que hace cada uno lo
     dice el title; con tres iconos conocidos (bajar, lápiz, caja) el
     texto era ancho gastado en decir lo que el dibujo ya dice. */
  .dic-acciones-iconos { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .dic-icono-btn {
    --accion-color: #696969;
    display: inline-flex; align-items: center; justify-content: flex-start; gap: 7px;
    width: auto; max-width: 32px; height: 32px; padding: 0 8px;
    overflow: hidden; white-space: nowrap;
    border: 1px solid var(--accion-color); border-radius: 9px;
    background: #fff; color: var(--accion-color); cursor: pointer;
    transition: max-width .28s ease, padding .28s ease, background .18s ease,
      color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .dic-icono-btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .dic-icono-texto {
    max-width: 0; opacity: 0; transform: translateX(-8px);
    overflow: hidden; font-size: 12px; font-weight: 500;
    transition: max-width .28s ease, opacity .18s ease, transform .28s ease;
  }
  .dic-icono-btn.preparado {
    max-width: 210px; padding: 0 11px; background: color-mix(in srgb, var(--accion-color) 8%, white);
    box-shadow: 0 5px 13px color-mix(in srgb, var(--accion-color) 18%, transparent);
    transform: translateX(-2px);
  }
  .dic-icono-btn.preparado .dic-icono-texto {
    max-width: 170px; opacity: 1; transform: translateX(0);
  }
  .dic-icono-btn:hover { background: color-mix(in srgb, var(--accion-color) 7%, white); }
  .dic-icono-btn.accion-imprimir { --accion-color: #a30d22; }
  .dic-icono-btn.accion-imprimir-correcciones { --accion-color: #7540a8; }
  .dic-icono-btn.accion-editar { --accion-color: #2463a8; }
  .dic-icono-btn.accion-archivar { --accion-color: #9a6710; }
  .dic-icono-btn.accion-restaurar { --accion-color: #197142; }
  .dic-icono-btn.accion-borrar { --accion-color: #b02a2a; }

  @media (max-width: 560px) {
    .dic-barra-tarjeta { flex-wrap: wrap; }
    .dic-acciones-iconos { margin-left: 0; }
  }

  /* ── Checklist de Marketing ── */
  .dic-mkt-checklist {
    border: 1px solid var(--border); border-radius: 13px;
    background: #fff; overflow: hidden;
  }
  .dic-mkt-encabezado {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 11px 13px; border-bottom: 1px solid var(--border);
    background: #fcfbfb;
  }
  .dic-mkt-encabezado h4 { margin: 0; font-size: 13.5px; color: var(--text); }
  .dic-mkt-progreso { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dic-mkt-lista { display: flex; flex-direction: column; }
  .dic-mkt-fila {
    display: grid; grid-template-columns: minmax(190px, .75fr) auto minmax(210px, 1.25fr);
    align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid #f0ecec;
  }
  .dic-mkt-fila:last-child { border-bottom: none; }
  .dic-mkt-fila.correcto { background: #f6fbf7; }
  .dic-mkt-fila.incorrecto { background: #fff7f7; }
  .dic-mkt-nombre { min-width: 0; font-size: 13px; color: var(--text); }
  .dic-mkt-opciones { display: flex; gap: 5px; }
  .dic-mkt-opcion {
    display: inline-flex; align-items: center; justify-content: center;
    width: 29px; height: 29px; padding: 0; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; color: #8a8585;
    font: inherit; font-size: 16px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s, transform .15s;
  }
  .dic-mkt-opcion:hover { transform: translateY(-1px); }
  .dic-mkt-opcion.correcto:hover,
  .dic-mkt-opcion.correcto.activo {
    color: #157a41; border-color: #8bc9a3; background: #eaf8ef;
  }
  .dic-mkt-opcion.incorrecto:hover,
  .dic-mkt-opcion.incorrecto.activo {
    color: #b02a2a; border-color: #e2a1a1; background: #fdecec;
  }
  .dic-mkt-comentario,
  .dic-mkt-general textarea {
    width: 100%; min-height: 34px; resize: vertical;
    border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 9px; background: #fff; color: var(--text);
    font: inherit; font-size: 12.5px; line-height: 1.35;
  }
  .dic-mkt-comentario:focus,
  .dic-mkt-general textarea:focus {
    outline: none; border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(198,32,39,.07);
  }
  .dic-mkt-general {
    padding: 11px 12px; border-top: 1px solid var(--border); background: #fcfbfb;
  }
  .dic-mkt-general label {
    display: block; margin-bottom: 6px; font-size: 12px; font-weight: 650; color: #302a2a;
  }
  .dic-mkt-pie {
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 0 12px 12px; background: #fcfbfb;
  }
  .dic-mkt-guardar { min-width: 150px; }
  @media (max-width: 760px) {
    .dic-mkt-fila { grid-template-columns: 1fr auto; }
    .dic-mkt-comentario { grid-column: 1 / -1; }
  }

  /* ── El historial ──
     Un renglón por movimiento, con su punto de color a la izquierda y la
     hora a la derecha. Se lee de arriba abajo como una conversación: lo
     más reciente primero, que es lo que uno viene a ver. */
  .dic-historia { display: flex; flex-direction: column; }
  .dic-historia-fila {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .dic-historia-fila:last-child { border-bottom: none; }
  .dic-historia-punto {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    margin-top: 5px; background: #b3b3b3;
  }
  .dic-historia-punto.creado          { background: var(--red); }
  .dic-historia-punto.estado          { background: #e0a218; }
  .dic-historia-punto.listado         { background: #6b7fd7; }
  .dic-historia-punto.punto_corregida { background: #1f9d55; }
  .dic-historia-punto.punto_nuevo     { background: #e0a218; }
  .dic-historia-punto.punto_quitado   { background: #d13b3b; }
  .dic-historia-txt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; }
  .dic-historia-txt b { display: block; color: var(--text); }
  .dic-historia-txt span { color: var(--muted); }
  .dic-historia-cuando {
    flex-shrink: 0; text-align: right;
    font-size: 11.5px; color: var(--muted); line-height: 1.5;
  }
  .dic-historia-cuando span { display: block; font-size: 11px; opacity: 0.85; }
  @media (max-width: 700px) {
    .dic-historia-fila { flex-wrap: wrap; }
    .dic-historia-cuando { width: 100%; text-align: left; padding-left: 18px; }
    .dic-historia-cuando span { display: inline; }
  }

  /* Las tres respuestas del aviso de "en qué estatus quedó". Van una
     debajo de otra y no en hilera: leídas en columna se comparan, que es
     lo que uno está haciendo justo en ese momento. */
  .dic-modal-estado h3 { margin: 0; line-height: 1.35; }
  .dic-modal-estado .dic-preguntar {
    display: flex; flex-direction: column; gap: 10px; margin-top: 16px;
  }
  .dic-modal-estado .modal-actions { margin-top: 14px; }
  .dic-modal-estado .modal-actions button { min-height: 46px; }
  .dic-preguntar-op {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px;
    border: 1px solid var(--border); border-radius: 12px; background: #fff;
    font-family: inherit; font-size: 13.5px; font-weight: 400; color: var(--text);
    padding: 13px 15px; cursor: pointer; text-align: left;
    transition: border-color 0.15s, background 0.15s, transform 0.12s;
  }
  .dic-preguntar-op:hover { background: #fafafa; border-color: #c9c9c9; }
  .dic-preguntar-op:active { transform: translateY(1px) scale(0.99); }
  .dic-preguntar-op i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dic-preguntar-op i.devuelta     { background: #b02a2a; }
  .dic-preguntar-op i.condicionada { background: var(--pastel-crema-txt); }
  .dic-preguntar-op i.autorizada   { background: var(--pastel-menta-txt); }

  .dic-menu-op i.borrador     { background: #5b5b5b; }
  .dic-menu-op i.devuelta     { background: #b02a2a; }
  .dic-menu-op i.condicionada { background: var(--pastel-crema-txt); }
  .dic-menu-op i.autorizada   { background: var(--pastel-menta-txt); }

  .dic-avance {
    width: 84px; height: 5px; border-radius: 999px;
    background: rgba(0,0,0,0.09); overflow: hidden; flex-shrink: 0;
  }
  .dic-avance span { display: block; height: 100%; background: #1f9d55; border-radius: 999px; }

  /* ── Una observación por atender ── */
  .dic-punto {
    border: 1px solid var(--border);
    border-left: 3px solid #e0a218;
    border-radius: 10px; background: #fff;
    padding: 5px 9px; margin-bottom: 5px;
  }
  .dic-punto.corregida { border-left-color: #1f9d55; }
  .dic-punto-cabeza { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .dic-punto-texto { flex: 1 1 auto; min-width: 0; font-size: 13px; line-height: 1.3; color: var(--text); }
  .dic-punto-acciones { flex: 0 0 auto; }
  .dic-punto-menu-trigger {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0; border: 1px solid var(--border);
    border-radius: 8px; background: #fff; color: var(--muted); cursor: pointer;
  }
  .dic-punto-menu-trigger:hover { color: var(--text); background: #f7f7f7; }
  .dic-punto-menu-trigger svg { width: 16px; height: 16px; }
  .dic-menu-punto { position: fixed; z-index: 121; min-width: 188px; padding: 5px; }
  .dic-menu-punto button {
    display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-radius: 8px;
    padding: 8px 10px; background: transparent; color: var(--text); font: inherit; font-size: 13px;
    text-align: left; cursor: pointer;
  }
  .dic-menu-punto button:hover { background: #f5f5f5; }
  .dic-menu-punto .peligro { color: #b02a2a; }
  .dic-menu-punto svg { width: 14px; height: 14px; }
  .dic-punto-nota {
    margin-top: 5px; padding: 6px 8px; border-radius: 8px;
    background: rgba(0,0,0,0.035); font-size: 12px; color: #444;
    line-height: 1.4; white-space: pre-line;
  }
  /* Todo lo que se le puede hacer a una observación va en un solo
     renglón. Antes la nota traía su propia hilera de botones encima de
     la de siempre: quedaban dos filas amontonadas y ninguna decía cuál
     era la acción principal. */
  .dic-punto-acciones {
    display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; margin-top: 0;
  }
  .dic-punto-acciones .kw-btn-mini {
    min-height: 26px; padding: 4px 8px; white-space: nowrap;
    font-size: 12px; font-weight: 400; border-color: transparent;
  }
  .dic-punto .dic-estado { padding: 2px 8px; font-size: 11px; }
  /* Corregir usa verde solo al pasar encima; una vez confirmado se queda
     verde para que el cambio sea evidente sin releer el estatus. */
  .dic-punto:not(.corregida) [data-mover]:hover { color: #157a41; border-color: transparent; background: #f0faf3; }
  .dic-punto.corregida [data-mover] { color: #157a41; border-color: transparent; background: #f0faf3; }
  .dic-punto.corregida [data-mover]:hover { background: #def4e5; }
  /* La nota es una acción informativa, por eso se diferencia en azul. */
  .dic-punto [data-nota] { color: #2463b5; border-color: transparent; }
  .dic-punto [data-nota]:hover { color: #164a91; border-color: transparent; background: #f1f7ff; }
  /* El indicador evita el vacío visual mientras llega la actualización. */
  .dic-punto.guardando { opacity: 0.72; transition: opacity 0.15s ease; }
  .dic-punto-acciones .actualizando { cursor: wait; }
  .dic-punto-acciones .actualizando::after {
    content: ''; display: inline-block; width: 10px; height: 10px; margin-left: 5px;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: dic-girar 0.65s linear infinite; vertical-align: -1px;
  }
  @keyframes dic-girar { to { transform: rotate(360deg); } }
  /* Quitar y archivar no son acciones del mismo peso que las de al lado:
     se van hasta la derecha, separadas, para no picarles de pasada. */
  .dic-punto-acciones .a-la-derecha,
  .kw-fila-acciones .a-la-derecha { margin-left: auto; }

  /* Enviar y cancelar solo existen mientras se está escribiendo la nota,
     y el botón de abrirla desaparece mientras tanto: ya está abierta. */
  .dic-punto .solo-notando { display: none; }
  .dic-punto.notando .solo-notando { display: inline-flex; }
  .dic-punto.notando .oculto-notando { display: none; }

  .kw-btn-mini.verde { border-color: #1f9d55; color: #157a41; }
  .kw-btn-mini.verde:hover { background: #f0faf3; border-color: #157a41; }
  .kw-btn-mini.rojo { border-color: #d13b3b; color: #b02a2a; }
  .kw-btn-mini.rojo:hover { background: #fdf0f0; border-color: #b02a2a; }

  /* Un bote de basura solo, sin texto: se entiende sin leerlo y deja de
     competir por atención con las acciones que sí se usan a diario. */
  .dic-punto-tirar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 9px;
    background: #fff; color: var(--muted); cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .dic-punto-tirar:hover { background: #fdf0f0; color: #b02a2a; border-color: #d13b3b; }
  .dic-punto-tirar svg { width: 14px; height: 14px; }

  .dic-punto-form { margin-top: 10px; display: none; }
  .dic-punto-form.abierto { display: block; }
  .dic-punto-form textarea {
    width: 100%; min-height: 58px; resize: vertical;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-family: inherit; font-size: 13px;
    color: var(--text); background: #fff;
  }
  .dic-punto-form textarea:focus { outline: none; border-color: var(--red); }

  /* ── Los datos del expediente dentro de la tarjeta ── */
  .dic-datos {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    margin: var(--sp-2) 0 var(--sp-4);
  }
  .dic-grupo-datos {
    border: 1px solid #e7e2e2; border-radius: 12px;
    padding: 11px 13px; background: #fff;
    box-shadow: 0 3px 12px rgba(39,22,22,.035);
  }
  .dic-grupo-datos-titulo {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 8px; padding-bottom: 6px;
    border-bottom: 1px solid #eee9e9;
    color: #272222; font-size: 12px; font-weight: 650;
    letter-spacing: .015em;
  }
  .dic-grupo-datos-titulo::before {
    content: ''; width: 4px; height: 15px; border-radius: 999px;
    background: var(--red); flex: 0 0 auto;
  }
  .dic-grupo-datos-rejilla {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 0 16px;
  }
  .dic-grupo-operacion .dic-dato:first-child { grid-column: 1 / -1; }
  .dic-dato {
    min-width: 0; padding: 6px 0 7px;
    border-bottom: 1px solid #f2eeee;
    font-size: 14px; line-height: 1.45;
  }
  .dic-dato:last-child { border-bottom-color: transparent; }
  .dic-dato b {
    display: block; margin-bottom: 4px;
    font-size: 9.5px; line-height: 1.25; font-weight: 650;
    text-transform: uppercase; letter-spacing: .065em; color: #8a7f7f;
  }
  .dic-dato-valor {
    display: block; color: #211d1d; font-size: 14px; font-weight: 500;
    overflow-wrap: anywhere; white-space: pre-line;
  }
  .dic-dato-valor.vacio { color: #9b9494; font-weight: 400; font-style: italic; }
  .dic-dato-correccion {
    display: block; margin-top: 7px; padding: 6px 8px;
    border-left: 2px solid #c52a36; border-radius: 0 7px 7px 0;
    background: #fff6f6; color: #a4212d;
    font-size: 12.5px; line-height: 1.4; font-weight: 400;
    overflow-wrap: anywhere;
  }
  .dic-dato-correccion::before {
    content: 'Corrección · '; font-size: 9px; font-weight: 650;
    text-transform: uppercase; letter-spacing: .055em; opacity: .72;
  }
  .dic-observaciones-seccion {
    margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .dic-observaciones-titulo {
    margin: 0 0 10px; color: #302a2a; font-size: 12.5px; font-weight: 650;
  }
  .dic-sin-observaciones {
    padding: 9px 11px; border: 1px dashed #ddd5d5; border-radius: 10px;
    color: var(--muted); font-size: 12.5px; background: #fcfbfb;
  }
  @media (max-width: 900px) {
    .dic-datos { grid-template-columns: 1fr; }
  }
  @media (max-width: 620px) {
    .dic-grupo-datos { padding: 11px 12px; }
    .dic-grupo-datos-rejilla { grid-template-columns: 1fr; }
  }

  /* ── Elegir un contrato como origen del dictamen ── */
  .dic-origen {
    margin-bottom: var(--sp-4); padding: 13px;
    border: 1px solid var(--pastel-menta-txt); border-radius: 13px;
    background: transparent;
  }
  .dic-origen-cabeza { margin-bottom: 10px; }
  .dic-origen-cabeza h2 { margin: 0; color: var(--text); font-size: 14px; line-height: 1.35; }
  .dic-origen-cabeza p { margin: 3px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .dic-contratos-panel { margin-top: 12px; }
  .dic-contratos-filtros {
    display: grid; grid-template-columns: minmax(220px, 1.6fr) minmax(145px, .7fr) minmax(155px, .8fr);
    gap: 8px; margin-bottom: 10px;
  }
  .dic-contratos-filtros .dic-campo { margin-bottom: 0; }
  .dic-contratos-origen {
    max-height: 330px; overflow: auto; border: 1px solid #e1d9cf;
    border-radius: 11px; background: #fff;
  }
  .dic-contrato-ayuda {
    padding: 10px 11px; border: 1px dashed #dcd4ca; border-radius: 10px;
    background: rgba(255,255,255,.65); color: var(--muted); font-size: 12.5px;
  }
  .dic-contrato-tabla { width: 100%; border-collapse: collapse; font-size: 12px; }
  .dic-contrato-tabla th {
    position: sticky; top: 0; z-index: 1; padding: 9px 10px;
    background: #f8f5f0; border-bottom: 1px solid #e1d9cf;
    color: #746b63; font-size: 10px; font-weight: 700;
    text-align: left; text-transform: uppercase; letter-spacing: .05em;
  }
  .dic-contrato-tabla td { padding: 10px; border-bottom: 1px solid #eee9e3; vertical-align: middle; }
  .dic-contrato-tabla tr:last-child td { border-bottom: none; }
  .dic-contrato-tabla tbody tr:hover { background: #fffaf1; }
  .dic-contrato-tabla tbody tr.seleccionado { background: #fff3d8; }
  .dic-contrato-principal { display: block; font-weight: 600; color: var(--text); }
  .dic-contrato-secundario { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
  .dic-contrato-elegir { white-space: nowrap; }
  .dic-contrato-seleccion {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    padding: 8px 10px; border-radius: 10px; background: #eef9f1;
    color: #17683c; font-size: 12px;
  }
  .dic-contrato-seleccion[hidden] { display: none; }
  .dic-contrato-seleccion::before {
    content: '✓'; display: grid; place-items: center; width: 19px; height: 19px;
    border-radius: 50%; background: #d9f1df; font-weight: 700;
  }
  @media (max-width: 720px) {
    .dic-contratos-filtros { grid-template-columns: 1fr; }
    .dic-contrato-tabla thead { display: none; }
    .dic-contrato-tabla, .dic-contrato-tabla tbody, .dic-contrato-tabla tr, .dic-contrato-tabla td { display: block; }
    .dic-contrato-tabla tr { padding: 9px 10px; border-bottom: 1px solid #e1d9cf; }
    .dic-contrato-tabla td { padding: 3px 0; border: none; }
    .dic-contrato-tabla td::before {
      content: attr(data-label); display: block; margin-bottom: 2px;
      color: #746b63; font-size: 9px; font-weight: 700; text-transform: uppercase;
    }
  }

  /* ── El editor ── */
  .dic-editor {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--r-tarjeta); box-shadow: var(--sombra-1);
    padding: var(--sp-4);
  }
  .dic-campo { margin-bottom: var(--sp-3); }
  .dic-campo > label {
    display: block; margin-bottom: 5px;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--muted);
  }
  /* Los que ya traen .kw-input quedan fuera: esos se visten con esa clase
     y agregarles este otro juego de medidas los haría cambiar de alto y
     de borde al picarlos. */
  .dic-campo textarea,
  .dic-campo input[type="date"]:not(.kw-input) {
    width: 100%; resize: vertical;
    border: 1px solid var(--border); border-radius: var(--r-campo);
    padding: 10px 12px; font-family: inherit; font-size: 13.5px;
    color: var(--text); background: #fff;
  }
  .dic-campo textarea { min-height: 62px; }
  .dic-campo .dic-numero-linea {
    display: block; width: 100%; min-height: var(--control-h, 44px);
    height: var(--control-h, 44px); resize: none; overflow: hidden;
    white-space: nowrap; line-height: 20px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--r-campo);
    font-family: inherit; font-size: 13.5px; color: var(--text); background: #fff;
  }
  .dic-campo .dic-numero-linea:focus { outline: none; border-color: var(--red); }
  .dic-campo textarea:focus, .dic-campo input:focus { outline: none; border-color: var(--red); }

  /* Fecha de escrituración sin calendario: día, mes y año se eligen por
     separado para poder corregir una parte sin volver a capturar todo. */
  .dic-fecha-partes { display: grid; grid-template-columns: 82px 1fr 104px; gap: 8px; }
  .dic-fecha-partes select { width: 100%; }

  /* Corrección particular de un dato: queda debajo del valor que copió
     Gabriela del contrato y se distingue en rojo de la captura original. */
  .dic-correccion { margin-top: 7px; }
  .dic-correccion-btn {
    border: none; background: none; padding: 2px 0; cursor: pointer;
    color: var(--red); font: 700 12px/1.4 inherit;
  }
  .dic-correccion-campo { display: none; margin-top: 6px; }
  .dic-correccion.abierta .dic-correccion-campo { display: block; }
  .dic-correccion-campo textarea,
  .dic-correccion-campo input[data-correccion-libre] {
    width: 100%; min-height: 48px; resize: vertical;
    border: 1px solid rgba(176,42,42,.38); border-radius: var(--r-campo);
    padding: 9px 11px; font-family: inherit; font-size: 13px;
    color: #b02a2a; background: #fff7f7;
  }
  .dic-correccion-campo input[data-correccion-libre] {
    min-height: 40px; margin: 0; resize: none;
  }
  .dic-correccion-campo,
  .dic-correccion-campo textarea,
  .dic-correccion-campo input,
  .dic-correccion-campo button { color: #b02a2a; }
  .dic-correccion-campo textarea::placeholder,
  .dic-correccion-campo input::placeholder { color: rgba(176,42,42,.62); }
  .dic-correccion-campo textarea:focus,
  .dic-correccion-campo input:focus { outline: none; border-color: #b02a2a; }

  /* Desplegable de corrección: las opciones y la escritura libre viven
     dentro del mismo menú, sin abrir un segundo campo debajo. */
  .dic-correccion-combo { position: relative; }
  .dic-correccion-combo-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; min-height: var(--control-h, 44px); padding: 9px 12px;
    border: 1px solid rgba(176,42,42,.38); border-radius: var(--r-campo);
    background: #fff7f7; color: #b02a2a; font: 400 13px/1.35 inherit;
    text-align: left; cursor: pointer;
  }
  .dic-correccion-combo-btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
  .dic-correccion-combo.abierto .dic-correccion-combo-btn {
    border-color: #b02a2a; border-radius: var(--r-campo) var(--r-campo) 0 0;
  }
  .dic-correccion-menu {
    display: none; position: absolute; z-index: 145; top: calc(100% - 1px);
    left: 0; right: 0; max-height: 260px; overflow-y: auto; padding: 6px;
    border: 1px solid rgba(176,42,42,.38); border-radius: 0 0 12px 12px;
    background: #fff; box-shadow: 0 12px 26px rgba(75,24,24,.16);
  }
  .dic-correccion-combo.abierto .dic-correccion-menu { display: block; }
  .dic-correccion-opcion {
    display: block; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px;
    background: transparent; color: #b02a2a; font: 400 13px/1.35 inherit;
    text-align: left; cursor: pointer;
  }
  .dic-correccion-opcion:hover { background: #fff0f0; }
  .dic-correccion-escribir {
    margin-top: 5px; padding-top: 6px; border-top: 1px solid #f0d8d8;
  }

  /* Las observaciones existentes se editan en su propio campo sin perder
     su id, estado ni historial. */
  .dic-punto-edit-texto {
    flex: 1; min-width: 0; min-height: 42px; resize: vertical;
    border: 1px solid transparent; border-radius: 8px;
    padding: 7px 9px; font-family: inherit; font-size: 13.5px; line-height: 1.45;
    color: var(--text); background: transparent;
  }
  .dic-punto-edit-texto:hover { border-color: var(--border); background: #fff; }
  .dic-punto-edit-texto:focus { outline: none; border-color: var(--red); background: #fff; }
  @media (max-width: 520px) { .dic-fecha-partes { grid-template-columns: 72px 1fr 92px; } }

  /* Superficies: en el campo se teclea nada más el número y la unidad va
     pegada a la derecha, puesta por el sitio. Se dibuja encima del campo
     en vez de escribirse dentro para que no haya forma de borrarla ni de
     capturarla de tres maneras distintas. El relleno de la derecha le
     abre el lugar para que el número no se le encime al llegar. */
  .dic-conunidad { position: relative; }
  .dic-conunidad input, .dic-conunidad textarea.dic-numero-linea {
    width: 100%; padding-right: 40px;
  }
  .dic-conunidad span {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; font-weight: 700; color: var(--muted); pointer-events: none;
  }
  /* El peso va del otro lado, que es donde se escribe en una cifra. */
  .dic-conunidad span.dic-unidad-izq { right: auto; left: 12px; }
  .dic-conunidad:has(.dic-unidad-izq) input,
  .dic-conunidad:has(.dic-unidad-izq) textarea.dic-numero-linea {
    padding-right: 12px; padding-left: 26px;
  }
  .dic-dos { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .dic-tres { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp-3); }
  @media (max-width: 700px) {
    .dic-dos, .dic-tres { grid-template-columns: 1fr; }
  }
  /* Las tres partes del formulario (cliente, inmueble, observaciones)
     se separan con este rótulo. La línea de abajo es la que hace que se
     lean como bloques y no como un solo chorro de campos. */
  .dic-subtitulo {
    width: 100%; font-size: 15px; color: var(--text); text-align: left;
    margin: var(--sp-5) 0 var(--sp-3);
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }

  /* ── Los clientes del expediente ──
     Cada uno en su tarjeta: con tres o cuatro capturados seguidos, sin
     algo que los encierre no se distingue dónde acaba uno y empieza el
     que sigue, y se acaba escribiendo el estado civil en el renglón del
     otro. */
  .dic-cliente {
    border: 1px solid var(--border); border-radius: var(--r-campo);
    padding: var(--sp-3); margin-bottom: var(--sp-3);
    background: var(--card-degradado, #fff);
  }
  .dic-cliente-num {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--red); margin-bottom: var(--sp-2);
  }
  .dic-cliente .dic-campo:last-child { margin-bottom: 0; }

  /* Los rótulos escondidos y el ancho tope de cada filtro salen ahora de
     .kw-filtros-caja, en kw-ui.css. */

  /* Cada filtro pesa según lo que le cabe adentro, en vez de repartirse
     el ancho a partes iguales. El de asesor es el que más se usa y el que
     crece con los elegidos, así que va más ancho; los tres desplegables
     llevan nombres largos; la comisión son dos dígitos y una fecha es una
     fecha. Sin esto, "Comisión %" tenía el mismo lugar que "Tipo de
     inmueble" y ninguno de los dos alcanzaba a decirse completo. */
  .kw-filtros > .dic-f-asesor { flex: 1.3 1 190px; max-width: 260px; }
  .kw-filtros > .dic-f-lista  { flex: 1 1 156px; max-width: 200px; }
  .kw-filtros > .dic-f-fecha  { flex: 0 1 138px; max-width: 150px; }
  .kw-filtros > .dic-f-chico  { flex: 0 1 118px; max-width: 130px; }

  /* La tarjeta de los filtros es la compartida (.kw-filtros-caja de
     kw-ui.css). Aquí queda nada más lo suyo: que de entrada solo se vea
     el primer renglón, porque diez casillas abiertas eran media pantalla
     antes de llegar al primer expediente. */

  /* Plegado, los filtros que no caben en el primer renglón se esconden
     uno por uno desde el código. Antes se recortaba la caja entera con
     overflow, que era más corto, pero el menú de un desplegable cuelga
     por debajo de su campo: al abrir "Tipo de inmueble" el menú quedaba
     cortado a media lista. */
  .dic-filtro-oculto { display: none !important; }

  /* La flechita va al final del primer renglón, colgada del borde y no
     en la hilera: metida entre los filtros se movía de lugar según
     cuántos cupieran ese día. */
  .dic-filtros-caja { position: relative; padding-right: 46px; }
  .dic-filtros-mas {
    position: absolute; right: 8px; top: calc(var(--sp-3) + var(--control-h) / 2);
    transform: translateY(-50%);
    display: flex; align-items: center; gap: 4px;
    padding: 5px 6px; border: none; background: none;
    color: rgba(27,79,138,0.9); cursor: pointer;
  }
  .dic-filtros-mas svg {
    width: 17px; height: 17px;
    transition: transform var(--t-medio);
  }
  .dic-filtros-caja.abierta .dic-filtros-mas svg { transform: rotate(180deg); }
  /* Cuántos filtros hay puestos entre los que quedaron escondidos. Sin
     esto, plegar la tarjeta escondía filtros prendidos y la lista salía
     recortada sin decir por qué. */
  .dic-filtros-cuantos {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
    background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700;
  }
  .dic-filtros-cuantos[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .dic-filtros-mas svg { transition: none; }
  }

  /* El campo suelto de un filtro y el par de un rango son piezas
     compartidas (.kw-fecha, .kw-rango y .kw-campo-rango, en kw-ui.css).
     Precio y comisión se piden por rango y no por un valor exacto: nadie
     busca "los de 4,500,000", se busca "de tres a cinco millones". */

  /* El engrane es el puro dibujo, azul al pasar el mouse: la pieza
     .kw-btn-icono de kw-ui.css, que es la misma que usa el botón de
     actualizar de Firmas. */
  @keyframes dic-gira { to { transform: rotate(360deg); } }

  /* El menú del engrane es la pieza compartida (.kw-menu de kw-ui.css).
     El de los estados no puede serlo: ese sale de una tarjeta que rueda
     con la lista y necesita posición fija. */

  /* Limpiar cierra la hilera: no es un filtro más, es el botón para
     deshacer lo elegido, así que va al final de todos y no compitiendo
     por lugar entre ellos. */
  .dic-campo-limpiar { justify-content: flex-end; }
  .kw-filtros > .dic-campo-limpiar { flex: 0 0 auto; }
  /* Chico y con el bote: no es un filtro más, es deshacer lo elegido, y
     del tamaño de los demás pesaba como si lo fuera. */
  .dic-limpiar {
    display: inline-flex; align-items: center; gap: 6px;
    height: var(--control-h); padding: 0 12px;
    border: 1px solid var(--border); border-radius: var(--r-campo);
    background: #fff; color: var(--muted);
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .dic-limpiar svg { width: 14px; height: 14px; flex-shrink: 0; }
  .dic-limpiar:hover { background: #fafafa; color: var(--red); border-color: var(--red); }

  /* ── El filtro de asesor, que admite varios ──
     El campo crece hacia abajo conforme se van agregando: con tres o
     cuatro elegidos, una sola línea los recortaría y ya no se sabría a
     quiénes se está filtrando. */
  .dic-multi { position: relative; }
  .dic-multi-elegidos { display: flex; flex-wrap: wrap; gap: 5px; }
  .dic-multi-elegidos:not(:empty) { margin-bottom: 6px; }
  .dic-multi-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--pastel-rojo); color: var(--red);
    border-radius: 999px; padding: 3px 5px 3px 10px;
    font-size: 11.5px; font-weight: 700; max-width: 100%;
  }
  .dic-multi-chip span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dic-multi-chip button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; flex-shrink: 0;
    border: none; border-radius: 50%; background: rgba(0,0,0,0.08);
    color: inherit; cursor: pointer; padding: 0;
  }
  .dic-multi-chip button:hover { background: rgba(0,0,0,0.16); }
  .dic-multi-chip svg { width: 9px; height: 9px; }

  /* ── El buscador de asesor ──
     Son 94 y crecen. Un desplegable de 94 renglones se recorre a ciegas;
     escribiendo tres letras se llega en un segundo. */
  .dic-busca-asesor { position: relative; }
  .dic-asesor-lista {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
    max-height: 260px; overflow-y: auto;
    background: #fff; border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--sombra-3);
    padding: 5px; display: none;
  }
  .dic-asesor-lista.abierta { display: block; }
  .dic-asesor-op {
    display: block; width: 100%; text-align: left;
    padding: 8px 10px; border: none; border-radius: 9px;
    background: none; font-family: inherit; font-size: 13.5px;
    color: var(--text); cursor: pointer;
  }
  .dic-asesor-op:hover, .dic-asesor-op.resaltada { background: var(--pastel-rojo); }
  .dic-asesor-op small { display: block; color: var(--muted); font-size: 11.5px; }
  .dic-asesor-vacio { padding: 14px 10px; color: var(--muted); font-size: 13px; text-align: center; }
  /* Ya elegido: se enseña como pastilla para que se note que es un dato
     tomado del catálogo y no algo que se escribió a mano. */
  .dic-asesor-puesto {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--r-campo);
    border: 1px solid var(--pastel-lavanda-txt); background: var(--pastel-lavanda);
  }
  .dic-asesor-puesto span { flex: 1; min-width: 0; font-size: 13.5px; }
  .dic-asesor-puesto small { display: block; color: var(--muted); font-size: 11.5px; }

  .dic-lista-puntos { margin-top: var(--sp-3); }
  .dic-punto-edit {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 9px; margin-bottom: 5px;
    border: 1px solid var(--border); border-radius: 10px; background: #fff;
  }
  .dic-punto-edit-num {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--pastel-rojo); color: var(--pastel-rojo-txt);
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .dic-quitar {
    border: none; background: transparent; color: var(--muted);
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: color var(--t-medio), background var(--t-medio);
  }
  .dic-quitar:hover { color: var(--red); background: rgba(198,32,39,0.08); }

  .dic-nuevo-punto {
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
    padding: 12px; border-radius: 12px;
    border: 1px dashed rgba(0,0,0,0.18); background: rgba(0,0,0,0.015);
    margin-top: var(--sp-2);
  }
  .dic-nuevo-punto textarea {
    width: 100%; min-height: 44px; resize: vertical;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-family: inherit; font-size: 13.5px; background: #fff;
  }
  .dic-nuevo-punto textarea:focus { outline: none; border-color: var(--red); }

  .dic-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--sp-4); }
  .dic-msg { border-radius: 12px; padding: 11px 13px; font-size: 13px; margin-bottom: var(--sp-3); display: none; }
  .dic-msg.error { display: block; background: rgba(198,32,39,0.08); color: #8a1212; }
  .dic-msg.ok { display: block; background: var(--pastel-menta); color: var(--pastel-menta-txt); }

  /* Al guardar aparece la descarga. Antes de guardar no tiene sentido:
     el PDF lleva el folio, y el folio se pone al dictaminar. */
  .dic-listo {
    display: none; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
    margin-top: var(--sp-4); padding: 13px 15px;
    border-radius: var(--r-tarjeta);
    background: var(--pastel-menta); color: var(--pastel-menta-txt);
  }
  .dic-listo.visible { display: flex; }
  .dic-listo > span { flex: 1; min-width: 200px; font-size: 13.5px; }
  #e-descargar, #e-descargar-correcciones, #e-volver {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-family: inherit;
  }
  #e-descargar, #e-descargar-correcciones {
    border-color: var(--red); background: var(--red); color: #fff;
    font-weight: 500; box-shadow: 0 4px 12px rgba(138,0,0,0.18);
  }
  #e-descargar-correcciones { background: #222; border-color: #222; }
  #e-descargar:hover { background: #6e0000; border-color: #6e0000; }
  #e-descargar-correcciones:hover { background: #000; border-color: #000; }
  #e-volver {
    padding: 7px 2px; border: 0; border-radius: 0; background: transparent;
    color: var(--pastel-menta-txt); font-weight: 400; box-shadow: none;
  }
  #e-volver:hover { background: transparent; color: #111; transform: none; }
  #e-descargar svg, #e-descargar-correcciones svg, #e-volver svg {
    width: 15px; height: 15px; flex: 0 0 auto;
  }


  /* Los contratos enlazados usan la misma jerarquía visual que los
     datos del expediente: rótulo discreto arriba y valor legible abajo. */
  .dic-documentos {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
  }
  .dic-documento {
    min-width: 0; padding: 11px 13px;
    border: 1px solid #e7e2e2; border-radius: 12px; background: #fff;
    box-shadow: 0 3px 12px rgba(39,22,22,.035);
  }
  .dic-documento-cabecera {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #eee9e9;
  }
  .dic-documento-cabecera > div {
    display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center;
    column-gap: 8px; min-width: 0;
  }
  .dic-documento-cabecera > div::before {
    content: ''; grid-row: 1 / span 2; width: 4px; height: 15px;
    border-radius: 999px; background: var(--red);
  }
  .dic-documento-cabecera strong {
    min-width: 0; color: #272222; font-size: 12px; font-weight: 650;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dic-documento-cabecera span {
    margin-top: 1px; color: #817979; font-size: 10.5px;
  }
  .dic-documento-cabecera a {
    flex: 0 0 auto; padding: 6px 9px; border-radius: 8px;
    color: #8a0000; background: #fff5f5;
    font-size: 11.5px; font-weight: 500; text-decoration: none;
    transition: background .15s, transform .15s;
  }
  .dic-documento-cabecera a:hover { background: #fbe5e5; transform: translateY(-1px); }
  .dic-documento-datos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 0 16px;
  }
  @media(max-width:900px) {
    .dic-documentos { grid-template-columns: 1fr; }
  }
  @media(max-width:640px) {
    .dic-documento-datos { grid-template-columns: 1fr; }
    .dic-documento-cabecera { align-items: stretch; flex-direction: column; }
    .dic-documento-cabecera a { align-self: flex-start; }
  }

</style>

  <!-- El mismo header que las demás pantallas: quieto arriba, sin barra,

    <div id="vista-lista">

      <!-- El título va donde va en todas (el bloque de encabezado de la
           página), y los botones de la pantalla se van a su derecha, en
           el mismo renglón. -->
      <div class="kw-page-encabezado con-acciones">
        <h1 class="kw-page-titulo" id="page-titulo">Dictaminación de Expedientes</h1>
        <div class="kw-page-acciones">

             se escriba en la lupa del encabezado. O sea que el buscador
             sigue siendo este, nada más que ahora se teclea arriba y no
             ocupa lugar aquí. Borrarlo de veras dejaría a la lupa sin a
             quién pasarle lo que se escribe. -->

        <!-- La comisión es una sola casilla y no un rango: en la práctica

          <button type="button" class="kw-fila-btn neutro" id="e-volver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg>
            Volver a la lista
          </button>
        </div>
      </div>
    </div>

  </main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  // El catálogo de Dictámenes conserva sus identificadores históricos,
  // pero sus personas se reflejan desde la base central de asesores.

  var yo = null;
  var veTodo = false;
  var puedoDictaminar = false;

  var dictamenes = [];
  var puntos = [];
  var clientes = [];
  var historial = [];
  var documentosEnlazados = [];
  var asesores = [];
  var tipos = [];
  var abierto = null;
  var verArchivo = false;
  var borrador = null;
  var contratosDisponibles = [];
  var contratoSeleccionado = null;

  var ESTADOS = {
    borrador:     'Borrador',
    devuelta:     'Devuelto',
    condicionada: 'Autorizado condicionado',
    autorizada:   'Aprobado',
  };

  var OPERACIONES = { venta: 'Venta', renta: 'Renta' };
  var USOS = { residencial: 'Residencial', comercial: 'Comercial', mixto: 'Mixto' };
  var CONTRATOS = { exclusiva: 'Exclusiva', abierto: 'Abierto' };

  // Un booleano de la base tiene tres respuestas posibles en pantalla: sí,
  // no, y todavía no se contesta. La tercera se enseña vacía, no como "No".
  function siNo(v) {
    if (v === true) return 'Sí';
    if (v === false) return 'No';
    return '';
  }

  // Los clientes de un expediente, con su estado civil entre paréntesis
  // para no gastar un renglón por cada uno en la tarjeta.
  function clientesTexto(d) {
    var suyos = clientes
      .filter(function (c) { return c.dictamen_id === d.id; })
      .sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
    if (!suyos.length) return d.clientes_nombres || '';
    return suyos.map(function (c) {
      return c.nombre + (c.estado_civil ? ' (' + c.estado_civil + ')' : '');
    }).join(' · ');
  }

  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fecha(iso) {
    if (!iso) return '';
    // Las fechas de solo día vienen como "2026-08-18". Pasarlas por Date
    // las lee como medianoche UTC y en México se corren un día hacia
    // atrás, así que se parten a mano.
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
    var d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(iso);
    return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function hoy() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  var MARCA_CORRECCIONES = '\\n\\n<!--KW_CORRECCIONES:';
  function separarCorrecciones(texto) {
    var s = String(texto || '');
    var i = s.lastIndexOf(MARCA_CORRECCIONES);
    if (i < 0 || !s.endsWith('-->')) return { texto: s, correcciones: {} };
    try {
      return {
        texto: s.slice(0, i),
        correcciones: JSON.parse(s.slice(i + MARCA_CORRECCIONES.length, -3)) || {},
      };
    } catch (e) { return { texto: s, correcciones: {} }; }
  }
  function juntarCorrecciones(texto, correcciones) {
    var limpias = {};
    Object.keys(correcciones || {}).forEach(function (k) {
      var v = String(correcciones[k] || '').trim();
      if (v) limpias[k] = v;
    });
    var base = String(texto || '').trim();
    return Object.keys(limpias).length
      ? base + MARCA_CORRECCIONES + JSON.stringify(limpias) + '-->'
      : (base || null);
  }

  var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
    'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  function prepararFechaEscritura() {
    $('e-esc-dia').innerHTML = '<option value="">Día</option>' +
      Array.from({ length: 31 }, function (_, i) {
        var n = String(i + 1).padStart(2, '0'); return '<option value="' + n + '">' + n + '</option>';
      }).join('');
    $('e-esc-mes').innerHTML = '<option value="">Mes</option>' +
      MESES.map(function (m, i) {
        var n = String(i + 1).padStart(2, '0'); return '<option value="' + n + '">' + m + '</option>';
      }).join('');
    var actual = new Date().getFullYear();
    var anos = [];
    for (var a = actual; a >= 1900; a--) anos.push('<option value="' + a + '">' + a + '</option>');
    $('e-esc-anio').innerHTML = '<option value="">Año</option>' + anos.join('');
  }
  function ponerFechaEscritura(valor) {
    var m = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(String(valor || ''));
    $('e-esc-anio').value = m ? m[1] : '';
    $('e-esc-mes').value = m ? m[2] : '';
    $('e-esc-dia').value = m ? m[3] : '';
    sincronizarFechaEscritura();
  }
  function sincronizarFechaEscritura() {
    var a = $('e-esc-anio').value, m = $('e-esc-mes').value, d = $('e-esc-dia').value;
    $('e-esc-fecha').value = a && m && d ? a + '-' + m + '-' + d : '';
  }

  function aviso(caja, texto, tipo) {
    var el = $(caja);
    el.className = 'dic-msg' + (texto ? ' ' + tipo : '');
    el.textContent = texto || '';
  }

  var TIPOS_CONTRATO_ORIGEN = {
    acuerdo_renta: 'Contratos de renta',
    contrato_profeco: 'Contratos PROFECO',
    contrato_comercial: 'Contratos de venta comercial',
  };

  function datoContrato(datos, claves) {
    for (var i = 0; i < claves.length; i++) {
      var valor = datos && datos[claves[i]];
      if (valor !== undefined && valor !== null && String(valor).trim() !== '') return valor;
    }
    return '';
  }

  function clientesDelContrato(doc) {
    var datos = doc.datos || {};
    if (Array.isArray(datos.clientes)) {
      return datos.clientes.map(function (x) {
        if (typeof x === 'string') return { nombre: x.trim(), estado_civil: '' };
        return {
          nombre: String((x && (x.nombre || x.name)) || '').trim(),
          estado_civil: String((x && (x.civil || x.estado_civil)) || '').trim(),
        };
      }).filter(function (x) { return x.nombre; });
    }
    var salida = [];
    Object.keys(datos).forEach(function (k) {
      var m = /^f-cli(\d+)-nombre$/.exec(k);
      if (!m || !datos[k]) return;
      salida[Number(m[1])] = {
        nombre: String(datos[k]).trim(),
        estado_civil: String(datos['f-cli' + m[1] + '-civil'] || '').trim(),
      };
    });
    return salida.filter(Boolean);
  }

  function direccionDelContrato(doc) {
    var datos = doc.datos || {};
    var direccion = datoContrato(datos, ['f-inm-direccion', 'f-inmueble', 'direccion', 'inmueble']);
    var alcaldia = datoContrato(datos, ['f-inm-alcaldia']);
    if (alcaldia && String(direccion).toLowerCase().indexOf(String(alcaldia).toLowerCase()) === -1) {
      direccion = [direccion, alcaldia].filter(Boolean).join(', ');
    }
    return String(direccion || '').trim();
  }

  function resumenContrato(doc) {
    var nombres = clientesDelContrato(doc).map(function (x) { return x.nombre; }).join(', ');
    return [nombres, direccionDelContrato(doc)]
      .filter(Boolean).join(' · ');
  }

  function operacionContrato(doc) {
    if (doc.tipo_documento === 'acuerdo_renta') return 'renta';
    var valor = String(datoContrato(doc.datos || {},
      ['operacion', 'f-operacion', 'f-tipo-operacion']) || '').toLowerCase();
    return valor.indexOf('renta') !== -1 ? 'renta' : 'venta';
  }

  function usoContrato(doc) {
    var uso = normalizarUsoContrato(datoContrato(doc.datos || {},
      ['uso', 'f-uso', 'f-car-uso-suelo']));
    return uso || 'residencial';
  }

  async function cargarContratosOrigen() {
    var r = await window.kwSupabase.rpc('listar_contratos_para_nuevo_dictamen');
    if (r.error) {
      contratosDisponibles = [];
      console.warn('No se pudieron cargar contratos para el nuevo dictamen:', r.error.message);
    } else {
      contratosDisponibles = r.data || [];
    }
  }

  function comparableAsesor(valor) {
    return String(valor || '').trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function contratoEsDelAsesor(doc, asesor) {
    if (!doc || !asesor) return false;
    var datos = doc.datos || {};
    var nombreCapturado = datoContrato(datos, ['f-agente', 'f-asesor']);
    var correoCapturado = datoContrato(datos, ['f-agente-correo']);
    if (nombreCapturado && comparableAsesor(nombreCapturado) === comparableAsesor(asesor.nombre)) return true;
    if (correoCapturado && comparableAsesor(correoCapturado) === comparableAsesor(asesor.correo)) return true;
    if (doc.dictamen_asesor_id && doc.dictamen_asesor_id === asesor.id) return true;
    if (doc.creador_id && doc.creador_id === asesor.id) return true;
    if (doc.asesor_correo && comparableAsesor(doc.asesor_correo) === comparableAsesor(asesor.correo)) return true;
    return !!(doc.asesor_nombre && asesor.nombre &&
      comparableAsesor(doc.asesor_nombre) === comparableAsesor(asesor.nombre));
  }

  function pintarContratosOrigen() {
    var caja = $('e-contratos-origen');
    var panel = $('e-origen');
    if (!caja || !panel) return;
    var asesor = borrador && asesores.find(function (a) { return a.id === borrador.asesor_id; });
    panel.hidden = !asesor || !!borrador.id;
    if (!asesor || borrador.id) {
      caja.innerHTML = '';
      return;
    }
    var busca = $('e-contrato-buscar').value.trim().toLowerCase();
    var operacion = $('e-contrato-operacion').value;
    var uso = $('e-contrato-uso').value;
    if (!contratosDisponibles.length) {
      caja.innerHTML = '<div class="dic-contrato-ayuda">No hay contratos finalizados disponibles para enlazar.</div>';
      return;
    }
    var delAsesor = contratosDisponibles.filter(function (doc) {
      return contratoEsDelAsesor(doc, asesor);
    });
    if (!delAsesor.length) {
      caja.innerHTML = '<div class="dic-contrato-ayuda">Este asesor no tiene contratos finalizados disponibles.</div>';
      return;
    }
    var hallados = delAsesor.filter(function (doc) {
      if (operacion !== 'todos' && operacionContrato(doc) !== operacion) return false;
      if (uso !== 'todos' && usoContrato(doc) !== uso) return false;
      return !busca || [doc.folio, doc.nombre_archivo, resumenContrato(doc)]
        .filter(Boolean).join(' ').toLowerCase().indexOf(busca) !== -1;
    });
    if (!hallados.length) {
      caja.innerHTML = '<div class="dic-contrato-ayuda">No encontramos contratos con esos filtros.</div>';
      return;
    }
    caja.innerHTML = '<table class="dic-contrato-tabla"><thead><tr>' +
      '<th>Contrato</th><th>Cliente e inmueble</th><th>Operación</th><th>Uso</th><th>Actualizado</th><th></th>' +
      '</tr></thead><tbody>' + hallados.map(function (doc) {
        var seleccionado = contratoSeleccionado &&
          contratoSeleccionado.documento_id === doc.documento_id;
        var clientes = clientesDelContrato(doc).map(function (x) { return x.nombre; }).join(', ');
        return '<tr' + (seleccionado ? ' class="seleccionado"' : '') + '>' +
          '<td data-label="Contrato"><span class="dic-contrato-principal">' +
            escapar(doc.folio || 'Sin folio') + '</span><span class="dic-contrato-secundario">' +
            escapar(doc.nombre_archivo || TIPOS_CONTRATO_ORIGEN[doc.tipo_documento] || 'Contrato') + '</span></td>' +
          '<td data-label="Cliente e inmueble"><span class="dic-contrato-principal">' +
            escapar(clientes || 'Cliente sin capturar') + '</span><span class="dic-contrato-secundario">' +
            escapar(direccionDelContrato(doc) || 'Dirección sin capturar') + '</span></td>' +
          '<td data-label="Operación">' + escapar(OPERACIONES[operacionContrato(doc)]) + '</td>' +
          '<td data-label="Uso">' + escapar(USOS[usoContrato(doc)]) + '</td>' +
          '<td data-label="Actualizado">' + escapar(fecha(doc.updated_at)) + '</td>' +
          '<td data-label="Acción"><button type="button" class="kw-btn-mini dic-contrato-elegir" ' +
            'data-elegir-contrato="' + doc.documento_id + '">' +
            (seleccionado ? 'Elegido' : 'Elegir') + '</button></td></tr>';
      }).join('') + '</tbody></table>';
    caja.querySelectorAll('[data-elegir-contrato]').forEach(function (b) {
      b.addEventListener('click', function () {
        var doc = contratosDisponibles.find(function (x) {
          return x.documento_id === b.dataset.elegirContrato;
        });
        if (doc) seleccionarContratoOrigen(doc);
      });
    });
  }

  function normalizarSiNoContrato(valor) {
    if (valor === true) return 'si';
    if (valor === false) return 'no';
    var s = String(valor || '').trim().toLowerCase();
    if (['si', 'sí', 's', 'yes', '1', 'true'].indexOf(s) !== -1) return 'si';
    if (['no', 'n', '0', 'false'].indexOf(s) !== -1) return 'no';
    return '';
  }

  function normalizarUsoContrato(valor) {
    var s = String(valor || '').toLowerCase();
    if (s.indexOf('mixt') !== -1) return 'mixto';
    if (s.indexOf('comer') !== -1 || s.indexOf('oficina') !== -1 ||
        s.indexOf('industrial') !== -1) return 'comercial';
    return s ? 'residencial' : '';
  }

  function ponerCampoDesdeContrato(llave, valor) {
    if (valor === undefined || valor === null || String(valor).trim() === '') return;
    var campo = CAMPOS.find(function (x) { return x[1] === llave; });
    if (!campo) return;
    borrador[llave] = String(valor).trim();
    $(campo[0]).value = paraCampo(llave, borrador[llave]);
  }

  function seleccionarContratoOrigen(doc) {
    if (!borrador || borrador.id) return;
    contratoSeleccionado = doc;
    borrador.documento_origen_id = doc.documento_id;
    var datos = doc.datos || {};
    var nombreCapturado = datoContrato(datos, ['f-agente', 'f-asesor']);
    var correoCapturado = datoContrato(datos, ['f-agente-correo']);
    var asesor = asesores.find(function (a) {
      return (nombreCapturado && comparableAsesor(a.nombre) === comparableAsesor(nombreCapturado)) ||
        (correoCapturado && comparableAsesor(a.correo) === comparableAsesor(correoCapturado)) ||
        (doc.dictamen_asesor_id && a.id === doc.dictamen_asesor_id) ||
        (doc.asesor_correo && a.correo && a.correo.toLowerCase() === doc.asesor_correo.toLowerCase()) ||
        (doc.asesor_nombre && a.nombre && a.nombre.toLowerCase() === doc.asesor_nombre.toLowerCase());
    });
    if (asesor) elegirAsesor(asesor);

    var clientesContrato = clientesDelContrato(doc);
    if (clientesContrato.length) {
      var cuantos = clientesContrato.length;
      $('e-clientes-cuantos').value = cuantos > 5 ? '__mas__' : String(cuantos);
      $('e-clientes-otros').value = cuantos > 5 ? String(cuantos) : '';
      // El cambio actualiza el selector personalizado, pero también lee
      // las casillas que estaban en pantalla. Los datos del contrato se
      // asignan después para que esa lectura no los borre.
      $('e-clientes-cuantos').dispatchEvent(new Event('change', { bubbles: true }));
      borrador.clientes = clientesContrato;
      acomodarCuantos();
      pintarClientes();
    }

    ponerCampoDesdeContrato('inmueble', direccionDelContrato(doc));
    if (doc.tipo_documento === 'acuerdo_renta') {
      borrador.operacion = 'renta';
      borrador.uso = 'residencial';
      ponerCampoDesdeContrato('precio_listado', datoContrato(datos, ['f-monto']));
      if (String(datos['f-tipo'] || '').toLowerCase() === 'exclusiva') borrador.tipo_contrato = 'exclusiva';
    } else {
      borrador.operacion = 'venta';
      ponerCampoDesdeContrato('precio_listado', datoContrato(datos, ['f-con-precio']));
      ponerCampoDesdeContrato('comision_porcentaje', datoContrato(datos, ['f-con-contraprestacion']));
      ponerCampoDesdeContrato('escritura_numero', datoContrato(datos, ['f-inm-escritura']));
      var fechaEsc = datoContrato(datos, ['f-inm-escritura-fecha']);
      if (fechaEsc) { borrador.escritura_fecha = fechaEsc; ponerFechaEscritura(fechaEsc); }
      ponerCampoDesdeContrato('notario_nombre', datoContrato(datos, ['f-inm-notario']));
      ponerCampoDesdeContrato('notaria_numero', datoContrato(datos, ['f-inm-notario-num']));
      ponerCampoDesdeContrato('folio_real', datoContrato(datos, ['f-inm-folio']));
      ponerCampoDesdeContrato('superficie_terreno', datoContrato(datos, ['f-car-terreno']));
      ponerCampoDesdeContrato('superficie_construccion', datoContrato(datos, ['f-car-construccion']));
      var condominio = normalizarSiNoContrato(datoContrato(datos, ['f-inm-condominio']));
      if (condominio) borrador.condominio = condominio;
      var uso = normalizarUsoContrato(datoContrato(datos, ['f-car-uso-suelo']));
      if (uso) borrador.uso = uso;
      var exclusiva = normalizarSiNoContrato(datoContrato(datos, ['f-con-exclusividad']));
      if (exclusiva === 'si') borrador.tipo_contrato = 'exclusiva';
      if (exclusiva === 'no') borrador.tipo_contrato = 'abierto';
    }

    $('e-operacion').value = borrador.operacion;
    $('e-uso').value = borrador.uso;
    $('e-tipo-contrato').value = borrador.tipo_contrato;
    $('e-condominio').value = borrador.condominio;
    ['e-operacion', 'e-uso', 'e-tipo-contrato', 'e-condominio'].forEach(function (id) {
      $(id).dispatchEvent(new Event('change', { bubbles: true }));
    });
    acomodarCondominio();
    $('e-contrato-seleccion').hidden = false;
    $('e-contrato-seleccion').textContent =
      'Contrato seleccionado: ' + (doc.folio || doc.nombre_archivo || 'sin folio') +
      '. Se precargaron los datos disponibles.';
    pintarContratosOrigen();
  }

  // ── Traer los datos ─────────────────────────────────────────

  async function cargar() {
    var r = await window.kwSupabase
      .from('dictamenes_con_asesor').select('*')
      .order('created_at', { ascending: false }).limit(500);

    if (r.error) {
      $('lista').innerHTML = '<div class="kw-vacio">No se pudieron cargar los dictámenes: '
        + escapar(r.error.message) + '</div>';
      return;
    }
    dictamenes = r.data || [];

    // Las observaciones de todos, de una sola vez. La regla de acceso de
    // la base ya devuelve nada más las que a uno le tocan.
    var p = await window.kwSupabase
      .from('dictamen_puntos').select('*').order('orden').limit(5000);
    puntos = p.data || [];

    // Y los clientes, por lo mismo: se ocupan al abrir cualquier
    // expediente y traerlos uno por uno sería una vuelta a la base por
    // cada tarjeta que se abre.
    var cl = await window.kwSupabase
      .from('dictamen_clientes').select('*').order('orden').limit(5000);
    clientes = cl.data || [];

    var hi = await window.kwSupabase
      .from('dictamen_historial_con_quien').select('*')
      .order('created_at', { ascending: false }).limit(5000);
    historial = hi.data || [];

    // Los documentos se leen por referencia: así una revisión nueva se
    // refleja en el expediente sin copiar ni desincronizar información.
    var de = await window.kwSupabase
      .from('documentos_guardados')
      .select('id, dictamen_id, tipo_documento, nombre_archivo, folio, revision, estado, datos, updated_at')
      .not('dictamen_id', 'is', null)
      .limit(1000);
    documentosEnlazados = de.error ? [] : (de.data || []);

    pintar();
  }

  async function cargarCatalogos() {
    // Liderazgo fuerza una conciliación antes de leer. Si la migración aún
    // no se ha aplicado, se conserva el catálogo anterior y la pantalla
    // sigue funcionando mientras se muestra el error en la consola.
    if (veTodo) {
      var sincronizacion = await window.kwSupabase.rpc('dictamen_asesores_actualizar_desde_base');
      if (sincronizacion.error) console.warn('No se pudo actualizar el catálogo central:', sincronizacion.error.message);
    }

    var a = await window.kwSupabase
      .from('dictamen_asesores').select('id, nombre, correo, activo').order('nombre');
    if (a.error) console.error('No se pudo cargar el catálogo de asesores:', a.error.message);
    asesores = a.data || [];

    var t = await window.kwSupabase
      .from('dictamen_tipos_inmueble').select('id, nombre').order('nombre');
    tipos = t.data || [];

    $('e-tipo').innerHTML = '<option value="">Sin especificar</option>' +
      tipos.map(function (x) {
        return '<option value="' + x.id + '">' + escapar(x.nombre) + '</option>';
      }).join('') +
      '<option value="__nuevo__">Otro (escribirlo)</option>';

    // El tipo de inmueble llega de la base; su campo de corrección debe
    // recibir exactamente ese mismo catálogo más la captura libre.
    prepararCorrecciones();

    $('f-tipo').innerHTML = '<option value="todos">Tipo de inmueble</option>' +
      tipos.map(function (x) {
        return '<option value="' + x.id + '">' + escapar(x.nombre) + '</option>';
      }).join('');
    if (window.kwUI) window.kwUI.selects(document);
  }

  // ── Filtrar ─────────────────────────────────────────────────

  var DESPLEGABLES = ['f-listado', 'f-contrato', 'f-tipo'];

  // Los filtros que se escriben: el buscador, el rango de fechas, el de
  // precio y el de comisión. Se enumeran una sola vez porque los tres
  // lugares que los tocan (repintar al cambiarlos, saber si hay algo
  // filtrado y limpiarlos) tienen que estar de acuerdo. Cuando la lista
  // vivía suelta en cada uno, agregar un filtro era acordarse de los tres.
  var ESCRITOS = ['f-buscar', 'f-desde', 'f-hasta',
    'f-precio-min', 'f-precio-max', 'f-comision'];

  // El estado ya no tiene desplegable: se pone y se quita picándole a las
  // tarjetas de arriba, que hacían exactamente lo mismo. Vive aquí en vez
  // de leerse de un campo.
  var estadoFiltro = 'todos';

  // Un rango de números. Si se pidió un mínimo o un máximo, el expediente
  // que no trae ese dato queda fuera: dejarlo pasar como si valiera cero
  // lo haría salir en "hasta 500,000" sin que nadie sepa en cuánto está.
  function fueraDeRango(valor, min, max) {
    if (!min && !max) return false;
    var n = Number(soloCifra(valor));
    if (!soloCifra(valor) || isNaN(n)) return true;
    if (min && n < Number(min)) return true;
    if (max && n > Number(max)) return true;
    return false;
  }

  function visibles() {
    var busca = $('f-buscar').value.trim().toLowerCase();
    var listado = $('f-listado').value;
    var contrato = $('f-contrato').value;
    var tipo = $('f-tipo').value;
    var desde = $('f-desde').value;
    var hasta = $('f-hasta').value;
    var precioMin = soloCifra($('f-precio-min').value);
    var precioMax = soloCifra($('f-precio-max').value);
    var comision = soloCifra($('f-comision').value);

    return dictamenes.filter(function (d) {
      // El archivo es una lista aparte, no un filtro más: o se ve lo
      // vivo, o se ve lo archivado.
      if (verArchivo !== !!d.archivado_at) return false;
      if (estadoFiltro !== 'todos' && d.estado !== estadoFiltro) return false;
