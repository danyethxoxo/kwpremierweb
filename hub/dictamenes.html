<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dictámenes</title>
<link rel="icon" type="image/png" href="/kwpremierweb/assets/img/favicon.png" />
<style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
<script>
  setTimeout(function () {
    if (!document.documentElement.classList.contains('kw-auth-ok')) {
      console.error('auth-guard.js no respondió a tiempo; redirigiendo al login por seguridad.');
      location.replace('/kwpremierweb/login.html');
    }
  }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kwpremierweb/assets/js/auth-guard.js"></script>
<script src="/kwpremierweb/assets/js/notif-bell.js"></script>
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-base.css?v=20260821a">
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-claro.css?v=20260820c">
<script src="/kwpremierweb/assets/js/kw-ui.js?v=20260821a"></script>
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  /* ── La barra de arriba ─────────────────────────────────────── */
  .dic-barra {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4);
  }
  .btn-nuevo {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 999px;
    border: none; background: var(--red); color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 14px rgba(40,12,12,0.2);
    transition: transform var(--t-medio);
  }
  .btn-nuevo:hover { transform: translateY(-1px); }
  .btn-nuevo:disabled { opacity: 0.5; cursor: default; transform: none; }

  /* ── El resumen ──
     Tres números y ya. Es lo que uno viene a saber al entrar. Cada uno
     filtra la lista, para no tener que ir a buscar el filtro. */
  .dic-resumen { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .dic-tarjeta {
    flex: 1 1 150px; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
    padding: 13px 15px; border-radius: 14px;
    border: 1px solid var(--border); background: #fff;
    box-shadow: var(--sombra-1);
    color: var(--text); font-family: inherit; text-align: left; cursor: pointer;
    transition: background var(--t-medio), border-color var(--t-medio);
  }
  .dic-tarjeta:hover { background: var(--pastel-rojo); }
  .dic-tarjeta.activa {
    background: var(--pastel-rojo); border-color: rgba(138,0,0,0.28);
    color: var(--pastel-rojo-txt);
  }
  .dic-tarjeta-num { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .dic-tarjeta-txt { font-size: 11.5px; color: var(--muted); }

  /* ── El estado del dictamen ──
     Cada uno con su color, porque es lo que se viene a mirar de un
     vistazo: devuelto naranja, condicionado amarillo, autorizado verde. */
  .dic-estado {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; white-space: nowrap;
  }
  .dic-estado::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }
  .dic-estado.borrador     { background: rgba(0,0,0,0.05);   color: #5b5b5b; }
  .dic-estado.devuelta     { background: #ffeede;            color: #b4530b; }
  .dic-estado.condicionada { background: var(--pastel-crema); color: var(--pastel-crema-txt); }
  .dic-estado.autorizada   { background: var(--pastel-menta); color: var(--pastel-menta-txt); }

  .dic-avance {
    width: 84px; height: 5px; border-radius: 999px;
    background: rgba(0,0,0,0.09); overflow: hidden; flex-shrink: 0;
  }
  .dic-avance span { display: block; height: 100%; background: #1f9d55; border-radius: 999px; }

  /* ── Una observación por atender ── */
  .dic-punto {
    border: 1px solid var(--border);
    border-left: 3px solid #e0a218;
    border-radius: 11px; background: #fff;
    padding: 11px 13px; margin-bottom: 9px;
  }
  .dic-punto.corregida { border-left-color: #1f9d55; }
  .dic-punto-cabeza { display: flex; align-items: flex-start; gap: 10px; }
  .dic-punto-texto { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.5; color: var(--text); }
  .dic-punto-nota {
    margin-top: 8px; padding: 8px 10px; border-radius: 9px;
    background: rgba(0,0,0,0.035); font-size: 12.5px; color: #444;
    line-height: 1.5; white-space: pre-line;
  }
  .dic-punto-acciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .dic-punto-form { margin-top: 10px; display: none; }
  .dic-punto-form.abierto { display: block; }
  .dic-punto-form textarea {
    width: 100%; min-height: 58px; resize: vertical;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-family: inherit; font-size: 13px;
    color: var(--text); background: #fff;
  }
  .dic-punto-form textarea:focus { outline: none; border-color: var(--red); }

  /* ── Los datos del expediente dentro de la tarjeta ── */
  .dic-datos {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 9px var(--sp-4); margin: var(--sp-3) 0;
  }
  .dic-dato { font-size: 13px; line-height: 1.45; }
  .dic-dato b {
    display: block; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
  }

  /* ── El editor ── */
  .dic-editor {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--r-tarjeta); box-shadow: var(--sombra-1);
    padding: var(--sp-4);
  }
  .dic-campo { margin-bottom: var(--sp-3); }
  .dic-campo > label {
    display: block; margin-bottom: 5px;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--muted);
  }
  .dic-campo textarea, .dic-campo input[type="date"] {
    width: 100%; resize: vertical;
    border: 1px solid var(--border); border-radius: var(--r-campo);
    padding: 10px 12px; font-family: inherit; font-size: 13.5px;
    color: var(--text); background: #fff;
  }
  .dic-campo textarea { min-height: 62px; }
  .dic-campo textarea:focus, .dic-campo input:focus { outline: none; border-color: var(--red); }
  .dic-dos { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .dic-tres { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp-3); }
  @media (max-width: 700px) {
    .dic-dos, .dic-tres { grid-template-columns: 1fr; }
  }
  .dic-subtitulo {
    font-size: 15px; color: var(--text);
    margin: var(--sp-5) 0 var(--sp-3);
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }

  /* ── El buscador de asesor ──
     Son 94 y crecen. Un desplegable de 94 renglones se recorre a ciegas;
     escribiendo tres letras se llega en un segundo. */
  .dic-busca-asesor { position: relative; }
  .dic-asesor-lista {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40;
    max-height: 260px; overflow-y: auto;
    background: #fff; border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--sombra-3);
    padding: 5px; display: none;
  }
  .dic-asesor-lista.abierta { display: block; }
  .dic-asesor-op {
    display: block; width: 100%; text-align: left;
    padding: 8px 10px; border: none; border-radius: 9px;
    background: none; font-family: inherit; font-size: 13.5px;
    color: var(--text); cursor: pointer;
  }
  .dic-asesor-op:hover, .dic-asesor-op.resaltada { background: var(--pastel-rojo); }
  .dic-asesor-op small { display: block; color: var(--muted); font-size: 11.5px; }
  .dic-asesor-vacio { padding: 14px 10px; color: var(--muted); font-size: 13px; text-align: center; }
  /* Ya elegido: se enseña como pastilla para que se note que es un dato
     tomado del catálogo y no algo que se escribió a mano. */
  .dic-asesor-puesto {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--r-campo);
    border: 1px solid var(--border); background: var(--pastel-rojo);
  }
  .dic-asesor-puesto span { flex: 1; min-width: 0; font-size: 13.5px; }
  .dic-asesor-puesto small { display: block; color: var(--muted); font-size: 11.5px; }

  .dic-lista-puntos { margin-top: var(--sp-3); }
  .dic-punto-edit {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 11px; background: #fff;
  }
  .dic-punto-edit-num {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--pastel-rojo); color: var(--pastel-rojo-txt);
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .dic-quitar {
    border: none; background: transparent; color: var(--muted);
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: color var(--t-medio), background var(--t-medio);
  }
  .dic-quitar:hover { color: var(--red); background: rgba(198,32,39,0.08); }

  .dic-nuevo-punto {
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
    padding: 12px; border-radius: 12px;
    border: 1px dashed rgba(0,0,0,0.18); background: rgba(0,0,0,0.015);
    margin-top: var(--sp-2);
  }
  .dic-nuevo-punto textarea {
    width: 100%; min-height: 44px; resize: vertical;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; font-family: inherit; font-size: 13.5px; background: #fff;
  }
  .dic-nuevo-punto textarea:focus { outline: none; border-color: var(--red); }

  .dic-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--sp-4); }
  .dic-msg { border-radius: 12px; padding: 11px 13px; font-size: 13px; margin-bottom: var(--sp-3); display: none; }
  .dic-msg.error { display: block; background: rgba(198,32,39,0.08); color: #8a1212; }
  .dic-msg.ok { display: block; background: var(--pastel-menta); color: var(--pastel-menta-txt); }

  /* Al guardar aparece la descarga. Antes de guardar no tiene sentido:
     el PDF lleva el folio, y el folio se pone al dictaminar. */
  .dic-listo {
    display: none; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
    margin-top: var(--sp-4); padding: 13px 15px;
    border-radius: var(--r-tarjeta);
    background: var(--pastel-menta); color: var(--pastel-menta-txt);
  }
  .dic-listo.visible { display: flex; }
  .dic-listo span { flex: 1; min-width: 200px; font-size: 13.5px; }

  /* ── La hoja que se imprime ──
     Las mismas medidas que el resto de los formatos de la oficina, para
     que un dictamen impreso no se distinga de los demás documentos. */
  #solo-impresion { display: none; }
  .hoja {
    background: #fff; width: 21.6cm; min-height: 27.9cm;
    padding: 1.6cm 1.9cm; margin: 0 auto; box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10pt; line-height: 1.55; color: #000;
  }
  .hoja-logo img { height: 46px; width: auto; display: block; margin-bottom: 18px; }
  .hoja h1 {
    font-size: 10.5pt; font-weight: 700; color: #7d1113;
    margin: 0 0 4px 3.2cm; letter-spacing: 0.01em;
  }
  .hoja-folio { font-size: 8.5pt; color: #444; margin: 0 0 16px 3.2cm; }
  .hoja-cuadro { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .hoja-cuadro td {
    border: 1px solid #000; padding: 4px 6px;
    vertical-align: top; font-size: 9.5pt; line-height: 1.4;
    word-wrap: break-word;
  }
  .hoja-cuadro .rotulo {
    width: 4.4cm; color: #7d1113; font-weight: 400;
    text-transform: uppercase; font-size: 8.5pt;
  }
  .hoja-cuadro .alto-2 { height: 1.6cm; }
  .hoja-cuadro .alto-3 { height: 2.4cm; }
  .hoja-cuadro .alto-4 { height: 3.2cm; }
  .hoja-cuadro .sub {
    color: #7d1113; text-transform: uppercase;
    font-size: 8.5pt; display: block; margin-bottom: 3px;
  }
  .hoja-lista { margin: 0; padding-left: 1.1em; }
  .hoja-lista li { margin-bottom: 3px; }
  .hoja-lista .estado { color: #444; font-size: 8.5pt; }
  .hoja-nota { margin: 0 0 6px; white-space: pre-line; }
  .hoja-pie { margin-top: 0.7cm; font-size: 8pt; color: #444; }

  @media print {
    @page { size: Letter; margin: 0; }
    body > *:not(#solo-impresion) { display: none !important; }
    #solo-impresion { display: block !important; }
    #solo-impresion .hoja { width: 100%; min-height: 0; }
  }
</style>
</head>
<body>

  <header class="kw-header">
    <span class="kw-header-title">Dictámenes</span>
    <div class="header-right">
      <div id="notif-bell-slot"></div>
      <a href="../portal.html" class="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        <span>Atrás</span>
      </a>
    </div>
  </header>

  <main class="kw-page">

    <!-- ── Vista 1: la lista ───────────────────────────────────── -->
    <div id="vista-lista">
      <div class="dic-barra">
        <div>
          <h1 class="kw-page-titulo" id="page-titulo">Dictámenes</h1>
          <p class="kw-page-desc" id="page-desc">Revisión de expedientes y seguimiento de lo que falta corregir.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="kw-fila-btn neutro" id="btn-sync-asesores" style="display:none;">Sincronizar asesores</button>
          <button type="button" class="kw-fila-btn neutro" id="btn-archivo">Ver archivo</button>
          <button type="button" class="btn-nuevo" id="btn-nuevo" style="display:none;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Nuevo dictamen</span>
          </button>
        </div>
      </div>

      <div class="dic-resumen" id="resumen"></div>

      <div class="kw-filtros">
        <div class="kw-campo-filtro ancho">
          <label for="f-buscar">Buscar</label>
          <div class="kw-buscador">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.7" y2="16.7"/>
            </svg>
            <input type="text" id="f-buscar" class="kw-input" placeholder="Inmueble, folio, cliente o asesor" autocomplete="off">
          </div>
        </div>
        <div class="kw-campo-filtro">
          <label for="f-estado">Estado</label>
          <select id="f-estado">
            <option value="todos">Todos los estados</option>
            <option value="borrador">Borradores</option>
            <option value="devuelta">Devueltos</option>
            <option value="condicionada">Autorizados condicionados</option>
            <option value="autorizada">Autorizados para promoción</option>
          </select>
        </div>
        <div class="kw-campo-filtro">
          <label for="f-asesor">Asesor</label>
          <select id="f-asesor"><option value="todos">Todos los asesores</option></select>
        </div>
      </div>

      <div class="kw-lista" id="lista">
        <div class="kw-fila"><div class="kw-fila-cabeza"><div class="kw-skel kw-skel-circle" style="width:11px;height:11px;"></div><div class="kw-fila-texto"><div class="kw-skel kw-skel-line kw-skel-w70"></div><div class="kw-skel kw-skel-line kw-skel-w30" style="margin-top:7px;"></div></div></div></div>
        <div class="kw-fila"><div class="kw-fila-cabeza"><div class="kw-skel kw-skel-circle" style="width:11px;height:11px;"></div><div class="kw-fila-texto"><div class="kw-skel kw-skel-line kw-skel-w50"></div><div class="kw-skel kw-skel-line kw-skel-w30" style="margin-top:7px;"></div></div></div></div>
      </div>
    </div>

    <!-- ── Vista 2: armar el dictamen ──────────────────────────── -->
    <div id="vista-editor" style="display:none;">
      <div class="dic-barra">
        <div>
          <h1 class="kw-page-titulo" id="editor-titulo">Nuevo dictamen</h1>
          <p class="kw-page-desc">Se guarda como borrador hasta que le pongas un dictamen.</p>
        </div>
      </div>

      <div class="dic-editor">
        <div class="dic-msg" id="editor-msg"></div>

        <div class="dic-dos">
          <div class="dic-campo">
            <label for="e-fecha">Fecha del dictamen</label>
            <input type="date" id="e-fecha">
          </div>
          <div class="dic-campo">
            <label for="e-asesor-busca">Asesor</label>
            <div class="dic-busca-asesor">
              <input type="text" id="e-asesor-busca" class="kw-input" placeholder="Escribe el nombre" autocomplete="off">
              <div class="dic-asesor-lista" id="e-asesor-lista"></div>
            </div>
            <div class="dic-asesor-puesto" id="e-asesor-puesto" style="display:none;">
              <span id="e-asesor-nombre"></span>
              <button type="button" class="kw-btn-mini" id="e-asesor-cambiar">Cambiar</button>
            </div>
          </div>
        </div>

        <div class="dic-campo">
          <label for="e-cliente">Nombre del cliente</label>
          <textarea id="e-cliente" rows="2" placeholder="Como aparece en la escritura"></textarea>
        </div>

        <div class="dic-campo">
          <label for="e-inmueble">Dirección del inmueble</label>
          <textarea id="e-inmueble" rows="2" placeholder="Calle, número, edificio, departamento, colonia, alcaldía"></textarea>
        </div>

        <div class="dic-tres">
          <div class="dic-campo">
            <label for="e-operacion">Operación</label>
            <select id="e-operacion">
              <option value="venta">Venta</option>
              <option value="renta">Renta</option>
            </select>
          </div>
          <div class="dic-campo">
            <label for="e-uso">Uso</label>
            <select id="e-uso">
              <option value="residencial">Residencial</option>
              <option value="comercial">Comercial</option>
              <option value="mixto">Mixto</option>
            </select>
          </div>
          <div class="dic-campo">
            <label for="e-tipo">Tipo de inmueble</label>
            <select id="e-tipo"></select>
            <!-- Sale solo al elegir "Otro": se escribe una vez y queda en
                 el catálogo para las siguientes, igual que las etiquetas. -->
            <input type="text" id="e-tipo-nuevo" class="kw-input" placeholder="¿Cuál? Se guarda para la próxima" style="display:none;margin-top:8px;" autocomplete="off">
          </div>
        </div>

        <h2 class="kw-page-titulo dic-subtitulo">Datos del expediente</h2>

        <div class="dic-dos">
          <div class="dic-campo">
            <label for="e-esc-propiedad">Escrituras y fecha</label>
            <textarea id="e-esc-propiedad" rows="2" placeholder="Escritura 25,928 de fecha 01 de agosto del 2000, ante el Lic. ..."></textarea>
          </div>
          <div class="dic-campo">
            <label for="e-esc-condominio">Condominio</label>
            <textarea id="e-esc-condominio" rows="2" placeholder="Escritura de condominio y fecha, si aplica"></textarea>
          </div>
        </div>

        <div class="dic-dos">
          <div class="dic-campo">
            <label for="e-cfdi">CFDI</label>
            <input type="text" id="e-cfdi" class="kw-input" autocomplete="off">
          </div>
          <div class="dic-campo">
            <label for="e-folio-real">Folio real</label>
            <input type="text" id="e-folio-real" class="kw-input" autocomplete="off">
          </div>
        </div>

        <div class="dic-dos">
          <div class="dic-campo">
            <label for="e-sup-escritura">Superficie escritura</label>
            <input type="text" id="e-sup-escritura" class="kw-input" placeholder="92.40 m2" autocomplete="off">
          </div>
          <div class="dic-campo">
            <label for="e-estado-civil">Estado civil</label>
            <input type="text" id="e-estado-civil" class="kw-input" placeholder="Casado por sociedad conyugal, soltero..." autocomplete="off">
          </div>
        </div>

        <!-- Estos dos no estaban en la lista que se pidió, pero sí en el
             machote de papel. Se dejan: quitarlos sería perder un dato que
             hoy se captura. -->
        <div class="dic-dos">
          <div class="dic-campo">
            <label for="e-cuenta-predial">Cuenta predial</label>
            <input type="text" id="e-cuenta-predial" class="kw-input" autocomplete="off">
          </div>
          <div class="dic-campo">
            <label for="e-sup-predial">Superficie predial</label>
            <input type="text" id="e-sup-predial" class="kw-input" placeholder="90.15 m2" autocomplete="off">
          </div>
        </div>

        <div class="dic-campo">
          <label for="e-observaciones">Observaciones generales</label>
          <textarea id="e-observaciones" placeholder="El resumen de la revisión. Lo que hay que corregir va abajo."></textarea>
        </div>

        <h2 class="kw-page-titulo dic-subtitulo">Observaciones por atender</h2>
        <p style="font-size:12.5px;color:var(--muted);margin:-6px 0 0;">
          Cada una se marca por separado conforme el asesor las va corrigiendo.
        </p>

        <div class="dic-lista-puntos" id="e-puntos"></div>

        <div class="dic-nuevo-punto">
          <textarea id="e-punto-texto" placeholder="Falta la boleta predial actualizada" rows="1"></textarea>
          <button type="button" class="kw-btn-mini" id="e-punto-agregar">Agregar</button>
        </div>

        <div class="dic-acciones">
          <button type="button" class="btn-nuevo" id="e-guardar">Guardar</button>
          <button type="button" class="kw-fila-btn neutro" id="e-cancelar">Cancelar</button>
        </div>

        <div class="dic-listo" id="e-listo">
          <span id="e-listo-txt">Guardado.</span>
          <button type="button" class="kw-fila-btn" id="e-descargar">Descargar PDF</button>
          <button type="button" class="kw-fila-btn neutro" id="e-volver">Volver a la lista</button>
        </div>
      </div>
    </div>

  </main>

  <div id="solo-impresion"></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  // La misma función que usa la pantalla de Proceso de Alta: ya sabe leer
  // la hoja de asesores y traer un token de Google, y el catálogo de
  // Dictámenes se nutre de esa misma hoja.
  var FN_ALTA = 'https://iloetojomzqtadkithtv.supabase.co/functions/v1/hyper-processor';

  var yo = null;
  var veTodo = false;
  var puedoDictaminar = false;

  var dictamenes = [];
  var puntos = [];
  var asesores = [];
  var tipos = [];
  var abierto = null;
  var verArchivo = false;
  var borrador = null;

  var ESTADOS = {
    borrador:     'Borrador',
    devuelta:     'Devuelto',
    condicionada: 'Autorizado condicionado',
    autorizada:   'Autorizado para promoción',
  };

  var OPERACIONES = { venta: 'Venta', renta: 'Renta' };
  var USOS = { residencial: 'Residencial', comercial: 'Comercial', mixto: 'Mixto' };

  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fecha(iso) {
    if (!iso) return '';
    // Las fechas de solo día vienen como "2026-08-18". Pasarlas por Date
    // las lee como medianoche UTC y en México se corren un día hacia
    // atrás, así que se parten a mano.
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
    var d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(iso);
    return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function hoy() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function aviso(caja, texto, tipo) {
    var el = $(caja);
    el.className = 'dic-msg' + (texto ? ' ' + tipo : '');
    el.textContent = texto || '';
  }

  // ── Traer los datos ─────────────────────────────────────────

  async function cargar() {
    var r = await window.kwSupabase
      .from('dictamenes_con_asesor').select('*')
      .order('created_at', { ascending: false }).limit(500);

    if (r.error) {
      $('lista').innerHTML = '<div class="kw-vacio">No se pudieron cargar los dictámenes: '
        + escapar(r.error.message) + '</div>';
      return;
    }
    dictamenes = r.data || [];

    // Las observaciones de todos, de una sola vez. La regla de acceso de
    // la base ya devuelve nada más las que a uno le tocan.
    var p = await window.kwSupabase
      .from('dictamen_puntos').select('*').order('orden').limit(5000);
    puntos = p.data || [];
    pintar();
  }

  async function cargarCatalogos() {
    var a = await window.kwSupabase
      .from('dictamen_asesores').select('id, nombre, correo, activo').order('nombre');
    asesores = a.data || [];

    var t = await window.kwSupabase
      .from('dictamen_tipos_inmueble').select('id, nombre').order('nombre');
    tipos = t.data || [];

    $('f-asesor').innerHTML = '<option value="todos">Todos los asesores</option>' +
      asesores.filter(function (x) { return x.activo; }).map(function (x) {
        return '<option value="' + x.id + '">' + escapar(x.nombre) + '</option>';
      }).join('');

    $('e-tipo').innerHTML = '<option value="">Sin especificar</option>' +
      tipos.map(function (x) {
        return '<option value="' + x.id + '">' + escapar(x.nombre) + '</option>';
      }).join('') +
      '<option value="__nuevo__">Otro (escribirlo)</option>';
  }

  // ── Filtrar ─────────────────────────────────────────────────

  function visibles() {
    var busca = $('f-buscar').value.trim().toLowerCase();
    var estado = $('f-estado').value;
    var asesor = $('f-asesor').value;

    return dictamenes.filter(function (d) {
      // El archivo es una lista aparte, no un filtro más: o se ve lo
      // vivo, o se ve lo archivado.
      if (verArchivo !== !!d.archivado_at) return false;
      if (estado !== 'todos' && d.estado !== estado) return false;
      if (asesor !== 'todos' && d.asesor_id !== asesor) return false;
      if (busca) {
        var heno = [d.inmueble, d.folio, d.cliente, d.asesor_nombre]
          .join(' ').toLowerCase();
        if (heno.indexOf(busca) === -1) return false;
      }
      return true;
    });
  }

  // ── El resumen ──────────────────────────────────────────────

  function pintarResumen() {
    if (verArchivo) { $('resumen').innerHTML = ''; return; }
    var vivos = dictamenes.filter(function (d) { return !d.archivado_at; });
    var cuenta = function (e) {
      return vivos.filter(function (d) { return d.estado === e; }).length;
    };
    var tarjetas = [
      ['devuelta', cuenta('devuelta'), 'Devueltos'],
      ['condicionada', cuenta('condicionada'), 'Condicionados'],
      ['autorizada', cuenta('autorizada'), 'Autorizados'],
    ];
    var activo = $('f-estado').value;

    $('resumen').innerHTML = tarjetas.map(function (t) {
      return '<button type="button" class="dic-tarjeta' + (activo === t[0] ? ' activa' : '') +
        '" data-estado="' + t[0] + '">' +
        '<span class="dic-tarjeta-num">' + t[1] + '</span>' +
        '<span class="dic-tarjeta-txt">' + t[2] + '</span>' +
      '</button>';
    }).join('');

    $('resumen').querySelectorAll('[data-estado]').forEach(function (b) {
      b.addEventListener('click', function () {
        // Volver a picarle al que ya está puesto lo quita: si no, para ver
        // todo habría que ir hasta el filtro de abajo.
        var quiere = b.dataset.estado;
        $('f-estado').value = ($('f-estado').value === quiere) ? 'todos' : quiere;
        $('f-estado').dispatchEvent(new Event('change', { bubbles: true }));
        pintar();
      });
    });
  }

  // ── La lista ────────────────────────────────────────────────

  function pintar() {
    pintarResumen();
    $('page-titulo').textContent = verArchivo ? 'Archivo de dictámenes' : 'Dictámenes';
    $('page-desc').textContent = verArchivo
      ? 'Los que se sacaron de la lista. Desde aquí se restauran o se borran de verdad.'
      : 'Revisión de expedientes y seguimiento de lo que falta corregir.';
    $('btn-archivo').textContent = verArchivo ? 'Volver a la lista' : 'Ver archivo';

    var filas = visibles();

    if (!filas.length) {
      var hayFiltro = $('f-buscar').value.trim() || $('f-estado').value !== 'todos'
        || $('f-asesor').value !== 'todos';
      $('lista').innerHTML = '<div class="kw-vacio">' + (
        verArchivo ? 'No hay dictámenes archivados.'
          : hayFiltro ? 'No hay dictámenes que cumplan con lo que estás filtrando.'
            : 'Todavía no se ha levantado ningún dictamen.'
      ) + '</div>';
      return;
    }

    $('lista').innerHTML = filas.map(filaHTML).join('');

    // Se vuelve a abrir el que estaba abierto: sin esto, marcar una
    // observación cierra la tarjeta y hay que volver a buscarla.
    if (abierto) {
      var f = $('lista').querySelector('[data-fila="' + abierto + '"]');
      if (f) {
        f.classList.add('abierta');
        var c = f.querySelector('.kw-fila-cabeza');
        if (c) c.setAttribute('aria-expanded', 'true');
      }
    }

    if (window.kwUI) window.kwUI.acordeon($('lista'));
    $('lista').querySelectorAll('.kw-fila-cabeza').forEach(function (c) {
      c.addEventListener('click', function () {
        var fila = c.closest('.kw-fila');
        abierto = fila && fila.classList.contains('abierta') ? fila.dataset.fila : null;
      });
    });
    cablear();
  }

  function filaHTML(d) {
    var mios = puntos.filter(function (p) { return p.dictamen_id === d.id; });
    var total = d.puntos_total || 0;
    var listas = d.puntos_corregidas || 0;
    var pct = total ? Math.round((listas / total) * 100) : 0;

    return '<div class="kw-fila" data-fila="' + d.id + '">' +
      '<button type="button" class="kw-fila-cabeza">' +
        '<span class="kw-fila-texto">' +
          '<span class="kw-fila-titulo">' + escapar(d.inmueble) + '</span>' +
          '<span class="kw-fila-sub">' +
            (d.folio ? escapar(d.folio) + ' · ' : '') +
            escapar(d.asesor_nombre || '') + ' · ' + fecha(d.fecha_dictamen) +
          '</span>' +
        '</span>' +
        '<span class="kw-fila-extra">' +
          (total
            ? '<span class="kw-extra"><span class="dic-avance"><span style="width:' + pct + '%"></span></span></span>' +
              '<span class="kw-extra"><span>' + listas + ' de ' + total + '</span></span>'
            : '') +
          '<span class="kw-extra"><span class="dic-estado ' + d.estado + '">' +
            (ESTADOS[d.estado] || '') + '</span></span>' +
        '</span>' +
        '<svg class="kw-fila-flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>' +
      '</button>' +
      '<div class="kw-fila-cuerpo"><div><div class="kw-fila-dentro">' +
        cuerpoHTML(d, mios) +
      '</div></div></div>' +
    '</div>';
  }

  function dato(rotulo, valor) {
    if (!valor) return '';
    return '<div class="dic-dato"><b>' + rotulo + '</b>' + escapar(valor) + '</div>';
  }

  function cuerpoHTML(d, mios) {
    var datos = '<div class="dic-datos">' +
      dato('Cliente', d.cliente) +
      dato('Operación', (OPERACIONES[d.operacion] || '') + ' · ' + (USOS[d.uso] || '')) +
      dato('Tipo de inmueble', d.tipo_inmueble) +
      dato('Escrituras y fecha', d.escritura_propiedad) +
      dato('Condominio', d.escritura_condominio) +
      dato('CFDI', d.cfdi) +
      dato('Superficie escritura', d.superficie_escritura) +
      dato('Cuenta predial', d.cuenta_predial) +
      dato('Superficie predial', d.superficie_predial) +
      dato('Estado civil', d.estado_civil) +
      dato('Folio real', d.folio_real) +
      dato('Dictaminó', ((d.dictaminador_nombre || '') + ' ' + (d.dictaminador_apellido || '')).trim()) +
    '</div>';

    var obs = d.observaciones
      ? '<div class="kw-nota">' + escapar(d.observaciones) + '</div>' : '';

    var lista = mios.length
      ? mios.map(function (p, i) { return puntoHTML(p, i); }).join('')
      : '<div class="kw-vacio" style="padding:var(--sp-4);">Sin observaciones por atender.</div>';

    var agregar = (puedoDictaminar && !d.archivado_at)
      ? '<div class="dic-nuevo-punto" data-agregar-en="' + d.id + '">' +
          '<textarea data-nuevo-texto placeholder="Otra observación para este expediente" rows="1"></textarea>' +
          '<button type="button" class="kw-btn-mini" data-nuevo-agregar>Agregar</button>' +
        '</div>'
      : '';

    // El dictamen en sí: los tres botones que mueven el estado. Van juntos
    // y siempre los tres, incluso el que ya está puesto, porque leerlos
    // uno al lado del otro es lo que deja ver de qué se está eligiendo.
    var dictaminar = (puedoDictaminar && !d.archivado_at)
      ? '<div class="dic-punto-acciones" style="margin-top:var(--sp-3);">' +
          ['devuelta', 'condicionada', 'autorizada'].map(function (e) {
            return '<button type="button" class="kw-btn-mini" data-dictaminar="' + e +
              '" data-dic="' + d.id + '"' + (d.estado === e ? ' disabled' : '') + '>' +
              ESTADOS[e] + '</button>';
          }).join('') +
        '</div>'
      : '';

    var acciones = '<div class="kw-fila-acciones">' +
      '<button type="button" class="kw-fila-btn" data-imprimir="' + d.id + '">Descargar PDF</button>' +
      (puedoDictaminar && !d.archivado_at
        ? '<button type="button" class="kw-fila-btn" data-editar="' + d.id + '">Editar</button>' +
          '<button type="button" class="kw-fila-btn neutro" data-archivar="' + d.id + '">Archivar</button>'
        : '') +
      (puedoDictaminar && d.archivado_at
        ? '<button type="button" class="kw-fila-btn" data-restaurar="' + d.id + '">Restaurar</button>' +
          '<button type="button" class="kw-fila-btn neutro" data-borrar="' + d.id + '">Borrar</button>'
        : '') +
    '</div>';

    return datos + obs +
      '<div style="margin-top:var(--sp-3);">' + lista + agregar + '</div>' +
      dictaminar + acciones;
  }

  function puntoHTML(p, i) {
    var corregida = p.estado === 'corregida';
    var btns = puedoDictaminar
      ? '<div class="dic-punto-acciones">' +
          '<button type="button" class="kw-btn-mini" data-mover="' + p.id + '">' +
            (corregida ? 'Marcar pendiente' : 'Marcar corregida') + '</button>' +
          '<button type="button" class="kw-btn-mini" data-nota="' + p.id + '">Nota</button>' +
          '<button type="button" class="kw-btn-mini" data-quitar-punto="' + p.id + '">Quitar</button>' +
        '</div>'
      : '';

    return '<div class="dic-punto' + (corregida ? ' corregida' : '') + '">' +
      '<div class="dic-punto-cabeza">' +
        '<span class="dic-punto-texto">' + (i + 1) + '. ' + escapar(p.texto) + '</span>' +
        '<span class="dic-estado ' + (corregida ? 'autorizada' : 'condicionada') + '">' +
          (corregida ? 'Corregida' : 'Pendiente') + '</span>' +
      '</div>' +
      (p.nota ? '<div class="dic-punto-nota">' + escapar(p.nota) + '</div>' : '') +
      '<div class="dic-punto-form" data-form-de="' + p.id + '">' +
        '<textarea placeholder="Una nota sobre esta observación">' + escapar(p.nota || '') + '</textarea>' +
        '<div class="dic-punto-acciones">' +
          '<button type="button" class="kw-btn-mini" data-guardar-nota="' + p.id + '">Guardar nota</button>' +
          '<button type="button" class="kw-btn-mini" data-cerrar-form="' + p.id + '">Cancelar</button>' +
        '</div>' +
      '</div>' +
      btns +
    '</div>';
  }

  // ── Los botones de la lista ─────────────────────────────────

  function cablear() {
    var raiz = $('lista');

    raiz.querySelectorAll('[data-mover]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var p = puntos.find(function (x) { return x.id === b.dataset.mover; });
        if (!p) return;
        await guardarPunto(p.id, { estado: p.estado === 'corregida' ? 'pendiente' : 'corregida' });
      });
    });

    raiz.querySelectorAll('[data-nota]').forEach(function (b) {
      b.addEventListener('click', function () {
        var caja = raiz.querySelector('[data-form-de="' + b.dataset.nota + '"]');
        if (!caja) return;
        caja.classList.add('abierto');
        caja.querySelector('textarea').focus();
      });
    });
    raiz.querySelectorAll('[data-cerrar-form]').forEach(function (b) {
      b.addEventListener('click', function () {
        var caja = raiz.querySelector('[data-form-de="' + b.dataset.cerrarForm + '"]');
        if (caja) caja.classList.remove('abierto');
      });
    });
    raiz.querySelectorAll('[data-guardar-nota]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var caja = raiz.querySelector('[data-form-de="' + b.dataset.guardarNota + '"]');
        if (!caja) return;
        await guardarPunto(b.dataset.guardarNota,
          { nota: caja.querySelector('textarea').value.trim() || null });
      });
    });

    raiz.querySelectorAll('[data-quitar-punto]').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!(await window.kwUI.confirm('¿Quitar esta observación del dictamen?'))) return;
        await window.kwSupabase.from('dictamen_puntos').delete().eq('id', b.dataset.quitarPunto);
        await cargar();
      });
    });

    raiz.querySelectorAll('[data-agregar-en]').forEach(function (caja) {
      var btn = caja.querySelector('[data-nuevo-agregar]');
      var txt = caja.querySelector('[data-nuevo-texto]');
      var agregar = async function () {
        var texto = txt.value.trim();
        if (!texto) return;
        var d = caja.dataset.agregarEn;
        var cuantos = puntos.filter(function (p) { return p.dictamen_id === d; }).length;
        btn.disabled = true;
        var r = await window.kwSupabase.from('dictamen_puntos')
          .insert({ dictamen_id: d, texto: texto, orden: cuantos + 1 });
        btn.disabled = false;
        if (r.error) { await window.kwUI.alert('No se pudo agregar: ' + r.error.message); return; }
        await cargar();
      };
      btn.addEventListener('click', agregar);
      txt.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); agregar(); }
      });
    });

    raiz.querySelectorAll('[data-dictaminar]').forEach(function (b) {
      b.addEventListener('click', async function () {
        b.disabled = true;
        var r = await window.kwSupabase.rpc('dictaminar', {
          p_id: b.dataset.dic, p_estado: b.dataset.dictaminar,
        });
        b.disabled = false;
        if (r.error) { await window.kwUI.alert('No se pudo dictaminar: ' + r.error.message); return; }
        await cargar();
      });
    });

    raiz.querySelectorAll('[data-imprimir]').forEach(function (b) {
      b.addEventListener('click', function () { imprimir(b.dataset.imprimir); });
    });
    raiz.querySelectorAll('[data-editar]').forEach(function (b) {
      b.addEventListener('click', function () { abrirEditor(b.dataset.editar); });
    });

    raiz.querySelectorAll('[data-archivar]').forEach(function (b) {
      b.addEventListener('click', async function () {
        await window.kwSupabase.from('dictamenes')
          .update({ archivado_at: new Date().toISOString() }).eq('id', b.dataset.archivar);
        abierto = null;
        await cargar();
      });
    });
    raiz.querySelectorAll('[data-restaurar]').forEach(function (b) {
      b.addEventListener('click', async function () {
        await window.kwSupabase.from('dictamenes')
          .update({ archivado_at: null }).eq('id', b.dataset.restaurar);
        abierto = null;
        await cargar();
      });
    });
    raiz.querySelectorAll('[data-borrar]').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!(await window.kwUI.confirm('Se va a borrar este dictamen para siempre, con sus observaciones. No se puede deshacer.\n\n¿Seguimos?'))) return;
        var r = await window.kwSupabase.from('dictamenes').delete().eq('id', b.dataset.borrar);
        if (r.error) { await window.kwUI.alert('No se pudo borrar: ' + r.error.message); return; }
        abierto = null;
        await cargar();
      });
    });
  }

  async function guardarPunto(id, datos) {
    var r = await window.kwSupabase.from('dictamen_puntos').update(datos).eq('id', id);
    if (r.error) { await window.kwUI.alert('No se pudo guardar: ' + r.error.message); return; }
    await cargar();
  }

  // ── El buscador de asesor ───────────────────────────────────

  function elegirAsesor(a) {
    borrador.asesor_id = a ? a.id : '';
    if (a) {
      $('e-asesor-nombre').innerHTML = escapar(a.nombre) +
        (a.correo ? '<small>' + escapar(a.correo) + '</small>' : '');
      $('e-asesor-puesto').style.display = '';
      $('e-asesor-busca').parentElement.style.display = 'none';
    } else {
      $('e-asesor-puesto').style.display = 'none';
      $('e-asesor-busca').parentElement.style.display = '';
      $('e-asesor-busca').value = '';
      $('e-asesor-lista').classList.remove('abierta');
    }
  }

  function pintarAsesores() {
    var q = $('e-asesor-busca').value.trim().toLowerCase();
    var caja = $('e-asesor-lista');
    if (!q) { caja.classList.remove('abierta'); return; }

    var hallados = asesores.filter(function (a) {
      if (!a.activo) return false;
      return (a.nombre + ' ' + (a.correo || '')).toLowerCase().indexOf(q) !== -1;
    }).slice(0, 40);

    caja.innerHTML = hallados.length
      ? hallados.map(function (a) {
        return '<button type="button" class="dic-asesor-op" data-asesor="' + a.id + '">' +
          escapar(a.nombre) +
          (a.correo ? '<small>' + escapar(a.correo) + '</small>' : '') +
        '</button>';
      }).join('')
      : '<div class="dic-asesor-vacio">Ningún asesor con ese nombre.</div>';

    caja.classList.add('abierta');
    caja.querySelectorAll('[data-asesor]').forEach(function (b) {
      b.addEventListener('click', function () {
        elegirAsesor(asesores.find(function (a) { return a.id === b.dataset.asesor; }));
      });
    });
  }

  // ── Armar un dictamen ───────────────────────────────────────

  // Los campos del machote, con el id del campo en pantalla al lado del
  // nombre de la columna. La lista vive en un solo lugar para que agregar
  // un renglón sea agregar un renglón aquí, y no acordarse de tocar el
  // leer, el guardar y el reabrir por separado.
  var CAMPOS = [
    ['e-cliente', 'cliente'],
    ['e-inmueble', 'inmueble'],
    ['e-esc-propiedad', 'escritura_propiedad'],
    ['e-esc-condominio', 'escritura_condominio'],
    ['e-cfdi', 'cfdi'],
    ['e-folio-real', 'folio_real'],
    ['e-sup-escritura', 'superficie_escritura'],
    ['e-estado-civil', 'estado_civil'],
    ['e-cuenta-predial', 'cuenta_predial'],
    ['e-sup-predial', 'superficie_predial'],
    ['e-observaciones', 'observaciones'],
  ];

  function abrirEditor(id) {
    var d = id ? dictamenes.find(function (x) { return x.id === id; }) : null;

    borrador = {
      id: d ? d.id : null,
      asesor_id: d ? d.asesor_id : '',
      operacion: d ? d.operacion : 'venta',
      uso: d ? d.uso : 'residencial',
      tipo_inmueble_id: (d && d.tipo_inmueble_id) || '',
      fecha_dictamen: (d && d.fecha_dictamen) || hoy(),
      puntos: d
        ? puntos.filter(function (p) { return p.dictamen_id === d.id; })
          .map(function (p) { return { texto: p.texto, estado: p.estado, nota: p.nota }; })
        : [],
    };
    CAMPOS.forEach(function (c) { borrador[c[1]] = (d && d[c[1]]) || ''; });

    $('editor-titulo').textContent = d ? 'Editar dictamen' : 'Nuevo dictamen';
    $('e-fecha').value = borrador.fecha_dictamen;
    $('e-operacion').value = borrador.operacion;
    $('e-uso').value = borrador.uso;
    $('e-tipo').value = borrador.tipo_inmueble_id;
    $('e-tipo-nuevo').style.display = 'none';
    $('e-tipo-nuevo').value = '';
    // El desplegable del sitio pinta su rótulo escuchando "change", y
    // poner el valor desde el código no lo dispara.
    ['e-operacion', 'e-uso', 'e-tipo'].forEach(function (x) {
      $(x).dispatchEvent(new Event('change', { bubbles: true }));
    });
    CAMPOS.forEach(function (c) { $(c[0]).value = borrador[c[1]]; });
    elegirAsesor(asesores.find(function (a) { return a.id === borrador.asesor_id; }));

    aviso('editor-msg', '', '');
    $('e-listo').classList.remove('visible');
    pintarPuntosEditor();

    $('vista-lista').style.display = 'none';
    $('vista-editor').style.display = '';
    window.scrollTo(0, 0);
  }

  function cerrarEditor() {
    borrador = null;
    $('vista-editor').style.display = 'none';
    $('vista-lista').style.display = '';
  }

  function pintarPuntosEditor() {
    if (!borrador.puntos.length) {
      $('e-puntos').innerHTML = '<div class="kw-vacio" style="padding:var(--sp-4);">' +
        'Todavía no hay observaciones. Agrega abajo lo que se le va a pedir al asesor.</div>';
      return;
    }
    $('e-puntos').innerHTML = borrador.puntos.map(function (p, i) {
      return '<div class="dic-punto-edit">' +
        '<span class="dic-punto-edit-num">' + (i + 1) + '</span>' +
        '<span style="flex:1;min-width:0;font-size:13.5px;line-height:1.5;">' +
          escapar(p.texto) + '</span>' +
        '<button type="button" class="dic-quitar" data-quitar="' + i + '" aria-label="Quitar">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
      '</div>';
    }).join('');

    $('e-puntos').querySelectorAll('[data-quitar]').forEach(function (b) {
      b.addEventListener('click', function () {
        borrador.puntos.splice(Number(b.dataset.quitar), 1);
        pintarPuntosEditor();
      });
    });
  }

  function leerEditor() {
    borrador.fecha_dictamen = $('e-fecha').value || hoy();
    borrador.operacion = $('e-operacion').value;
    borrador.uso = $('e-uso').value;
    CAMPOS.forEach(function (c) { borrador[c[1]] = $(c[0]).value.trim(); });
  }

  // Si se escribió un tipo nuevo, se guarda en el catálogo antes que nada
  // y se usa el que quedó. Así la próxima vez ya sale en la lista, igual
  // que las etiquetas de Firmas.
  async function resolverTipo() {
    var elegido = $('e-tipo').value;
    if (elegido !== '__nuevo__') return elegido || null;

    var nombre = $('e-tipo-nuevo').value.trim();
    if (!nombre) return null;

    var ya = tipos.find(function (t) {
      return t.nombre.toLowerCase() === nombre.toLowerCase();
    });
    if (ya) return ya.id;

    var r = await window.kwSupabase.from('dictamen_tipos_inmueble')
      .insert({ nombre: nombre }).select('id, nombre').single();
    if (r.error) { aviso('editor-msg', 'No se pudo guardar el tipo: ' + r.error.message, 'error'); return null; }
    tipos.push(r.data);
    await cargarCatalogos();
    return r.data.id;
  }

  // Guarda el dictamen y sus observaciones. Las observaciones se borran y
  // se vuelven a escribir en vez de andar comparando cuál cambió: el
  // editor es de quien dictamina y nadie más las está tocando mientras.
  async function guardar() {
    leerEditor();
    if (!borrador.asesor_id) { aviso('editor-msg', 'Falta elegir al asesor.', 'error'); return null; }
    if (borrador.inmueble.length < 3) { aviso('editor-msg', 'Falta la dirección del inmueble.', 'error'); return null; }

    var fila = {
      asesor_id: borrador.asesor_id,
      fecha_dictamen: borrador.fecha_dictamen,
      operacion: borrador.operacion,
      uso: borrador.uso,
      tipo_inmueble_id: await resolverTipo(),
    };
    // Los vacíos van como nulo y no como cadena vacía: en la base son la
    // misma ausencia, pero una cadena vacía se cuela en las búsquedas y en
    // los reportes como si fuera un dato.
    CAMPOS.forEach(function (c) { fila[c[1]] = borrador[c[1]] || null; });
    fila.inmueble = borrador.inmueble;

    var id = borrador.id;
    if (id) {
      var u = await window.kwSupabase.from('dictamenes').update(fila).eq('id', id);
      if (u.error) { aviso('editor-msg', 'No se pudo guardar: ' + u.error.message, 'error'); return null; }
      await window.kwSupabase.from('dictamen_puntos').delete().eq('dictamen_id', id);
    } else {
      fila.dictaminado_por = yo.id;
      var c = await window.kwSupabase.from('dictamenes').insert(fila).select('id').single();
      if (c.error) { aviso('editor-msg', 'No se pudo guardar: ' + c.error.message, 'error'); return null; }
      id = c.data.id;
      borrador.id = id;
    }

    if (borrador.puntos.length) {
      var p = await window.kwSupabase.from('dictamen_puntos').insert(
        borrador.puntos.map(function (x, i) {
          return {
            dictamen_id: id, texto: x.texto, orden: i + 1,
            estado: x.estado || 'pendiente', nota: x.nota || null,
          };
        }));
      if (p.error) { aviso('editor-msg', 'No se pudieron guardar las observaciones: ' + p.error.message, 'error'); return null; }
    }
    return id;
  }

  // ── La hoja ─────────────────────────────────────────────────

  function renglon(rotulo, valor, alto) {
    return '<tr>' +
      '<td class="rotulo">' + rotulo + '</td>' +
      '<td' + (alto ? ' class="' + alto + '"' : '') + '>' + escapar(valor || '') + '</td>' +
    '</tr>';
  }

  function imprimir(id) {
    var d = dictamenes.find(function (x) { return x.id === id; });
    if (!d) return;
    var mios = puntos.filter(function (p) { return p.dictamen_id === id; });

    // Las observaciones por atender van numeradas dentro de la celda de
    // OBSERVACIONES, con su estado. Esa es toda la diferencia entre este
    // dictamen y el de papel: el de papel dice qué falta, este además dice
    // qué ya se corrigió.
    var lista = mios.length
      ? '<ol class="hoja-lista">' + mios.map(function (p) {
        return '<li>' + escapar(p.texto) +
          ' <span class="estado">(' + (p.estado === 'corregida' ? 'Corregida' : 'Pendiente') + ')</span>' +
          (p.nota ? '<br><span class="estado">' + escapar(p.nota) + '</span>' : '') +
        '</li>';
      }).join('') + '</ol>'
      : '';

    var observaciones =
      (d.observaciones ? '<p class="hoja-nota">' + escapar(d.observaciones) + '</p>' : '') + lista;

    var dictaminador = ((d.dictaminador_nombre || '') + ' ' + (d.dictaminador_apellido || '')).trim();

    $('solo-impresion').innerHTML =
      '<div class="hoja">' +
        '<div class="hoja-logo"><img src="/kwpremierweb/assets/img/logo-kw-premier.png" alt="KW Premier"></div>' +
        '<h1>DICTAMINACIÓN DE EXPEDIENTES</h1>' +
        '<div class="hoja-folio">' + escapar(d.folio || 'Borrador, sin folio') + '</div>' +

        '<table class="hoja-cuadro">' +
          renglon('Fecha de dictamen', fecha(d.fecha_dictamen)) +
          renglon('Asesor', d.asesor_nombre) +
          renglon('Cliente', d.cliente, 'alto-3') +
          renglon('Inmueble', d.inmueble, 'alto-3') +
          renglon('Tipo de oportunidad',
            (OPERACIONES[d.operacion] || '') + ' · ' + (USOS[d.uso] || '') +
            (d.tipo_inmueble ? ' · ' + d.tipo_inmueble : '')) +

          // El único renglón que parte su celda en dos, igual que el
          // machote: la escritura de la propiedad y la del condominio.
          '<tr>' +
            '<td class="rotulo">Escrituras y fecha</td>' +
            '<td class="alto-3" style="padding:0;">' +
              '<table style="width:100%;border-collapse:collapse;height:100%;">' +
                '<tr>' +
                  '<td style="border:0;border-right:1px solid #000;width:50%;vertical-align:top;">' +
                    '<span class="sub">Propiedad</span>' + escapar(d.escritura_propiedad || '') +
                  '</td>' +
                  '<td style="border:0;width:50%;vertical-align:top;">' +
                    '<span class="sub">Condominio</span>' + escapar(d.escritura_condominio || '') +
                  '</td>' +
                '</tr>' +
              '</table>' +
            '</td>' +
          '</tr>' +

          renglon('CFDI', d.cfdi) +
          renglon('Superficie escritura', d.superficie_escritura) +
          renglon('Cuenta predial', d.cuenta_predial) +
          renglon('Superficie predial', d.superficie_predial) +
          renglon('Estado civil', d.estado_civil) +
          renglon('Folio real', d.folio_real) +

          '<tr>' +
            '<td class="rotulo">Observaciones</td>' +
            '<td class="alto-4">' + observaciones + '</td>' +
          '</tr>' +
          renglon('Autorización',
            d.estado === 'borrador' ? 'Sin dictaminar' : ESTADOS[d.estado], 'alto-2') +
        '</table>' +

        '<div class="hoja-pie">' +
          (dictaminador ? 'Dictaminó: ' + escapar(dictaminador) + '. ' : '') +
          'Generado desde el portal de KW Premier el ' +
          fecha(new Date().toISOString()) + '.' +
        '</div>' +
      '</div>';

    window.print();
  }

  // ── Arranque ────────────────────────────────────────────────

  async function iniciar() {
    var s = await window.kwSupabase.auth.getSession();
    var uid = s.data.session && s.data.session.user && s.data.session.user.id;
    if (!uid) return;

    var r = await window.kwSupabase
      .from('profiles').select('id, role, puede_dictaminar').eq('id', uid).single();
    yo = r.data || { id: uid, role: 'asociado', puede_dictaminar: false };

    veTodo = ['master', 'admin', 'staff'].indexOf(yo.role) !== -1;
    // Master entra siempre, igual que en la base.
    puedoDictaminar = yo.puede_dictaminar === true || yo.role === 'master';

    if (puedoDictaminar) $('btn-nuevo').style.display = '';
    // Sincronizar es del equipo de liderazgo, no de quien dictamina nada
    // más: el candado de verdad vive en la Edge Function, esto solo
    // esconde el botón para quien de todos modos no podría usarlo.
    if (veTodo) $('btn-sync-asesores').style.display = '';

    await cargarCatalogos();
    if (window.kwUI) window.kwUI.selects(document);
    await cargar();
  }

  $('f-buscar').addEventListener('input', pintar);
  $('f-estado').addEventListener('change', pintar);
  $('f-asesor').addEventListener('change', pintar);

  // Sincronizar es en dos tiempos: primero se pregunta sin escribir nada,
  // y solo si se confirma se manda "aplicar". Así, si la hoja se leyó a
  // medias (un permiso caído, un rango mal puesto), eso se ve en el
  // resumen antes de dar de baja a medio equipo por error.
  $('btn-sync-asesores').addEventListener('click', async function () {
    var btn = $('btn-sync-asesores');
    var s = await window.kwSupabase.auth.getSession();
    var token = s.data.session && s.data.session.access_token;
    if (!token) return;

    async function pedir(aplicar) {
      var res = await fetch(FN_ALTA, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ accion: 'dictamen_asesores_sync', aplicar: aplicar }),
      });
      var json = await res.json().catch(function () { return null; });
      if (!res.ok) throw new Error((json && json.error) || ('Falló (' + res.status + ')'));
      return json;
    }

    btn.disabled = true;
    btn.textContent = 'Revisando...';
    try {
      var previa = await pedir(false);
      var mensaje = 'De la hoja del ABC:\n' +
        '  Nuevos: ' + previa.nuevos.length + '\n' +
        '  Reactivados: ' + previa.reactivados.length + '\n' +
        '  Bajas: ' + previa.bajas.length + '\n\n' +
        '¿Aplicar estos cambios al catálogo de asesores?';
      if (!(await window.kwUI.confirm(mensaje))) return;

      btn.textContent = 'Aplicando...';
      await pedir(true);
      await cargarCatalogos();
      if (window.kwUI) window.kwUI.selects(document);
      await window.kwUI.alert('Catálogo actualizado.');
    } catch (e) {
      await window.kwUI.alert('No se pudo sincronizar: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sincronizar asesores';
    }
  });

  $('btn-archivo').addEventListener('click', function () {
    verArchivo = !verArchivo;
    abierto = null;
    pintar();
  });

  $('btn-nuevo').addEventListener('click', function () { abrirEditor(null); });
  $('e-cancelar').addEventListener('click', function () { cerrarEditor(); });
  $('e-volver').addEventListener('click', function () { cerrarEditor(); });

  $('e-asesor-busca').addEventListener('input', pintarAsesores);
  $('e-asesor-cambiar').addEventListener('click', function () { elegirAsesor(null); });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.dic-busca-asesor')) $('e-asesor-lista').classList.remove('abierta');
  });

  $('e-tipo').addEventListener('change', function () {
    var nuevo = $('e-tipo').value === '__nuevo__';
    $('e-tipo-nuevo').style.display = nuevo ? '' : 'none';
    if (nuevo) $('e-tipo-nuevo').focus();
  });

  $('e-punto-agregar').addEventListener('click', function () {
    var texto = $('e-punto-texto').value.trim();
    if (!texto) return;
    borrador.puntos.push({ texto: texto, estado: 'pendiente' });
    $('e-punto-texto').value = '';
    $('e-punto-texto').focus();
    pintarPuntosEditor();
  });
  // Enter agrega, Shift+Enter salta de línea: se capturan varias
  // observaciones seguidas y llevar la mano al botón cada vez estorba.
  $('e-punto-texto').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $('e-punto-agregar').click();
    }
  });

  $('e-guardar').addEventListener('click', async function () {
    var b = $('e-guardar');
    b.disabled = true;
    b.textContent = 'Guardando...';
    var id = await guardar();
    b.disabled = false;
    b.textContent = 'Guardar';
    if (!id) return;

    await cargar();
    aviso('editor-msg', '', '');
    $('e-listo-txt').textContent = 'Guardado. Ya puedes descargar el PDF, '
      + 'y desde la lista ponerle el dictamen.';
    $('e-listo').classList.add('visible');
    $('e-descargar').onclick = function () { imprimir(id); };
  });

  if (document.documentElement.classList.contains('kw-auth-ok')) {
    iniciar();
  } else {
    window.addEventListener('kw-auth-ready', iniciar, { once: true });
  }
})();
</script>
