      icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'
        + '<line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>',
    },
    {
      id: 'check', grupo: 'extra', rotulo: 'Background Check', titulo: 'Background Check (requiere Foto ID, costo extra)',
      icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>'
        + '<polyline points="9 13 11 15 15 11"/></svg>',
    },
  ];

  function filaFirmante(nombre, correo) {
    const fila = document.createElement('div');
    fila.className = 'firmante-fila';
    fila.innerHTML =
      '<input type="text" class="kw-input firmante-nom" placeholder="Nombre completo" value="' + escapar(nombre || '') + '">' +
      '<div class="firmante-cola">' +
        '<input type="email" class="kw-input firmante-mail" placeholder="correo@ejemplo.com" value="' + escapar(correo || '') + '">' +
      '<button type="button" class="firmante-fijar">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 17c3.5 0 3.5-10 7-10s3.5 10 7 10"/><line x1="3" y1="21" x2="21" y2="21"/>' +
        '</svg><span class="rotulo">Fijar firma</span><span class="cuenta">0</span>' +
      '</button>' +
      '</div>' +
      '<button type="button" class="firmante-quitar" aria-label="Quitar firmante">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
      '</button>' +
      // Las verificaciones, como iconos que se prenden y apagan. Todas
      // arrancan apagadas: cada una se cobra aparte y por firmante.
      //
      // Las tres primeras son el mismo campo de weetrust (identification),
      // que solo admite un valor, así que prender una apaga las otras.
      // Background Check es aparte y solo tiene sentido junto a la
      // facial, que es lo que weetrust exige.
      '<div class="firmante-verif">' + VERIFICACIONES.map((v) =>
        '<button type="button" class="verif-btn" data-verif="' + v.id + '"' +
          ' data-grupo="' + v.grupo + '" title="' + v.titulo + '" aria-label="' + v.titulo + '">' +
          v.icono + '<span class="verif-txt">' + v.rotulo + '</span>' +
        '</button>').join('') +
      '</div>';
    fila.querySelector('.firmante-fijar').addEventListener('click', () => armarColocacion(fila));

    fila.querySelector('.firmante-quitar').addEventListener('click', () => {
      fila.remove();
      marcarUnico();
      // Sus firmas colocadas se van con él.
      limpiarMarcasHuerfanas();
      // Quitar un renglón no dispara ningún evento 'input', así que sin
      // esto el botón del frecuente que se acaba de borrar se quedaba
      // apagado para siempre y ya no se podía volver a agregar.
      marcarFrecuentesPuestos();
    });

    fila.querySelectorAll('.verif-btn').forEach((b) => {
      b.addEventListener('click', () => {
        const prendido = b.classList.toggle('activo');

        // Las tres de identificación son el mismo campo en weetrust y
        // solo cabe un valor, así que prender una apaga a sus hermanas.
        if (prendido && b.dataset.grupo === 'ident') {
          fila.querySelectorAll('.verif-btn[data-grupo="ident"]').forEach((otro) => {
            if (otro !== b) otro.classList.remove('activo');
          });
        }
        ajustarBackgroundCheck(fila);
      });
    });

    ajustarBackgroundCheck(fila);
    return fila;
  }

  // weetrust solo hace el Background Check cuando la verificación es la
  // facial. Se apaga el botón en vez de dejar prenderlo y que el envío
  // truene después: el error llegaría cuando la persona ya llenó todo.
  function ajustarBackgroundCheck(fila) {
    const facial = fila.querySelector('.verif-btn[data-verif="face"]');
    const check = fila.querySelector('.verif-btn[data-verif="check"]');
    if (!facial || !check) return;

    const hayFacial = facial.classList.contains('activo');
    check.disabled = !hayFacial;
    if (!hayFacial) check.classList.remove('activo');
  }

  function marcarUnico() {
    const filas = $('firmantes').querySelectorAll('.firmante-fila');
    filas.forEach((f) => f.classList.toggle('unico', filas.length === 1));
  }

  function agregarFirmante(nombre, correo) {
    $('firmantes').appendChild(filaFirmante(nombre, correo));
    marcarUnico();
  }

  // ── ¿Yo también firmo? ──
  // Se pregunta cada vez que se arma un documento, no una sola vez: que
  // el asesor firme uno no quiere decir que firme el que sigue. Mientras
  // no conteste no hay ninguna tarjeta, para que la pregunta no compita
  // con un campo vacío que ya invita a escribir.
  function prepararFirmantes() {
    $('firmantes').innerHTML = '';
    $('pregunta-firmo').style.display = 'flex';
    marcarFrecuentesPuestos();
  }

  function responderFirmo(firmaYo) {
    $('pregunta-firmo').style.display = 'none';
    // En los dos casos queda una tarjeta: con "sí" viene con los datos
    // del asesor, con "no" viene vacía para el primer cliente. Dejarlo
    // sin ninguna obligaría a picarle a "agregar" antes de poder
    // escribir nada.
    agregarFirmante(firmaYo ? miPerfil.nombre : '', firmaYo ? miPerfil.correo : '');
    marcarFrecuentesPuestos();
    const primero = $('firmantes').querySelector(firmaYo ? '.firmante-mail' : '.firmante-nom');
    if (primero) primero.focus();
  }

  $('firmo-si').addEventListener('click', () => responderFirmo(true));
  $('firmo-no').addEventListener('click', () => responderFirmo(false));

  $('btn-agregar').addEventListener('click', () => {
    agregarFirmante('', '');
    const filas = $('firmantes').querySelectorAll('.firmante-nom');
    filas[filas.length - 1].focus();
  });

  function leerFirmantes() {
    return Array.from($('firmantes').querySelectorAll('.firmante-fila')).map((f) => {
      const ident = f.querySelector('.verif-btn[data-grupo="ident"].activo');
      const check = f.querySelector('.verif-btn[data-verif="check"].activo');
      return {
        nombre: f.querySelector('.firmante-nom').value.trim(),
        correo: f.querySelector('.firmante-mail').value.trim(),
        identificacion: ident ? ident.dataset.verif : '',
        check: !!check,
      };
    }).filter((f) => f.nombre || f.correo);
  }

  // ── Mandar ──────────────────────────────────────────────────

  async function llamarFuncion(cuerpo) {
    const { data: { session } } = await window.kwSupabase.auth.getSession();
    if (!session) throw new Error('Se cerró tu sesión. Vuelve a entrar.');

    // Un corte de dos minutos. Sin esto, si la función se queda pensando
    // el botón se queda en "Trayendo..." para siempre y no hay manera de
    // saber si sigue trabajando o ya se murió.
    const corte = new AbortController();
    const reloj = setTimeout(() => corte.abort(), 120000);

    let res;
    try {
      res = await fetch(FN_FIRMAR, {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + session.access_token,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(cuerpo),
        signal: corte.signal,
      });
    } catch (e) {
      if (e.name === 'AbortError') {
        throw new Error('La operación tardó demasiado y se cortó. Vuelve a intentarlo.');
      }
      throw e;
    } finally {
      clearTimeout(reloj);
    }
    const json = await res.json().catch(() => null);
    if (!res.ok) throw new Error((json && json.error) || ('Falló la operación (' + res.status + ')'));
    return json;
  }

  // Sube el PDF unido al bucket, o reusa el que ya estaba si se reabrió
  // un borrador sin cambiar los documentos.
  async function asegurarSubido() {
    if (rutaSubida) return { ruta: rutaSubida, nombre: nombreDelUnido() };

    const nombreFinal = nombreDelUnido();
    const ruta = miUserId + '/' + crypto.randomUUID() + '-' + nombreFinal;
    const { error } = await window.kwSupabase
      .storage.from('firmas').upload(ruta, new Blob([pdfUnido], { type: 'application/pdf' }), {
        contentType: 'application/pdf',
      });
    if (error) throw new Error('No se pudo subir el archivo: ' + error.message);
    rutaSubida = ruta;
    return { ruta, nombre: nombreFinal };
  }

  $('btn-borrador').addEventListener('click', async () => {
    const titulo = $('titulo').value.trim();
    if (!pdfUnido) return aviso('Falta elegir el documento.', 'error');
    if (!titulo) return aviso('Ponle un título para poder guardarlo.', 'error');

    const btn = $('btn-borrador');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    aviso('', '');

    try {
      const { ruta, nombre } = await asegurarSubido();
      const r = await llamarFuncion({
        accion: 'guardar_borrador',
        borradorId: borradorId,
        archivoRuta: ruta,
        nombreArchivo: nombre,
        titulo: titulo,
        // A medias está bien: se guarda justamente porque falta algo.
        firmantes: leerFirmantes(),
        posiciones: posicionesParaEnviar(),
      });
      // Se recuerda cuál es, para que guardar otra vez actualice este
      // mismo borrador y no vaya dejando copias.
      borradorId = r.id;
      aviso('Guardado. Lo puedes retomar desde el historial.', 'ok');
      await cargarEnvios();
    } catch (err) {
      aviso(err.message || 'No se pudo guardar el borrador.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar borrador';
    }
  });

  $('form-firma').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (enviando) return;

    const titulo = $('titulo').value.trim();
    const firmantes = leerFirmantes();

    if (!pdfUnido) return aviso('Falta elegir el documento.', 'error');
    if (!titulo) return aviso('Ponle un título al documento.', 'error');
    if (!firmantes.length) return aviso('Falta indicar quién firma.', 'error');

    // La validación de fondo (correo bien formado, sin repetidos) vive en
    // la Edge Function, porque es la que tiene que aguantar aunque alguien
    // se salte esta pantalla. Aquí solo se atajan los descuidos obvios
    // para no gastar una subida en balde.
    for (const f of firmantes) {
      if (!f.nombre) return aviso('A uno de los firmantes le falta el nombre.', 'error');
      if (!f.correo) return aviso('A ' + f.nombre + ' le falta el correo.', 'error');
    }

    enviando = true;
    const btn = $('btn-enviar');
    btn.disabled = true;
    btn.textContent = 'Subiendo el documento...';
    aviso('', '');

    try {
      // El archivo va primero al bucket y de ahí lo recoge la Edge
      // Function. No se manda dentro de la petición porque un PDF
      // escaneado pasa de lo que aguanta un cuerpo JSON, y porque así
      // queda copia del original exactamente como se firmó.
      // El nombre se limpia antes de armar la ruta: Storage rechaza
      // acentos, espacios y signos, y los documentos suelen llamarse
      // "Contrato Depto. #3 (final).pdf".
      // Se sube el PDF ya unido, no los originales: es exactamente el
      // que la gente va a firmar, y las coordenadas de firma solo tienen
      // sentido contra esa paginación. Si viene de un borrador ya subido
      // se reusa, para no dejar dos copias del mismo archivo.
      const { ruta, nombre: nombreFinal } = await asegurarSubido();

      btn.textContent = 'Mandando a firma...';

      await llamarFuncion({
        accion: 'enviar',
        origen: 'subido',
        borradorId: borradorId,
        archivoRuta: ruta,
        nombreArchivo: nombreFinal,
        titulo: titulo,
        firmantes: firmantes,
        enOrden: $('en-orden').checked,
        posiciones: posicionesParaEnviar(),
      });

      // Se limpia todo para que no se mande dos veces sin querer.
      $('form-firma').reset();

      // Se regresa al historial en limpio, que es donde el envío recién
      // hecho ya aparece. Dejar el editor abierto con el documento que
      // se acaba de mandar invita a mandarlo dos veces.
      archivos = [];
      pdfUnido = null;
      marcas = [];
      paginas = [];
      borradorId = null;
      rutaSubida = null;
      desarmar();
      $('paginas').innerHTML = '';
      pintarArchivos();
      mostrarVista('historial');

      // Los firmantes se vacían y la pregunta vuelve a salir en el
      // siguiente documento: que el asesor firme uno no quiere decir que
      // firme el que sigue.
      $('firmantes').innerHTML = '';
      prepararFirmantes();

      await cargarEnvios();
    } catch (err) {
      aviso(err.message || 'No se pudo mandar a firma.', 'error');
    } finally {
      enviando = false;
      btn.textContent = 'Mandar a firma';
      btn.disabled = false;
      // Va al final y no dentro del try: aquí se acaba de reactivar el
      // botón, y si con este envío se agotó el tope hay que volver a
      // apagarlo. Puesto antes, esta línea de arriba lo desharía.
      // También corre cuando algo falló, que es justo cuando el envío
      // se rechazó por tope y el contador tiene que decirlo.
      await cargarCupo();
    }
  });

  // ── Mis envíos ──────────────────────────────────────────────

  // Los valores que guarda weetrust son sus nombres internos; en la
  // lista se enseña algo que se pueda leer.
  const NOMBRE_VERIF = {
    id: 'identificación',
    face: 'foto ID',
    ocr: 'OCR',
    face_login: 'facial con registro',
  };

  const PILL = {
    preparando: ['kw-pill-neutro', 'Preparando'],
    borrador: ['kw-pill-neutro', 'Borrador'],
    pendiente: ['kw-pill-espera', 'Esperando firmas'],
    completado: ['kw-pill-ok', 'Firmado'],
    cancelado: ['kw-pill-neutro', 'Cancelado'],
    error: ['kw-pill-alerta', 'Falló'],
  };
  const PUNTO = {
    preparando: 'gris', borrador: 'gris', pendiente: 'ambar',
    completado: 'verde', cancelado: 'gris', error: 'rojo',
  };

  function fecha(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('es-MX', {
      day: 'numeric', month: 'short', year: 'numeric',
    });
  }

  // ── El historial, en tabla ──────────────────────────────────
  // Mismas columnas que la pantalla de weetrust (nombre, quién firma,
  // estado, fecha) para que a quien ya la usa no le cambie el terreno.
  // El detalle completo se abre aparte, igual que su "Más información":
  // meterlo todo en el renglón haría la tabla ilegible con cuatro
  // firmantes, que es lo normal en un contrato.

  // ── La tabla ────────────────────────────────────────────────
  // Cada renglón se parte en dos zonas que abren cosas distintas: la
  // izquierda (nombre y asesor) abre el documento, la derecha (etiquetas,
  // estado y fecha) abre el estatus. Antes todo el renglón hacía lo
  // mismo y hacía falta un enlace de "ver todos los detalles" para
  // distinguirlo; partiéndolo, el enlace sobra.

  function pintarEnvios() {
    const cont = $('lista-envios');
    const filas = envíosFiltrados();
    // El detalle se abre por posición dentro de lo que se está viendo,
    // así que la lista visible se guarda tal cual quedó filtrada.
    visibles = filas;

    // El checkbox de "seleccionar todos" vive fuera de aquí, pegado
    // arriba de la tabla junto con la búsqueda: no se vuelve a crear en
    // cada pintada, solo se le ajusta si está marcado.
    const todos = $('elegir-todos');
    if (todos) todos.checked = filas.length > 0 && filas.every((x) => elegidos.has(x.id));

    if (!filas.length) {
      // El texto cambia según por qué está vacío: no es lo mismo no
      // haber mandado nunca nada que estar mirando un filtro sin
      // resultados, y con un solo mensaje uno cree que perdió sus
      // documentos.
      const hayFiltro = filtro !== 'todos' || buscaAsesor || faltaFirma || etiqueta;
      cont.innerHTML = '<div class="tabla-envios"><div class="kw-vacio">' + (
        hayFiltro
          ? 'No hay documentos que cumplan con lo que estás filtrando.'
          : (veTodo ? 'Todavía nadie ha mandado nada a firma.' : 'Todavía no has mandado nada a firma.')
      ) + '</div></div>';
      return;
    }

    cont.innerHTML =
      '<div class="tabla-envios">' +
        filas.map((f, i) => {
          const firmantes = Array.isArray(f.firmantes) ? f.firmantes : [];
          const yaFirmaron = firmantes.filter((x) => x.firmado).length;
          const pill = PILL[f.estado] || PILL.pendiente;

          // Los que no se pudieron atribuir a nadie se marcan, en vez de
          // dejar el hueco en blanco: así se ve cuáles hay que revisar.
          const quien = veTodo
            ? ((f.autor && f.autor.nombre)
                ? '<span class="env-etiqueta">' + escapar(f.autor.nombre) + '</span>'
                : '<span class="env-etiqueta sin">Sin identificar</span>')
            : '';

          const tags = (f.etiquetas || []).map((id) => {
            const e = etiquetas.find((x) => x.id === id);
            return e ? '<span class="env-tag" style="background:' + escapar(e.color) + '">'
              + escapar(e.nombre) + '</span>' : '';
          }).join('');

          return '<div class="tabla-fila' + (elegidos.has(f.id) ? ' elegida' : '') + '">' +
            '<label class="fila-check" title="Seleccionar">' +
              '<input type="checkbox" data-elegir="' + f.id + '"' +
                (elegidos.has(f.id) ? ' checked' : '') + '>' +
            '</label>' +
            // Zona izquierda: abre el documento.
            '<button type="button" class="zona-doc" data-doc="' + i + '" title="' +
              (f.estado === 'borrador' && f.archivo_ruta ? 'Continuar armándolo' : 'Ver el documento') + '">' +
              '<span class="env-nombre">' + escapar(nombreDoc(f)) + '</span>' +
              (quien ? '<span class="env-quien">' + quien + '</span>' : '') +
            '</button>' +

            // Zona derecha: abre el estatus.
            '<button type="button" class="zona-info" data-detalle="' + i + '" title="Ver el estatus">' +
              '<span class="env-tags">' + tags + '</span>' +
              '<span class="env-estado">' +
                '<span class="env-punto ' + (PUNTO[f.estado] || 'gris') + '"></span>' +
                '<span class="env-estado-txt">' + pill[1] +
                  (firmantes.length ? ' <span class="env-cuantos">' + yaFirmaron + '/' + firmantes.length + '</span>' : '') +
                '</span>' +
              '</span>' +
              '<span class="env-fecha">' + fecha(f.created_at) + '</span>' +
            '</button>' +

            '<span class="fila-botones">' +
              '<button type="button" class="env-menu-btn" data-editar="' + i + '" aria-label="Editar asesor y etiquetas">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>' +
                '</svg>' +
              '</button>' +
              '<button type="button" class="env-menu-btn" data-menu="' + i + '" aria-label="Más acciones">' +
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">' +
                  '<circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>' +
                '</svg>' +
              '</button>' +
            '</span>' +
          '</div>';
        }).join('') +
      '</div>';

    cont.querySelectorAll('[data-elegir]').forEach((c) => {
      c.addEventListener('click', (e) => e.stopPropagation());
      c.addEventListener('change', () => {
        if (c.checked) elegidos.add(c.dataset.elegir);
        else elegidos.delete(c.dataset.elegir);
        c.closest('.tabla-fila').classList.toggle('elegida', c.checked);
        pintarBarraSeleccion();
      });
    });

    pintarBarraSeleccion();

    cont.querySelectorAll('[data-doc]').forEach((b) => {
      b.addEventListener('click', () => abrirDocumento(Number(b.dataset.doc)));
    });
    cont.querySelectorAll('[data-detalle]').forEach((b) => {
      b.addEventListener('click', () => abrirDetalle(Number(b.dataset.detalle)));
    });
    cont.querySelectorAll('[data-editar]').forEach((b) => {
      b.addEventListener('click', (e) => { e.stopPropagation(); abrirEditar(b, Number(b.dataset.editar)); });
    });
    cont.querySelectorAll('[data-menu]').forEach((b) => {
      b.addEventListener('click', (e) => { e.stopPropagation(); abrirMenu(b, Number(b.dataset.menu)); });
    });
  }

  function pintarBarraSeleccion() {
    const n = elegidos.size;
    $('barra-seleccion').style.display = n ? 'flex' : 'none';
    $('sel-cuantos').textContent = n === 1 ? '1 documento seleccionado' : n + ' documentos seleccionados';
  }

  $('btn-quitar-sel').addEventListener('click', () => {
    elegidos.clear();
    pintarEnvios();
  });

  // Etiquetar de golpe. Se ponen o se quitan a todos los elegidos, que es
  // para lo que sirve seleccionar varios: marcar una tanda entera de
  // "revisado" sin abrir uno por uno.
  $('btn-etiquetar-varios').addEventListener('click', (e) => {
    e.stopPropagation();
    if (!elegidos.size) return;

    const caja = abrirFlotante($('btn-etiquetar-varios'), 250,
      '<div class="env-menu-titulo">Poner o quitar en ' + elegidos.size + '</div>' +
      (etiquetas.length
        ? etiquetas.map((et) =>
            '<div class="env-menu-fila">' +
              '<button type="button" class="env-menu-op" data-poner="' + et.id + '">' +
                '<i style="background:' + escapar(et.color) + '"></i><span>' + escapar(et.nombre) + '</span>' +
              '</button>' +
              '<button type="button" class="tag-menu-btn" data-quitar="' + et.id + '" title="Quitarla de los seleccionados">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
              '</button>' +
            '</div>').join('')
        : '<div class="env-menu-nada">Todavía no hay etiquetas. Créalas desde el lápiz de un documento.</div>'));
    if (!caja) return;

    async function aplicar(etiquetaId, poner) {
      cerrarFlotante();
      const ids = [...elegidos];
      const fallos = [];

      // De cinco en cinco: de golpe con cincuenta documentos se atraganta
      // la base, y uno por uno se hace eterno.
      for (let i = 0; i < ids.length; i += 5) {
        const trozo = ids.slice(i, i + 5);
        await Promise.all(trozo.map(async (id) => {
          const doc = envios.find((x) => x.id === id);
          if (!doc) return;
          const actuales = new Set(doc.etiquetas || []);
          if (poner) actuales.add(etiquetaId); else actuales.delete(etiquetaId);
          const { error } = await window.kwSupabase.rpc('firmas_etiquetar', {
            p_documento: id, p_etiquetas: [...actuales],
          });
          if (error) fallos.push(doc.titulo);
        }));
      }

      if (fallos.length) {
        alert('No se pudo etiquetar ' + fallos.length + ':\n' + fallos.slice(0, 10).join('\n'));
      }
      await cargarEnvios();
    }

    caja.querySelectorAll('[data-poner]').forEach((b) => {
      b.addEventListener('click', () => aplicar(b.dataset.poner, true));
    });
    caja.querySelectorAll('[data-quitar]').forEach((b) => {
      b.addEventListener('click', () => aplicar(b.dataset.quitar, false));
    });
  });

  // ── Ver el documento ────────────────────────────────────────
  // De dónde sale el PDF depende de por dónde entró el documento:
  //   - completado: el firmado, que weetrust deja en su URL
  //   - mandado desde el sitio: el original, en nuestro bucket
  //   - traído de su panel y sin terminar: no tenemos archivo
  async function abrirDocumento(i) {
    const f = visibles[i];
    if (!f) return;

    // Un borrador no se mira, se termina: picarle abre el editor donde
    // se quedó, con sus firmantes y sus firmas ya colocadas. Solo los
    // nuestros: uno traído del panel de weetrust no tiene archivo aquí
    // ni sabemos dónde puso las firmas.
    if (f.estado === 'borrador' && f.archivo_ruta) return retomarBorrador(f);

    // Primero la copia de weetrust: la de ellos va cambiando conforme la
    // gente firma, así que en un documento a medias ya trae dibujadas las
    // firmas que llevan. La nuestra es la que se subió y nunca cambia.
    //
    // Se pide al momento en vez de usar la guardada porque su URL viene
    // firmada y con caducidad: una de ayer ya no abre.
    // El cuadro se abre de inmediato, antes de cualquier espera. Todo lo
    // que sigue tarda (preguntarle a weetrust, bajar el PDF, dibujarlo),
    // y hasta ahora la pantalla se quedaba muerta sin decir nada: uno le
    // picaba al renglón y no pasaba nada durante varios segundos.
    $('doc-titulo').textContent = nombreDoc(f);
    $('doc-lado').innerHTML = '';
    $('doc-acciones').innerHTML = '';
    $('doc-cuerpo').innerHTML =
      '<div class="editor-cargando"><div class="kw-loader"></div>' +
      '<span>Abriendo el documento...</span></div>';
    $('modal-doc').style.display = 'flex';

    // Tres intentos, en orden de qué tan buena es cada copia:
    //
    //   1. La que weetrust tiene ahora. Va cambiando conforme la gente
    //      firma, así que trae las firmas ya dibujadas.
    //   2. La última que nos dieron y guardamos. Sirve de red cuando no
    //      se les puede preguntar en el momento.
    //   3. La nuestra, la que se subió. Nunca cambia, así que no trae
    //      ninguna firma, pero es mejor que no enseñar nada.
    //
    // La segunda es la que faltaba: sin ella, un documento traído de su
    // panel (que no tiene copia nuestra) se quedaba en blanco en cuanto
    // la consulta en vivo fallaba.
    let url = null;
    let conFirmas = false;

    if (f.weetrust_document_id) {
      try {
        const r = await llamarFuncion({ accion: 'url_documento', id: f.id });
        url = r.url || null;
        conFirmas = !!url;
      } catch {
        // Se sigue con las otras.
      }
    }

    if (!url && f.pdf_firmado_url) {
      url = f.pdf_firmado_url;
      conFirmas = true;
    }

    // Nuestra copia, la que se subió. Una URL firmada de una hora: el
    // bucket es privado y no se puede enseñar de otra forma sin abrirlo a
    // todo el mundo.
    let urlNuestra = null;
    if (f.archivo_ruta) {
      const { data } = await window.kwSupabase
        .storage.from('firmas').createSignedUrl(f.archivo_ruta, 3600);
      urlNuestra = data?.signedUrl || null;
    }
    if (!url) url = urlNuestra;

    // ── Cuál se dibuja y cuál se descarga ──
    // No tienen por qué ser la misma.
    //
    // Para descargar, la de weetrust: es la copia buena, la que trae las
    // firmas selladas.
    //
    // Para dibujar en pantalla, mientras el documento no esté completo,
    // la nuestra. El archivo de weetrust lo sirve su almacenamiento, que
    // no nos deja leerlo desde el navegador (no manda los permisos de
    // origen cruzado que hacen falta), así que al intentar bajarlo para
    // dibujarlo tronaba y se caía al visor del navegador: un PDF pelón,
    // sin los recuadros de firma encima. En un documento completado eso
    // no se notaba, porque ahí las firmas ya vienen dibujadas dentro del
    // archivo; en uno a medias se notaba justo lo que se venía a ver.
    //
    // La nuestra es la misma paginación contra la que se calcularon las
    // coordenadas, y Supabase sí deja leerla, así que los recuadros
    // vuelven a poder pintarse encima.
    const completado = f.estado === 'completado';
    const urlVista = (!completado && urlNuestra) ? urlNuestra : url;

    // Al lado del documento, quién ya firmó. Es lo que uno quiere saber
    // al abrir un contrato a medias, y ahorra tener que cerrar y abrir
    // el estatus por separado.
    const firmantes = Array.isArray(f.firmantes) ? f.firmantes : [];
    const yaFirmaron = firmantes.filter((x) => x.firmado).length;
    const faltan = firmantes.length - yaFirmaron;

    $('doc-lado').innerHTML = firmantes.length
      ? '<div class="doc-lado-tit">' +
          (faltan ? 'Firmas pendientes ' + faltan + '/' + firmantes.length
                  : 'Firmado por los ' + firmantes.length) +
        '</div>' +
        firmantes.map((x) => {
          // La liga solo mientras esa persona no haya firmado: pasársela
          // a quien ya firmó lo manda a un documento donde no puede
          // hacer nada.
          const caducada = x.url_expira && Number(x.url_expira) < Date.now();
          const abajo = x.firmado
            ? '<span class="doc-firmo">Ya firmó' +
                (x.firmado_at ? ' · ' + fecha(x.firmado_at) : '') + '</span>'
            : (x.url_firma && !caducada
                ? '<button type="button" class="firma-liga" data-liga="' + escapar(x.url_firma) + '">' +
                    '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                      '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/>' +
                      '<path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19"/>' +
                    '</svg>URL de firma</button>' +
                  (x.url_expira ? '<span class="det-expira">Expira: ' + fecha(Number(x.url_expira)) + '</span>' : '')
                : (caducada ? '<span class="det-expira">Liga vencida</span>' : ''));

          return '<div class="doc-firmante">' +
            '<span class="det-punto' + (x.firmado ? ' ok' : '') + '">' +
              (x.firmado
                ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
                : '') +
            '</span>' +
            '<span class="det-datos">' +
              '<span class="det-nom">' + escapar(x.nombre) + '</span>' +
              '<span class="det-mail">' + escapar(x.correo) + '</span>' +
              abajo +
            '</span>' +
          '</div>';
        }).join('')
      : '';

    // Un solo botón, y que descargue de verdad. Un enlace con "download"
    // apuntando a otro dominio lo ignoran los navegadores y abren la
    // pestaña igual, así que el archivo se baja aquí y se entrega ya
    // bajado.
    $('doc-acciones').innerHTML = url
      ? '<button type="button" class="kw-fila-btn" id="doc-bajar">' +
          (conFirmas && !faltan ? 'Descargar firmado' : 'Descargar') + '</button>'
      : '';

    if (url) {
      $('doc-bajar').addEventListener('click', async () => {
        const b = $('doc-bajar');
        const txt = b.textContent;
        b.disabled = true;
        b.textContent = 'Bajando...';
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('no se pudo');
          const blob = await res.blob();
          const tmp = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = tmp;
          a.download = (f.nombre_archivo || f.titulo || 'documento').replace(/\.pdf$/i, '') + '.pdf';
          document.body.appendChild(a);
          a.click();
          a.remove();
          // Se libera después de un momento: revocarlo de inmediato deja
          // la descarga a medias en algunos navegadores.
          setTimeout(() => URL.revokeObjectURL(tmp), 4000);
        } catch {
          // Si el servidor de weetrust no deja bajarlo desde aquí, al
          // menos se abre: bajarlo a mano es peor que no poder.
          window.open(url, '_blank', 'noopener');
        } finally {
          b.disabled = false;
          b.textContent = txt;
        }
      });

      cablearAcciones($('doc-lado'));
    }

    if (!url) {
      $('doc-cuerpo').innerHTML = '<div class="kw-vacio">No se pudo traer el archivo de weetrust en este momento. '
        + 'Vuelve a intentarlo en un rato.</div>';
      return;
    }

    // Se dibuja con pdf.js, no con un <iframe>. El iframe abre el visor
    // del navegador, que trae su propia barra de herramientas encima y
    // no enseña nada hasta que termina de bajar el archivo entero. Aquí
    // la primera página aparece en cuanto está lista, que en un contrato
    // de catorce hojas es la diferencia entre esperar y no esperar.
    $('doc-cuerpo').innerHTML =
      '<div class="editor-cargando"><div class="kw-loader"></div><span>Preparando las hojas...</span></div>' +
      '<div id="doc-paginas"></div>';

    // Bajar y dibujar el PDF va en su propio try: es lo único que puede
    // fallar por algo de afuera (el archivo no se deja leer, la librería
    // no cargó), y es lo único que justifica caer al visor del navegador.
    // Pintar los recuadros, que viene después, es cuenta nuestra: si
    // estuviera aquí dentro, un descuido pintando una marca tiraría
    // también el documento ya dibujado y se vería exactamente igual que
    // no poder abrirlo, sin manera de distinguir un problema del otro.
    let hojas;
    try {
      await cargarLibs();
      const res = await fetch(urlVista);
      if (!res.ok) throw new Error('no se pudo bajar');
      const bytes = new Uint8Array(await res.arrayBuffer());
      hojas = await dibujarEn(bytes, $('doc-paginas'), $('doc-cuerpo'));
      $('doc-cuerpo').querySelector('.editor-cargando')?.remove();
    } catch {
      // Si el archivo no se deja leer desde aquí, al menos se abre en el
      // visor del navegador. Ahí ya no se pueden pintar los recuadros
      // encima, así que se dice: mejor eso que dejar creer que el
      // documento no tiene ninguna firma colocada.
      $('doc-cuerpo').innerHTML =
        ((f.posiciones || []).length
          ? '<div class="kw-nota">Este documento se está viendo con el visor del navegador, '
            + 'así que no se pueden dibujar encima los recuadros de firma.</div>'
          : '') +
        '<iframe class="doc-visor" src="' + escapar(urlVista) + '"></iframe>';
      return;
    }

    // Encima, dónde va la firma de cada quien. Sin esto la vista previa
    // es el PDF pelón y no se ve si el recuadro quedó sobre la rayita,
    // que es justo lo que uno viene a revisar.
    //
    // Las que faltan llevan su recuadro de color. Las que ya se firmaron
    // llevan el mismo recuadro pero en verde, con el nombre y "Firmado"
    // adentro: weetrust solo entrega el trazo dibujado en el documento
    // completo (su api regresa vacío el campo de la firma suelta mientras
    // falte alguien), así que hasta entonces no hay un trazo real que
    // mostrar y el recuadro verde es lo más honesto.
    (f.posiciones || []).forEach((pz) => {
      const pag = hojas[pz.pagina - 1];
      if (!pag) return;
      const quien = (Array.isArray(f.firmantes) ? f.firmantes : [])
        .find((x) => String(x.correo).toLowerCase() === String(pz.correo).toLowerCase());

      const el = document.createElement('div');
      el.style.position = 'absolute';
      el.style.left = ((pz.x / pz.pagAncho) * 100) + '%';
      el.style.top = ((pz.y / pz.pagAlto) * 100) + '%';
      el.style.width = ((pz.ancho / pz.pagAncho) * 100) + '%';
      el.style.height = ((pz.alto / pz.pagAlto) * 100) + '%';

      if (quien && quien.firmado && quien.imagen) {
        el.className = 'firma-trazo';
        el.innerHTML = '<img src="' + escapar(quien.imagen) + '" alt="Firma de ' +
          escapar(quien.nombre || quien.correo) + '">';
      } else if (quien && quien.firmado) {
        // Firmó, pero no tenemos su trazo: el mismo recuadro de siempre,
        // ya no del color que se eligió al colocarlo sino en verde, con
        // su nombre y la palabra "Firmado" adentro, más la palomita en la
        // esquina para distinguirlo de un vistazo.
        el.className = 'marca-firma vista firmada';
        el.innerHTML = '<span class="marca-rotulo">' +
          escapar(quien.nombre || quien.correo) + ' · Firmado</span>' +
          '<span class="firma-hecha-check" title="Firmado por ' +
          escapar(quien.nombre || quien.correo) + '">' +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
          '</span>';
      } else {
        el.className = 'marca-firma vista';
        el.style.setProperty('--marca-color', pz.color || '#FFD247');
        el.innerHTML = '<span class="marca-rotulo">' +
          escapar(quien ? (quien.nombre || quien.correo) : pz.correo) + '</span>';
      }
      pag.capa.appendChild(el);
    });
  }



  // ── Retomar un borrador ─────────────────────────────────────
  // Reconstruye el editor tal como se dejó: el PDF que se había subido,
  // los firmantes capturados y los recuadros de firma en su lugar.
  async function retomarBorrador(f) {
    mostrarVista('editor');
    $('editor-cargando').style.display = 'flex';
    $('paginas').innerHTML = '';
    aviso('', '');

    borradorId = f.id;
    rutaSubida = f.archivo_ruta;
    // No se juntaron archivos: se está retomando uno ya unido. La lista
    // se deja vacía y el nombre del guardado es el que manda.
    archivos = [];
    marcas = [];
    paginas = [];
    desarmar();

    $('titulo').value = f.titulo || '';
    $('editor-nombre').textContent = f.nombre_archivo || 'Borrador guardado';

    // Los firmantes, como se dejaron. La pregunta de "¿yo también
    // firmo?" no aplica: eso ya se contestó cuando se armó.
    $('firmantes').innerHTML = '';
    $('pregunta-firmo').style.display = 'none';
    const guardados = Array.isArray(f.firmantes) ? f.firmantes : [];
    if (guardados.length) {
      guardados.forEach((x) => agregarFirmante(x.nombre || '', x.correo || ''));
      // Las verificaciones que traía cada uno.
      const filas = $('firmantes').querySelectorAll('.firmante-fila');
      guardados.forEach((x, n) => {
        const fila = filas[n];
        if (!fila) return;
        if (x.identificacion) {
          const b = fila.querySelector('[data-verif="' + x.identificacion + '"]');
          if (b) b.classList.add('activo');
        }
        if (x.check) {
          const b = fila.querySelector('[data-verif="check"]');
          if (b) b.classList.add('activo');
        }
      });
    } else {
      agregarFirmante('', '');
    }
    marcarUnico();
    marcarFrecuentesPuestos();

    try {
      // El PDF se baja del bucket. Es el mismo que se subió al guardar,
      // así que la paginación coincide con las coordenadas guardadas.
      const { data: firmada, error } = await window.kwSupabase
        .storage.from('firmas').createSignedUrl(f.archivo_ruta, 3600);
      if (error || !firmada?.signedUrl) throw new Error('No se pudo leer el archivo guardado.');

      const res = await fetch(firmada.signedUrl);
      if (!res.ok) throw new Error('No se pudo bajar el archivo guardado.');
      pdfUnido = new Uint8Array(await res.arrayBuffer());

      await cargarLibs();
      await pintarDocumento(pdfUnido);
      $('editor-cargando').style.display = 'none';

      // Y de vuelta los recuadros. Se guardaron en puntos del PDF; aquí
      // se convierten otra vez a porcentaje de la página, que es como
      // los maneja el editor para que aguanten el zoom.
      const filas = Array.from($('firmantes').querySelectorAll('.firmante-fila'));
      marcas = (f.posiciones || []).map((p) => {
        const pag = paginas[p.pagina - 1];
        if (!pag) return null;
        // Se vuelve a casar con su renglón por correo: es lo único que
        // no cambia entre guardar y retomar.
        const fila = filas.find((x) =>
          x.querySelector('.firmante-mail').value.trim().toLowerCase() === String(p.correo).toLowerCase());
        if (!fila) return null;
        return {
          id: crypto.randomUUID(),
          fila,
          nombre: fila.querySelector('.firmante-nom').value.trim() || p.correo,
          correo: String(p.correo).toLowerCase(),
          pagina: p.pagina,
          x: (p.x / p.pagAncho) * 100,
          y: (p.y / p.pagAlto) * 100,
          anchoPct: (p.ancho / p.pagAncho) * 100,
          altoPct: (p.alto / p.pagAlto) * 100,
          color: p.color || COLORES[0],
        };
      }).filter(Boolean);
      pintarMarcas();
    } catch (e) {
      $('editor-cargando').style.display = 'none';
      aviso(e.message || 'No se pudo abrir el borrador.', 'error');
    }
  }

  // ── Los dos menús de cada renglón ───────────────────────────
  // Están separados a propósito. El de los tres puntos hace cosas que
  // salen del sitio (le vuelve a llegar un correo a un cliente, se
  // retira un documento); el del lápiz solo ordena lo nuestro (de quién
  // es, cómo está etiquetado). Mezclarlos deja "reenviar a los
  // firmantes" pegado a "cambiar color de etiqueta", y ahí es fácil
  // picarle al que no era.

  let flotante = null;
  // Qué etiqueta tiene abierto su panel de color y borrado. Vive fuera
  // del menú para que sobreviva a que la lista se vuelva a pintar.
  let tagAbierta = null;

  // Qué botón abrió el menú que está abierto. Sirve para que volver a
  // picarle lo cierre en vez de cerrarlo y abrirlo otra vez, que desde
  // fuera se ve como que el botón no hace nada.
  let botonAbierto = null;

  function cerrarFlotante() {
    if (flotante) { flotante.remove(); flotante = null; }
    botonAbierto = null;
    tagAbierta = null;
  }

  // Lo coloca pegado al botón, y si no cabe hacia abajo lo sube: en un
  // renglón del final de la lista se saldría de la pantalla.
  function colocar(caja, boton, ancho) {
    const r = boton.getBoundingClientRect();
    const alto = caja.offsetHeight;
    const arriba = r.bottom + alto > window.innerHeight - 8;
    caja.style.top = (arriba ? Math.max(8, r.top - alto - 4) : r.bottom + 4) + 'px';
    caja.style.left = Math.max(8, Math.min(r.right - ancho, window.innerWidth - ancho - 8)) + 'px';
  }

  function abrirFlotante(boton, ancho, html) {
    // Si ya estaba abierto por este mismo botón, se cierra y ya.
    if (botonAbierto === boton) { cerrarFlotante(); return null; }

    cerrarFlotante();
    botonAbierto = boton;
    const caja = document.createElement('div');
    caja.className = 'env-menu';
    caja.style.width = ancho + 'px';
    caja.innerHTML = html;
    document.body.appendChild(caja);
    flotante = caja;
    colocar(caja, boton, ancho);
    caja.addEventListener('click', (e) => e.stopPropagation());
    return caja;
  }

  document.addEventListener('click', cerrarFlotante);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarFlotante(); });
  // Van pegados a la pantalla y no al renglón: si algo se mueve debajo
  // se quedarían flotando en el lugar equivocado.
  // Solo cuando se mueve algo de FUERA del menú. Con la captura pelada,
  // rodar la rueda dentro del propio menú lo cerraba, así que la lista
  // de asesores y la de etiquetas no se podían recorrer.
  window.addEventListener('scroll', (e) => {
    if (flotante && e.target instanceof Node && flotante.contains(e.target)) return;
    cerrarFlotante();
  }, true);

  // ── Tres puntos: acciones sobre el envío ──
  function abrirMenu(boton, i) {
    const f = visibles[i];
    if (!f) return;

    // Reenviar y recordar solo tienen sentido mientras alguien deba
    // firmar. En un completado no hay a quién insistirle.
    const enCurso = f.estado === 'pendiente';
    const puedeBorrar = f.estado !== 'completado';

    const caja = abrirFlotante(boton, 220,
      (enCurso
        ? '<button type="button" class="env-menu-op" data-accion="reenviar">' +
            '<span>Reenviar el correo</span></button>'
        : '') +
      (enCurso && puedeBorrar ? '<div class="env-menu-sep"></div>' : '') +
      (puedeBorrar
        ? '<button type="button" class="env-menu-op peligro" data-accion="borrar">' +
            '<span>Eliminar</span></button>'
        : '') +
      (!enCurso && !puedeBorrar
        ? '<div class="env-menu-nada">Un documento ya firmado no se puede cambiar.</div>'
        : ''));
    // Vino null: era el mismo botón y lo que se hizo fue cerrarlo.
    if (!caja) return;

    caja.querySelectorAll('[data-accion]').forEach((b) => {
      b.addEventListener('click', async () => {
        const accion = b.dataset.accion;
        cerrarFlotante();

        if (accion === 'borrar' && !confirm('¿Eliminar "' + nombreDoc(f) + '" del historial?\n\n'
          + 'Se intenta retirar también de weetrust. Esto no se puede deshacer.')) return;

        try {
          const r = await llamarFuncion({ accion, id: f.id });
          if (r.aviso) alert(r.aviso);
          await Promise.all([cargarEnvios(), cargarCupo()]);
        } catch (e) {
          alert(e.message || 'No se pudo completar la acción.');
        }
      });
    });
  }

  // ── Lápiz: asesor y etiquetas ──
  function abrirEditar(boton, i) {
    const f = visibles[i];
    if (!f) return;

    const caja = abrirFlotante(boton, 290,
      (veTodo
        ? '<div class="env-menu-titulo">Asesor</div>' +
          '<div class="env-menu-busca">' +
            '<input type="text" id="bus-asesor" placeholder="Buscar asesor" autocomplete="off">' +
          '</div>' +
          '<div id="lista-asesores"></div>' +
          '<div class="env-menu-sep"></div>'
        : '') +
      '<div class="env-menu-titulo">Etiquetas</div>' +
      '<div class="env-menu-busca">' +
        '<input type="text" id="bus-etiqueta" placeholder="Buscar o crear etiqueta" maxlength="40" autocomplete="off">' +
      '</div>' +
      '<div id="lista-etiquetas"></div>');
    if (!caja) return;

    // ── Asesores ──
    // Solo cuatro a la vez: la lista completa dentro de un menú flotante
    // obliga a recorrerla y tapa media pantalla. Para llegar al que no
    // se ve, se escribe.
    function pintarAsesores(busca) {
      const q = (busca || '').trim().toLowerCase();
      const hallados = asesores
        .filter((a) => !q || String(a.nombre || a.email).toLowerCase().includes(q))
        .slice(0, 4);

      $('lista-asesores').innerHTML =
        '<button type="button" class="env-menu-op' + (!f.user_id ? ' elegida' : '') + '" data-asesor="">' +
          '<span>Sin identificar</span></button>' +
        hallados.map((a) =>
          '<button type="button" class="env-menu-op' + (f.user_id === a.id ? ' elegida' : '') + '"' +
            ' data-asesor="' + a.id + '"><span>' + escapar(a.nombre || a.email) + '</span></button>').join('') +
        (!hallados.length && q ? '<div class="env-menu-nada">Nadie con ese nombre</div>' : '');

      $('lista-asesores').querySelectorAll('[data-asesor]').forEach((b) => {
        b.addEventListener('click', async () => {
          cerrarFlotante();
          const { error } = await window.kwSupabase.rpc('firmas_asignar_asesor', {
            p_documento: f.id, p_asesor: b.dataset.asesor || null,
          });
          if (error) return alert('No se pudo cambiar el asesor: ' + error.message);
          await cargarEnvios();
        });
      });
    }

    if (veTodo) {
      pintarAsesores('');
      $('bus-asesor').addEventListener('input', (e) => pintarAsesores(e.target.value));
    }

    // ── Etiquetas ──
    const puestas = new Set(f.etiquetas || []);

    async function ponerEtiquetas(ids) {
      const { error } = await window.kwSupabase.rpc('firmas_etiquetar', {
        p_documento: f.id, p_etiquetas: ids,
      });
      if (error) { alert('No se pudo etiquetar: ' + error.message); return false; }
      return true;
    }

    function pintarEtiquetas(busca) {
      const q = (busca || '').trim();
      const ql = q.toLowerCase();
      const hallados = etiquetas
        .filter((e) => !ql || e.nombre.toLowerCase().includes(ql))
        .slice(0, 4);

      // Si lo que se escribió no existe todavía, se ofrece crearlo desde
      // ahí mismo: es el momento en que uno se da cuenta de que le falta
      // una etiqueta, y mandarlo a otra pantalla a crearla rompe el hilo.
      const exacta = etiquetas.some((e) => e.nombre.toLowerCase() === ql);
      const crear = (q && !exacta)
        ? '<button type="button" class="env-menu-op crear" data-crear="1">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
            '<span>Crear "' + escapar(q) + '"</span></button>' +
          '<div class="env-menu-colores" id="colores-nueva">' +
            COLORES_TAG.map((c, n) =>
              '<button type="button" class="tag-color' + (n === 0 ? ' elegido' : '') + '"' +
                ' data-color="' + c + '" style="background:' + c + '"></button>').join('') +
          '</div>'
        : '';

      $('lista-etiquetas').innerHTML = crear + hallados.map((e) =>
        '<div class="env-menu-fila">' +
          '<button type="button" class="env-menu-op' + (puestas.has(e.id) ? ' elegida' : '') + '"' +
            ' data-etiqueta="' + e.id + '">' +
            '<i style="background:' + escapar(e.color) + '"></i><span>' + escapar(e.nombre) + '</span>' +
          '</button>' +
          '<button type="button" class="tag-menu-btn' + (tagAbierta === e.id ? ' abierto' : '') + '"' +
            ' data-tagmenu="' + e.id + '" aria-label="Opciones de la etiqueta">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">' +
              '<circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>' +
            '</svg>' +
          '</button>' +
        '</div>' +
        (tagAbierta === e.id
          ? '<div class="tag-panel">' +
              '<div class="env-menu-colores">' +
                COLORES_TAG.map((c) =>
                  '<button type="button" class="tag-color' + (c === e.color ? ' elegido' : '') + '"' +
                    ' data-recolor="' + e.id + '" data-color="' + c + '" style="background:' + c + '"></button>').join('') +
              '</div>' +
              '<button type="button" class="env-menu-op peligro" data-borrar-tag="' + e.id + '">' +
                '<span>Borrar etiqueta</span></button>' +
            '</div>'
          : '')).join('') +
        (!hallados.length && !q ? '<div class="env-menu-nada">Todavía no hay etiquetas. Escribe una para crearla.</div>' : '');

      // Poner o quitar. Se manda la lista completa como debe quedar y no
      // "agrega esta": así dos clics seguidos no dejan la etiqueta
      // repetida ni dependen del orden en que lleguen.
      $('lista-etiquetas').querySelectorAll('[data-etiqueta]').forEach((b) => {
        b.addEventListener('click', async () => {
          const id = b.dataset.etiqueta;
          const nuevas = puestas.has(id)
            ? [...puestas].filter((x) => x !== id)
            : [...puestas, id];
          cerrarFlotante();
          if (await ponerEtiquetas(nuevas)) await cargarEnvios();
        });
      });

      // El color elegido para la etiqueta nueva.
      const paleta = $('colores-nueva');
      if (paleta) {
        paleta.querySelectorAll('[data-color]').forEach((b) => {
          b.addEventListener('click', () => {
            paleta.querySelectorAll('[data-color]').forEach((x) => x.classList.remove('elegido'));
            b.classList.add('elegido');
          });
        });
      }

      $('lista-etiquetas').querySelectorAll('[data-recolor]').forEach((b) => {
        b.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          const { error } = await window.kwSupabase.rpc('firmas_actualizar_etiqueta', {
            p_etiqueta: b.dataset.recolor, p_nombre: null, p_color: b.dataset.color,
          });
          if (error) return alert('No se pudo cambiar el color: ' + error.message);
          await cargarEtiquetas();
          pintarOpcionesFiltros();
          // El panel se queda abierto: casi siempre se prueban dos o
          // tres colores antes de quedarse con uno.
          pintarEtiquetas($('bus-etiqueta').value);
          pintarEnvios();
        });
      });

      $('lista-etiquetas').querySelectorAll('[data-borrar-tag]').forEach((b) => {
        b.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          const et = etiquetas.find((x) => x.id === b.dataset.borrarTag);
          if (!confirm('¿Borrar la etiqueta "' + (et ? et.nombre : '') + '"?\n\n'
            + 'Se quita de todos los documentos que la tuvieran.')) return;
          const { error } = await window.kwSupabase.rpc('firmas_borrar_etiqueta', {
            p_etiqueta: b.dataset.borrarTag,
          });
          if (error) return alert('No se pudo borrar: ' + error.message);
          tagAbierta = null;
          await cargarEtiquetas();
          pintarOpcionesFiltros();
          pintarEtiquetas($('bus-etiqueta').value);
          await cargarEnvios();
        });
      });

      const btnCrear = $('lista-etiquetas').querySelector('[data-crear]');
      if (btnCrear) {
        btnCrear.addEventListener('click', async () => {
          const color = paleta?.querySelector('.elegido')?.dataset.color || COLORES_TAG[0];
          const { data, error } = await window.kwSupabase.rpc('firmas_crear_etiqueta', {
            p_nombre: q, p_color: color,
          });
          if (error) return alert('No se pudo crear la etiqueta: ' + error.message);
          cerrarFlotante();
          await cargarEtiquetas();
          pintarOpcionesFiltros();
          // Se le pone de una vez al documento desde el que se creó:
          // quien la crea ahí es porque la quiere en ese documento.
          if (await ponerEtiquetas([...puestas, data.id])) await cargarEnvios();
        });
      }

      // Cambiar color o borrar. Se despliega dentro del mismo panel, no
      // como otro menú flotante: el anterior se posicionaba desde el
      // botón que lo abrió, y como ese botón desaparecía al cerrar el
      // panel padre, acababa siempre en la esquina de arriba.
      $('lista-etiquetas').querySelectorAll('[data-tagmenu]').forEach((b) => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = b.dataset.tagmenu;
          tagAbierta = tagAbierta === id ? null : id;
          pintarEtiquetas($('bus-etiqueta').value);
        });
      });
    }

    pintarEtiquetas('');
    $('bus-etiqueta').addEventListener('input', (e) => pintarEtiquetas(e.target.value));
  }

  const COLORES_TAG = ['#6b7280', '#16a34a', '#2563eb', '#e0a218', '#c62027', '#7c3aed', '#0891b2', '#db2777'];

  // ── El detalle de un envío ──────────────────────────────────

  function abrirDetalle(i) {
    const f = visibles[i];
    if (!f) return;

    const firmantes = Array.isArray(f.firmantes) ? f.firmantes : [];
    const pill = PILL[f.estado] || PILL.pendiente;

    const quienes = firmantes.map((x) => {
      // La liga solo sirve mientras esa persona no haya firmado. Si ya
      // firmó, enseñarla invita a mandársela a alguien que se va a topar
      // con un documento donde ya no puede hacer nada.
      const caducada = x.url_expira && Number(x.url_expira) < Date.now();
      const derecha = x.firmado
        ? '<span class="det-firmo">Ya firmó' +
            (x.firmado_at ? '<span class="det-firmo-fecha">' + fecha(x.firmado_at) + '</span>' : '') +
          '</span>'
        : (x.url_firma && !caducada
            ? '<button type="button" class="firma-liga" data-liga="' + escapar(x.url_firma) + '">' +
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/>' +
                  '<path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19"/>' +
                '</svg>Copiar liga</button>' +
              (x.url_expira ? '<span class="det-expira">Expira: ' + fecha(Number(x.url_expira)) + '</span>' : '')
            : (caducada ? '<span class="det-expira">Liga vencida</span>' : ''));

      return '<div class="det-firmante">' +
        '<span class="det-punto' + (x.firmado ? ' ok' : '') + '">' +
          (x.firmado
            ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
            : '') +
        '</span>' +
        '<span class="det-datos">' +
          '<span class="det-nom">' + escapar(x.nombre) + '</span>' +
          '<span class="det-mail">' + escapar(x.correo) + '</span>' +
          (x.identificacion ? '<span class="firma-quien-verif">' + escapar(NOMBRE_VERIF[x.identificacion] || x.identificacion) + '</span>' : '') +
          (x.check ? '<span class="firma-quien-verif">background check</span>' : '') +
        '</span>' +
        '<span class="det-derecha">' + derecha + '</span>' +
      '</div>';
    }).join('');

    // Solo se puede cancelar lo que todavía no se firma del todo: los
    // completados weetrust los sella y ya no se tocan.
    const puedeCancelar = ['preparando', 'borrador', 'pendiente'].includes(f.estado);
    const acciones =
      (f.estado === 'completado' && f.pdf_firmado_url
        ? '<a class="kw-fila-btn" href="' + escapar(f.pdf_firmado_url) + '" target="_blank" rel="noopener">Descargar firmado</a>'
        : '') +
      (f.estado === 'pendiente'
        ? '<button type="button" class="kw-fila-btn" data-accion="consultar" data-id="' + f.id + '">Actualizar</button>'
        : '') +
      (puedeCancelar
        ? '<button type="button" class="kw-fila-btn" data-accion="cancelar" data-id="' + f.id + '">Cancelar</button>'
        : '');

    $('det-cuerpo').innerHTML =
      '<div class="det-encabezado">' +
        '<div class="det-meta">' +
          (veTodo && f.autor && f.autor.nombre
            ? '<div><b>Creado por:</b> ' + escapar(f.autor.nombre) + '</div>' : '') +
          '<div><b>Documento:</b> ' + escapar(nombreDoc(f)) + '</div>' +
          (f.weetrust_document_id
            ? '<div><b>ID:</b> <span class="det-id">' + escapar(f.weetrust_document_id) + '</span></div>' : '') +
          '<div><b>Fecha de envío:</b> ' + fecha(f.enviado_at || f.created_at) + '</div>' +
        '</div>' +
        '<span class="kw-pill ' + pill[0] + '">' + pill[1] + '</span>' +
      '</div>' +
      (f.error_mensaje ? '<div class="kw-nota">' + escapar(f.error_mensaje) + '</div>' : '') +
      '<div class="det-firmantes">' + (quienes || '<div class="env-vacio">Este documento no llegó a tener firmantes.</div>') + '</div>' +
      (acciones ? '<div class="det-acciones">' + acciones + '</div>' : '');

    cablearAcciones($('det-cuerpo'));
    $('modal-detalle').style.display = 'flex';
  }

  function cerrarDetalle() {
    $('modal-detalle').style.display = 'none';
  }

  function cerrarDoc() { $('modal-doc').style.display = 'none'; $('doc-cuerpo').innerHTML = ''; }
  $('doc-cerrar').addEventListener('click', cerrarDoc);
  $('modal-doc').addEventListener('click', (e) => { if (e.target === $('modal-doc')) cerrarDoc(); });

  $('det-cerrar').addEventListener('click', cerrarDetalle);
  $('modal-detalle').addEventListener('click', (e) => {
    // Solo cuando se pica el fondo, no cuando el clic viene de la
    // tarjeta: si no, arrastrar para seleccionar texto lo cierra.
    if (e.target === $('modal-detalle')) cerrarDetalle();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('modal-detalle').style.display === 'flex') cerrarDetalle();
    if ($('modal-doc').style.display === 'flex') cerrarDoc();
  });

  // Copiar liga, actualizar y cancelar. Vive aparte porque ahora estos
  // botones nacen dentro del modal y no en la lista.
  function cablearAcciones(raiz) {
    raiz.querySelectorAll('[data-liga]').forEach((b) => {
      b.addEventListener('click', async () => {
        const original = b.innerHTML;
        try {
          await navigator.clipboard.writeText(b.dataset.liga);
          b.textContent = 'Copiada';
        } catch {
          // navigator.clipboard no existe fuera de https ni en algunos
          // navegadores viejos. Ahí se enseña para copiar a mano, que es
          // peor pero deja seguir.
          window.prompt('Copia la liga de firma:', b.dataset.liga);
        }
        setTimeout(() => { b.innerHTML = original; }, 1600);
      });
    });

    raiz.querySelectorAll('[data-accion]').forEach((b) => {
      b.addEventListener('click', async () => {
        const accion = b.dataset.accion;
        if (accion === 'cancelar' && !confirm('¿Cancelar este envío? Se retira de weetrust y los firmantes ya no podrán firmarlo.')) return;

        const textoOriginal = b.textContent;
        b.disabled = true;
        b.textContent = accion === 'cancelar' ? 'Cancelando...' : 'Consultando...';
        try {
          await llamarFuncion({ accion: accion, id: b.dataset.id });
          cerrarDetalle();
          // Cancelar libera un lugar del tope, así que el contador
          // también se vuelve a calcular.
          await Promise.all([cargarEnvios(), cargarCupo()]);
        } catch (err) {
          alert(err.message || 'No se pudo completar la acción.');
          b.disabled = false;
          b.textContent = textoOriginal;
        }
      });
    });
  }

  // Los filtros del historial. 'todos' primero porque es lo que uno
  // quiere ver al entrar; los demás sirven para buscar algo concreto.
  // ── Filtros ─────────────────────────────────────────────────
  // Se traen todos los envíos de una sola vez y el filtrado y el orden
  // se hacen aquí. Así combinar cuatro filtros es instantáneo y no hay
  // que volver a preguntarle a la base por cada cambio.

  // Cómo ordenar. "Pendientes primero" y "completados primero" existen
  // porque son dos formas distintas de trabajar: una es perseguir lo que
  // falta, la otra es revisar lo que ya cerró.
  const ORDENES = {
    'fecha-desc': (a, b) => new Date(b.created_at) - new Date(a.created_at),
    'fecha-asc': (a, b) => new Date(a.created_at) - new Date(b.created_at),
    'asesor': (a, b) => {
      const na = (a.autor && a.autor.nombre) || 'zzz';
      const nb = (b.autor && b.autor.nombre) || 'zzz';
      // Dentro de cada asesor, lo más nuevo arriba.
      return na.localeCompare(nb) || new Date(b.created_at) - new Date(a.created_at);
    },
    'pendientes': (a, b) =>
      (a.estado === 'pendiente' ? 0 : 1) - (b.estado === 'pendiente' ? 0 : 1)
      || new Date(b.created_at) - new Date(a.created_at),
    'completados': (a, b) =>
      (a.estado === 'completado' ? 0 : 1) - (b.estado === 'completado' ? 0 : 1)
      || new Date(b.created_at) - new Date(a.created_at),
  };

  // kw-ui convierte cada <select> en su propio componente y lo marca
  // como listo, así que cambiarle las opciones después no se refleja: el
  // menú que se ve lo armó con las de antes. Para cambiarlas hay que
  // deshacer el envoltorio, quitarle la marca y dejar que lo vuelva a
  // armar.
  function rehacerSelect(id, html, valor) {
    const sel = $(id);
    const caja = sel.closest('.kw-select');
    sel.innerHTML = html;
    if (valor != null) sel.value = valor;
    if (caja) {
      caja.parentNode.insertBefore(sel, caja);
      caja.remove();
    }
    delete sel.dataset.kwListo;
    if (window.kwUI) window.kwUI.selects(sel.parentNode);
  }

  function pintarOpcionesFiltros() {
    // Quién falta de firmar, armado con los firmantes frecuentes: son
    // los que se repiten en todos los contratos y por eso vale la pena
    // preguntarlo con un clic.
    if (frecuentes.length >= 2) {
      const a = frecuentes[0], b = frecuentes[1];
      rehacerSelect('f-falta',
        '<option value="">Firmas de cualquiera</option>' +
        '<option value="' + escapar(a.correo) + '">Sin firma de ' + escapar(a.puesto || a.nombre.split(' ')[0]) + '</option>' +
        '<option value="' + escapar(b.correo) + '">Sin firma de ' + escapar(b.puesto || b.nombre.split(' ')[0]) + '</option>' +
        '<option value="__ambos__">Falta firma de ambos</option>', faltaFirma || '');
      $('w-falta').style.display = '';
    } else {
      $('w-falta').style.display = 'none';
    }

    // Las etiquetas que de verdad existen. Sin ninguna creada el
    // desplegable se esconde en vez de quedarse vacío.
    if (etiquetas.length) {
      rehacerSelect('f-etiqueta',
        '<option value="">Todas las etiquetas</option>' +
        etiquetas.map((e) =>
          '<option value="' + e.id + '">' + escapar(e.nombre) + '</option>').join(''), etiqueta || '');
      $('w-etiqueta').style.display = '';
    } else {
      $('w-etiqueta').style.display = 'none';
    }
  }

  function armarFiltros() {
    $('f-estado').addEventListener('change', (e) => { filtro = e.target.value; pintarEnvios(); });
    $('f-falta').addEventListener('change', (e) => { faltaFirma = e.target.value || null; pintarEnvios(); });
    $('f-etiqueta').addEventListener('change', (e) => { etiqueta = e.target.value || null; pintarEnvios(); });
    $('f-orden').addEventListener('change', (e) => { orden = e.target.value; pintarEnvios(); });

    // La búsqueda es un campo de texto y no un desplegable porque con
    // cien asesores el desplegable no se puede recorrer. Se filtra
    // mientras se escribe, por asesor o por nombre del documento.
    $('f-buscar').addEventListener('input', (e) => {
      buscaAsesor = e.target.value.trim().toLowerCase();
      pintarEnvios();
    });

    // El checkbox de "todos" vive pegado arriba de la tabla, fuera de lo
    // que pintarEnvios() vuelve a dibujar en cada filtrada, así que su
    // manejador se pone una sola vez aquí. Usa "visibles" (lo último que
    // se pintó) y no la lista completa: marcar "todos" con un filtro
    // puesto no debería alcanzar a lo que el filtro está escondiendo.
    const todos = $('elegir-todos');
    todos.addEventListener('click', (e) => e.stopPropagation());
    todos.addEventListener('change', () => {
      visibles.forEach((x) => {
        if (todos.checked) elegidos.add(x.id);
        else elegidos.delete(x.id);
      });
      pintarEnvios();
    });
  }

  function envíosFiltrados() {
    const lista = envios.filter((e) => {
      if (filtro !== 'todos' && e.estado !== filtro) return false;

      if (buscaAsesor) {
        const nombreAsesor = ((e.autor && e.autor.nombre) || '').toLowerCase();
        // "sin" encuentra los que no se pudieron atribuir a nadie, que
        // son justo los que hay que repartir.
        const coincideAsesor = nombreAsesor
          ? nombreAsesor.includes(buscaAsesor)
          : 'sin identificar'.includes(buscaAsesor);
        const coincideDoc = nombreDoc(e).toLowerCase().includes(buscaAsesor);
        if (!coincideAsesor && !coincideDoc) return false;
      }

      if (etiqueta && !(e.etiquetas || []).includes(etiqueta)) return false;

      if (faltaFirma) {
        const firmantes = Array.isArray(e.firmantes) ? e.firmantes : [];
        const faltaDe = (correo) => {
          const suyo = firmantes.find((x) => String(x.correo).toLowerCase() === correo);
          // Tiene que estar invitado Y no haber firmado: un documento
          // donde esa persona ni participa no es uno al que le "falte"
          // su firma.
          return !!suyo && !suyo.firmado;
        };
        if (faltaFirma === '__ambos__') {
          if (frecuentes.length < 2) return false;
          if (!faltaDe(frecuentes[0].correo) || !faltaDe(frecuentes[1].correo)) return false;
        } else if (!faltaDe(faltaFirma)) return false;
      }
      return true;
    });

    return lista.sort(ORDENES[orden] || ORDENES['fecha-desc']);
  }

  async function cargarEtiquetas() {
    const { data } = await window.kwSupabase
      .from('firmas_etiquetas').select('id, nombre, color').order('nombre');
    etiquetas = data || [];
  }

  // Solo para el liderazgo: es el único que puede reasignar, y traerse
  // la lista completa de usuarios para quien no la va a usar es gastar
  // una consulta en balde.
  async function cargarAsesores() {
    if (!veTodo) return;
    const { data } = await window.kwSupabase
      .from('profiles').select('id, nombre, email').order('nombre');
    asesores = data || [];
  }

  async function cargarEnvios() {
    // Quien es Staff o más ve los envíos de todo el equipo, así que en su
    // caso hay que traer también de quién es cada uno. Para el asesor esa
    // consulta extra no aporta nada: todos son suyos.
    const campos = 'id, titulo, estado, firmantes, posiciones, nombre_archivo, pdf_firmado_url, archivo_ruta, error_mensaje, created_at, enviado_at, weetrust_document_id, user_id, etiquetas'
      + (veTodo ? ', autor:profiles!firmas_documentos_user_id_fkey(nombre)' : '');

    const { data, error } = await window.kwSupabase
      .from('firmas_documentos')
      .select(campos)
      .order('created_at', { ascending: false })
      .limit(300);

    if (error) {
      $('lista-envios').innerHTML =
        '<div class="kw-vacio">No se pudieron cargar los envíos: ' + escapar(error.message) + '</div>';
      return;
    }
    envios = data || [];
    // Lo que ya no está (se borró, o cambió de estado y el filtro lo
    // esconde) deja de contar como seleccionado.
    const vivos = new Set(envios.map((x) => x.id));
    [...elegidos].forEach((id) => { if (!vivos.has(id)) elegidos.delete(id); });
    pintarEnvios();
  }


  // ── Arranque ────────────────────────────────────────────────

  // Enseña cuánto le queda del mes y, si ya se acabó, apaga el botón.
  // El freno de verdad está en la Edge Function; esto es para que nadie
  // llene el formulario completo para enterarse hasta el final.
  async function cargarCupo() {
    const caja = $('cupo');
    const { data, error } = await window.kwSupabase.rpc('firmas_disponibles', { p_user: miUserId });
    if (error || !data || data.sin_tope) { caja.style.display = 'none'; return; }

    const quedan = Number(data.restantes);
    caja.classList.toggle('agotado', quedan <= 0);
    caja.innerHTML = quedan > 0
      ? 'Te quedan <strong>' + quedan + '</strong> de ' + data.limite + ' documentos este mes.'
      : 'Ya usaste tus <strong>' + data.limite + '</strong> documentos de este mes. '
        + 'Pídele al equipo de liderazgo que te suba el tope si necesitas más.';
    caja.style.display = 'block';

    $('btn-enviar').disabled = quedan <= 0;
  }

  // Los que firman casi siempre, de un clic. Se apaga el botón del que
  // ya está puesto en vez de esconderlo, para que se vea que esa persona
  // ya quedó y no que la opción desapareció.
  function marcarFrecuentesPuestos() {
    const puestos = leerFirmantes().map((f) => f.correo.toLowerCase());
    $('frecuentes').querySelectorAll('.firma-frecuente').forEach((b) => {
      b.disabled = puestos.includes(b.dataset.correo);
    });
  }

  async function cargarFrecuentes() {
    const { data, error } = await window.kwSupabase
      .from('firmas_frecuentes')
      .select('nombre, correo, puesto')
      .eq('activo', true)
      .order('orden');

    if (error || !data || !data.length) return;
    frecuentes = data;

    const caja = $('frecuentes');
    caja.innerHTML = data.map((f) =>
      '<button type="button" class="firma-frecuente" data-correo="' + escapar(f.correo.toLowerCase()) + '"' +
        ' data-nombre="' + escapar(f.nombre) + '">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
        escapar(f.nombre) + (f.puesto ? ' (' + escapar(f.puesto) + ')' : '') +
      '</button>').join('');
    caja.style.display = 'flex';

    caja.querySelectorAll('.firma-frecuente').forEach((b) => {
      b.addEventListener('click', () => {
        // Si el primer renglón está vacío se aprovecha en vez de dejar
        // un hueco arriba del que se acaba de agregar.
        const vacia = Array.from($('firmantes').querySelectorAll('.firmante-fila')).find((f) =>
          !f.querySelector('.firmante-nom').value.trim() && !f.querySelector('.firmante-mail').value.trim());
        if (vacia) {
          vacia.querySelector('.firmante-nom').value = b.dataset.nombre;
          vacia.querySelector('.firmante-mail').value = b.dataset.correo;
        } else {
          agregarFirmante(b.dataset.nombre, b.dataset.correo);
        }
        marcarFrecuentesPuestos();
      });
    });
  }

  // ── Que la tabla se mantenga al día sola ────────────────────
  // Dos mecanismos, a propósito. Realtime avisa al instante cuando algo
  // cambia en la base (que es cuando llega un webhook de weetrust), pero
  // depende de una conexión abierta que se puede caer sin avisar: el
  // portátil se durmió, cambió el wifi, el navegador congeló la pestaña.
  // Por eso además se recarga al volver a la pestaña, que es justo
  // cuando la persona va a mirar y cuando más importa que esté al día.
  function escucharCambios() {
    window.kwSupabase
      .channel('firmas-en-vivo')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'firmas_documentos' },
        () => {
          // Solo se repinta si el historial está a la vista. Recargar
          // mientras alguien arma un envío no sirve de nada y le mueve
          // la pantalla debajo de las manos.
          if ($('vista-historial').style.display !== 'none') cargarEnvios();
        })
      .subscribe();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible'
        && $('vista-historial').style.display !== 'none') cargarEnvios();
    });
  }

  async function iniciar() {
    const { data: userData } = await window.kwSupabase.auth.getUser();
    if (!userData || !userData.user) return;
    miUserId = userData.user.id;

    const { data: perfil } = await window.kwSupabase
      .from('profiles').select('nombre, email, role').eq('id', miUserId).single();
    miPerfil = { nombre: perfil?.nombre || '', correo: perfil?.email || '' };

    // El liderazgo ve el historial de todo el equipo. Esto solo decide
    // qué se pide y cómo se pinta; quién puede ver qué lo resuelven las
    // políticas de la base, que es donde no se puede hacer trampa.
    veTodo = ['master', 'admin', 'staff'].includes(String(perfil?.role));
    // El botón de traer de weetrust ya no hace falta en el día a día: el
    // webhook crea solo los documentos que se mandan desde su panel. Se
    // queda escondido y solo aparece al abrir la pantalla con
    // ?importar=1, para cuando haya que forzar una resincronización.
    const pedido = new URLSearchParams(location.search).get('importar') === '1';
    if (pedido && ['master', 'admin'].includes(String(perfil?.role))) {
      $('btn-importar').style.display = 'inline-flex';
      $('btn-limpiar').style.display = 'inline-flex';
    }

    // Cada vez que alguien teclea puede coincidir (o dejar de coincidir)
    // con un frecuente, así que los botones se revisan al vuelo.
    $('firmantes').addEventListener('input', () => {
      marcarFrecuentesPuestos();
      // Los recuadros ya colocados llevan el nombre del firmante escrito
      // encima, así que se redibujan al corregirlo.
      if (marcas.length) pintarMarcas();
    });

    escucharCambios();
    // Los frecuentes primero: los botones de "falta la firma de" se
    // arman con ellos, así que pintar los filtros antes los dejaría sin
    // esa mitad.
    await cargarFrecuentes();
    armarFiltros();
    // Las etiquetas y los asesores antes de pintar la tabla: los
    // renglones enseñan los nombres y colores de las etiquetas, y sin el
    // catálogo saldrían en blanco hasta la siguiente recarga.
    await Promise.all([cargarEtiquetas(), cargarAsesores()]);
    pintarOpcionesFiltros();
    await Promise.all([cargarCupo(), cargarEnvios()]);
    marcarFrecuentesPuestos();
  }

  if (document.documentElement.classList.contains('kw-auth-ok')) {
    iniciar();
  } else {
    window.addEventListener('kw-auth-ready', iniciar, { once: true });
  }
})();
</script>
