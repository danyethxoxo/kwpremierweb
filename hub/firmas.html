<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Firmas Digitales</title>
<link rel="icon" type="image/png" href="/kwpremierweb/assets/img/favicon.png" />
<style>html:not(.kw-auth-ok) body { visibility: hidden; }</style>
<script>
  setTimeout(function () {
    if (!document.documentElement.classList.contains('kw-auth-ok')) {
      console.error('auth-guard.js no respondió a tiempo; redirigiendo al login por seguridad.');
      location.replace('/kwpremierweb/login.html');
    }
  }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/kwpremierweb/assets/js/auth-guard.js"></script>
<script src="/kwpremierweb/assets/js/notif-bell.js"></script>
<link rel="stylesheet" href="/kwpremierweb/assets/css/kw-base.css?v=20260817j">
<script src="/kwpremierweb/assets/js/kw-ui.js?v=20260817j"></script>
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* El título y la descripción van directo sobre el fondo guinda, no
     dentro de una tarjeta, así que necesitan su propio color claro:
     kw-page-titulo/kw-page-desc de kw-ui.css traen el oscuro de
     siempre, pensado para fondo gris. Igual que en el Panel de Admin. */
  .kw-page-titulo { color: #fff; }
  .kw-page-desc { color: rgba(255,255,255,0.72); }

  .header-right { display: flex; align-items: center; gap: 10px; }

  /* Este va DENTRO de la tarjeta blanca, así que se queda oscuro (en
     otras pantallas el mismo nombre de clase va en blanco porque ahí
     el título cuelga sobre el fondo). */
  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 14px; color: var(--text); }

  /* ── Cargar el archivo ──────────────────────────────────────
     El <input type="file"> del navegador se ve mal y no se puede
     maquillar, así que se esconde y se dibuja esta zona en su lugar.
     Sigue siendo un <label>, o sea que arrastrar y soltar, el teclado
     y los lectores de pantalla funcionan igual que siempre.

     "Esconder" no es display:none: varios navegadores móviles (el de
     WhatsApp/Instagram entre otros, y ciertas versiones de Safari)
     tratan un input con display:none como si no existiera y bloquean el
     diálogo de elegir archivo aunque el clic venga de su <label>. Esta
     es la técnica estándar para esconder visualmente sin quitarlo del
     todo: sigue "presente" para el navegador, solo que en un pixel. */
  .firma-input-real {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .firma-drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 26px 18px; text-align: center;
    border: 1.5px dashed rgba(0,0,0,0.16);
    border-radius: 14px;
    background: rgba(0,0,0,0.02);
    cursor: pointer;
    transition: border-color var(--t-medio), background var(--t-medio);
  }
  .firma-drop:hover, .firma-drop.encima { border-color: var(--red); background: rgba(198,32,39,0.04); }
  .firma-drop svg { color: var(--muted); }
  .firma-drop-txt { font-size: 13.5px; font-weight: 700; color: var(--text); }
  .firma-drop-sub { font-size: 12px; color: var(--muted); }
  .firma-drop.con-archivo { border-style: solid; border-color: rgba(0,0,0,0.14); }

  /* ── Firmantes ──────────────────────────────────────────────
     Cada renglón es nombre + correo + quitar. En celular se apilan,
     porque los dos campos lado a lado quedan impracticables. */
  .firmante-fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .firmante-fila .kw-input { margin: 0; }
  /* El nombre completo de una persona no cabe en un tercio del renglón:
     se queda con la misma mitad que el correo. */
  .firmante-nom { flex: 1 1 240px; min-width: 0; }
  .firmante-mail { flex: 1 1 240px; min-width: 0; }
  .firmante-quitar {
    flex: 0 0 auto; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(0,0,0,0.1); border-radius: 10px;
    background: rgba(255,255,255,0.6); color: var(--muted);
    cursor: pointer; transition: color var(--t-medio), border-color var(--t-medio);
  }
  .firmante-quitar:hover { color: var(--red); border-color: rgba(198,32,39,0.35); }
  /* Con un solo firmante no hay nada que quitar: el botón se va, en vez
     de quedarse apagado dando a entender que algo falta. */
  .firmante-fila.unico .firmante-quitar { display: none; }
  /* En celular los dos campos se apilan y el botón de quitar se va a la
     esquina, porque lado a lado quedan impracticables. Los iconos de
     verificación sí caben en su propio renglón. */
  @media (max-width: 560px) {
    .firmante-nom, .firmante-mail { flex: 1 1 100%; }
    .firmante-quitar { position: absolute; right: 0; top: 0; }
    .firmante-fila {
      position: relative; padding-right: 46px;
      padding-bottom: 12px; border-bottom: 1px solid rgba(0,0,0,0.07);
    }
    .firmante-fila:last-child { border-bottom: none; }
  }

  .firma-agregar {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; background: none; padding: 4px 0;
    font-family: inherit; font-size: 13px; font-weight: 700;
    color: var(--red); cursor: pointer;
  }

  /* Cuánto le queda del mes. Se enseña antes del formulario, no al
     apretar enviar: enterarte de que ya no te quedan después de llenar
     todo y subir el archivo es la peor manera de saberlo. */
  .firma-cupo {
    font-size: 12.5px; color: var(--muted);
    padding: 9px 12px; border-radius: 10px;
    background: rgba(0,0,0,0.03);
    margin-bottom: var(--sp-4);
  }
  .firma-cupo strong { color: var(--text); }
  .firma-cupo.agotado {
    background: rgba(198,32,39,0.07);
    border: 1px solid rgba(198,32,39,0.22);
    color: var(--text);
  }

  /* Los que firman casi todos los contratos: se agregan de un clic en
     vez de volver a teclear nombre y correo cada vez, que es donde se
     cuelan las direcciones mal escritas. */
  .firma-frecuentes { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .firma-frecuente {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.12);
    background: rgba(255,255,255,0.7);
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    color: var(--text); cursor: pointer;
    transition: border-color var(--t-medio), background var(--t-medio), color var(--t-medio);
  }
  .firma-frecuente:hover { border-color: var(--red); color: var(--red); }
  /* Ya agregado: se queda visible pero apagado, para que se entienda
     que esa persona ya está en la lista y no que el botón se perdió. */
  .firma-frecuente:disabled { opacity: 0.45; cursor: default; }
  .firma-frecuente:disabled:hover { border-color: rgba(0,0,0,0.12); color: var(--text); }

  /* ── Paso 1: la lista de archivos ───────────────────────────
     El orden importa: normalmente va el contrato y luego los anexos, y
     así es como se van a unir. Por eso cada renglón trae su número y
     los botones para subirlo o bajarlo. */
  .archivos-lista { display: flex; flex-direction: column; gap: 7px; margin-top: var(--sp-4); }
  .archivo-fila {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 11px; border-radius: 11px;
    border: 1px solid rgba(0,0,0,0.09);
    background: rgba(255,255,255,0.65);
  }
  .archivo-num {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--red); color: #fff;
    font-size: 11px; font-weight: 700;
  }
  .archivo-nom { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .archivo-peso { flex: 0 0 auto; font-size: 11.5px; color: var(--muted); }
  .archivo-btn {
    flex: 0 0 auto; width: 26px; height: 26px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(0,0,0,0.1); border-radius: 7px;
    background: #fff; color: var(--muted); cursor: pointer;
  }
  .archivo-btn:hover:not(:disabled) { color: var(--red); border-color: var(--red); }
  .archivo-btn:disabled { opacity: 0.3; cursor: default; }

  /* ── Paso 2: el editor ──────────────────────────────────────
     Documento a la izquierda, campos a la derecha. En pantallas
     angostas se apilan, con el documento arriba: la firma se coloca
     mirando la hoja, así que la hoja va primero. */
  .editor-barra {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: var(--sp-3);
  }
  .btn-volver-paso {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.12);
    font-family: inherit; font-size: 12.5px; font-weight: 700;
    color: #fff; cursor: pointer;
  }
  .btn-volver-paso:hover { background: rgba(255,255,255,0.2); }
  .editor-nombre { font-size: 12.5px; color: rgba(255,255,255,0.75); }

  .editor-split { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); gap: var(--sp-4); align-items: start; }
  @media (max-width: 900px) { .editor-split { grid-template-columns: 1fr; } }

  .editor-doc {
    position: relative;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: var(--r-tarjeta);
    padding: var(--sp-3);
    max-height: 78vh; overflow-y: auto;
  }
  .editor-cargando {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 40px 0; color: rgba(255,255,255,0.8); font-size: 13px;
  }

  .editor-campos {
    background: radial-gradient(62% 48% at 16% 98%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.34) 42%, rgba(255,255,255,0) 74%), linear-gradient(150deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.66) 100%);
    border: 1px solid rgba(255,255,255,0.82);
    border-radius: var(--r-tarjeta);
    padding: var(--sp-4);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow: var(--sombra-1), inset 0 1px 0 rgba(255,255,255,0.95);
  }

  /* Cada página del PDF, con su capa para los recuadros de firma
     encima. La capa se mide en porcentaje de la página y no en pixeles,
     así el recuadro se queda en su lugar aunque cambie el zoom o el
     ancho de la ventana. */
  .pagina-caja { position: relative; margin: 0 auto var(--sp-3); width: fit-content; }
  .pagina-caja canvas { display: block; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.35); }
  .pagina-capa { position: absolute; inset: 0; }
  .pagina-num {
    text-align: center; font-size: 11px; color: rgba(255,255,255,0.6);
    margin-top: 4px; margin-bottom: var(--sp-3);
  }
  /* Mientras se está colocando una firma, la hoja invita a picarle. */
  .editor-doc.colocando .pagina-capa { cursor: crosshair; background: rgba(255,255,255,0.06); }

  .marca-firma {
    position: absolute; box-sizing: border-box;
    border: 2px solid rgba(0,0,0,0.55); border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; font-weight: 700; color: rgba(0,0,0,0.75);
    text-align: center; line-height: 1.15; overflow: hidden;
    cursor: grab; user-select: none; padding: 2px;
  }
  .marca-firma:active { cursor: grabbing; }
  .marca-quitar {
    position: absolute; top: -8px; right: -8px;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: none; background: #c62027; color: #fff;
    font-size: 12px; line-height: 1; cursor: pointer; padding: 0;
  }

  /* El botón de fijar firma, dentro del renglón de cada firmante. */
  .firmante-fijar {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 0 11px; height: 34px; border-radius: 9px;
    border: 1.5px solid var(--border); background: #fff;
    font-family: inherit; font-size: 12px; font-weight: 700;
    color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .firmante-fijar:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  .firmante-fijar:disabled { opacity: 0.4; cursor: not-allowed; }
  .firmante-fijar.armado { border-color: var(--red); background: var(--red); color: #fff; }
  .firmante-fijar .cuenta {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
    background: rgba(0,0,0,0.12); font-size: 10px;
  }
  .firmante-fijar.armado .cuenta { background: rgba(255,255,255,0.3); }

  /* Los firmantes dentro de un envío ya mandado. */
  .firma-quien { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 13px; }
  .firma-quien-punto { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--muted); }
  .firma-quien-punto.ok { background: #16a34a; }
  .firma-quien-datos { flex: 1; min-width: 0; }
  .firma-quien-nom { font-weight: 700; }
  .firma-quien-mail { color: var(--muted); font-size: 12px; }
  .firma-quien-verif {
    display: inline-block; margin-left: 6px; padding: 1px 7px;
    border-radius: 999px; background: rgba(0,0,0,0.06);
    font-size: 10.5px; font-weight: 700; color: var(--muted);
  }

  /* La liga personal de firma. weetrust cobra su propio envío por
     WhatsApp; copiarla y mandarla uno mismo hace lo mismo sin costo. */
  .firma-liga {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.12);
    background: rgba(255,255,255,0.7);
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    color: var(--text); cursor: pointer; white-space: nowrap;
    transition: border-color var(--t-medio), color var(--t-medio);
  }
  .firma-liga:hover { border-color: var(--red); color: var(--red); }

  /* ── Verificación de identidad ──────────────────────────────
     Cuatro iconos en vez de un desplegable largo: el desplegable se
     comía el renglón entero para algo que casi siempre va apagado.
     Qué es cada uno se dice en su title, al pasar el cursor. */
  .firmante-verif { display: flex; gap: 5px; flex: 0 0 auto; }
  .verif-btn {
    width: 34px; height: 34px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--border); border-radius: 9px;
    background: #fff; color: var(--muted); cursor: pointer;
    transition: border-color var(--t-medio), color var(--t-medio), background var(--t-medio);
  }
  .verif-btn svg { width: 17px; height: 17px; }
  .verif-btn:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  .verif-btn.activo { border-color: var(--red); background: var(--red); color: #fff; }
  /* Background Check sin la facial prendida: weetrust no lo hace, así
     que se ve claramente fuera de alcance en vez de dejar prenderlo y
     que el envío truene cuando ya se llenó todo. */
  .verif-btn:disabled { opacity: 0.35; cursor: not-allowed; }
</style>
</head>
<body>

  <header class="kw-header">
    <span class="kw-header-title">Firmas Digitales</span>
    <div class="header-right">
      <div id="notif-bell-slot"></div>
      <a href="../portal.html" class="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        <span>Atrás</span>
      </a>
    </div>
  </header>

  <main class="kw-page">
    <div class="kw-page-encabezado">
      <h1 class="kw-page-titulo">Firmas Digitales</h1>
      <p class="kw-page-desc">Manda documentos a firma electrónica y sigue aquí quién ya firmó.</p>
    </div>

    <div class="kw-tabs" data-kw-tabs>
      <button class="kw-tab activo" data-tab="mandar">Mandar a firma</button>
      <button class="kw-tab" data-tab="envios">Mis envíos</button>
    </div>

    <div class="kw-tabpanels">

      <!-- ── Mandar a firma ──
           Dos pasos: primero se juntan y ordenan los archivos, luego se
           abre el editor con la vista previa a la izquierda y los
           firmantes a la derecha. El paso 1 existe porque un contrato
           casi nunca es un solo archivo: es el contrato más sus anexos,
           y el orden importa. -->
      <section class="kw-tabpanel" data-panel="mandar">

        <!-- Paso 1: los archivos -->
        <div class="kw-card" id="paso-archivos">
          <div id="cupo" class="firma-cupo" style="display:none;"></div>

          <input type="file" id="archivo" class="firma-input-real" multiple
            accept=".pdf,application/pdf">
          <label for="archivo" class="firma-drop" id="drop">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span class="firma-drop-txt" id="drop-txt">Elige los documentos o arrástralos aquí</span>
            <span class="firma-drop-sub" id="drop-sub">Puedes elegir varios PDF y se unen en uno solo</span>
          </label>

          <div id="lista-archivos" class="archivos-lista"></div>

          <div id="msg-archivos" class="msg" style="display:none;"></div>

          <button type="button" class="btn-guardar" id="btn-continuar" style="margin-top:var(--sp-4);display:none;">
            Continuar
          </button>
        </div>

        <!-- Paso 2: el editor -->
        <div id="paso-editor" style="display:none;">
          <div class="editor-barra">
            <button type="button" class="btn-volver-paso" id="btn-volver-archivos">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
              Cambiar documentos
            </button>
            <span class="editor-nombre" id="editor-nombre"></span>
          </div>

          <div class="editor-split">

            <!-- Vista previa -->
            <div class="editor-doc" id="editor-doc">
              <div class="editor-cargando" id="editor-cargando">
                <div class="kw-loader"></div>
                <span>Preparando el documento...</span>
              </div>
              <div id="paginas"></div>
            </div>

            <!-- Campos -->
            <div class="editor-campos">
              <form id="form-firma" autocomplete="off">
                <div class="field">
                  <label for="titulo">Título</label>
                  <input type="text" id="titulo" class="kw-input" placeholder="Ej. Contrato de arrendamiento, Av. Reforma 100" maxlength="120">
                </div>

                <div class="field">
                  <label for="mensaje">Mensaje <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
                  <input type="text" id="mensaje" class="kw-input" placeholder="Se le solicita la firma del siguiente documento." maxlength="200">
                </div>

                <h2 class="section-title" style="margin-top:var(--sp-4);">Quién firma</h2>
                <div id="frecuentes" class="firma-frecuentes" style="display:none;"></div>
                <div id="firmantes"></div>
                <button type="button" class="firma-agregar" id="btn-agregar">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Agregar otro firmante
                </button>

                <label style="display:flex;align-items:center;gap:9px;margin-top:var(--sp-4);font-size:13px;cursor:pointer;">
                  <input type="checkbox" id="en-orden">
                  <span>Firmar en orden</span>
                </label>

                <div id="msg-firma" class="msg" style="display:none;"></div>

                <button type="submit" class="btn-guardar" id="btn-enviar" style="margin-top:var(--sp-4);">
                  Mandar a firma
                </button>
              </form>
            </div>

          </div>
        </div>
      </section>

      <!-- ── Mis envíos ── -->
      <section class="kw-tabpanel" data-panel="envios">
        <div class="kw-lista" id="lista-envios">
          <div class="kw-fila"><div class="kw-fila-cabeza"><div class="kw-skel kw-skel-circle" style="width:11px;height:11px;"></div><div class="kw-fila-texto"><div class="kw-skel kw-skel-line kw-skel-w70"></div><div class="kw-skel kw-skel-line kw-skel-w30" style="margin-top:7px;"></div></div></div></div>
          <div class="kw-fila"><div class="kw-fila-cabeza"><div class="kw-skel kw-skel-circle" style="width:11px;height:11px;"></div><div class="kw-fila-texto"><div class="kw-skel kw-skel-line kw-skel-w50"></div><div class="kw-skel kw-skel-line kw-skel-w30" style="margin-top:7px;"></div></div></div></div>
        </div>
      </section>

    </div>
  </main>

<script>
(function () {
  'use strict';

  const BASE = '/kwpremierweb';
  const FN_FIRMAR = 'https://iloetojomzqtadkithtv.supabase.co/functions/v1/firmar-documento';
  const MAX_BYTES = 20 * 1024 * 1024;

  let miUserId = null;
  let miPerfil = { nombre: '', correo: '' };
  // Los archivos elegidos, en el orden en que se van a unir.
  let archivos = [];
  // El PDF ya unido, que es el que se sube y sobre el que se colocan las
  // firmas. Se guarda porque unir cuesta y no hay por qué repetirlo cada
  // vez que se mueve un recuadro.
  let pdfUnido = null;
  // Las páginas dibujadas, con su tamaño real en puntos.
  let paginas = [];
  // Los recuadros de firma colocados.
  let marcas = [];
  // El renglón de firmante que está esperando que le piquen a la hoja.
  let filaArmada = null;
  let enviando = false;

  const $ = (id) => document.getElementById(id);

  function aviso(texto, tipo) {
    const caja = $('msg-firma');
    if (!texto) { caja.style.display = 'none'; return; }
    caja.textContent = texto;
    caja.className = 'msg ' + (tipo || '');
    caja.style.display = 'block';
    caja.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function escapar(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // ── Elegir el archivo ───────────────────────────────────────

  // Storage solo admite letras, números, guiones, puntos y diagonales en
  // la ruta. Un nombre con acentos o espacios truena la subida, y como
  // el nombre de verdad se guarda aparte en la base, aquí se puede
  // aplastar sin perder nada.
  function limpiarNombre(nombre) {
    return String(nombre)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-zA-Z0-9._-]+/g, '-')
      .replace(/-+/g, '-')
      .slice(-80);
  }

  // Las dos librerías se cargan hasta que hacen falta, no al abrir la
  // pantalla: entre las dos pesan cerca de un mega, y quien solo viene a
  // ver cómo va un envío no tiene por qué esperarlas.
  function cargarScript(src) {
    return new Promise((listo, falla) => {
      if (document.querySelector('script[data-lib="' + src + '"]')) return listo();
      const s = document.createElement('script');
      s.src = src;
      s.dataset.lib = src;
      s.onload = listo;
      s.onerror = () => falla(new Error('No se pudo cargar una librería necesaria. Revisa tu conexión.'));
      document.head.appendChild(s);
    });
  }

  let libsListas = null;
  function cargarLibs() {
    if (!libsListas) {
      libsListas = Promise.all([
        cargarScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'),
        cargarScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'),
      ]).then(() => {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      }).catch((e) => {
        // Si falló, se olvida para que el siguiente intento lo vuelva a
        // probar en vez de quedarse pegado en el error de la primera vez.
        libsListas = null;
        throw e;
      });
    }
    return libsListas;
  }

  // ── Paso 1: juntar y ordenar los archivos ───────────────────

  function agregarArchivos(lista) {
    const nuevos = Array.from(lista || []);
    if (!nuevos.length) return;

    for (const a of nuevos) {
      if (!a.name.toLowerCase().endsWith('.pdf')) {
        avisoArchivos('Por ahora solo se pueden unir PDF. "' + a.name + '" no lo es.', 'error');
        continue;
      }
      // Se comparan nombre y tamaño porque elegir dos veces el mismo
      // archivo es un descuido común y el duplicado no se nota hasta
      // que el documento unido sale con las hojas repetidas.
      if (archivos.some((x) => x.name === a.name && x.size === a.size)) continue;
      archivos.push(a);
    }

    const total = archivos.reduce((s, a) => s + a.size, 0);
    if (total > MAX_BYTES) {
      avisoArchivos('Entre todos pasan de 20 MB. Quita alguno o vuelve a generarlos con menos resolución.', 'error');
    }
    pintarArchivos();
  }

  function pintarArchivos() {
    const cont = $('lista-archivos');
    cont.innerHTML = archivos.map((a, i) =>
      '<div class="archivo-fila">' +
        '<span class="archivo-num">' + (i + 1) + '</span>' +
        '<span class="archivo-nom">' + escapar(a.name) + '</span>' +
        '<span class="archivo-peso">' + (a.size / 1024 / 1024).toFixed(1) + ' MB</span>' +
        '<button type="button" class="archivo-btn" data-sube="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Subir">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>' +
        '</button>' +
        '<button type="button" class="archivo-btn" data-baja="' + i + '"' + (i === archivos.length - 1 ? ' disabled' : '') + ' aria-label="Bajar">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>' +
        '<button type="button" class="archivo-btn" data-quita="' + i + '" aria-label="Quitar">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
      '</div>').join('');

    cont.querySelectorAll('[data-sube]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.dataset.sube);
      [archivos[i - 1], archivos[i]] = [archivos[i], archivos[i - 1]];
      pintarArchivos();
    }));
    cont.querySelectorAll('[data-baja]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.dataset.baja);
      [archivos[i + 1], archivos[i]] = [archivos[i], archivos[i + 1]];
      pintarArchivos();
    }));
    cont.querySelectorAll('[data-quita]').forEach((b) => b.addEventListener('click', () => {
      archivos.splice(Number(b.dataset.quita), 1);
      pintarArchivos();
    }));

    $('btn-continuar').style.display = archivos.length ? 'block' : 'none';
    $('drop-txt').textContent = archivos.length
      ? 'Agregar más documentos'
      : 'Elige los documentos o arrástralos aquí';
    $('drop-sub').textContent = archivos.length
      ? 'Se unen en el orden de la lista'
      : 'Puedes elegir varios PDF y se unen en uno solo';
  }

  $('archivo').addEventListener('change', (e) => {
    agregarArchivos(e.target.files);
    // Se limpia para que volver a elegir el mismo archivo dispare otro
    // 'change'; si no, quitarlo de la lista y reelegirlo no hace nada.
    e.target.value = '';
  });

  const drop = $('drop');
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault(); drop.classList.add('encima');
  }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault(); drop.classList.remove('encima');
  }));
  drop.addEventListener('drop', (e) => agregarArchivos(e.dataTransfer.files));

  // ── Unir los PDF en uno solo ────────────────────────────────

  async function unirArchivos() {
    await cargarLibs();

    // Con un solo archivo no hay nada que unir. Se devuelve tal cual en
    // vez de pasarlo por la librería: reescribirlo puede romper campos
    // de formulario o firmas previas que el original sí traía bien.
    if (archivos.length === 1) {
      return new Uint8Array(await archivos[0].arrayBuffer());
    }

    const unido = await window.PDFLib.PDFDocument.create();
    for (const a of archivos) {
      let doc;
      try {
        doc = await window.PDFLib.PDFDocument.load(await a.arrayBuffer());
      } catch {
        // Un PDF con contraseña o dañado truena aquí. Decir cuál es
        // ahorra tener que ir probándolos de uno en uno.
        throw new Error('No se pudo leer "' + a.name + '". Puede estar protegido con contraseña o dañado.');
      }
      const hojas = await unido.copyPages(doc, doc.getPageIndices());
      hojas.forEach((h) => unido.addPage(h));
    }
    return await unido.save();
  }

  // ── Dibujar el documento ────────────────────────────────────

  async function pintarDocumento(bytes) {
    // pdf.js se queda con el arreglo que recibe y lo deja inservible
    // para lo que venga después; se le pasa una copia para poder seguir
    // usando el original al subirlo.
    const doc = await window.pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    paginas = [];
    const cont = $('paginas');
    cont.innerHTML = '';

    for (let n = 1; n <= doc.numPages; n++) {
      const pag = await doc.getPage(n);

      // La escala se calcula sobre el ancho disponible para que la hoja
      // se vea completa sin tener que hacer zoom. El tamaño real en
      // puntos se guarda aparte: es el que weetrust necesita, y no
      // cambia aunque la pantalla sea chica.
      const natural = pag.getViewport({ scale: 1 });
      const ancho = Math.min(cont.clientWidth || 560, 760);
      const escala = ancho / natural.width;
      const vista = pag.getViewport({ scale: escala });

      const caja = document.createElement('div');
      caja.className = 'pagina-caja';

      const lienzo = document.createElement('canvas');
      // El dibujo se hace al doble de resolución en pantallas que lo
      // aprovechan; si no, el texto del contrato se ve borroso justo
      // cuando hay que leerlo para saber dónde va la firma.
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      lienzo.width = Math.floor(vista.width * dpr);
      lienzo.height = Math.floor(vista.height * dpr);
      lienzo.style.width = vista.width + 'px';
      lienzo.style.height = vista.height + 'px';

      const capa = document.createElement('div');
      capa.className = 'pagina-capa';
      capa.dataset.pagina = String(n);

      caja.appendChild(lienzo);
      caja.appendChild(capa);
      cont.appendChild(caja);

      const num = document.createElement('div');
      num.className = 'pagina-num';
      num.textContent = 'Página ' + n + ' de ' + doc.numPages;
      cont.appendChild(num);

      await pag.render({
        canvasContext: lienzo.getContext('2d'),
        viewport: vista,
        transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
      }).promise;

      paginas.push({ numero: n, capa: capa, anchoPt: natural.width, altoPt: natural.height });
      capa.addEventListener('click', (e) => colocarEnPagina(e, paginas[n - 1]));
    }
  }

  // ── Pasar del paso 1 al paso 2 ──────────────────────────────

  function avisoArchivos(texto, tipo) {
    const caja = $('msg-archivos');
    if (!texto) { caja.style.display = 'none'; return; }
    caja.textContent = texto;
    caja.className = 'msg ' + (tipo || '');
    caja.style.display = 'block';
  }

  function nombreDelUnido() {
    if (archivos.length === 1) return limpiarNombre(archivos[0].name);
    return limpiarNombre(archivos[0].name.replace(/\.pdf$/i, '')) + '-y-anexos.pdf';
  }

  $('btn-continuar').addEventListener('click', async () => {
    if (!archivos.length) return;

    const btn = $('btn-continuar');
    btn.disabled = true;
    btn.textContent = archivos.length > 1 ? 'Uniendo los documentos...' : 'Abriendo el documento...';
    avisoArchivos('', '');

    try {
      pdfUnido = await unirArchivos();

      $('paso-archivos').style.display = 'none';
      $('paso-editor').style.display = 'block';
      $('editor-cargando').style.display = 'flex';
      $('editor-nombre').textContent = archivos.length > 1
        ? archivos.length + ' documentos unidos'
        : archivos[0].name;

      // El título se propone con el nombre del primer archivo, que es el
      // contrato; los anexos van después y no lo nombran.
      if (!$('titulo').value.trim()) {
        $('titulo').value = archivos[0].name.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim();
      }

      await pintarDocumento(pdfUnido);
      $('editor-cargando').style.display = 'none';
      // Las marcas se redibujan porque las capas de página son nuevas.
      pintarMarcas();
    } catch (e) {
      avisoArchivos(e.message || 'No se pudo abrir el documento.', 'error');
      $('paso-archivos').style.display = 'block';
      $('paso-editor').style.display = 'none';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Continuar';
    }
  });

  $('btn-volver-archivos').addEventListener('click', () => {
    // Las marcas se tiran a propósito: si cambian los documentos, cambia
    // la paginación, y una firma en la página 4 del documento anterior
    // no significa nada en el nuevo.
    marcas = [];
    desarmar();
    $('paso-editor').style.display = 'none';
    $('paso-archivos').style.display = 'block';
  });

  // ── Colocar las firmas sobre el documento ───────────────────
  //
  // Cada marca se guarda en porcentaje de la página, no en pixeles. Así
  // sobrevive a que cambie el zoom o el ancho de la ventana, y al final
  // se convierte a puntos del PDF, que es lo que weetrust entiende.

  // Tamaño del recuadro de firma, en puntos del PDF. Es el mismo que
  // usa weetrust en su ejemplo.
  const FIRMA_ANCHO = 101;
  const FIRMA_ALTO = 51;

  const COLORES = ['#FFD247', '#7FD1FF', '#FFA8C5', '#9BE59B', '#C7B3FF', '#FFB68A'];

  function colorDe(fila) {
    const filas = Array.from($('firmantes').querySelectorAll('.firmante-fila'));
    return COLORES[filas.indexOf(fila) % COLORES.length];
  }

  function armarColocacion(fila) {
    // Picarle otra vez al mismo botón desarma, para poder arrepentirse
    // sin tener que colocar una firma de más y luego borrarla.
    if (filaArmada === fila) return desarmar();
    filaArmada = fila;
    $('editor-doc').classList.add('colocando');
    refrescarBotonesFijar();
    $('editor-doc').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function desarmar() {
    filaArmada = null;
    $('editor-doc').classList.remove('colocando');
    refrescarBotonesFijar();
  }

  function colocarEnPagina(e, pagina) {
    if (!filaArmada) return;

    const nombre = filaArmada.querySelector('.firmante-nom').value.trim();
    const correo = filaArmada.querySelector('.firmante-mail').value.trim().toLowerCase();
    if (!correo) {
      aviso('Escribe primero el correo de esa persona: la firma se fija a su correo.', 'error');
      return desarmar();
    }

    const r = pagina.capa.getBoundingClientRect();
    // El clic marca el centro del recuadro, no su esquina: uno apunta a
    // donde quiere la firma, no a dónde empieza su caja.
    const anchoPct = (FIRMA_ANCHO / pagina.anchoPt) * 100;
    const altoPct = (FIRMA_ALTO / pagina.altoPt) * 100;
    const xPct = ((e.clientX - r.left) / r.width) * 100 - anchoPct / 2;
    const yPct = ((e.clientY - r.top) / r.height) * 100 - altoPct / 2;

    marcas.push({
      id: crypto.randomUUID(),
      fila: filaArmada,
      nombre: nombre || correo,
      correo: correo,
      pagina: pagina.numero,
      // Se recorta para que nunca nazca fuera de la hoja, aunque el clic
      // haya caído pegado a la orilla.
      x: Math.max(0, Math.min(xPct, 100 - anchoPct)),
      y: Math.max(0, Math.min(yPct, 100 - altoPct)),
      anchoPct: anchoPct,
      altoPct: altoPct,
      color: colorDe(filaArmada),
    });

    desarmar();
    pintarMarcas();
  }

  function pintarMarcas() {
    paginas.forEach((p) => { p.capa.innerHTML = ''; });

    marcas.forEach((m) => {
      const pag = paginas[m.pagina - 1];
      if (!pag) return;

      const el = document.createElement('div');
      el.className = 'marca-firma';
      el.style.left = m.x + '%';
      el.style.top = m.y + '%';
      el.style.width = m.anchoPct + '%';
      el.style.height = m.altoPct + '%';
      el.style.background = m.color;
      // El rótulo se toma del renglón cada vez que se redibuja, para que
      // corregir el nombre se refleje en el recuadro sin tener que
      // volver a colocarlo.
      el.textContent = m.fila.querySelector('.firmante-nom').value.trim()
        || m.fila.querySelector('.firmante-mail').value.trim()
        || 'Firma';

      const quitar = document.createElement('button');
      quitar.type = 'button';
      quitar.className = 'marca-quitar';
      quitar.textContent = '×';
      quitar.setAttribute('aria-label', 'Quitar esta firma');
      quitar.addEventListener('click', (e) => {
        e.stopPropagation();
        marcas = marcas.filter((x) => x.id !== m.id);
        pintarMarcas();
      });
      el.appendChild(quitar);

      // Arrastrar con puntero, que cubre ratón y dedo con el mismo
      // código. Se captura el puntero para que el arrastre no se corte
      // si el dedo se sale del recuadro a media maniobra.
      el.addEventListener('pointerdown', (ev) => {
        if (ev.target === quitar) return;
        ev.preventDefault();
        ev.stopPropagation();
        el.setPointerCapture(ev.pointerId);

        const r = pag.capa.getBoundingClientRect();
        const desdeX = ev.clientX - (m.x / 100) * r.width;
        const desdeY = ev.clientY - (m.y / 100) * r.height;

        const mover = (e2) => {
          const nx = ((e2.clientX - desdeX) / r.width) * 100;
          const ny = ((e2.clientY - desdeY) / r.height) * 100;
          m.x = Math.max(0, Math.min(nx, 100 - m.anchoPct));
          m.y = Math.max(0, Math.min(ny, 100 - m.altoPct));
          el.style.left = m.x + '%';
          el.style.top = m.y + '%';
        };
        const soltar = () => {
          el.removeEventListener('pointermove', mover);
          el.removeEventListener('pointerup', soltar);
          el.removeEventListener('pointercancel', soltar);
        };
        el.addEventListener('pointermove', mover);
        el.addEventListener('pointerup', soltar);
        el.addEventListener('pointercancel', soltar);
      });

      pag.capa.appendChild(el);
    });

    refrescarBotonesFijar();
  }

  // Cuántas firmas lleva colocadas cada quien, para que se vea en su
  // botón sin tener que ir contando recuadros por el documento.
  function refrescarBotonesFijar() {
    $('firmantes').querySelectorAll('.firmante-fila').forEach((fila) => {
      const btn = fila.querySelector('.firmante-fijar');
      if (!btn) return;
      const cuantas = marcas.filter((m) => m.fila === fila).length;
      btn.classList.toggle('armado', filaArmada === fila);
      btn.querySelector('.cuenta').textContent = String(cuantas);
      btn.querySelector('.rotulo').textContent =
        filaArmada === fila ? 'Pica en la hoja' : 'Fijar firma';
    });
  }

  // Las marcas guardan una referencia al renglón del firmante. Si ese
  // renglón se borra, sus firmas se van con él: dejarlas colgadas haría
  // que el envío se rechazara por apuntar a alguien que ya no está.
  function limpiarMarcasHuerfanas() {
    const vivas = Array.from($('firmantes').querySelectorAll('.firmante-fila'));
    const antes = marcas.length;
    marcas = marcas.filter((m) => vivas.includes(m.fila));
    if (marcas.length !== antes) pintarMarcas();
  }

  // Pasa las marcas de porcentaje de pantalla a puntos del PDF, que es
  // lo que weetrust entiende: origen arriba a la izquierda de cada
  // página, 72 puntos por pulgada. La conversión se hace aquí y no en el
  // servidor porque aquí es donde se conoce el tamaño real de cada
  // página, que no tiene por qué ser el mismo en todas (un anexo puede
  // venir en horizontal).
  function posicionesParaEnviar() {
    return marcas.map((m) => {
      const pag = paginas[m.pagina - 1];
      return {
        // El correo se lee del renglón ahora, no el que tenía cuando se
        // colocó: si alguien corrige una letra después de fijar la
        // firma, la marca seguiría apuntando al correo viejo y el envío
        // se rechazaría por un firmante que ya no existe.
        correo: m.fila.querySelector('.firmante-mail').value.trim().toLowerCase(),
        pagina: m.pagina,
        x: (m.x / 100) * pag.anchoPt,
        y: (m.y / 100) * pag.altoPt,
        ancho: (m.anchoPct / 100) * pag.anchoPt,
        alto: (m.altoPct / 100) * pag.altoPt,
        pagAncho: pag.anchoPt,
        pagAlto: pag.altoPt,
        color: m.color,
      };
    });
  }

  // ── Firmantes ───────────────────────────────────────────────

  // Las verificaciones que weetrust documenta para el endpoint de
  // firmantes. Falta la de One Time Password, que sí aparece en la
  // factura (WT26) pero no en la documentación de este endpoint: no se
  // pone hasta saber cómo se manda, porque adivinarlo se cobra igual
  // aunque no funcione.
  //
  // El "grupo" dice cuáles se pelean entre sí: las de grupo 'ident' son
  // el mismo campo de weetrust, que solo admite un valor.
  const VERIFICACIONES = [
    {
      id: 'id', grupo: 'ident', titulo: 'Verificación de identificación (costo extra)',
      icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="9" cy="10" r="2"/>'
        + '<path d="M5.5 16a3.5 3.5 0 0 1 7 0"/><line x1="15" y1="9" x2="19" y2="9"/><line x1="15" y1="13" x2="19" y2="13"/></svg>',
    },
    {
      id: 'face', grupo: 'ident', titulo: 'Foto ID / reconocimiento facial (costo extra)',
      icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>'
        + '<circle cx="12" cy="11" r="2.2"/><path d="M8.5 16.5a4 4 0 0 1 7 0"/></svg>',
    },
    {
      id: 'ocr', grupo: 'ident', titulo: 'Lectura automática de la identificación, OCR (costo extra)',
      icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'
        + '<line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>',
    },
    {
      id: 'check', grupo: 'extra', titulo: 'Background Check (requiere Foto ID, costo extra)',
      icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>'
        + '<polyline points="9 13 11 15 15 11"/></svg>',
    },
  ];

  function filaFirmante(nombre, correo) {
    const fila = document.createElement('div');
    fila.className = 'firmante-fila';
    fila.innerHTML =
      '<input type="text" class="kw-input firmante-nom" placeholder="Nombre completo" value="' + escapar(nombre || '') + '">' +
      '<input type="email" class="kw-input firmante-mail" placeholder="correo@ejemplo.com" value="' + escapar(correo || '') + '">' +
      '<button type="button" class="firmante-fijar">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 17c3.5 0 3.5-10 7-10s3.5 10 7 10"/><line x1="3" y1="21" x2="21" y2="21"/>' +
        '</svg><span class="rotulo">Fijar firma</span><span class="cuenta">0</span>' +
      '</button>' +
      '<button type="button" class="firmante-quitar" aria-label="Quitar firmante">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
      '</button>' +
      // Las verificaciones, como iconos que se prenden y apagan. Todas
      // arrancan apagadas: cada una se cobra aparte y por firmante.
      //
      // Las tres primeras son el mismo campo de weetrust (identification),
      // que solo admite un valor, así que prender una apaga las otras.
      // Background Check es aparte y solo tiene sentido junto a la
      // facial, que es lo que weetrust exige.
      '<div class="firmante-verif">' + VERIFICACIONES.map((v) =>
        '<button type="button" class="verif-btn" data-verif="' + v.id + '"' +
          ' data-grupo="' + v.grupo + '" title="' + v.titulo + '" aria-label="' + v.titulo + '">' +
          v.icono +
        '</button>').join('') +
      '</div>';
    fila.querySelector('.firmante-fijar').addEventListener('click', () => armarColocacion(fila));

    fila.querySelector('.firmante-quitar').addEventListener('click', () => {
      fila.remove();
      marcarUnico();
      // Sus firmas colocadas se van con él.
      limpiarMarcasHuerfanas();
      // Quitar un renglón no dispara ningún evento 'input', así que sin
      // esto el botón del frecuente que se acaba de borrar se quedaba
      // apagado para siempre y ya no se podía volver a agregar.
      marcarFrecuentesPuestos();
    });

    fila.querySelectorAll('.verif-btn').forEach((b) => {
      b.addEventListener('click', () => {
        const prendido = b.classList.toggle('activo');

        // Las tres de identificación son el mismo campo en weetrust y
        // solo cabe un valor, así que prender una apaga a sus hermanas.
        if (prendido && b.dataset.grupo === 'ident') {
          fila.querySelectorAll('.verif-btn[data-grupo="ident"]').forEach((otro) => {
            if (otro !== b) otro.classList.remove('activo');
          });
        }
        ajustarBackgroundCheck(fila);
      });
    });

    ajustarBackgroundCheck(fila);
    return fila;
  }

  // weetrust solo hace el Background Check cuando la verificación es la
  // facial. Se apaga el botón en vez de dejar prenderlo y que el envío
  // truene después: el error llegaría cuando la persona ya llenó todo.
  function ajustarBackgroundCheck(fila) {
    const facial = fila.querySelector('.verif-btn[data-verif="face"]');
    const check = fila.querySelector('.verif-btn[data-verif="check"]');
    if (!facial || !check) return;

    const hayFacial = facial.classList.contains('activo');
    check.disabled = !hayFacial;
    if (!hayFacial) check.classList.remove('activo');
  }

  function marcarUnico() {
    const filas = $('firmantes').querySelectorAll('.firmante-fila');
    filas.forEach((f) => f.classList.toggle('unico', filas.length === 1));
  }

  function agregarFirmante(nombre, correo) {
    $('firmantes').appendChild(filaFirmante(nombre, correo));
    marcarUnico();
  }

  $('btn-agregar').addEventListener('click', () => {
    agregarFirmante('', '');
    const filas = $('firmantes').querySelectorAll('.firmante-nom');
    filas[filas.length - 1].focus();
  });

  function leerFirmantes() {
    return Array.from($('firmantes').querySelectorAll('.firmante-fila')).map((f) => {
      const ident = f.querySelector('.verif-btn[data-grupo="ident"].activo');
      const check = f.querySelector('.verif-btn[data-verif="check"].activo');
      return {
        nombre: f.querySelector('.firmante-nom').value.trim(),
        correo: f.querySelector('.firmante-mail').value.trim(),
        identificacion: ident ? ident.dataset.verif : '',
        check: !!check,
      };
    }).filter((f) => f.nombre || f.correo);
  }

  // ── Mandar ──────────────────────────────────────────────────

  async function llamarFuncion(cuerpo) {
    const { data: { session } } = await window.kwSupabase.auth.getSession();
    if (!session) throw new Error('Se cerró tu sesión. Vuelve a entrar.');

    const res = await fetch(FN_FIRMAR, {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + session.access_token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(cuerpo),
    });
    const json = await res.json().catch(() => null);
    if (!res.ok) throw new Error((json && json.error) || ('Falló la operación (' + res.status + ')'));
    return json;
  }

  $('form-firma').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (enviando) return;

    const titulo = $('titulo').value.trim();
    const firmantes = leerFirmantes();

    if (!pdfUnido) return aviso('Falta elegir el documento.', 'error');
    if (!titulo) return aviso('Ponle un título al documento.', 'error');
    if (!firmantes.length) return aviso('Falta indicar quién firma.', 'error');

    // La validación de fondo (correo bien formado, sin repetidos) vive en
    // la Edge Function, porque es la que tiene que aguantar aunque alguien
    // se salte esta pantalla. Aquí solo se atajan los descuidos obvios
    // para no gastar una subida en balde.
    for (const f of firmantes) {
      if (!f.nombre) return aviso('A uno de los firmantes le falta el nombre.', 'error');
      if (!f.correo) return aviso('A ' + f.nombre + ' le falta el correo.', 'error');
    }

    enviando = true;
    const btn = $('btn-enviar');
    btn.disabled = true;
    btn.textContent = 'Subiendo el documento...';
    aviso('', '');

    try {
      // El archivo va primero al bucket y de ahí lo recoge la Edge
      // Function. No se manda dentro de la petición porque un PDF
      // escaneado pasa de lo que aguanta un cuerpo JSON, y porque así
      // queda copia del original exactamente como se firmó.
      // El nombre se limpia antes de armar la ruta: Storage rechaza
      // acentos, espacios y signos, y los documentos suelen llamarse
      // "Contrato Depto. #3 (final).pdf".
      const nombreFinal = nombreDelUnido();
      const ruta = miUserId + '/' + crypto.randomUUID() + '-' + nombreFinal;

      // Se sube el PDF ya unido, no los originales: es exactamente el
      // que la gente va a firmar, y las coordenadas de firma solo tienen
      // sentido contra esa paginación.
      const { error: errSubida } = await window.kwSupabase
        .storage.from('firmas').upload(ruta, new Blob([pdfUnido], { type: 'application/pdf' }), {
          contentType: 'application/pdf',
        });
      if (errSubida) throw new Error('No se pudo subir el archivo: ' + errSubida.message);

      btn.textContent = 'Mandando a firma...';

      await llamarFuncion({
        accion: 'enviar',
        origen: 'subido',
        archivoRuta: ruta,
        nombreArchivo: nombreFinal,
        titulo: titulo,
        mensaje: $('mensaje').value.trim(),
        firmantes: firmantes,
        enOrden: $('en-orden').checked,
        posiciones: posicionesParaEnviar(),
      });

      // Se limpia todo para que no se mande dos veces sin querer.
      $('form-firma').reset();

      // Se regresa al paso 1 en limpio. Dejar el editor abierto con el
      // documento que se acaba de mandar invita a mandarlo dos veces.
      archivos = [];
      pdfUnido = null;
      marcas = [];
      paginas = [];
      desarmar();
      $('paginas').innerHTML = '';
      $('paso-editor').style.display = 'none';
      $('paso-archivos').style.display = 'block';
      pintarArchivos();

      $('firmantes').innerHTML = '';
      // Se vuelve a proponer al asesor, igual que al abrir la pantalla:
      // quien mandó uno casi siempre va a mandar el siguiente en las
      // mismas condiciones.
      agregarFirmante(miPerfil.nombre, miPerfil.correo);
      marcarFrecuentesPuestos();

      await cargarEnvios();
      if (window.kwUI) window.kwUI.activarTab('envios');
    } catch (err) {
      aviso(err.message || 'No se pudo mandar a firma.', 'error');
    } finally {
      enviando = false;
      btn.textContent = 'Mandar a firma';
      btn.disabled = false;
      // Va al final y no dentro del try: aquí se acaba de reactivar el
      // botón, y si con este envío se agotó el tope hay que volver a
      // apagarlo. Puesto antes, esta línea de arriba lo desharía.
      // También corre cuando algo falló, que es justo cuando el envío
      // se rechazó por tope y el contador tiene que decirlo.
      await cargarCupo();
    }
  });

  // ── Mis envíos ──────────────────────────────────────────────

  // Los valores que guarda weetrust son sus nombres internos; en la
  // lista se enseña algo que se pueda leer.
  const NOMBRE_VERIF = {
    id: 'identificación',
    face: 'foto ID',
    ocr: 'OCR',
    face_login: 'facial con registro',
  };

  const PILL = {
    preparando: ['kw-pill-neutro', 'Preparando'],
    borrador: ['kw-pill-neutro', 'Sin enviar'],
    pendiente: ['kw-pill-espera', 'Esperando firmas'],
    completado: ['kw-pill-ok', 'Firmado'],
    cancelado: ['kw-pill-neutro', 'Cancelado'],
    error: ['kw-pill-alerta', 'Falló'],
  };
  const PUNTO = {
    preparando: 'gris', borrador: 'gris', pendiente: 'ambar',
    completado: 'verde', cancelado: 'gris', error: 'rojo',
  };

  function fecha(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('es-MX', {
      day: 'numeric', month: 'short', year: 'numeric',
    });
  }

  function pintarEnvios(filas) {
    const cont = $('lista-envios');

    if (!filas.length) {
      cont.innerHTML = '<div class="kw-vacio">Todavía no has mandado nada a firma.</div>';
      return;
    }

    cont.innerHTML = filas.map((f) => {
      const firmantes = Array.isArray(f.firmantes) ? f.firmantes : [];
      const yaFirmaron = firmantes.filter((x) => x.firmado).length;
      const pill = PILL[f.estado] || PILL.pendiente;

      const sub = f.estado === 'error'
        ? 'No se pudo enviar'
        : yaFirmaron + ' de ' + firmantes.length + ' firmaron · ' + fecha(f.created_at);

      const quienes = firmantes.map((x) => {
        // La liga solo sirve mientras esa persona no haya firmado. Si ya
        // firmó, enseñarla invita a mandársela a alguien que se va a
        // topar con un documento que ya no puede hacer nada.
        const caducada = x.url_expira && Number(x.url_expira) < Date.now();
        const liga = (!x.firmado && x.url_firma && !caducada)
          ? '<button type="button" class="firma-liga" data-liga="' + escapar(x.url_firma) + '">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/>' +
                '<path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19"/>' +
              '</svg>Copiar liga</button>'
          : (!x.firmado && caducada
              ? '<span class="firma-quien-mail">liga vencida</span>'
              : '');

        return '<div class="firma-quien">' +
          '<span class="firma-quien-punto' + (x.firmado ? ' ok' : '') + '"></span>' +
          '<span class="firma-quien-datos">' +
            '<span class="firma-quien-nom">' + escapar(x.nombre) + '</span> ' +
            '<span class="firma-quien-mail">' + escapar(x.correo) + '</span>' +
            (x.identificacion ? '<span class="firma-quien-verif">' + escapar(NOMBRE_VERIF[x.identificacion] || x.identificacion) + '</span>' : '') +
            (x.check ? '<span class="firma-quien-verif">background check</span>' : '') +
          '</span>' + liga +
        '</div>';
      }).join('');

      // Solo se puede cancelar lo que todavía no se firma del todo: los
      // completados weetrust los sella y ya no se tocan.
      const puedeCancelar = ['preparando', 'borrador', 'pendiente'].includes(f.estado);

      const acciones =
        (f.estado === 'completado' && f.pdf_firmado_url
          ? '<a class="kw-fila-btn" href="' + escapar(f.pdf_firmado_url) + '" target="_blank" rel="noopener">Descargar firmado</a>'
          : '') +
        (f.estado === 'pendiente'
          ? '<button type="button" class="kw-fila-btn" data-accion="consultar" data-id="' + f.id + '">Actualizar</button>'
          : '') +
        (puedeCancelar
          ? '<button type="button" class="kw-fila-btn" data-accion="cancelar" data-id="' + f.id + '">Cancelar</button>'
          : '');

      return '' +
        '<div class="kw-fila">' +
          '<button class="kw-fila-cabeza">' +
            '<span class="kw-fila-punto ' + (PUNTO[f.estado] || 'gris') + '"></span>' +
            '<span class="kw-fila-texto">' +
              '<span class="kw-fila-titulo">' + escapar(f.titulo) + '</span>' +
              '<span class="kw-fila-sub">' + escapar(sub) + '</span>' +
            '</span>' +
            '<span class="kw-pill ' + pill[0] + '">' + pill[1] + '</span>' +
            '<svg class="kw-fila-flecha" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
          '</button>' +
          '<div class="kw-fila-cuerpo"><div><div class="kw-fila-dentro">' +
            '<div class="kw-datos">' + quienes +
              (f.error_mensaje ? '<div class="kw-nota">' + escapar(f.error_mensaje) + '</div>' : '') +
            '</div>' +
            (acciones ? '<div class="kw-fila-acciones">' + acciones + '</div>' : '') +
          '</div></div></div>' +
        '</div>';
    }).join('');

    if (window.kwUI) window.kwUI.acordeon(cont);

    // Copiar la liga personal de cada firmante, para pasarla por
    // WhatsApp a mano. weetrust cobra su propio envío por WhatsApp;
    // mandar la liga uno mismo hace lo mismo sin costo.
    cont.querySelectorAll('[data-liga]').forEach((b) => {
      b.addEventListener('click', async (e) => {
        // Sin esto el clic sube hasta la cabecera de la fila y la cierra
        // justo cuando la persona iba a usar lo que acaba de copiar.
        e.stopPropagation();
        const original = b.innerHTML;
        try {
          await navigator.clipboard.writeText(b.dataset.liga);
          b.textContent = 'Copiada';
        } catch {
          // navigator.clipboard no existe fuera de https ni en algunos
          // navegadores viejos. Ahí se enseña para copiar a mano, que es
          // peor pero deja seguir.
          window.prompt('Copia la liga de firma:', b.dataset.liga);
        }
        setTimeout(() => { b.innerHTML = original; }, 1600);
      });
    });

    cont.querySelectorAll('[data-accion]').forEach((b) => {
      b.addEventListener('click', async () => {
        const accion = b.dataset.accion;
        if (accion === 'cancelar' && !confirm('¿Cancelar este envío? Se retira de weetrust y los firmantes ya no podrán firmarlo.')) return;

        const textoOriginal = b.textContent;
        b.disabled = true;
        b.textContent = accion === 'cancelar' ? 'Cancelando...' : 'Consultando...';
        try {
          await llamarFuncion({ accion: accion, id: b.dataset.id });
          // Cancelar libera un lugar del tope, así que el contador
          // también se vuelve a calcular.
          await Promise.all([cargarEnvios(), cargarCupo()]);
        } catch (err) {
          alert(err.message || 'No se pudo completar la acción.');
          b.disabled = false;
          b.textContent = textoOriginal;
        }
      });
    });
  }

  async function cargarEnvios() {
    const { data, error } = await window.kwSupabase
      .from('firmas_documentos')
      .select('id, titulo, estado, firmantes, pdf_firmado_url, error_mensaje, created_at')
      .order('created_at', { ascending: false })
      .limit(100);

    if (error) {
      $('lista-envios').innerHTML =
        '<div class="kw-vacio">No se pudieron cargar tus envíos: ' + escapar(error.message) + '</div>';
      return;
    }
    pintarEnvios(data || []);
  }

  // ── Arranque ────────────────────────────────────────────────

  // Enseña cuánto le queda del mes y, si ya se acabó, apaga el botón.
  // El freno de verdad está en la Edge Function; esto es para que nadie
  // llene el formulario completo para enterarse hasta el final.
  async function cargarCupo() {
    const caja = $('cupo');
    const { data, error } = await window.kwSupabase.rpc('firmas_disponibles', { p_user: miUserId });
    if (error || !data || data.sin_tope) { caja.style.display = 'none'; return; }

    const quedan = Number(data.restantes);
    caja.classList.toggle('agotado', quedan <= 0);
    caja.innerHTML = quedan > 0
      ? 'Te quedan <strong>' + quedan + '</strong> de ' + data.limite + ' documentos este mes.'
      : 'Ya usaste tus <strong>' + data.limite + '</strong> documentos de este mes. '
        + 'Pídele al equipo de liderazgo que te suba el tope si necesitas más.';
    caja.style.display = 'block';

    $('btn-enviar').disabled = quedan <= 0;
  }

  // Los que firman casi siempre, de un clic. Se apaga el botón del que
  // ya está puesto en vez de esconderlo, para que se vea que esa persona
  // ya quedó y no que la opción desapareció.
  function marcarFrecuentesPuestos() {
    const puestos = leerFirmantes().map((f) => f.correo.toLowerCase());
    $('frecuentes').querySelectorAll('.firma-frecuente').forEach((b) => {
      b.disabled = puestos.includes(b.dataset.correo);
    });
  }

  async function cargarFrecuentes() {
    const { data, error } = await window.kwSupabase
      .from('firmas_frecuentes')
      .select('nombre, correo, puesto')
      .eq('activo', true)
      .order('orden');

    if (error || !data || !data.length) return;

    const caja = $('frecuentes');
    caja.innerHTML = data.map((f) =>
      '<button type="button" class="firma-frecuente" data-correo="' + escapar(f.correo.toLowerCase()) + '"' +
        ' data-nombre="' + escapar(f.nombre) + '">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
        escapar(f.nombre) + (f.puesto ? ' (' + escapar(f.puesto) + ')' : '') +
      '</button>').join('');
    caja.style.display = 'flex';

    caja.querySelectorAll('.firma-frecuente').forEach((b) => {
      b.addEventListener('click', () => {
        // Si el primer renglón está vacío se aprovecha en vez de dejar
        // un hueco arriba del que se acaba de agregar.
        const vacia = Array.from($('firmantes').querySelectorAll('.firmante-fila')).find((f) =>
          !f.querySelector('.firmante-nom').value.trim() && !f.querySelector('.firmante-mail').value.trim());
        if (vacia) {
          vacia.querySelector('.firmante-nom').value = b.dataset.nombre;
          vacia.querySelector('.firmante-mail').value = b.dataset.correo;
        } else {
          agregarFirmante(b.dataset.nombre, b.dataset.correo);
        }
        marcarFrecuentesPuestos();
      });
    });
  }

  async function iniciar() {
    const { data: userData } = await window.kwSupabase.auth.getUser();
    if (!userData || !userData.user) return;
    miUserId = userData.user.id;

    // El primer renglón se propone con los datos de quien está usando
    // la pantalla: el asesor casi siempre firma sus propios documentos,
    // y volver a teclear su nombre y correo cada vez no aporta nada. Si
    // no firma, lo borra y ya.
    const { data: perfil } = await window.kwSupabase
      .from('profiles').select('nombre, email').eq('id', miUserId).single();
    miPerfil = { nombre: perfil?.nombre || '', correo: perfil?.email || '' };
    agregarFirmante(miPerfil.nombre, miPerfil.correo);

    // Cada vez que alguien teclea puede coincidir (o dejar de coincidir)
    // con un frecuente, así que los botones se revisan al vuelo.
    $('firmantes').addEventListener('input', () => {
      marcarFrecuentesPuestos();
      // Los recuadros ya colocados llevan el nombre del firmante escrito
      // encima, así que se redibujan al corregirlo.
      if (marcas.length) pintarMarcas();
    });

    await Promise.all([cargarFrecuentes(), cargarCupo(), cargarEnvios()]);
    marcarFrecuentesPuestos();
  }

  if (document.documentElement.classList.contains('kw-auth-ok')) {
    iniciar();
  } else {
    window.addEventListener('kw-auth-ready', iniciar, { once: true });
  }
})();
</script>

</body>
</html>
