name: Sincronizar inventario KWMexico

on:
  # La ejecucion diaria se programa en Supabase Cron a las 09:00 UTC.
  # GitHub queda disponible para ejecuciones manuales.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al sincronizador
        env:
          SUPABASE_URL: ${{ secrets.KW_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.KW_SUPABASE_ANON_KEY }}
          KW_SYNC_SECRET: ${{ secrets.KW_SYNC_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$KW_SYNC_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/sincronizar-propiedades" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-sync-secret: $KW_SYNC_SECRET" \
            -H "x-sync-source: kwmexico" \
            -H "Content-Type: application/json" \
            --data '{}'

      - name: Enviar reporte diario de propiedades
        env:
          SUPABASE_URL: ${{ secrets.KW_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.KW_SUPABASE_ANON_KEY }}
          KW_SYNC_SECRET: ${{ secrets.KW_SYNC_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/enviar-reporte-propiedades" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-sync-secret: $KW_SYNC_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'
