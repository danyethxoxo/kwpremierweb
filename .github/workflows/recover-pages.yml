name: Recover Pages publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  request-build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request a build of the current Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.request('POST /repos/{owner}/{repo}/pages/builds', context.repo);
            core.info('Pages build request: ' + result.status);
