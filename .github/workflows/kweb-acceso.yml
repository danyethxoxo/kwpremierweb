name: Comprobar acceso real de KWEB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/security.ts'
      - 'supabase/functions/mfa-correo/**'
      - 'supabase/functions/data-gateway/**'
      - 'herramientas/verificar-acceso.mjs'
      - '.github/workflows/kweb-acceso.yml'
permissions:
  contents: read
jobs:
  acceso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node herramientas/verificar-acceso.mjs
