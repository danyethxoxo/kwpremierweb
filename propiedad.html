<!-- El mapa (Google Maps, o OpenStreetMap mientras no haya llave) se
     carga solo cuando la propiedad trae coordenadas: ver montarMapa. -->
<style>
  :root {
    --red: #CC0000; --text: #1a1a1a; --muted: #888;
    --bg: #EFEFEF; --card: #ffffff; --border: rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; min-height: 100vh; }


  /* Más ancha que antes para que la galería luzca, pero con tope: a lo
     ancho de una pantalla grande, los renglones de la descripción se
     volverían incómodos de leer. */
  main { flex: 1; max-width: 1320px; margin: 0 auto; padding: 90px clamp(20px, 3vw, 40px) 60px; width: 100%; }

  .volver {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: #555; text-decoration: none;
    margin-bottom: 18px;
  }
  .volver svg { width: 14px; height: 14px; }
  .volver:hover { color: var(--red); }

  /* ── Galería ──
     Mosaico: la principal grande a la izquierda y cuatro chicas a la
     derecha, como en los portales inmobiliarios. Con menos de cinco
     fotos la principal se lleva todo el ancho, para no dejar huecos. */
  .galeria {
    display: grid; grid-template-columns: 2fr 1fr; grid-auto-rows: 1fr;
    gap: 8px; margin-bottom: 22px; height: 440px;
  }
  .galeria.solo-una { grid-template-columns: 1fr; }
  .galeria-lado { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* Con menos de cuatro secundarias, la retícula 2×2 dejaría celdas
     vacías: se reacomodan para que el bloque quede lleno. */
  @media (min-width: 861px) {
    .galeria-lado[data-n="1"] { grid-template-columns: 1fr; }
    .galeria-lado[data-n="2"] { grid-template-columns: 1fr; }
    .galeria-lado[data-n="3"] > :first-child { grid-column: span 2; }
  }
  .foto-principal {
    position: relative; background: #e4e4e4; overflow: hidden;
    border-radius: 14px; cursor: zoom-in;
    display: flex; align-items: center; justify-content: center;
  }
  .foto-principal img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto-chica {
    position: relative; background: #e4e4e4; overflow: hidden;
    border-radius: 12px; cursor: zoom-in;
  }
  .foto-chica img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .foto-chica:hover img { transform: scale(1.05); }
  .ver-mas-fotos {
    position: absolute; inset: 0; border: none; cursor: pointer;
    background: rgba(0,0,0,0.55); color: #fff;
    font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    transition: background 0.2s;
  }
  .ver-mas-fotos:hover { background: rgba(0,0,0,0.66); }
  .ver-mas-fotos svg { width: 20px; height: 20px; }
  .sin-foto { color: #bbb; }
  .sin-foto svg { width: 54px; height: 54px; }

  @media (max-width: 860px) {
    .galeria { grid-template-columns: 1fr; height: auto; }
    .foto-principal { aspect-ratio: 4 / 3; }
    /* De lado se ven las cuatro chicas sin comerse la pantalla a lo
       alto; la principal ya ocupó su espacio arriba. */
    .galeria-lado { grid-template-columns: repeat(4, 1fr); height: 82px; }
  }

  .columnas { display: grid; grid-template-columns: 1fr 360px; gap: 24px; align-items: start; }

  .bloque {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 24px; margin-bottom: 18px;
  }
  .badge-op {
    display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 4px 11px; border-radius: 20px;
    background: #fdeaea; color: var(--red); margin-bottom: 10px;
  }
  .precio { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }
  .titulo { font-size: 20px; font-weight: 700; margin-top: 4px; line-height: 1.3; }
  .ubic { font-size: 14px; color: var(--muted); margin-top: 7px; display: flex; align-items: center; gap: 6px; }
  .ubic svg { width: 14px; height: 14px; flex-shrink: 0; }

  .datos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .dato {
    flex: 1; min-width: 92px; background: #f7f7f6; border-radius: 12px;
    padding: 13px 12px; text-align: center;
  }
  .dato-ico { color: var(--red); margin-bottom: 6px; }
  .dato-ico svg { width: 19px; height: 19px; }
  .dato-valor { font-size: 17px; font-weight: 700; }
  .dato-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

  /* Días en el mercado: es el dato que más peso tiene al negociar, así
     que va junto al precio y no escondido entre las características. */
  .meta-linea {
    display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px;
    font-size: 12.5px; color: var(--muted);
  }
  .meta-item { display: inline-flex; align-items: center; gap: 6px; }
  .meta-item svg { width: 13px; height: 13px; }

  /* ── Mapa ── */
  #mapa { height: 320px; border-radius: 12px; overflow: hidden; z-index: 0; }
  .mapa-nota { font-size: 11.5px; color: var(--muted); margin-top: 9px; }
  /* El pin es el chincheta roja de KW; el div lo pinta Leaflet sin
     fondo propio para que solo se vea el SVG. */
  .pin-kw { background: none; border: none; }
  .pin-kw svg { width: 34px; height: 44px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.35)); }

  .bloque h2 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .descripcion { font-size: 14px; line-height: 1.7; color: #444; white-space: pre-wrap; }
  .caracteristicas { display: flex; flex-wrap: wrap; gap: 7px; }
  .caract {
    font-size: 12.5px; background: #f7f7f6; border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 20px;
  }

  /* ── Asesor ── */
  .asesor { position: sticky; top: 88px; }
  .asesor-head { display: flex; align-items: center; gap: 13px; }
  .asesor-foto {
    width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
    background: #fff3f3; color: var(--red); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; overflow: hidden;
  }
  .asesor-nombre { font-size: 15.5px; font-weight: 700; }
  .asesor-rol { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .asesor-nota {
    font-size: 11.5px; color: var(--muted); background: #f7f7f6;
    border-radius: 8px; padding: 7px 10px; margin-top: 12px;
  }
  /* ── Formulario de contacto ── */
  .form-lead { display: flex; flex-direction: column; gap: 9px; margin-top: 15px; }
  .form-lead input, .form-lead textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; font-family: 'DM Sans', sans-serif;
    color: var(--text); background: #fff; outline: none;
  }
  .form-lead textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
  .form-lead input:focus, .form-lead textarea:focus {
    border-color: var(--red); box-shadow: 0 0 0 3px rgba(204,0,0,0.08);
  }
  /* Trampa para robots: la llenan los que rellenan todo a ciegas, y
     así se descartan sin molestar a nadie con un captcha. */
  .trampa { position: absolute; left: -9999px; opacity: 0; height: 0; }
  .lead-msg { font-size: 12.5px; border-radius: 9px; padding: 9px 11px; display: none; }
  .lead-msg.error { display: block; background: #fdeaea; color: #a30000; }
  .lead-gracias { display: none; text-align: center; padding: 18px 6px; }
  .lead-gracias.visible { display: block; }
  .lead-gracias-ico {
    width: 42px; height: 42px; border-radius: 50%; background: #eaf7ee;
    color: #1a7f37; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 10px;
  }
  .lead-gracias-ico svg { width: 21px; height: 21px; }
  .lead-gracias strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .lead-gracias span { font-size: 13px; color: var(--muted); line-height: 1.5; }

  .contactos { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .btn-contacto {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px; border-radius: 30px; font-size: 13.5px; font-weight: 700;
    text-decoration: none; border: 1.5px solid var(--border); background: #f7f7f6;
    color: var(--text); cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: filter 0.15s, background 0.15s;
  }
  .btn-contacto svg { width: 15px; height: 15px; }
  .btn-wa { background: #25D366; border-color: #25D366; color: #fff; }
  .btn-mail { background: linear-gradient(180deg, #e81010, var(--red)); border-color: var(--red); color: #fff; }
  .btn-contacto:hover { filter: brightness(1.06); }
  .btn-compartir { background: #fff; }
  .btn-compartir:hover { background: #ececec; }

  .estado-msg { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 20px; }

  /* Visor de imagen */
  #visor {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.88);
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
  }
  #visor { flex-direction: column; gap: 12px; }
  #visor img#visor-img { max-width: 92vw; max-height: calc(88vh - 96px); border-radius: 10px; }
  /* Tira de miniaturas del visor: deja saltar a cualquier foto sin
     tener que pasar una por una con las flechas. */
  .visor-tira {
    display: flex; gap: 7px; max-width: 92vw; overflow-x: auto;
    padding: 4px 2px; cursor: default;
  }
  .visor-tira img {
    width: 72px; height: 54px; object-fit: cover; border-radius: 7px;
    flex-shrink: 0; cursor: pointer; opacity: 0.5;
    border: 2px solid transparent; transition: opacity 0.15s, border-color 0.15s;
  }
  .visor-tira img:hover { opacity: 0.85; }
  .visor-tira img.activa { opacity: 1; border-color: var(--red); }
  .visor-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.16); color: #fff; font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .visor-nav:hover { background: rgba(255,255,255,0.3); }
  #visor-prev { left: 14px; } #visor-next { right: 14px; }
  #visor-contador {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 12px; font-weight: 700;
    background: rgba(0,0,0,0.45); padding: 5px 13px; border-radius: 20px;
  }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 600;
    padding: 11px 18px; border-radius: 30px; z-index: 120;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .toast.visible { opacity: 1; }

  @media (max-width: 860px) {
    .columnas { grid-template-columns: 1fr; }
    .asesor { position: static; }
  }
  @media (max-width: 640px) {
    main { padding: 18px 16px 40px; }
    .precio { font-size: 25px; }
    .titulo { font-size: 17px; }
    .bloque { padding: 18px 18px; }
  }
</style>

<script>
  var SUPABASE_URL = 'https://iloetojomzqtadkithtv.supabase.co';

  var GOOGLE_MAPS_KEY = '';

  function escapeHtml(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtPrecio(p, m) {
    // 0 también es "no lo mandaron": varios CRMs lo usan como plantilla
    // para "precio a consultar" en vez de dejarlo vacío.
    if (p == null || Number(p) <= 0) return 'Precio a consultar';
    try { return new Intl.NumberFormat('es-MX', { style: 'currency', currency: m || 'MXN', maximumFractionDigits: 0 }).format(p); }
    catch (e) { return '$' + Number(p).toLocaleString('es-MX'); }
  }

  // Si la foto principal no carga, se prueba con la siguiente de la

  function siguienteFotoPrincipal(img) {
    var intento = Number(img.dataset.intento || 0) + 1;
    if (intento >= fotos.length) {
      img.closest('.foto-principal').innerHTML = '<div class="sin-foto">' + ICO.casa + '</div>';

    img.dataset.intento = intento;
    img.src = fotos[intento];
  }

    cama: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>',
    bano: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 6.5 3.5a1.5 1.5 0 0 0-3 0V17a3 3 0 0 0 3 3h11a3 3 0 0 0 3-3v-1H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>',
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M5 12h14"/></svg>',
    area: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M3 9h18"/></svg>',
    terreno: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20V9l7-5 7 5v11"/></svg>',
    reloj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    fotos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
  };

  // El mensaje ya viene escrito para que baste con darle enviar, y trae
  // el título de la propiedad: en `prospectos` no se guarda de cuál se
  // trata, así que es lo que le dice al asesor por qué lo contactan.
  function MENSAJE_BASE(p) {
    return 'Hola, me interesa la propiedad "' + p.titulo + '". ¿Me pueden dar más información?';
  }

  var waLinkActual = null;

  // Chincheta roja de KW para el mapa.
  var PIN_KW = '<svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20c0-6.6-5.4-12-12-12z" fill="#CC0000"/>' +
    '<circle cx="12" cy="12" r="4.6" fill="#fff"/></svg>';

  // ── Visor ──
  function pintarTiraVisor() {
    var tira = document.getElementById('visor-tira');
    if (fotos.length < 2) { tira.innerHTML = ''; return; }
    tira.innerHTML = fotos.map(function (u, i) {
      return '<img src="' + escapeHtml(u) + '" alt="Foto ' + (i + 1) + '"' +
        (i === idxFoto ? ' class="activa"' : '') +
        ' onclick="abrirVisor(' + i + ')" onerror="this.style.display=\'none\'" />';
    }).join('');
    // Que la miniatura activa quede siempre a la vista al navegar con
    // las flechas, aunque haya muchas fotos.
    var activa = tira.querySelector('.activa');
    if (activa && activa.scrollIntoView) {
      activa.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    }
  }

  function abrirVisor(i) {
    if (!fotos.length) return;
    idxFoto = i;
    document.getElementById('visor-img').src = fotos[idxFoto];
    document.getElementById('visor-contador').textContent = fotos.length > 1 ? (idxFoto + 1) + ' / ' + fotos.length : '';
    document.getElementById('visor-prev').style.display = fotos.length > 1 ? 'flex' : 'none';
    document.getElementById('visor-next').style.display = fotos.length > 1 ? 'flex' : 'none';
    document.getElementById('visor').style.display = 'flex';
    pintarTiraVisor();
  }
  function cerrarVisor() { document.getElementById('visor').style.display = 'none'; }
  function navVisor(d, e) {
    if (e) e.stopPropagation();
    idxFoto = (idxFoto + d + fotos.length) % fotos.length;
    abrirVisor(idxFoto);
  }
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('visor').style.display !== 'flex') return;
    if (e.key === 'Escape') cerrarVisor();
    else if (e.key === 'ArrowLeft') navVisor(-1);
    else if (e.key === 'ArrowRight') navVisor(1);
  });

  // ── Compartir ──
  async function compartir() {
    var s = await sb.auth.getSession();
    var sesion = s && s.data && s.data.session;

    if (!sesion) {
      // Sin sesión se comparte el enlace normal
      copiar(location.origin + '/kwpremierweb/propiedad.html?id=' + encodeURIComponent(ID));
      return;
    }
    try {
      var r = await sb.rpc('crear_enlace_compartido', { p_propiedad_id: ID });
      if (r.error) throw r.error;
      copiar(location.origin + '/kwpremierweb/propiedad.html?ref=' + r.data);
      toast('Enlace copiado. Quien lo abra verá tus datos de contacto.');
      return;
    } catch (err) {
      copiar(location.origin + '/kwpremierweb/propiedad.html?id=' + encodeURIComponent(ID));
    }
  }

  function copiar(url) {
    if (navigator.share) {
      navigator.share({ title: propiedad ? propiedad.titulo : 'Propiedad', url: url }).catch(function () {});
      return;
    }
    navigator.clipboard.writeText(url).then(function () { toast('Enlace copiado'); },
      function () { prompt('Copia el enlace:', url); });
  }

  function tieneCoords(p) {
    return p && isFinite(Number(p.lat)) && isFinite(Number(p.lng))
      && Number(p.lat) !== 0 && Number(p.lng) !== 0;
  }

  // Días desde que la propiedad entró a nuestro sistema. Si Command
  // manda su propia fecha de publicación se usa esa, que es la que de
  // verdad importa; si no, created_at es la mejor aproximación.
  function diasEnMercado(p) {
    var desde = p.publicada_at || p.created_at;
    if (!desde) return null;
    var ms = Date.now() - new Date(desde).getTime();
    if (!isFinite(ms) || ms < 0) return null;
    return Math.floor(ms / 86400000);
  }

  function metaHtml(p) {
    var partes = [];
    var dias = diasEnMercado(p);
    if (dias !== null) {
      partes.push('<span class="meta-item">' + ICO.reloj +
        (dias === 0 ? 'Publicada hoy'
          : dias === 1 ? '1 día en el mercado'
          : dias + ' días en el mercado') + '</span>');
    }
    return partes.length ? '<div class="meta-linea">' + partes.join('') + '</div>' : '';
  }

  // El mapa se arma después de meter el HTML: la librería necesita que
  // el contenedor ya exista y tenga tamaño para calcular los mosaicos.
  function montarMapa(p) {
    if (!tieneCoords(p)) return;
    var caja = document.getElementById('mapa');
    if (!caja) return;
    if (GOOGLE_MAPS_KEY) montarGoogle(caja, p);
    else montarOSM(caja, p);
  }

  function cargarScript(src, alCargar) {
    var s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = alCargar || null;
    document.head.appendChild(s);
  }

  function montarGoogle(caja, p) {
    var punto = { lat: Number(p.lat), lng: Number(p.lng) };
    // El callback tiene que ser global: así lo pide el cargador de Google.
    window.__mapaKwListo = function () {
      var mapa = new google.maps.Map(caja, {
        center: punto, zoom: 16,
        mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
        // El scroll de la rueda queda apagado para que al recorrer la
        // página no se acerque el mapa sin querer; con Ctrl sí funciona.
        gestureHandling: 'cooperative',
      });
      new google.maps.Marker({
        position: punto, map: mapa, draggable: false,
        title: p.titulo,
        icon: {
          url: 'data:image/svg+xml;base64,' + btoa(PIN_KW),
          scaledSize: new google.maps.Size(34, 44),
          anchor: new google.maps.Point(17, 44),
        },
      });
    };
    cargarScript('https://maps.googleapis.com/maps/api/js?key=' +
      encodeURIComponent(GOOGLE_MAPS_KEY) + '&callback=__mapaKwListo&loading=async');
  }

  // Respaldo mientras no se configure la llave de Google: OpenStreetMap
  // no pide llave ni facturación. Se puede quitar en cuanto la de Google
  // quede puesta.
  function montarOSM(caja, p) {
    var hoja = document.createElement('link');
    hoja.rel = 'stylesheet';
    hoja.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(hoja);

    cargarScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', function () {
      if (!window.L) return;
      var punto = [Number(p.lat), Number(p.lng)];
      var mapa = L.map(caja, { scrollWheelZoom: false }).setView(punto, 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap',
      }).addTo(mapa);
      // draggable apagado: el pin marca la propiedad y no debe moverse.
      // Navegar el mapa sí se puede: arrastrar, acercar y alejar.
      L.marker(punto, {
        draggable: false, keyboard: false,
        icon: L.divIcon({ className: 'pin-kw', html: PIN_KW, iconSize: [34, 44], iconAnchor: [17, 44] }),
      }).addTo(mapa);
    });
  }

  // ── Render ──
  function render() {
    var p = propiedad;
    fotos = (p.imagenes || []).filter(function (u) { return typeof u === 'string'; });

    var ubic = [p.colonia, p.municipio, p.estado].filter(Boolean).join(', ');

    // Mosaico: la principal grande y hasta cuatro chicas al lado. En la
    // cuarta chica, si todavía quedan fotos, va el botón de "ver más".
    // Las URLs vienen de un CRM externo y pueden vencerse: la principal
    // prueba con la siguiente de la lista antes de rendirse y las chicas
    // rotas simplemente se esconden.
    var sinFotoHtml = '<div class="sin-foto">' + ICO.casa + '</div>';
    var lado = fotos.slice(1, 5);
    var restantes = fotos.length - 5;

    var galeria = '<div class="galeria' + (lado.length ? '' : ' solo-una') + '">' +
      '<div class="foto-principal" onclick="abrirVisor(0)">' +
        (fotos.length
          ? '<img id="foto-grande" src="' + escapeHtml(fotos[0]) + '" alt="' + escapeHtml(p.titulo) + '" ' +
            'data-intento="0" onerror="siguienteFotoPrincipal(this)" />'
          : sinFotoHtml) +
      '</div>' +
      (lado.length
        ? '<div class="galeria-lado" data-n="' + lado.length + '">' + lado.map(function (u, i) {
            var esUltima = i === lado.length - 1 && restantes > 0;
            return '<div class="foto-chica" onclick="abrirVisor(' + (i + 1) + ')">' +
              '<img src="' + escapeHtml(u) + '" alt="Foto ' + (i + 2) + '" onerror="this.style.display=\'none\'" />' +
              (esUltima
                ? '<button type="button" class="ver-mas-fotos">' + ICO.fotos +
                  '<span>Ver ' + restantes + ' foto' + (restantes === 1 ? '' : 's') + ' más</span></button>'
                : '') +
            '</div>';
          }).join('') + '</div>'
        : '') +
      '</div>';

    var datos = [];
    if (p.recamaras) datos.push({ i: ICO.cama, v: p.recamaras, l: p.recamaras === 1 ? 'Recámara' : 'Recámaras' });
    if (p.banos) datos.push({ i: ICO.bano, v: p.banos, l: p.banos === 1 ? 'Baño' : 'Baños' });
    if (p.estacionamientos) datos.push({ i: ICO.auto, v: p.estacionamientos, l: 'Estac.' });
    if (p.m2_construccion) datos.push({ i: ICO.area, v: p.m2_construccion, l: 'm² const.' });
    if (p.m2_terreno) datos.push({ i: ICO.terreno, v: p.m2_terreno, l: 'm² terreno' });

    var caracts = (p.caracteristicas || []).filter(function (c) { return typeof c === 'string'; });

    var principal =
      '<div class="bloque">' +
        (p.operacion ? '<span class="badge-op">' + (p.operacion === 'renta' ? 'En renta' : 'En venta') + '</span>' : '') +
        '<div class="precio">' + fmtPrecio(p.precio, p.moneda) + '</div>' +
        '<div class="titulo">' + escapeHtml(p.titulo) + '</div>' +
        (ubic ? '<div class="ubic">' + ICO.pin + escapeHtml(ubic) + '</div>' : '') +
        metaHtml(p) +
        (datos.length ? '<div class="datos">' + datos.map(function (d) {
          return '<div class="dato"><div class="dato-ico">' + d.i + '</div>' +
            '<div class="dato-valor">' + d.v + '</div><div class="dato-label">' + d.l + '</div></div>';
        }).join('') + '</div>' : '') +
      '</div>' +
      (p.descripcion ? '<div class="bloque"><h2>Descripción</h2><div class="descripcion">' + escapeHtml(p.descripcion) + '</div></div>' : '') +
      (caracts.length ? '<div class="bloque"><h2>Características</h2><div class="caracteristicas">' +
        caracts.map(function (c) { return '<span class="caract">' + escapeHtml(c) + '</span>'; }).join('') + '</div></div>' : '') +
      // El mapa solo se arma si la propiedad trae coordenadas; con
      // dirección sin lat/lng no hay nada que ubicar.
      (tieneCoords(p)
        ? '<div class="bloque"><h2>Ubicación</h2><div id="mapa"></div>' +
          '<div class="mapa-nota">Ubicación aproximada.</div></div>'
        : '');

    // ── Panel de contacto ──
    var nombre = contacto
      ? [contacto.nombre, contacto.apellido].filter(Boolean).join(' ')
      : (p.asesor_nombre || 'KW Premier');
    var iniciales = nombre.split(' ').filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase();

    // El formulario solo se puede mostrar cuando hay un asesor de KW
    // Premier al cual mandarle el prospecto: la base exige un asesor_id
    // que exista. Para propiedades de otra oficina (sin perfil aquí) se
    // deja el enlace al directorio, como antes.
    var hayDestino = !!(contacto && contacto.id);
    waLinkActual = null;
    if (contacto && contacto.whatsapp) {
      var wa = String(contacto.whatsapp).replace(/\D/g, '');
      waLinkActual = 'https://wa.me/' + (wa.length === 10 ? '52' + wa : wa) +
        '?text=' + encodeURIComponent(MENSAJE_BASE(p));
    }

    var botones = '';
    if (waLinkActual) {
      botones += '<a class="btn-contacto btn-wa" target="_blank" rel="noopener" href="' +
        escapeHtml(waLinkActual) + '">' + ICO.wa + 'WhatsApp</a>';
    }
    if (!hayDestino) {
      botones += '<a class="btn-contacto btn-mail" href="/kwpremierweb/asesores.html">' + ICO.mail + 'Contactar a un asesor</a>';
    }
    botones += '<button type="button" class="btn-contacto btn-compartir" onclick="compartir()">' + ICO.share + 'Compartir</button>';

    var formulario = hayDestino
      ? '<form class="form-lead" id="form-lead" autocomplete="on">' +
          '<div class="lead-msg" id="lead-msg"></div>' +
          '<input class="trampa" type="text" name="apodo" tabindex="-1" autocomplete="off" aria-hidden="true" />' +
          '<input type="text" name="nombre" placeholder="Tu nombre" maxlength="120" autocomplete="name" required />' +
          '<input type="email" name="correo" placeholder="Tu correo" maxlength="160" autocomplete="email" />' +
          '<input type="tel" name="telefono" placeholder="Tu teléfono" maxlength="40" autocomplete="tel" />' +
          '<textarea name="mensaje" maxlength="1000" placeholder="Mensaje">' +
            escapeHtml(MENSAJE_BASE(p)) + '</textarea>' +
          '<button type="submit" class="btn-contacto btn-mail" id="lead-btn">' +
            ICO.mail + '<span>Enviar mensaje</span></button>' +
        '</form>' +
        '<div class="lead-gracias" id="lead-gracias">' +
          '<div class="lead-gracias-ico">' + ICO.check + '</div>' +
          '<strong>¡Listo!</strong>' +
          '<span>Tus datos le llegaron a ' + escapeHtml(nombre.split(' ')[0] || 'el asesor') +
            '. Te contactará muy pronto.</span>' +
        '</div>'
      : '';

    var lateral =
      '<div class="bloque asesor">' +
        '<div class="asesor-head">' +
          '<div class="asesor-foto">' +
            (contacto && contacto.foto_url
              ? '<img src="' + escapeHtml(contacto.foto_url) + '" alt="' + escapeHtml(nombre) + '" style="width:100%;height:100%;object-fit:cover;" />'
              : escapeHtml(iniciales || 'KW')) +
          '</div>' +
          '<div>' +
            '<div class="asesor-nombre">' + escapeHtml(nombre) + '</div>' +
            '<div class="asesor-rol">' + escapeHtml(
                (contacto && contacto.puesto) || p.market_center || 'KW Premier') + '</div>' +
          '</div>' +
        '</div>' +
        (REF && contacto ? '<div class="asesor-nota">Te compartió esta propiedad.</div>' :
         refAsesorActivo && contacto ? '<div class="asesor-nota">Estás viendo el catálogo con los datos de contacto de ' + escapeHtml(nombre) + '.</div>' : '') +
        formulario +
        '<div class="contactos">' + botones + '</div>' +
      '</div>';

    document.getElementById('contenido').innerHTML =
      '<a class="volver" href="/kwpremierweb/propiedades.html">' + ICO.flecha + 'Todas las propiedades</a>' +
      galeria +
      '<div class="columnas"><div>' + principal + '</div><div>' + lateral + '</div></div>';

    document.title = p.titulo + ' · KW Premier';
    montarMapa(p);
    armarFormularioLead();
  }

  // ── Formulario de prospecto ──
  // Reusa la tabla `prospectos` del micrositio: su política ya acepta
  // origen 'propiedad', y el disparador de la campanita ya avisa al
  // asesor, así que no hace falta nada nuevo en la base.
  function armarFormularioLead() {
    var form = document.getElementById('form-lead');
    if (!form) return;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var msg = document.getElementById('lead-msg');
      var btn = document.getElementById('lead-btn');
      var decir = function (t) { msg.textContent = t; msg.className = 'lead-msg error'; };
      msg.className = 'lead-msg';

      // Si la trampa viene llena fue un robot: se responde como si todo
      // hubiera salido bien, pero no se guarda nada.
      if (form.apodo.value) { mostrarGracias(); return; }

      var nombre = form.nombre.value.trim();
      var correo = form.correo.value.trim();
      var telefono = form.telefono.value.trim();
      var mensaje = form.mensaje.value.trim();

      if (nombre.length < 2) { decir('Escribe tu nombre.'); form.nombre.focus(); return; }
      if (!correo && !telefono) {
        decir('Déjanos un correo o un teléfono para poder contactarte.');
        form.correo.focus();
        return;
      }
      if (correo && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) {
        decir('Ese correo no se ve bien, revísalo por favor.');
        form.correo.focus();
        return;
      }

      btn.disabled = true;
      btn.querySelector('span').textContent = 'Enviando...';
      try {
        var res = await sb.from('prospectos').insert({
          asesor_id: contacto.id,
          nombre: nombre,
          correo: correo || null,
          telefono: telefono || null,
          mensaje: mensaje || null,
          origen: 'propiedad',
        });
        if (res.error) throw res.error;
        mostrarGracias();
      } catch (err) {
        decir('No se pudieron enviar tus datos. Intenta de nuevo o escríbenos por WhatsApp.');
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Enviar mensaje';
      }
    });
  }

  function mostrarGracias() {
    document.getElementById('form-lead').style.display = 'none';
    document.getElementById('lead-gracias').classList.add('visible');
  }

  async function cargar() {
    var cont = document.getElementById('contenido');
    try {
      if (REF) {
        // Enlace compartido: la función devuelve la propiedad junto con
        // los datos de quien la compartió.
        var r = await sb.rpc('resolver_propiedad_compartida', { p_codigo: REF });
        if (r.error) throw r.error;
        if (!r.data) {
          cont.innerHTML = '<div class="estado-msg">Este enlace ya no está disponible.<br><a href="/kwpremierweb/propiedades.html">Ver todas las propiedades</a></div>';
          return;
        }
        propiedad = r.data.propiedad;
        contacto = r.data.compartido_por;
        ID = propiedad.id;
      } else {
        if (!ID) {
          cont.innerHTML = '<div class="estado-msg">Falta el identificador de la propiedad.</div>';
          return;
        }
        var q = await sb.from('propiedades_publicas').select('*').eq('id', ID).maybeSingle();
        if (q.error) throw q.error;
        if (!q.data) {
          cont.innerHTML = '<div class="estado-msg">No encontramos esta propiedad.<br><a href="/kwpremierweb/propiedades.html">Ver todas las propiedades</a></div>';
          return;
        }
        propiedad = q.data;

        // El link personalizado de un asesor (propiedades.html?asesor=…,
        // o llegando directo a una ficha con ese mismo parámetro) le gana
        // al asesor real de la propiedad: es la misma idea que un enlace
        // compartido, pero puesta para todo el catálogo en vez de una
        // sola propiedad — quien entró por ahí es prospecto de quien
        // compartió el link, no de quien tenga listada esta propiedad.
        var marca = null;
        try { marca = await window.kwRefAsesor.capturar(sb); } catch (e) { /* se sigue sin marca */ }

        if (marca) {
          contacto = marca; contacto.email = null;
          refAsesorActivo = true;
        } else if (propiedad.asesor_id) {
          var a = await sb.from('perfiles_publicos').select('*').eq('id', propiedad.asesor_id).maybeSingle();
          if (a.data) { contacto = a.data; contacto.email = null; }
        }
      }
      render();
    } catch (err) {
      cont.innerHTML = '<div class="estado-msg">No se pudo cargar la propiedad.<br>' + escapeHtml(err.message || '') + '</div>';
    }
  }

  cargar();
</script>
