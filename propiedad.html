<style>
  :root {
    --red: #CC0000; --text: #1a1a1a; --muted: #888;
    --bg: #EFEFEF; --card: #ffffff; --border: rgba(0,0,0,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; min-height: 100vh; }


  main { flex: 1; max-width: 1060px; margin: 0 auto; padding: 90px 24px 60px; width: 100%; }

  .volver {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: #555; text-decoration: none;
    margin-bottom: 18px;
  }
  .volver svg { width: 14px; height: 14px; }
  .volver:hover { color: var(--red); }

  /* ── Galería ── */
  .galeria { border-radius: 16px; overflow: hidden; background: #e4e4e4; margin-bottom: 22px; }
  .foto-principal {
    position: relative; aspect-ratio: 16 / 9; max-height: 460px; background: #e4e4e4;
    display: flex; align-items: center; justify-content: center; cursor: zoom-in;
  }
  .foto-principal img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sin-foto { color: #bbb; }
  .sin-foto svg { width: 54px; height: 54px; }
  .miniaturas { display: flex; gap: 8px; padding: 8px; background: #fff; overflow-x: auto; }
  .miniatura {
    width: 78px; height: 58px; border-radius: 8px; object-fit: cover;
    cursor: pointer; flex-shrink: 0; border: 2px solid transparent; display: block;
  }
  .miniatura.activa { border-color: var(--red); }

  .columnas { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }

  .bloque {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 24px; margin-bottom: 18px;
  }
  .badge-op {
    display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 4px 11px; border-radius: 20px;
    background: #fdeaea; color: var(--red); margin-bottom: 10px;
  }
  .precio { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }
  .titulo { font-size: 20px; font-weight: 700; margin-top: 4px; line-height: 1.3; }
  .ubic { font-size: 14px; color: var(--muted); margin-top: 7px; display: flex; align-items: center; gap: 6px; }
  .ubic svg { width: 14px; height: 14px; flex-shrink: 0; }

  .datos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .dato {
    flex: 1; min-width: 92px; background: #f7f7f6; border-radius: 12px;
    padding: 12px; text-align: center;
  }
  .dato-valor { font-size: 17px; font-weight: 700; }
  .dato-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

  .bloque h2 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .descripcion { font-size: 14px; line-height: 1.7; color: #444; white-space: pre-wrap; }
  .caracteristicas { display: flex; flex-wrap: wrap; gap: 7px; }
  .caract {
    font-size: 12.5px; background: #f7f7f6; border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 20px;
  }

  /* ── Asesor ── */
  .asesor { position: sticky; top: 88px; }
  .asesor-head { display: flex; align-items: center; gap: 13px; }
  .asesor-foto {
    width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
    background: #fff3f3; color: var(--red); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; overflow: hidden;
  }
  .asesor-nombre { font-size: 15.5px; font-weight: 700; }
  .asesor-rol { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .asesor-nota {
    font-size: 11.5px; color: var(--muted); background: #f7f7f6;
    border-radius: 8px; padding: 7px 10px; margin-top: 12px;
  }
  .contactos { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .btn-contacto {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px; border-radius: 30px; font-size: 13.5px; font-weight: 700;
    text-decoration: none; border: 1.5px solid var(--border); background: #f7f7f6;
    color: var(--text); cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: filter 0.15s, background 0.15s;
  }
  .btn-contacto svg { width: 15px; height: 15px; }
  .btn-wa { background: #25D366; border-color: #25D366; color: #fff; }
  .btn-mail { background: linear-gradient(180deg, #e81010, var(--red)); border-color: var(--red); color: #fff; }
  .btn-contacto:hover { filter: brightness(1.06); }
  .btn-compartir { background: #fff; }
  .btn-compartir:hover { background: #ececec; }

  .estado-msg { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 20px; }

  /* Visor de imagen */
  #visor {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.88);
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
  }
  #visor img { max-width: 92vw; max-height: 88vh; border-radius: 10px; }
  .visor-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.16); color: #fff; font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .visor-nav:hover { background: rgba(255,255,255,0.3); }
  #visor-prev { left: 14px; } #visor-next { right: 14px; }
  #visor-contador {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 12px; font-weight: 700;
    background: rgba(0,0,0,0.45); padding: 5px 13px; border-radius: 20px;
  }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 600;
    padding: 11px 18px; border-radius: 30px; z-index: 120;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .toast.visible { opacity: 1; }

  @media (max-width: 860px) {
    .columnas { grid-template-columns: 1fr; }
    .asesor { position: static; }
  }
  @media (max-width: 640px) {
    main { padding: 18px 16px 40px; }
    .precio { font-size: 25px; }
    .titulo { font-size: 17px; }
    .bloque { padding: 18px 18px; }
  }
</style>
</head>

<script>
  var SUPABASE_URL = 'https://iloetojomzqtadkithtv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_ZvaIC0_lkd6OQ0VMihOvjA_BIgpbClq';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var params = new URLSearchParams(location.search);
  var ID = params.get('id');
  var REF = params.get('ref');   // enlace compartido: muestra al que comparte

  var propiedad = null;
  var contacto = null;      // a quién se muestra como contacto
  var fotos = [];
  var idxFoto = 0;

  function escapeHtml(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtPrecio(p, m) {
    if (p == null) return 'Precio a consultar';
    try { return new Intl.NumberFormat('es-MX', { style: 'currency', currency: m || 'MXN', maximumFractionDigits: 0 }).format(p); }
    catch (e) { return '$' + Number(p).toLocaleString('es-MX'); }
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('visible');
    setTimeout(function () { t.classList.remove('visible'); }, 2600);
  }

  var ICO = {
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    casa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
    wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.01-1.04 2.47s1.06 2.86 1.21 3.06c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.75-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12 2a10 10 0 0 0-8.6 15.06L2 22l5.06-1.33A10 10 0 1 0 12 2z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22 6 12 13 2 6"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>',
    flecha: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>'
  };

  // ── Visor ──
  function abrirVisor(i) {
    if (!fotos.length) return;
    idxFoto = i;
    document.getElementById('visor-img').src = fotos[idxFoto];
    document.getElementById('visor-contador').textContent = fotos.length > 1 ? (idxFoto + 1) + ' / ' + fotos.length : '';
    document.getElementById('visor-prev').style.display = fotos.length > 1 ? 'flex' : 'none';
    document.getElementById('visor-next').style.display = fotos.length > 1 ? 'flex' : 'none';
    document.getElementById('visor').style.display = 'flex';
  }
  function cerrarVisor() { document.getElementById('visor').style.display = 'none'; }
  function navVisor(d, e) {
    if (e) e.stopPropagation();
    idxFoto = (idxFoto + d + fotos.length) % fotos.length;
    abrirVisor(idxFoto);
  }
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('visor').style.display !== 'flex') return;
    if (e.key === 'Escape') cerrarVisor();
    else if (e.key === 'ArrowLeft') navVisor(-1);
    else if (e.key === 'ArrowRight') navVisor(1);
  });

  function verFoto(i) {
    idxFoto = i;
    document.getElementById('foto-grande').src = fotos[i];
    document.querySelectorAll('.miniatura').forEach(function (m, j) {
      m.classList.toggle('activa', j === i);
    });
  }

  // ── Compartir ──
  async function compartir() {
    var s = await sb.auth.getSession();
    var sesion = s && s.data && s.data.session;

    if (!sesion) {
      // Sin sesión se comparte el enlace normal
      copiar(location.origin + '/kwpremierweb/propiedad.html?id=' + encodeURIComponent(ID));
      return;
    }
    try {
      var r = await sb.rpc('crear_enlace_compartido', { p_propiedad_id: ID });
      if (r.error) throw r.error;
      copiar(location.origin + '/kwpremierweb/propiedad.html?ref=' + r.data);
      toast('Enlace copiado. Quien lo abra verá tus datos de contacto.');
      return;
    } catch (err) {
      copiar(location.origin + '/kwpremierweb/propiedad.html?id=' + encodeURIComponent(ID));
    }
  }

  function copiar(url) {
    if (navigator.share) {
      navigator.share({ title: propiedad ? propiedad.titulo : 'Propiedad', url: url }).catch(function () {});
      return;
    }
    navigator.clipboard.writeText(url).then(function () { toast('Enlace copiado'); },
      function () { prompt('Copia el enlace:', url); });
  }

  // ── Render ──
  function render() {
    var p = propiedad;
    fotos = (p.imagenes || []).filter(function (u) { return typeof u === 'string'; });

    var ubic = [p.colonia, p.municipio, p.estado].filter(Boolean).join(', ');

    var galeria = '<div class="galeria">' +
      '<div class="foto-principal" onclick="abrirVisor(idxFoto)">' +
        (fotos.length
          ? '<img id="foto-grande" src="' + escapeHtml(fotos[0]) + '" alt="' + escapeHtml(p.titulo) + '" />'
          : '<div class="sin-foto">' + ICO.casa + '</div>') +
      '</div>' +
      (fotos.length > 1
        ? '<div class="miniaturas">' + fotos.map(function (u, i) {
            return '<img class="miniatura' + (i === 0 ? ' activa' : '') + '" src="' + escapeHtml(u) + '" onclick="verFoto(' + i + ')" alt="Foto ' + (i + 1) + '" />';
          }).join('') + '</div>'
        : '') +
      '</div>';

    var datos = [];
    if (p.recamaras) datos.push({ v: p.recamaras, l: p.recamaras === 1 ? 'Recámara' : 'Recámaras' });
    if (p.banos) datos.push({ v: p.banos, l: p.banos === 1 ? 'Baño' : 'Baños' });
    if (p.estacionamientos) datos.push({ v: p.estacionamientos, l: 'Estac.' });
    if (p.m2_construccion) datos.push({ v: p.m2_construccion, l: 'm² const.' });
    if (p.m2_terreno) datos.push({ v: p.m2_terreno, l: 'm² terreno' });

    var caracts = (p.caracteristicas || []).filter(function (c) { return typeof c === 'string'; });

    var principal =
      '<div class="bloque">' +
        (p.operacion ? '<span class="badge-op">' + (p.operacion === 'renta' ? 'En renta' : 'En venta') + '</span>' : '') +
        '<div class="precio">' + fmtPrecio(p.precio, p.moneda) + '</div>' +
        '<div class="titulo">' + escapeHtml(p.titulo) + '</div>' +
        (ubic ? '<div class="ubic">' + ICO.pin + escapeHtml(ubic) + '</div>' : '') +
        (datos.length ? '<div class="datos">' + datos.map(function (d) {
          return '<div class="dato"><div class="dato-valor">' + d.v + '</div><div class="dato-label">' + d.l + '</div></div>';
        }).join('') + '</div>' : '') +
      '</div>' +
      (p.descripcion ? '<div class="bloque"><h2>Descripción</h2><div class="descripcion">' + escapeHtml(p.descripcion) + '</div></div>' : '') +
      (caracts.length ? '<div class="bloque"><h2>Características</h2><div class="caracteristicas">' +
        caracts.map(function (c) { return '<span class="caract">' + escapeHtml(c) + '</span>'; }).join('') + '</div></div>' : '');

    // ── Panel de contacto ──
    var nombre = contacto
      ? [contacto.nombre, contacto.apellido].filter(Boolean).join(' ')
      : (p.asesor_nombre || 'KW Premier');
    var iniciales = nombre.split(' ').filter(Boolean).slice(0, 2).map(function (x) { return x[0]; }).join('').toUpperCase();

    var botones = '';
    if (contacto && contacto.whatsapp) {
      var wa = String(contacto.whatsapp).replace(/\D/g, '');
      var msg = encodeURIComponent('Hola, me interesa la propiedad "' + p.titulo + '".');
      botones += '<a class="btn-contacto btn-wa" target="_blank" rel="noopener" href="https://wa.me/' + (wa.length === 10 ? '52' + wa : wa) + '?text=' + msg + '">' + ICO.wa + 'WhatsApp</a>';
    }
    if (contacto && contacto.email) {
      botones += '<a class="btn-contacto btn-mail" href="mailto:' + escapeHtml(contacto.email) +
        '?subject=' + encodeURIComponent('Interés en: ' + p.titulo) + '">' + ICO.mail + 'Enviar correo</a>';
    }
    if (!botones) {
      botones = '<a class="btn-contacto btn-mail" href="/kwpremierweb/asesores.html">' + ICO.mail + 'Contactar a un asesor</a>';
    }
    botones += '<button type="button" class="btn-contacto btn-compartir" onclick="compartir()">' + ICO.share + 'Compartir</button>';

    var lateral =
      '<div class="bloque asesor">' +
        '<div class="asesor-head">' +
          '<div class="asesor-foto">' +
            (contacto && contacto.foto_url
              ? '<img src="' + escapeHtml(contacto.foto_url) + '" alt="' + escapeHtml(nombre) + '" style="width:100%;height:100%;object-fit:cover;" />'
              : escapeHtml(iniciales || 'KW')) +
          '</div>' +
          '<div>' +
            '<div class="asesor-nombre">' + escapeHtml(nombre) + '</div>' +
            '<div class="asesor-rol">' + escapeHtml(
                (contacto && contacto.puesto) || p.market_center || 'KW Premier') + '</div>' +
          '</div>' +
        '</div>' +
        (REF && contacto ? '<div class="asesor-nota">Te compartió esta propiedad.</div>' : '') +
        '<div class="contactos">' + botones + '</div>' +
      '</div>';

    document.getElementById('contenido').innerHTML =
      '<a class="volver" href="/kwpremierweb/propiedades.html">' + ICO.flecha + 'Todas las propiedades</a>' +
      galeria +
      '<div class="columnas"><div>' + principal + '</div><div>' + lateral + '</div></div>';

    document.title = p.titulo + ' · KW Premier';
  }

  async function cargar() {
    var cont = document.getElementById('contenido');
    try {
      if (REF) {
        // Enlace compartido: la función devuelve la propiedad junto con
        // los datos de quien la compartió.
        var r = await sb.rpc('resolver_propiedad_compartida', { p_codigo: REF });
        if (r.error) throw r.error;
        if (!r.data) {
          cont.innerHTML = '<div class="estado-msg">Este enlace ya no está disponible.<br><a href="/kwpremierweb/propiedades.html">Ver todas las propiedades</a></div>';
          return;
        }
        propiedad = r.data.propiedad;
        contacto = r.data.compartido_por;
        ID = propiedad.id;
      } else {
        if (!ID) {
          cont.innerHTML = '<div class="estado-msg">Falta el identificador de la propiedad.</div>';
          return;
        }
        var q = await sb.from('propiedades_publicas').select('*').eq('id', ID).maybeSingle();
        if (q.error) throw q.error;
        if (!q.data) {
          cont.innerHTML = '<div class="estado-msg">No encontramos esta propiedad.<br><a href="/kwpremierweb/propiedades.html">Ver todas las propiedades</a></div>';
          return;
        }
        propiedad = q.data;
        // Si la propiedad tiene asesor de KW Premier, se muestra a él
        if (propiedad.asesor_id) {
          var a = await sb.from('perfiles_publicos').select('*').eq('id', propiedad.asesor_id).maybeSingle();
          if (a.data) { contacto = a.data; contacto.email = null; }
        }
      }
      render();
    } catch (err) {
      cont.innerHTML = '<div class="estado-msg">No se pudo cargar la propiedad.<br>' + escapeHtml(err.message || '') + '</div>';
    }
  }

  cargar();
</script>
